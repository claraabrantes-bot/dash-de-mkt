<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gestão de Tarefas Nibo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral de pipelines + área de trabalho com abas Lista e Quadro. Tudo em um só lugar, no padrão de uso do Asana. */
:root{
  --bg:#F4F7FC; --surface:#FFFFFF; --surface2:#F7F9FD; --line:#DEE6F2; --line2:#EDF2F9;
  --fg:#002D72; --body:#22406F; --mut:#5B7098; --mut2:#8D9DBA;
  --accent:#0072CE; --accent-soft:#E8F2FC; --sky:#41B6E6; --violet:#6431E2; --pink:#FF40B3; --yellow:#FFE800; --gelo:#B8CCEA;
  --danger:#B4232A; --danger-soft:#FDECEC; --warn:#8A6206; --warn-soft:#FFF6DE;
  --done-fg:#9AA9C4; --shadow:0 10px 36px rgba(0,45,114,.14);
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#001A45; --surface:#032B66; --surface2:#06337A; --line:#164383; --line2:#0F3A78;
  --fg:#F2F6FD; --body:#DCE7F8; --mut:#A9BCDD; --mut2:#7F97C0;
  --accent:#41B6E6; --accent-soft:#0B3F86; --danger:#FF9AA0; --danger-soft:#4A1F3A; --warn:#FFE27A; --warn-soft:#4A3F14;
  --done-fg:#6F88B3; --shadow:0 10px 36px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#001A45; --surface:#032B66; --surface2:#06337A; --line:#164383; --line2:#0F3A78;
  --fg:#F2F6FD; --body:#DCE7F8; --mut:#A9BCDD; --mut2:#7F97C0;
  --accent:#41B6E6; --accent-soft:#0B3F86; --danger:#FF9AA0; --danger-soft:#4A1F3A; --warn:#FFE27A; --warn-soft:#4A3F14;
  --done-fg:#6F88B3; --shadow:0 10px 36px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--body);font:14px/1.5 var(--font);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.logo-dark{display:none}
:root[data-theme="dark"] .logo-light{display:none}
:root[data-theme="dark"] .logo-dark{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:block}}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.brand{padding:22px 22px 14px;display:flex;flex-direction:column;gap:4px}
.brand img{height:34px;width:auto;align-self:flex-start}
.brand small{font-size:10.5px;letter-spacing:.14em;color:var(--mut);font-weight:600}
.new{margin:8px 18px 0;background:var(--accent);color:#fff;border-radius:10px;padding:12px 14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
:root[data-theme="dark"] .new{color:#002D72}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .new{color:#002D72}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 18px 6px}
.stat{background:var(--surface2);border-radius:10px;padding:9px 12px}
.stat b{display:block;font-size:20px;line-height:1.1;color:var(--fg);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mut)}
.stat.late b{color:var(--danger)}
.nav-l{padding:14px 22px 6px;font-size:10.5px;letter-spacing:.12em;color:var(--mut2);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--body);font-weight:500;text-align:left;width:100%}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.nav .dot{width:9px;height:9px;border-radius:50%;flex:none}
.nav .n{margin-left:auto;font-size:12px;color:var(--mut2);font-variant-numeric:tabular-nums}
.nav button.on .n{color:var(--accent)}
.sidefoot{margin-top:auto;padding:16px 18px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;gap:8px}
.sidefoot button{align-self:flex-start;color:var(--accent);font-weight:500;font-size:12px;text-decoration:underline;text-underline-offset:3px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 28px 0;display:flex;flex-direction:column;gap:12px}
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:21px;line-height:1.25;color:var(--fg);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:4px}
.tabs button{padding:9px 14px;font-weight:500;color:var(--mut);border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px;margin-bottom:-1px}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 28px;background:var(--bg);border-bottom:1px solid var(--line2)}
.search{position:relative;flex:1 1 220px;max-width:300px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut2)}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px 8px 34px}
.sel,.btn-t{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;color:var(--body);display:inline-flex;align-items:center;gap:7px;font-weight:500}
.sel{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.lab{font-size:12px;color:var(--mut);margin-right:-4px}
.btn-t.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.grow{flex:1}
.pop{position:relative}
.popbox{position:absolute;top:42px;left:0;z-index:30;width:250px;max-height:380px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}
.popbox h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.1em;color:var(--mut2);text-transform:uppercase}
.popbox label{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer}
.popbox input{accent-color:var(--accent)}
.popbox hr{border:0;border-top:1px solid var(--line2);margin:10px 0}

.content{flex:1;min-height:0;overflow:auto;padding:18px 28px 80px}

/* lista */
.listwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto;overflow-y:visible}
.lt{min-width:880px}
.grid{display:grid;grid-template-columns:40px minmax(240px,1fr) 150px 150px 96px 110px 92px;align-items:center}
.hrow{position:sticky;top:0;z-index:5;background:var(--surface2);border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.08em;color:var(--mut2);text-transform:uppercase;font-weight:600}
.hrow>div{padding:10px 8px}
.nopipe .grid{grid-template-columns:40px minmax(240px,1fr) 150px 96px 110px 92px}
.nopipe .c-pipe{display:none}
.ghead{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;background:var(--surface);position:sticky;left:0}
.ghead .chev{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--mut)}
.ghead .chev:hover{background:var(--surface2)}
.ghead .chev svg{transition:transform .15s}
.ghead.closed .chev svg{transform:rotate(-90deg)}
.gname{font-weight:600;color:var(--fg);font-size:14.5px;display:flex;align-items:center;gap:9px}
.gcount{color:var(--mut2);font-size:12.5px;font-variant-numeric:tabular-nums}
.glink{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:500}
.group+.group{border-top:1px solid var(--line)}
.hb{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;display:inline-flex;align-items:center;gap:5px;padding:2px 4px;margin:-2px -4px;border-radius:6px}
.hb:hover{color:var(--fg);background:var(--line2)}
.hb .arr{font-size:13px;line-height:1;opacity:.45}
.hb.on{color:var(--accent)}
.hb.on .arr{opacity:1}
.row{border-top:1px solid var(--line2);min-height:46px;cursor:pointer}
.row:hover{background:var(--surface2)}
.row>div{padding:8px;min-width:0}
.c-name{display:flex;align-items:center;gap:10px}
.title{font-weight:500;color:var(--fg);overflow-wrap:anywhere}
.meta{display:inline-flex;align-items:center;gap:4px;color:var(--mut2);font-size:12px;white-space:nowrap}
.chk{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--mut2);display:grid;place-items:center;color:transparent;flex:none;transition:all .12s;margin-left:10px}
.chk:hover{border-color:var(--accent);color:var(--accent)}
.row .chk{margin-left:12px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--body);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%}
.stagebadge{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--surface2);border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.stagebadge.ap{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pri{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pri.Alta{background:var(--danger-soft);color:var(--danger)}
.pri.Baixa{background:var(--surface2);color:var(--mut2)}
.pri.Média{display:none}
.due{font-size:13px;color:var(--mut);white-space:nowrap}
.due.late{color:var(--danger);font-weight:500}
.due.soon{color:var(--warn);font-weight:500}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:9.5px;font-weight:600;color:#fff;border:2px solid var(--surface);margin-left:-4px;flex:none;letter-spacing:-.02em}
.av:first-child{margin-left:0}
.av.big{width:30px;height:30px;font-size:11px;margin-left:0;border:0}
.avs{display:flex}
.addrow{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 62px;color:var(--mut2);font-size:13px;border-top:1px solid var(--line2);width:100%;text-align:left}
.addrow:hover{color:var(--accent);background:var(--surface2)}
.addrow input{flex:1;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:7px 10px;color:var(--fg)}
.donehead{display:flex;align-items:center;gap:8px;padding:9px 14px 9px 24px;color:var(--mut);font-size:12.5px;font-weight:500;border-top:1px solid var(--line2);width:100%;text-align:left;background:var(--surface2)}
.donehead:hover{color:var(--fg)}
.donehead svg{transition:transform .15s}
.donehead.closed svg{transform:rotate(-90deg)}

/* concluídas: menos destaque, sem cores de alerta */
.row.done .title{color:var(--done-fg);text-decoration:line-through;text-decoration-color:var(--line);font-weight:400}
.row.done .chip,.row.done .due,.row.done .meta,.row.done .stagebadge{color:var(--done-fg)}
.row.done .stagebadge{background:transparent;border-color:transparent;padding-left:0}
.row.done .chip .dot{opacity:.4}
.row.done .av{opacity:.45;filter:saturate(.4)}
.row.done .pri{display:none}
.row.done{background:transparent}
.chk.on{background:var(--gelo);border-color:var(--gelo);color:#002D72}
.row.done .chk.on{background:transparent;border-color:var(--done-fg);color:var(--done-fg)}

/* quadro */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}
.col{flex:1 0 268px;max-width:340px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:120px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.colh{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:600;color:var(--fg)}
.colh .gcount{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:0 8px;font-size:12px}
.colb{padding:0 10px 10px;display:flex;flex-direction:column;gap:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 13px;cursor:pointer;display:flex;flex-direction:column;gap:9px}
.card:hover{box-shadow:0 4px 16px rgba(0,45,114,.1)}
.card.dragging{opacity:.4}
.card .title{font-size:13.5px}
.cardf{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cardf .l{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.bar{height:4px;background:var(--line2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.card.done{background:transparent;border-style:dashed}
.card.done .title{color:var(--done-fg);text-decoration:line-through;text-decoration-color:var(--line);font-weight:400}
.card.done .chip,.card.done .due,.card.done .meta{color:var(--done-fg)}
.card.done .av{opacity:.45;filter:saturate(.4)}
.card.done .bar i{background:var(--done-fg)}
.more{padding:8px;border:1.5px dashed var(--line);border-radius:10px;font-size:12px;font-weight:600;color:var(--mut);text-align:center}
.more:hover{color:var(--accent);border-color:var(--accent)}
.emptycol{padding:18px 8px;text-align:center;color:var(--mut2);font-size:12.5px;border:1.5px dashed var(--line);border-radius:10px}
.empty{padding:56px 20px;text-align:center;color:var(--mut)}
.empty button{margin-top:10px;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* painel de detalhe */
.scrim{position:fixed;inset:0;background:rgba(0,26,69,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.donebtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-weight:500;font-size:13px;color:var(--body)}
.donebtn:hover{border-color:var(--accent);color:var(--accent)}
.donebtn.on{background:var(--surface2);color:var(--mut)}
.x{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--mut)}
.x:hover{background:var(--surface2)}
.db{padding:18px 20px 40px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.ttl{width:100%;font-size:19px;font-weight:600;color:var(--fg);border:1px solid transparent;border-radius:8px;padding:6px 8px;margin-left:-8px;background:transparent;line-height:1.3}
.ttl:hover,.ttl:focus{border-color:var(--line);background:var(--surface)}
.ttl.isdone{color:var(--done-fg);text-decoration:line-through}
.fields{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:center}
.fields>span{font-size:12.5px;color:var(--mut)}
.fields select,.fields input[type=date],.fields input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--body)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 3px;font-size:12.5px;color:var(--mut)}
.pick button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pick .av{width:22px;height:22px;font-size:9px;margin:0;border:0}
.dsec h5{margin:0 0 8px;font-size:11px;letter-spacing:.1em;color:var(--mut2);text-transform:uppercase}
.sub-r{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line2)}
.sub-r.done .st{color:var(--done-fg);text-decoration:line-through}
.sub-r .chk{margin-left:0}
.sub-r .chk.on{background:transparent;border-color:var(--done-fg);color:var(--done-fg)}
.subadd{width:100%;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;background:transparent;margin-top:6px}
textarea.desc{width:100%;min-height:84px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--surface);resize:vertical}

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));background:var(--surface);border-radius:14px;box-shadow:var(--shadow);z-index:41;padding:22px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0 0 2px;color:var(--fg);font-size:17px}
.modal input[type=text],.modal select,.modal input[type=date]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.modal label{font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;gap:5px}
.mact{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.b1{background:var(--accent);color:#fff;border-radius:9px;padding:9px 18px;font-weight:600}
:root[data-theme="dark"] .b1{color:#002D72}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .b1{color:#002D72}}
.b2{border:1px solid var(--line);border-radius:9px;padding:9px 16px;font-weight:500;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
:root[data-theme="dark"] .toast{background:var(--gelo);color:#002D72}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:var(--gelo);color:#002D72}}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:auto;min-height:100%}
  .side{flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);overflow:visible;padding:10px 16px;gap:8px}
  .brand{padding:0 8px 0 0}.brand small{display:none}.brand img{height:26px}
  .new{margin:0;padding:8px 12px}.stats,.nav-l,.sidefoot{display:none}
  .nav{flex-direction:row;overflow-x:auto;padding:0;width:100%;gap:6px}
  .nav button{width:auto;white-space:nowrap;padding:7px 11px;border:1px solid var(--line)}
  .nav button.on{box-shadow:none}
  .top,.tools,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body{padding-left:0;padding-right:0}
  .search{max-width:none}
  .lt{min-width:0}
  .grid,.nopipe .grid{grid-template-columns:40px minmax(0,1fr) 96px}
  .c-pipe,.c-stage,.c-ppl,.c-pri{display:none!important}
  .main{overflow:visible}.content{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function phaseOf(t){var st=PIPES[t.pipe],s=stageOf(t);if(s.done)return 'Concluído';if(s.ap)return 'Aprovação';if(st[0].id===s.id)return 'Solicitado';return 'Em andamento'}

var lastPt={x:window.innerWidth/2,y:window.innerHeight/3};

  var cv=document.createElement('canvas');cv.width=W*dpr;cv.height=H*dpr;

  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  var cols=['#0072CE','#41B6E6','#6431E2','#FF40B3','#FFE800','#B8CCEA'],ps=[];
  for(var i=0;i<90;i++){var a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.25,v=5+Math.random()*9;
    ps.push({x:lastPt.x,y:lastPt.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*6,h:3+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],round:i%4===0})}

  (function frame(now){

/* ---------- ações ---------- */
function firstMid(pipe){var st=PIPES[pipe];for(var i=1;i<st.length;i++){if(!st[i].ap&&!st[i].done)return st[i]}return st[0]}
function setStage(t,id){
  var from=stageOf(t),to=PIPES[t.pipe].filter(function(s){return s.id===id})[0];if(!to||from.id===to.id)return;
  if(to.done){t.prev=from.id;t.done=dayISO(0);burst()}else{t.done=null}
  t.stage=id;save();
}
function toggleDone(t){
  if(isDone(t)){var prev=PIPES[t.pipe].filter(function(s){return s.id===t.prev&&!s.done})[0]||firstMid(t.pipe);setStage(t,prev.id);toast('Demanda reaberta em '+prev.n)}
  else{var d=PIPES[t.pipe].filter(function(s){return s.done})[0];setStage(t,d.id);toast('Concluída. Fica na seção Concluídas.')}
}
function moveToPhase(t,phase){
  var st=PIPES[t.pipe],target;
  if(phase==='Solicitado')target=st[0];
  else if(phase==='Aprovação')target=st.filter(function(s){return s.ap})[0];
  else if(phase==='Concluído')target=st.filter(function(s){return s.done})[0];
  else{var cur=stageOf(t);target=(!cur.done&&!cur.ap&&st[0].id!==cur.id)?cur:firstMid(t.pipe)}
  if(!target){toast('O pipeline de '+t.pipe+' não tem essa etapa.');return}
  if(target.id===t.stage)return;
  setStage(t,target.id);toast('Movida para '+target.n+' em '+t.pipe);
}
function addTask(title,pipe,extra){

/* ---------- filtro, ordem, grupos ---------- */
function visibleTasks(){
  var q=state.q.trim().toLowerCase();
  return state.tasks.filter(function(t){
    if(state.area!=='Todas'&&t.pipe!==state.area)return false;
    if(state.fPri.length&&state.fPri.indexOf(t.pri)<0)return false;
    if(state.fPpl.length&&!t.ppl.some(function(p){return state.fPpl.indexOf(p)>=0}))return false;
    if(q&&t.title.toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function sorter(){
  var po={Alta:0,'Média':1,Baixa:2};
  return function(a,b){
    var k=state.dir;
    if(state.sort==='name')return k*a.title.localeCompare(b.title,'pt-BR');
    if(state.sort==='pri'){var d=po[a.pri]-po[b.pri];if(d)return k*d}
    if(!a.due&&b.due)return 1;if(a.due&&!b.due)return -1;
    var da=a.due||'',db=b.due||'';if(da!==db)return k*(da<db?-1:1);

  };
}

  var order;
  if(g==='none'){list.forEach(function(t){put('Todas as demandas',t)})}
  else if(g==='pipe'){PIPE_NAMES.forEach(function(p){map[p]={key:p,tasks:[],meta:{pipe:p}};groups.push(map[p])});list.forEach(function(t){map[t.pipe].tasks.push(t)});groups=groups.filter(function(x){return x.tasks.length||state.area==='Todas'&&!state.q&&!state.fPri.length&&!state.fPpl.length})}
  else if(g==='phase'){PHASES.forEach(function(p){map[p]={key:p,tasks:[],meta:{doneGroup:p==='Concluído'}};groups.push(map[p])});list.forEach(function(t){map[phaseOf(t)].tasks.push(t)})}
  else if(g==='resp'){TEAM.forEach(function(p){map[p.i]={key:p.n,tasks:[],meta:{}};groups.push(map[p.i])});map._='x';map._={key:'Sem responsável',tasks:[],meta:{}};groups.push(map._);list.forEach(function(t){(t.ppl.length?map[t.ppl[0]]:map._).tasks.push(t)});groups=groups.filter(function(x){return x.tasks.length})}
  else if(g==='due'){order=['Atrasadas','Hoje','Próximos 7 dias','Depois','Sem prazo','Concluídas'];order.forEach(function(k){map[k]={key:k,tasks:[],meta:{doneGroup:k==='Concluídas'}};groups.push(map[k])});list.forEach(function(t){map[dueBucket(t)].tasks.push(t)});groups=groups.filter(function(x){return x.tasks.length})}

  if(state.newOpen){
    h+='<div class="scrim" data-act="closenew"></div><div class="modal" role="dialog" aria-label="Nova demanda"><h3>Nova demanda</h3>'+
      '<label>O que você precisa<input type="text" id="nName" placeholder="Ex: banner para a campanha de vagas de agosto"></label>'+
      '<label>Área de marketing<select id="nPipe">'+PIPE_NAMES.map(function(p){return '<option'+(p===(state.area!=='Todas'?state.area:'Design')?' selected':'')+'>'+esc(p)+'</option>'}).join('')+'</select></label>'+
      '<label>Tipo de material<input type="text" id="nTipo" placeholder="Ex: post, landing page, lista de leads, relatório..."></label>'+
      '<label>Contexto e objetivo<textarea class="desc" id="nDesc" placeholder="Para que serve, onde vai ser usado, qual mensagem precisa passar..."></textarea></label>'+
      '<label>Precisa para quando<input type="date" id="nDue"></label>'+
      '<label>Link de referência (opcional)<input type="text" id="nLink" placeholder="https://..."></label>'+
      '<label>Prioridade<select id="nPri">'+PRIS.map(function(p){return '<option'+(p==='Média'?' selected':'')+'>'+p+'</option>'}).join('')+'</select></label>'+
      '<div class="mact"><button class="b2" data-act="closenew">Cancelar</button><button class="b1" data-act="savenew">Criar demanda</button></div></div>';
  }
  var t=state.sel&&state.tasks.filter(function(x){return x.id===state.sel})[0];
  if(t){
    var done=isDone(t);
    h+='<div class="scrim" data-act="closedrawer"></div><aside class="drawer" role="dialog" aria-label="Detalhe da demanda"><div class="dh">'+
      '<button class="donebtn'+(done?' on':'')+'" data-toggle="'+t.id+'">'+CHECK+(done?'Concluída':'Marcar como concluída')+'</button>'+
      '<button class="x" data-act="closedrawer" aria-label="Fechar">'+'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>'+
      '<div class="db"><input class="ttl'+(done?' isdone':'')+'" id="dTitle" value="'+esc(t.title)+'" aria-label="Nome da demanda">'+
      '<div class="fields"><span>Área de marketing</span><select id="dPipe">'+PIPE_NAMES.map(function(p){return '<option'+(p===t.pipe?' selected':'')+'>'+esc(p)+'</option>'}).join('')+'</select>'+
      '<span>Etapa</span><select id="dStage">'+PIPES[t.pipe].map(function(s){return '<option value="'+s.id+'"'+(s.id===t.stage?' selected':'')+'>'+esc(s.n)+'</option>'}).join('')+'</select>'+
      '<span>Tipo de material</span><input type="text" id="dTipo" value="'+esc(t.tipo||'')+'" placeholder="post, landing page, relatório...">'+
      '<span>Precisa para quando</span><input type="date" id="dDue" value="'+(t.due||'')+'">'+
      '<span>Link de referência</span><input type="text" id="dLink" value="'+esc(t.link||'')+'" placeholder="https://...">'+
      '<span>Prioridade</span><select id="dPri">'+PRIS.map(function(p){return '<option'+(p===t.pri?' selected':'')+'>'+p+'</option>'}).join('')+'</select>'+
      '<span>Pessoas</span><div class="pick">'+TEAM.map(function(p){return '<button data-ppl="'+p.i+'" class="'+(t.ppl.indexOf(p.i)>=0?'on':'')+'"><span class="av" style="background:'+p.c+'">'+p.i+'</span>'+esc(p.n.split(' ')[0])+'</button>'}).join('')+'</div></div>'+
      '<div class="dsec"><h5>Contexto e objetivo</h5><textarea class="desc" id="dDesc" placeholder="Para que serve, onde vai ser usado, qual mensagem precisa passar...">'+esc(t.desc)+'</textarea></div>'+
      '<div class="dsec"><h5>Subtarefas'+(t.subs.length?' · '+t.subs.filter(function(s){return s.done}).length+'/'+t.subs.length:'')+'</h5>'+
      t.subs.map(function(s){return '<div class="sub-r'+(s.done?' done':'')+'"><button class="chk'+(s.done?' on':'')+'" data-sub="'+s.id+'" aria-label="Alternar subtarefa">'+CHECK+'</button><span class="st">'+esc(s.t)+'</span></div>'}).join('')+
      '<input class="subadd" id="dSubAdd" type="text" placeholder="Adicionar subtarefa e Enter" aria-label="Adicionar subtarefa"></div></div></aside>';
  }
  var active=document.activeElement&&document.activeElement.id;
  L.innerHTML=h;
  if(state.newOpen){var nn=document.getElementById('nName');if(nn)nn.focus()}
}

/* ---------- render geral ---------- */
function renderContent(){
  var c=document.getElementById('content');
  var top=c.scrollTop;
  c.innerHTML=state.view==='list'?renderList():renderBoard();
  c.scrollTop=top;
  var ia=document.getElementById('inlineAdd');if(ia)ia.focus();
}
function renderAll(){renderSide();renderHead();renderContent();renderLayer()}
function refresh(){renderSide();renderHead();renderContent();if(state.sel||state.newOpen)renderLayer()}

/* ---------- eventos ---------- */
function byId(id){return state.tasks.filter(function(t){return t.id===id})[0]}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-toggle],[data-area],[data-gtoggle],[data-add],[data-more],[data-open],[data-act],[data-view],[data-sub],[data-ppl],[data-sort]');
  if(!el)return;
  if(el.hasAttribute('data-toggle')){e.stopPropagation();var t=byId(el.getAttribute('data-toggle'));if(t){toggleDone(t);refresh()}return}
  if(el.hasAttribute('data-sub')){var tt=byId(state.sel);var s=tt.subs.filter(function(x){return x.id===el.getAttribute('data-sub')})[0];s.done=!s.done;save();refresh();return}
  if(el.hasAttribute('data-ppl')){var t2=byId(state.sel),i=el.getAttribute('data-ppl'),ix=t2.ppl.indexOf(i);if(ix>=0)t2.ppl.splice(ix,1);else t2.ppl.push(i);save();refresh();return}
  if(el.hasAttribute('data-area')){e.stopPropagation();state.area=el.getAttribute('data-area');state.addFor=null;refresh();return}
  if(el.hasAttribute('data-gtoggle')){var k=el.getAttribute('data-gtoggle'),def=el.getAttribute('data-gdef')==='1';state.collapsed[k]=!expanded(k,def);renderContent();return}
  if(el.hasAttribute('data-add')){state.addFor=el.getAttribute('data-add');renderContent();return}
  if(el.hasAttribute('data-more')){var m=el.getAttribute('data-more');state.boardMore[m]=!state.boardMore[m];renderContent();return}
  if(el.hasAttribute('data-sort')){var sk=el.getAttribute('data-sort');if(state.sort===sk)state.dir=-state.dir;else{state.sort=sk;state.dir=1}renderHead();renderContent();return}
  if(el.hasAttribute('data-view')){state.view=el.getAttribute('data-view');refresh();return}
  if(el.hasAttribute('data-open')){state.sel=el.getAttribute('data-open');renderLayer();return}
  var a=el.getAttribute('data-act');
  if(a==='closedrawer'){state.sel=null;renderLayer();refresh()}
  else if(a==='closenew'){state.newOpen=false;renderLayer()}
  else if(a==='new'){state.newOpen=true;renderLayer()}
  else if(a==='savenew'){var nm=document.getElementById('nName').value.trim();if(!nm){document.getElementById('nName').focus();return}
    addTask(nm,document.getElementById('nPipe').value,{pri:document.getElementById('nPri').value,due:document.getElementById('nDue').value,tipo:document.getElementById('nTipo').value.trim(),desc:document.getElementById('nDesc').value.trim(),link:document.getElementById('nLink').value.trim()});state.newOpen=false;renderLayer();refresh()}
  else if(a==='fclose'){state.fOpen=false;renderHead()}
  else if(a==='fclear'){state.fPri=[];state.fPpl=[];renderHead();renderContent()}
  else if(a==='fclear2'){state.fPri=[];state.fPpl=[];state.q='';document.getElementById('q').value='';refresh()}
});
document.getElementById('btnNew').addEventListener('click',function(){state.newOpen=true;renderLayer()});
document.getElementById('btnF').addEventListener('click',function(){state.fOpen=!state.fOpen;renderHead()});
document.getElementById('btnReset').addEventListener('click',function(){state.tasks=seed();save();state.sel=null;refresh();renderLayer();toast('Exemplos restaurados')});
document.getElementById('q').addEventListener('input',function(e){state.q=e.target.value;renderHead();renderContent()});
document.getElementById('selGroup').addEventListener('change',function(e){state.group=e.target.value;renderContent()});
document.getElementById('selSort').addEventListener('change',function(e){state.sort=e.target.value;state.dir=1;renderContent()});
document.getElementById('selDone').addEventListener('change',function(e){state.doneMode=e.target.value;state.collapsed={};renderContent()});
document.getElementById('fPop').addEventListener('change',function(e){
  var p=e.target.getAttribute('data-fpri'),q=e.target.getAttribute('data-fppl');
  function tog(arr,v){var i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v)}
  if(p)tog(state.fPri,p);if(q)tog(state.fPpl,q);renderHead();renderContent();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(state.newOpen){state.newOpen=false;renderLayer()}else if(state.sel){state.sel=null;renderLayer();refresh()}else if(state.addFor){state.addFor=null;renderContent()}else if(state.fOpen){state.fOpen=false;renderHead()}}
  if(e.key==='Enter'){
    var t=e.target;
    if(t.id==='inlineAdd'&&t.value.trim()){addTask(t.value.trim(),t.getAttribute('data-addpipe'));state.addFor=null;refresh()}
    else if(t.id==='dSubAdd'&&t.value.trim()){var tk=byId(state.sel);tk.subs.push({id:'s'+Date.now(),t:t.value.trim(),done:false});save();refresh();var f=document.getElementById('dSubAdd');if(f)f.focus()}
    else if(t.id==='nName'){document.querySelector('[data-act="savenew"]').click()}
    else if(t.id==='dTitle'){t.blur()}
  }
});
document.addEventListener('change',function(e){
  var id=e.target.id;if(!state.sel||!id||id.charAt(0)!=='d')return;var t=byId(state.sel);if(!t)return;
  if(id==='dTitle'){t.title=e.target.value.trim()||t.title}
  else if(id==='dPipe'){t.pipe=e.target.value;t.stage=PIPES[t.pipe][0].id;t.done=null;t.prev=null}
  else if(id==='dStage'){setStage(t,e.target.value)}
  else if(id==='dPri'){t.pri=e.target.value}
  else if(id==='dDue'){t.due=e.target.value||null}
  else if(id==='dDesc'){t.desc=e.target.value}
  else if(id==='dTipo'){t.tipo=e.target.value.trim()}
  else if(id==='dLink'){t.link=e.target.value.trim()||null}
  else return;
  save();refresh();
});
document.addEventListener('focusout',function(e){if(e.target.id==='dDesc'&&state.sel){var t=byId(state.sel);if(t){t.desc=e.target.value;save()}}if(e.target.id==='inlineAdd'&&!e.target.value.trim()){state.addFor=null;setTimeout(renderContent,0)}});
/* arrastar entre colunas do quadro */
var dragId=null;
document.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('[data-drag]');if(!c)return;dragId=c.getAttribute('data-drag');c.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(x){}});
document.addEventListener('dragend',function(){dragId=null;Array.prototype.forEach.call(document.querySelectorAll('.dragging,.over'),function(n){n.classList.remove('dragging','over')})});
document.addEventListener('dragover',function(e){var c=e.target.closest&&e.target.closest('[data-col]');if(c&&dragId){e.preventDefault();Array.prototype.forEach.call(document.querySelectorAll('.over'),function(n){if(n!==c)n.classList.remove('over')});c.classList.add('over')}});
document.addEventListener('drop',function(e){var c=e.target.closest&&e.target.closest('[data-col]');if(!c||!dragId)return;e.preventDefault();var t=byId(dragId);var col=c.getAttribute('data-col');dragId=null;if(!t)return;
  if(state.area==='Todas')moveToPhase(t,col);else{var to=PIPES[t.pipe].filter(function(s){return s.id===col})[0];if(to&&to.id!==t.stage){setStage(t,to.id);toast('Movida para '+to.n)}}
  refresh()});

document.addEventListener('pointerdown',function(e){lastPt={x:e.clientX,y:e.clientY}},true);
document.addEventListener('drop',function(e){lastPt={x:e.clientX,y:e.clientY}},true);
load();
var hash=(location.hash||'').replace('#','');
if(hash==='quadro')state.view='board';
renderAll();
})();
</script>

</body></html>

function EmbaixadorPerfilModal({ e, onClose }) {
  const iniciais = (e.nome||'').split(/\s+/).filter(Boolean).map(s=>s[0]).slice(0,2).join('').toUpperCase();
  const ano = e.criadoEm ? new Date(e.criadoEm).getFullYear() : null;
  const instaHandle = e.instagram && (e.instagram.startsWith('@') ? e.instagram : '@'+e.instagram.replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/\/$/,''));
  const instaHref = e.instagram && (e.instagram.startsWith('http') ? e.instagram : 'https://instagram.com/'+e.instagram.replace('@',''));

  return (
    <Modal onClose={onClose} width={480}>
      <div style={{aspectRatio:'16/11',background:e.foto?'#EAF3FD':'linear-gradient(135deg,'+NB.azul+','+NB.azulClaro+')',display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
        {e.foto && <img src={e.foto} alt="" style={{width:'100%',height:'100%',objectFit:'contain'}}/>}
        {!e.foto && <span style={{fontSize:44,fontWeight:600,color:'#fff',marginBottom:20}}>{iniciais}</span>}
      </div>
      <div style={{padding:'20px 24px 24px'}}>
        {e.cargo && <span style={{fontSize:12,fontWeight:700,letterSpacing:'0.06em',textTransform:'uppercase',color:NB.azul}}>{e.cargo}</span>}
        <h3 style={{fontSize:19,fontWeight:600,color:NB.txt,marginTop:3,marginBottom:e.empresa?2:10}}>{e.nome}</h3>
        {e.empresa && <p style={{fontSize:13,color:NB.mut,marginBottom:14}}>{e.empresa}</p>}
        {e.descricao && <p style={{fontSize:14,color:NB.txt,lineHeight:1.6,marginBottom:16}}>{e.descricao}</p>}

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,paddingTop:14,borderTop:'1px solid '+NB.bdSoft,marginBottom:16}}>
          <div>
            <div style={{fontSize:11,color:NB.mut2,marginBottom:3}}>Embaixadora desde</div>
            <div style={{fontSize:13,fontWeight:600,color:NB.txt}}>{ano || '—'}</div>
          </div>
          <div>
            <div style={{fontSize:11,color:NB.mut2,marginBottom:3}}>Instagram</div>
            {instaHandle ? (
              <a href={instaHref} target="_blank" rel="noopener noreferrer" style={{fontSize:13,fontWeight:600,color:NB.azul,textDecoration:'none'}}>{instaHandle}</a>
            ) : <div style={{fontSize:13,color:NB.mut2}}>—</div>}
          </div>
        </div>

        {(e.especialidades||[]).length>0 && (
          <div>
            <div style={{fontSize:12.5,fontWeight:600,color:NB.mut,marginBottom:8}}>Especialidades e áreas de conhecimento</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
              {e.especialidades.map((t,i)=>(
                <span key={i} style={{fontSize:12.5,color:NB.azul,background:'#EAF3FD',borderRadius:20,padding:'5px 12px'}}>{t}</span>
              ))}
            </div>
          </div>
        )}
      </div>
    </Modal>
  );
}

function EmbaixadoresTab({ podeEditar }) {
  const { embaixadores, removeEmbaixador, addEmbaixador } = useApp();
  const [novo, setNovo] = useState(false);
  const [mostrarTodos, setMostrarTodos] = useState(false);
  const [selecionado, setSelecionado] = useState(null);
  const [semeando, setSemeando] = useState(false);
  const iniciais = nome => (nome||'').split(/\s+/).filter(Boolean).map(s=>s[0]).slice(0,2).join('').toUpperCase();

  const adicionarProntos = async () => {
    setSemeando(true);
    const jaTem = new Set(embaixadores.map(e=>e.nome));
    for (const emb of EMBAIXADORES_PRONTOS) {
      if (!jaTem.has(emb.nome)) await addEmbaixador(emb);
    }
    setSemeando(false);
  };

  return (
    <div>
      <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',marginBottom:22}}>
        <div>
          <h2 style={{fontSize:19,fontWeight:600,color:NB.txt}}>Nossos embaixadores</h2>
          <p style={{fontSize:13,color:NB.mut,marginTop:3,maxWidth:520}}>Colaboradores que ajudam a levar a voz do Nibo pras redes sociais, eventos e conteúdos.</p>
        </div>
        {podeEditar && (
          <div style={{display:'flex',gap:9,flexShrink:0}}>
            {embaixadores.length<4 && (
              <button onClick={adicionarProntos} disabled={semeando}
                style={{display:'flex',alignItems:'center',gap:7,padding:'9px 15px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.azul,opacity:semeando?0.7:1}}>
                {semeando?'Adicionando…':'Adicionar os 4 prontos'}
              </button>
            )}
            <button onClick={()=>setNovo(true)}
              style={{display:'flex',alignItems:'center',gap:7,padding:'9px 15px',background:NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>
              <IPlus s={13}/> Novo embaixador
            </button>
          </div>
        )}
      </div>
      {embaixadores.length===0 ? (
        <div style={{background:'#fff',border:'1px dashed '+NB.bd,borderRadius:16,padding:'48px 24px',textAlign:'center'}}>
          <div style={{width:52,height:52,borderRadius:14,background:NB.col,color:NB.mut2,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}}>
            <IStamp s={23}/>
          </div>
          <p style={{fontSize:14,fontWeight:600,color:NB.txt,marginBottom:6}}>Nenhum embaixador cadastrado ainda</p>
        </div>
      ) : (
        <div style={{display:'grid',gridTemplateColumns: embaixadores.length>4 ? 'repeat(4,1fr) 56px' : 'repeat(4,1fr)',gap:20,alignItems:'start'}}>
          {embaixadores.slice(0,4).map((e,i)=>{
            const [c1,c2] = AVATAR_GRADIENTES[i % AVATAR_GRADIENTES.length];
            return (
              <div key={e.id} onClick={()=>setSelecionado(e)} style={{display:'flex',flexDirection:'column',cursor:'pointer'}}>
                <div style={{aspectRatio:'3/3.6',borderRadius:24,overflow:'hidden',marginBottom:18,background:e.foto?'#EAF3FD':'linear-gradient(135deg,'+c1+','+c2+')',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 14px 30px rgba(16,20,31,0.1)'}}>
                  {e.foto ? <img src={e.foto} alt={e.nome} style={{width:'100%',height:'100%',objectFit:'contain'}}/> : <span style={{fontSize:34,fontWeight:600,color:'#fff'}}>{iniciais(e.nome)}</span>}
                </div>
                {e.cargo && <span style={{fontSize:12,fontWeight:700,letterSpacing:'0.06em',textTransform:'uppercase',color:NB.azul,marginBottom:8}}>{e.cargo}</span>}
                <h4 style={{fontSize:19,fontWeight:600,color:NB.txt,marginBottom:4}}>{e.nome}</h4>
                {e.empresa && <p style={{fontSize:13.5,color:NB.mut,fontWeight:500,marginBottom:6}}>{e.empresa}</p>}
                {e.instagram && (
                  <a href={e.instagram.startsWith('http')?e.instagram:'https://instagram.com/'+e.instagram.replace('@','')} target="_blank" rel="noopener noreferrer" onClick={ev=>ev.stopPropagation()}
                    style={{display:'inline-block',fontSize:12.5,color:NB.azul,textDecoration:'none'}}>{e.instagram}</a>
                )}
                {podeEditar && (
                  <button onClick={ev=>{ev.stopPropagation(); removeEmbaixador(e.id);}} style={{alignSelf:'flex-start',marginTop:8,fontSize:11,color:'#B4232A',background:'none',border:'none'}}>Remover</button>
                )}
              </div>
            );
          })}
          {embaixadores.length>4 && !mostrarTodos && (
            <button onClick={()=>setMostrarTodos(true)} title="Ver mais embaixadores"
              style={{alignSelf:'center',justifySelf:'center',width:38,height:38,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(236,244,255,0.75)',border:'1px solid '+NB.bd}}>
              <IArrowR s={14}/>
            </button>
          )}
        </div>
      )}
      {mostrarTodos && embaixadores.length>4 && (
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:20,marginTop:20}}>
          {embaixadores.slice(4).map((e,i)=>{
            const [c1,c2] = AVATAR_GRADIENTES[(i+4) % AVATAR_GRADIENTES.length];
            return (
              <div key={e.id} onClick={()=>setSelecionado(e)} style={{display:'flex',flexDirection:'column',cursor:'pointer'}}>
                <div style={{aspectRatio:'3/3.6',borderRadius:24,overflow:'hidden',marginBottom:18,background:e.foto?'#EAF3FD':'linear-gradient(135deg,'+c1+','+c2+')',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 14px 30px rgba(16,20,31,0.1)'}}>
                  {e.foto ? <img src={e.foto} alt={e.nome} style={{width:'100%',height:'100%',objectFit:'contain'}}/> : <span style={{fontSize:34,fontWeight:600,color:'#fff'}}>{iniciais(e.nome)}</span>}
                </div>
                {e.cargo && <span style={{fontSize:12,fontWeight:700,letterSpacing:'0.06em',textTransform:'uppercase',color:NB.azul,marginBottom:8}}>{e.cargo}</span>}
                <h4 style={{fontSize:19,fontWeight:600,color:NB.txt,marginBottom:4}}>{e.nome}</h4>
                {e.empresa && <p style={{fontSize:13.5,color:NB.mut,fontWeight:500,marginBottom:6}}>{e.empresa}</p>}
                {e.instagram && (
                  <a href={e.instagram.startsWith('http')?e.instagram:'https://instagram.com/'+e.instagram.replace('@','')} target="_blank" rel="noopener noreferrer" onClick={ev=>ev.stopPropagation()}
                    style={{display:'inline-block',fontSize:12.5,color:NB.azul,textDecoration:'none'}}>{e.instagram}</a>
                )}
                {podeEditar && (
                  <button onClick={ev=>{ev.stopPropagation(); removeEmbaixador(e.id);}} style={{alignSelf:'flex-start',marginTop:8,fontSize:11,color:'#B4232A',background:'none',border:'none'}}>Remover</button>
                )}
              </div>
            );
          })}
        </div>
      )}
      {novo && <EmbaixadorModal onClose={()=>setNovo(false)}/>}
      {selecionado && <EmbaixadorPerfilModal e={selecionado} onClose={()=>setSelecionado(null)}/>}
    </div>
  );
}

/* ---------- Gerar Abordagem (IA por persona) ---------- */
function AbordagemTab() {
  const { campanhas } = useApp();
  const publicadas = campanhas.filter(c=>c.status==='publicada');
  const [campId, setCampId] = useState(null);
  const [persona, setPersona] = useState(null);
  const [copiado, setCopiado] = useState(null);
  const copiar = (t,i) => { navigator.clipboard && navigator.clipboard.writeText(t); setCopiado(i); setTimeout(()=>setCopiado(null),1800); };
  const camp = publicadas.find(c=>c.id===campId) || null;

  return (
    <div style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:16,padding:'22px 24px',boxShadow:'0 1px 3px rgba(11,42,92,0.04)'}}>
      <div style={{...lbl,marginBottom:11}}>Qual campanha você vai abordar?</div>
      {publicadas.length===0 ? (
        <div style={{background:NB.col,border:'1px dashed '+NB.bd,borderRadius:11,padding:'18px 16px',marginBottom:8}}>
          <p style={{fontSize:13,color:NB.mut,lineHeight:1.6}}>Nenhuma campanha publicada no momento. A abordagem sempre parte de uma campanha real — assim que o marketing publicar uma, ela aparece aqui pra escolher.</p>
        </div>
      ) : (
        <div style={{display:'flex',gap:9,flexWrap:'wrap',marginBottom:22}}>
          {publicadas.map(c=>{
            const on = campId===c.id;
            return (
              <button key={c.id} onClick={()=>setCampId(c.id)}
                style={{padding:'10px 16px',borderRadius:10,border:'1px solid '+(on?NB.azul:NB.bd),background:on?'#EAF3FD':'#fff',fontSize:13.5,fontWeight:500,color:on?NB.azul:NB.mut,textAlign:'left'}}>
                {c.titulo}{c.desconto && <span style={{color:NB.mut2,fontWeight:400}}> · {c.desconto}</span>}
              </button>
            );
          })}
        </div>
      )}

      {camp && (
        <React.Fragment>
          <div style={{...lbl,marginBottom:11}}>Pra quem é essa abordagem?</div>
          <div style={{display:'flex',gap:9,flexWrap:'wrap',marginBottom:22}}>
            {PERSONAS.map(p=>{
              const on = persona===p.id;
              return (
                <button key={p.id} onClick={()=>setPersona(p.id)}
                  style={{display:'flex',alignItems:'center',gap:8,padding:'10px 16px',borderRadius:10,border:'1px solid '+(on?NB.azul:NB.bd),background:on?'#EAF3FD':'#fff',fontSize:13.5,fontWeight:500,color:on?NB.azul:NB.mut}}>
                  <span>{p.emoji}</span> {p.label}
                </button>
              );
            })}
          </div>
        </React.Fragment>
      )}

      {camp && persona && (
        <div style={{display:'flex',flexDirection:'column',gap:11}}>
          {personaVariants(persona, camp).map((v,i)=>(
            <div key={i} style={{background:NB.col,border:'1px solid '+NB.bd,borderRadius:11,padding:'14px 16px'}}>
              <div style={{fontSize:10.5,fontWeight:600,color:NB.mut2,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:7}}>{v.rotulo}</div>
              <p style={{fontSize:13.5,color:NB.txt,lineHeight:1.6,marginBottom:10}}>{v.texto}</p>
              <button onClick={()=>copiar(v.texto,i)}
                style={{padding:'7px 13px',background:copiado===i?'#E1F5EE':'#fff',border:'1px solid '+(copiado===i?'#0F6E56':NB.bd),borderRadius:8,fontSize:12,fontWeight:500,color:copiado===i?'#0F6E56':NB.mut}}>
                {copiado===i?'Copiado ✓':'Copiar'}
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}



/* =========== CAMPANHAS — gestão, só quem tem permissão ============ */
function CampanhaEditModal({ camp, onClose }) {
  const { updateCampanha, MAX_FILE } = useApp();
  const [form, setForm] = useState({
    titulo: camp.titulo || '', descricao: camp.descricao || '',
    desconto: camp.desconto || '', jornada: camp.jornada || 'empresa',
    instagramLink: camp.instagramLink || '', foto: camp.foto || '',
  });
  const [pecas, setPecas] = useState(camp.pecasDemanda || []);
  const [novaPeca, setNovaPeca] = useState({ nome:'', url:'' });
  const [err, setErr] = useState('');
  const [comprimindo, setComprimindo] = useState(false);
  const set = (k,v) => { setForm(f=>({...f,[k]:v})); setErr(''); };

  const escolherFoto = e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (file.size > 8*1024*1024) return setErr('A foto tem '+Math.round(file.size/1024)+'KB — tenta uma bem menor (até uns 8MB de origem).');
    setErr(''); setComprimindo(true);
    const img = new Image();
    img.onload = () => {
      const maxLado = 900;
      const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
      const w = Math.round(img.width * escala), h = Math.round(img.height * escala);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
      setComprimindo(false);
      if (dataUrl.length > MAX_FILE) { setErr('A foto ficou grande demais mesmo comprimida — tenta outra imagem.'); return; }
      set('foto', dataUrl);
    };
    img.onerror = () => { setComprimindo(false); setErr('Não foi possível processar essa foto.'); };
    img.src = URL.createObjectURL(file);
  };

  const adicionarPeca = () => {
    if (!novaPeca.nome.trim() || !novaPeca.url.trim()) return setErr('Preencha nome e link da peça.');
    let url = novaPeca.url.trim();
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    setPecas(p => [...p, { name: novaPeca.nome.trim(), url }]);
    setNovaPeca({ nome:'', url:'' }); setErr('');
  };
  const removerPeca = i => setPecas(p => p.filter((_,ix)=>ix!==i));

  const salvar = () => {
    if (!form.titulo.trim()) return setErr('O título não pode ficar vazio.');
    let link = form.instagramLink.trim();
    if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
    updateCampanha(camp.id, {
      titulo: form.titulo.trim(), descricao: form.descricao.trim(),
      desconto: form.desconto.trim(), jornada: form.jornada, instagramLink: link, foto: form.foto,
      pecasDemanda: pecas,
    });
    onClose();
  };

  return (
    <Modal onClose={onClose} width={520}>
      <div style={{padding:'22px 24px 16px',borderBottom:'1px solid '+NB.bdSoft}}>
        <h2 style={{fontSize:17,fontWeight:600,color:NB.txt,marginBottom:5}}>Editar campanha</h2>
        <p style={{fontSize:12.5,color:NB.mut}}>Pra corrigir algo que veio errado da demanda — não recria, só ajusta.</p>
      </div>
      <div style={{padding:'20px 24px',display:'flex',flexDirection:'column',gap:14,maxHeight:'60vh',overflowY:'auto'}}>
        <div>
          <div style={{...lbl,marginBottom:6}}>Foto principal (opcional)</div>
          <div style={{display:'flex',alignItems:'center',gap:14}}>
            <div style={{width:64,height:44,borderRadius:8,overflow:'hidden',background:NB.col,border:'1px solid '+NB.bd,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              {comprimindo ? (
                <div style={{width:14,height:14,border:'2px solid '+NB.bd,borderTopColor:NB.azul,borderRadius:'50%',animation:'nb-spin 0.8s linear infinite'}}/>
              ) : form.foto ? (
                <img src={form.foto} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
              ) : <IPhoto s={16} color={NB.mut2}/>}
            </div>
            <label style={{fontSize:12.5,fontWeight:600,color:comprimindo?NB.mut2:NB.azul,cursor:comprimindo?'default':'pointer',padding:'8px 14px',border:'1px solid '+NB.bd,borderRadius:9}}>
              {comprimindo ? 'Comprimindo…' : (form.foto ? 'Trocar foto' : 'Adicionar foto')}
              <input type="file" accept="image/*" onChange={escolherFoto} disabled={comprimindo} style={{display:'none'}}/>
            </label>
            {form.foto && !comprimindo && (
              <button type="button" onClick={()=>set('foto','')} style={{fontSize:12,color:'#B4232A',background:'none',border:'none'}}>Remover</button>
            )}
          </div>
          <p style={{fontSize:11,color:NB.mut2,marginTop:6}}>Comprimida automaticamente pra não pesar no banco. Sem foto, mantém o fundo colorido.</p>
        </div>
        <div>
          <div style={{...lbl,marginBottom:6}}>Título</div>
          <input value={form.titulo} onChange={e=>set('titulo',e.target.value)} style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
        </div>
        <div>
          <div style={{...lbl,marginBottom:6}}>Descrição</div>
          <textarea value={form.descricao} onChange={e=>set('descricao',e.target.value)} rows={2} style={{...inp,padding:'9px 12px',fontSize:13.5,resize:'vertical'}}/>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div>
            <div style={{...lbl,marginBottom:6}}>Desconto</div>
            <input value={form.desconto} onChange={e=>set('desconto',e.target.value)} placeholder="ex: 20% OFF" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
          </div>
          <div>
            <div style={{...lbl,marginBottom:6}}>Jornada</div>
            <select value={form.jornada} onChange={e=>set('jornada',e.target.value)} style={{...inp,padding:'9px 12px',fontSize:13.5}}>
              {PERSONAS.map(p=><option key={p.id} value={p.id}>{p.emoji} {p.label}</option>)}
            </select>
          </div>
        </div>
        <div>
          <div style={{...lbl,marginBottom:6}}>Link do post no Instagram</div>
          <input value={form.instagramLink} onChange={e=>set('instagramLink',e.target.value)} placeholder="cole quando publicar lá" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
        </div>

        <div>
          <div style={{...lbl,marginBottom:8}}>Peças</div>
          {pecas.length>0 && (
            <div style={{display:'flex',flexDirection:'column',gap:7,marginBottom:10}}>
              {pecas.map((p,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:9,background:NB.col,border:'1px solid '+NB.bd,borderRadius:9,padding:'8px 11px'}}>
                  <span style={{color:NB.azul,display:'flex',flexShrink:0}}><ILink s={13}/></span>
                  <a href={p.url} target="_blank" rel="noopener noreferrer" style={{fontSize:13,color:NB.txt,textDecoration:'none',flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</a>
                  <button type="button" onClick={()=>removerPeca(i)} style={{fontSize:11,color:'#B4232A',background:'none',border:'none',flexShrink:0}}>Remover</button>
                </div>
              ))}
            </div>
          )}
          <div style={{display:'flex',gap:8}}>
            <input value={novaPeca.nome} onChange={e=>{setNovaPeca(v=>({...v,nome:e.target.value})); setErr('');}} placeholder="Nome da peça" style={{...inp,padding:'8px 11px',fontSize:12.5,flex:1}}/>
            <input value={novaPeca.url} onChange={e=>{setNovaPeca(v=>({...v,url:e.target.value})); setErr('');}} placeholder="Link" style={{...inp,padding:'8px 11px',fontSize:12.5,flex:1}}/>
            <button type="button" onClick={adicionarPeca} style={{padding:'8px 13px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:12,fontWeight:500,color:NB.azul,flexShrink:0}}>
              <IPlus s={12}/> Adicionar
            </button>
          </div>
        </div>

        {err && <p style={{fontSize:12.5,color:'#B4232A'}}>{err}</p>}
      </div>
      <div style={{padding:'16px 24px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'flex-end',gap:10}}>
        <button onClick={onClose} style={{padding:'10px 16px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>Cancelar</button>
        <button onClick={salvar} style={{padding:'10px 20px',background:NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>Salvar</button>
      </div>
    </Modal>
  );
}

  const publicada = camp.status === 'publicada';
  const nPecas = (camp.pecaIds||[]).length + (camp.pecasDemanda||[]).length;
  const podeGerenciar = !!user.canPublishCampaigns;

  return (
    <div style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:13,padding:'16px 18px',display:'flex',gap:14}}>
      {camp.foto && (
        <div style={{width:64,height:44,borderRadius:8,overflow:'hidden',flexShrink:0,background:NB.col}}>
          <img src={camp.foto} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
        </div>
      )}
      <div style={{flex:1,minWidth:0}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10,marginBottom:9}}>
        <div>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5,flexWrap:'wrap'}}>
            <span style={{fontSize:15,fontWeight:600,color:NB.txt}}>{camp.titulo}</span>
            <span style={{fontSize:10.5,fontWeight:600,padding:'2px 8px',borderRadius:6,background:publicada?'#E1F5EE':'#FFF6DE',color:publicada?'#0F6E56':'#8A6206'}}>
              {publicada?'Publicada':'Rascunho'}
            </span>
            {camp.origemDemandaId && (
              <span style={{fontSize:10.5,fontWeight:500,padding:'2px 8px',borderRadius:6,background:NB.col,color:NB.mut2}}>vinda de demanda</span>
            )}
          </div>
          <span style={{fontSize:12.5,color:NB.mut}}>
            {camp.desconto || 'sem desconto'}{camp.jornada ? ' · '+(PERSONAS.find(p=>p.id===camp.jornada)?.label||camp.jornada) : ''}
          </span>
        </div>
        {podeGerenciar && (
          <div style={{display:'flex',gap:7,flexShrink:0}}>
            <button onClick={()=>setEditar(true)} style={{padding:'7px 11px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:12,fontWeight:500,color:NB.mut}}>
              Editar
            </button>
            {publicada
              ? <button onClick={()=>despublicarCampanha(camp)} style={{padding:'7px 11px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:12,fontWeight:500,color:NB.mut}}>Despublicar</button>
              : <button onClick={()=>publicarCampanha(camp)} style={{padding:'7px 13px',background:'#0F6E56',border:'none',borderRadius:8,fontSize:12,fontWeight:500,color:'#fff'}}>Publicar</button>}
          </div>
        )}
      </div>
      {camp.descricao && <p style={{fontSize:12.5,color:NB.mut,lineHeight:1.55,marginBottom:8}}>{camp.descricao}</p>}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
        <span style={{fontSize:11.5,color:NB.mut2}}>{nPecas} peça(s) · {camp.instagramLink?'link do Insta ok':'sem link do Insta ainda'}</span>
        {podeGerenciar && (confirmar ? (
          <span style={{display:'flex',gap:7}}>
            <button onClick={()=>deleteCampanha(camp.id)} style={{padding:'5px 10px',background:'#B4232A',border:'none',borderRadius:7,fontSize:11.5,color:'#fff'}}>Confirmar</button>
            <button onClick={()=>setConfirmar(false)} style={{padding:'5px 10px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:7,fontSize:11.5,color:NB.mut}}>Cancelar</button>
          </span>
        ) : (
          <button onClick={()=>setConfirmar(true)} style={{fontSize:11.5,color:'#B4232A',background:'none',border:'none',fontWeight:500}}>Excluir</button>
        ))}
      </div>
      {editar && <CampanhaEditModal camp={camp} onClose={()=>setEditar(false)}/>}
      </div>
    </div>
  );
}

/* =========== GESTÃO — fila de aprovação =========== */
function ApprovalCard({ demand }) {
  const { moveStage, setNotifyPending, addComment, user, previewMember, setModal, attach, comments, pipes } = useApp();
  const [nota, setNota] = useState('');
  const [ajuste, setAjuste] = useState(false);

  const stages = pipes[demand.area] || [];
  const idx    = stages.findIndex(s => s.id === demand.stageId);
  const prox   = stages[idx+1];
  const antes  = stages[idx-1];
  const sla    = getSla(demand.deadline);
  const Icon   = AREA_ICON[demand.area];
  const podeAprovar = !!(previewMember ? previewMember.isApprover : user.isApprover);
  const nA = (attach[demand.id]||[]).length;
  const nC = (comments[demand.id]||[]).length;

  const aprovar = () => {
    if (!prox) return;
    if (demand.area === 'Design' && prox.isDone) {
      setNotifyPending({ demandId:demand.id, stageId:prox.id, demandTitle:demand.title });
    } else {
      moveStage(demand.id, prox.id);
    }
  };

  const pedirAjuste = () => {
    if (!antes) return;
    if (nota.trim()) addComment(demand, 'Ajuste solicitado: ' + nota.trim(), user.initials);
    moveStage(demand.id, antes.id);
    setNota(''); setAjuste(false);
  };

  return (
    <div style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:13,padding:'16px 18px',boxShadow:'0 1px 3px rgba(11,42,92,0.04)'}}>
      <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:9,flexWrap:'wrap'}}>
        <span style={{background:NB.col,border:'1px solid '+NB.bd,color:NB.mut,fontSize:11,fontWeight:500,padding:'2px 8px',borderRadius:6,fontFamily:'monospace'}}>{demand.code}</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:12.5,fontWeight:500,color:AREA_CLR[demand.area]}}><Icon s={14}/> {demand.area}</span>
        <span style={{fontSize:12,color:NB.mut2}}>· {stages[idx] ? stages[idx].name : '—'}</span>
        {sla && sla.type!=='ok' && (
          <span style={{fontSize:11.5,fontWeight:500,padding:'3px 9px',borderRadius:6,background:sla.type==='danger'?'#FEECEC':'#FFF6DE',color:sla.type==='danger'?'#B4232A':'#8A6206'}}>{sla.label}</span>
        )}
      </div>

      <button onClick={()=>setModal(demand.id)}
        style={{background:'none',border:'none',padding:0,textAlign:'left',fontSize:15,fontWeight:500,color:NB.txt,lineHeight:1.4,marginBottom:11}}>
        {demand.title}
      </button>

      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14,flexWrap:'wrap'}}>
        <div style={{display:'flex'}}>
          {demand.assignees.slice(0,4).map((init,i)=><CardAvatar key={init+i} initials={init} offset={i}/>)}
        </div>
        <span style={{fontSize:12.5,color:NB.mut}}>Prazo {fmtDate(demand.deadline)}</span>
        {nA>0 && <span style={{display:'flex',alignItems:'center',gap:4,fontSize:12,color:NB.mut2}}><IClip s={13}/>{nA}</span>}
        {nC>0 && <span style={{display:'flex',alignItems:'center',gap:4,fontSize:12,color:NB.mut2}}><IChatBox s={13}/>{nC}</span>}
      </div>

      {!podeAprovar ? (
        <div style={{fontSize:12.5,color:NB.mut2,background:NB.col,border:'1px solid '+NB.bd,borderRadius:9,padding:'10px 13px',lineHeight:1.55}}>
          Aguardando decisão de @Mariana Araújo. Abra o card para comentar ou anexar algo que ajude na aprovação.
        </div>
      ) : ajuste ? (
        <div style={{background:NB.col,border:'1px solid '+NB.bd,borderRadius:10,padding:'13px 14px'}}>
          <div style={{...lbl,marginBottom:7}}>O que precisa mudar</div>
          <textarea value={nota} onChange={e=>setNota(e.target.value)} rows={2} autoFocus
            placeholder="Ex: trocar o CTA e deixar o público explícito na primeira linha"
            style={{...inp,padding:'9px 12px',fontSize:13.5,resize:'vertical',lineHeight:1.55}}/>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:10}}>
            <button onClick={()=>{setAjuste(false); setNota('');}}
              style={{padding:'8px 14px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:12.5,fontWeight:500,color:NB.mut}}>Cancelar</button>
            <button onClick={pedirAjuste}
              style={{padding:'8px 16px',background:'#B4232A',border:'none',borderRadius:8,fontSize:12.5,fontWeight:500,color:'#fff'}}>
              Devolver para {antes ? antes.name : 'etapa anterior'}
            </button>
          </div>
        </div>
      ) : (
        <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
          <button onClick={aprovar} disabled={!prox}
            style={{display:'flex',alignItems:'center',gap:7,padding:'10px 17px',background:prox?'#0F6E56':'#CFD8E6',border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',cursor:prox?'pointer':'not-allowed'}}>
            <ICheck s={14}/> Aprovar {prox ? '→ '+prox.name : ''}
          </button>
          <button onClick={()=>setAjuste(true)} disabled={!antes}

/* =========== EDITOR DE ETAPAS =========== */
function StageEditorModal({ areaName, onClose }) {
  const { pipes, salvarPipes, active, moveStage } = useApp();
  const [rows, setRows] = useState(() => (pipes[areaName]||[]).map(s => ({...s})));
  const [delIdx, setDelIdx] = useState(null);
  const [err, setErr] = useState('');

  const contar = id => active.filter(d => d.area===areaName && d.stageId===id).length;

  const set = (i, patch) => setRows(r => r.map((s,k)=> k===i ? {...s, ...patch} : s));

  const mover = (i, dir) => setRows(r => {
    const j = i + dir;
    if (j < 0 || j >= r.length) return r;
    const c = [...r]; const tmp = c[i]; c[i] = c[j]; c[j] = tmp; return c;
  });

  const addStage = () => setRows(r => [...r, {
    id: areaName.slice(0,3).toLowerCase().replace(/[^a-z]/g,'') + '-' + Date.now().toString(36),
    name: 'Nova etapa',
  }]);

  const remover = i => {
    const alvo = rows[i];
    const n = contar(alvo.id);
    const destino = rows[i-1] || rows[i+1];
    if (rows.length <= 2) { setErr('Um pipeline precisa de pelo menos duas etapas.'); return; }
    if (n > 0 && destino) {
      active.filter(d => d.area===areaName && d.stageId===alvo.id)
            .forEach(d => moveStage(d.id, destino.id));
    }
    setRows(r => r.filter((_,k)=>k!==i));
    setDelIdx(null); setErr('');
  };

  const salvar = () => {
    const limpo = rows.map(s => {
      const o = { id:s.id, name:(s.name||'').trim() || 'Etapa' };
      if (s.isApproval) o.isApproval = true;
      if (s.isDone) o.isDone = true;
      return o;
    });
    if (limpo.filter(s=>s.isApproval).length > 1) { setErr('Marque só uma etapa como de aprovação.'); return; }
    salvarPipes({ ...pipes, [areaName]: limpo });
    onClose();
  };

  const restaurar = () => { setRows(DEFAULT_PIPELINES[areaName].map(s=>({...s}))); setErr(''); };
  const Icon = AREA_ICON[areaName];

  return (
    <Modal onClose={onClose} width={620} z={65}>
      <div style={{padding:'22px 26px 16px',borderBottom:'1px solid '+NB.bdSoft,display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:14}}>
        <div>
          <h2 style={{fontSize:19,fontWeight:600,color:NB.txt,marginBottom:5,display:'flex',alignItems:'center',gap:9}}>
            <span style={{color:AREA_CLR[areaName],display:'flex'}}><Icon s={18}/></span> Etapas de {areaName}
          </h2>
          <p style={{fontSize:13,color:NB.mut}}>Renomeie, reordene, adicione ou remova. Vale só para este pipeline.</p>
        </div>
        <button onClick={onClose} style={{padding:8,background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,color:NB.mut,display:'flex',flexShrink:0}}><IX/></button>
      </div>

      <div style={{padding:'18px 26px',display:'flex',flexDirection:'column',gap:9}}>
        {rows.map((st,i)=>{
          const n = contar(st.id);
          const apagando = delIdx===i;
          return (
            <div key={st.id} style={{border:'1px solid '+(apagando?'#FBD5D5':NB.bd),borderRadius:11,padding:'12px 13px',background:apagando?'#FEF7F7':'#fff'}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div style={{display:'flex',flexDirection:'column',gap:2,flexShrink:0}}>
                  <button onClick={()=>mover(i,-1)} disabled={i===0} title="Subir"
                    style={{padding:'2px 5px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:6,color:i===0?'#DDE5F0':NB.mut,cursor:i===0?'not-allowed':'pointer',lineHeight:1,fontSize:10}}>▲</button>
                  <button onClick={()=>mover(i,1)} disabled={i===rows.length-1} title="Descer"
                    style={{padding:'2px 5px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:6,color:i===rows.length-1?'#DDE5F0':NB.mut,cursor:i===rows.length-1?'not-allowed':'pointer',lineHeight:1,fontSize:10}}>▼</button>
                </div>
                <input value={st.name} onChange={e=>set(i,{name:e.target.value})}
                  style={{...inp,padding:'9px 12px',fontSize:13.5,flex:1}}
                  onFocus={e=>{e.target.style.borderColor=NB.azul;}} onBlur={e=>{e.target.style.borderColor=NB.bd;}}/>
                <span style={{fontSize:12,color:NB.mut2,whiteSpace:'nowrap',flexShrink:0}}>{n} {n===1?'card':'cards'}</span>
                <button onClick={()=>{setDelIdx(apagando?null:i); setErr('');}} title="Remover etapa"
                  style={{padding:'8px 9px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,color:apagando?'#B4232A':NB.mut,display:'flex',flexShrink:0}}>
                  <ITrash/>
                </button>
              </div>

              <div style={{display:'flex',gap:16,marginTop:10,flexWrap:'wrap',paddingLeft:34}}>
                <label style={{display:'flex',alignItems:'center',gap:7,fontSize:12.5,color:NB.mut,cursor:'pointer'}}>
                  <input type="checkbox" checked={!!st.isApproval}
                    onChange={e=>set(i,{isApproval:e.target.checked, isDone:e.target.checked?false:st.isDone})}
                    style={{width:14,height:14,accentColor:NB.azul}}/>
                  Etapa de aprovação <span style={{color:NB.mut2}}>(vai para Gestão e puxa a Mariana)</span>
                </label>
                <label style={{display:'flex',alignItems:'center',gap:7,fontSize:12.5,color:NB.mut,cursor:'pointer'}}>
                  <input type="checkbox" checked={!!st.isDone}
                    onChange={e=>set(i,{isDone:e.target.checked, isApproval:e.target.checked?false:st.isApproval})}
                    style={{width:14,height:14,accentColor:NB.azul}}/>
                  Etapa final
                </label>
              </div>

              {apagando && (
                <div style={{marginTop:11,paddingLeft:34}}>
                  <p style={{fontSize:12.5,color:'#B4232A',lineHeight:1.55,marginBottom:9}}>
                    {n>0
                      ? 'Remover "'+st.name+'"? Os '+n+' card(s) daqui vão para "'+((rows[i-1]||rows[i+1]||{}).name||'—')+'".'
                      : 'Remover "'+st.name+'"?'}
                  </p>
                  <div style={{display:'flex',gap:8}}>
                    <button onClick={()=>remover(i)}
                      style={{padding:'7px 14px',background:'#B4232A',border:'none',borderRadius:8,fontSize:12.5,fontWeight:500,color:'#fff'}}>Remover</button>
                    <button onClick={()=>setDelIdx(null)}
                      style={{padding:'7px 14px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:12.5,fontWeight:500,color:NB.mut}}>Cancelar</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}

        <button onClick={addStage}
          style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'12px',background:'#fff',border:'1.5px dashed '+NB.bd,borderRadius:11,fontSize:13,fontWeight:500,color:NB.mut}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=NB.azul; e.currentTarget.style.color=NB.azul;}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=NB.bd; e.currentTarget.style.color=NB.mut;}}>
          <IPlus s={15}/> Adicionar etapa
        </button>

        {err && (
          <div style={{padding:'10px 13px',background:'#FEF2F2',border:'1px solid #FECACA',borderRadius:9,fontSize:12.5,color:'#B4232A'}}>{err}</div>
        )}
      </div>

      <div style={{padding:'16px 26px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}}>
        <button onClick={restaurar}
          style={{padding:'10px 16px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>
          Restaurar padrão
        </button>
        <div style={{display:'flex',gap:10}}>
          <button onClick={onClose}
            style={{padding:'10px 18px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>Cancelar</button>
          <button onClick={salvar}
            style={{padding:'10px 22px',background:NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>Salvar etapas</button>
        </div>
      </div>
    </Modal>
  );
}

function ListView() {
  const { filtered } = useApp();

  const rows = sortDir

  );
}

/* Campo que vira input ao clicar. Enter salva, Esc cancela, sair do campo salva. */
function EditableText({ value, onSave, multiline, placeholder, required, textStyle, rows }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(value || '');
  const ref = useRef(null);

  useEffect(() => { if (editing) setDraft(value || ''); }, [editing, value]);
  useEffect(() => {
    if (editing && ref.current) { ref.current.focus(); if (ref.current.select) ref.current.select(); }
  }, [editing]);

  const [invalido, setInvalido] = useState(false);

  const commit = () => {
    const v = (draft || '').trim();
    const apagouTudo = (value || '').trim() && !v;   // tinha texto, ficou vazio — provável acidente
    if ((required || apagouTudo) && !v) { setInvalido(true); return; }
    setEditing(false); setInvalido(false);
    if (v !== (value || '')) onSave(v);
  };

  const keys = e => {
    if (e.key === 'Escape') { e.preventDefault(); setEditing(false); setInvalido(false); setDraft(value||''); }
    if (e.key === 'Enter' && !multiline) { e.preventDefault(); commit(); }
    if (e.key === 'Enter' && multiline && (e.metaKey || e.ctrlKey)) { e.preventDefault(); commit(); }
  };

  if (editing) {
    const common = {
      ref, value:draft, onChange:e=>{setDraft(e.target.value); setInvalido(false);}, onBlur:commit, onKeyDown:keys,
      style:{ ...inp, ...textStyle, borderColor: invalido?'#E4534A':NB.azul, background:'#fff', width:'100%',
              resize: multiline?'vertical':undefined, lineHeight: multiline?1.65:undefined }
    };
    return (
      <div>
        {multiline ? <textarea rows={rows||3} {...common}/> : <input {...common}/>}
        {invalido && <div style={{fontSize:11,color:'#E4534A',marginTop:4}}>Ficou vazio — escreve algo ou aperta Esc pra descartar e voltar como estava.</div>}
      </div>
    );
  }

  const empty = !value;
  return (
    <div onClick={()=>setEditing(true)} title="Clique para editar"
      style={{ ...textStyle, cursor:'text', borderRadius:9, padding:'6px 9px', margin:'-6px -9px',
               color: empty ? NB.mut2 : (textStyle && textStyle.color) || NB.txt,
               fontStyle: empty ? 'italic' : 'normal', transition:'background 0.12s',
               whiteSpace: multiline ? 'pre-wrap' : undefined }}
      onMouseEnter={e=>{e.currentTarget.style.background=NB.col;}}
      onMouseLeave={e=>{e.currentTarget.style.background='transparent';}}>
      {value || placeholder}
    </div>
  );
}

/* =========== ANEXOS =========== */
const fmtBytes = b => b < 1024 ? b+' B' : b < 1048576 ? (b/1024).toFixed(0)+' KB' : (b/1048576).toFixed(1)+' MB';
const fmtWhen = iso => { const d=new Date(iso); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };

function AttachPanel({ demand }) {
  const { attach, addAttachment, uploadFile, migrarLocal, carregarAnexo, removeAttachment, user, MAX_FILE, storageWarn } = useApp();
  const nuvem  = [ ...(demand.anexos||[]), ...(demand.links||[]) ].map(a => ({ ...a, origem:'nuvem' }));
  const locais = (attach[demand.id] || []).map(a => ({ ...a, origem:'local' }));
  const list = [...nuvem, ...locais];
  const fileRef = useRef(null);
  const [mode, setMode] = useState(null);
  const [ln, setLn] = useState({ name:'', url:'' });
  const [err, setErr] = useState('');
  const [subindo, setSubindo] = useState([]);   // [{nome, pct}]
  const [conteudo, setConteudo] = useState({}); // anexoId -> dataURL, buscado sob demanda

  /* Só busca o arquivo em si quando o card está aberto, para não pesar o quadro. */
  useEffect(() => {
    let vivo = true;
    nuvem.filter(a => a.anexoId && !conteudo[a.anexoId]).forEach(a => {
      carregarAnexo(a.anexoId)
        .then(d => { if (vivo && d) setConteudo(c => ({ ...c, [a.anexoId]: d.data })); })
        .catch(()=>{});
    });
    return () => { vivo = false; };
  }, [demand.id, nuvem.length]);

  const saveLink = () => {
    let url = ln.url.trim();
    if (!url) return setErr('Cole o endereço do link.');
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    try { new URL(url); } catch { return setErr('Esse endereço não parece válido.'); }
    addAttachment(demand, { kind:'link', name: ln.name.trim() || url.replace(/^https?:\/\//,'').slice(0,50), url, by:user.name });
    setLn({name:'',url:''}); setMode(null); setErr('');
  };

  const pickFiles = e => {
    const files = Array.from(e.target.files||[]);
    e.target.value = '';
    setErr('');
    files.forEach(f => {
      const chave = f.name + Math.random();
      setSubindo(s => [...s, { chave, nome:f.name, pct:0 }]);
      uploadFile(demand, f, pct => setSubindo(s => s.map(x => x.chave===chave ? {...x, pct} : x)))
        .then(meta => {
          addAttachment(demand, { ...meta, by:user.name });
          setSubindo(s => s.filter(x => x.chave!==chave));
        })
        .catch(erro => {
          setErr(erro.message);
          setSubindo(s => s.filter(x => x.chave!==chave));
        });
    });
  };

  const enviarLocal = att => {
    const chave = att.name + Math.random();
    setSubindo(s => [...s, { chave, nome:att.name, pct:0 }]);
    migrarLocal(demand, att)
      .then(() => setSubindo(s => s.filter(x=>x.chave!==chave)))
      .catch(e => { setErr(e.message); setSubindo(s => s.filter(x=>x.chave!==chave)); });
  };

  return (
    <div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:list.length||mode||subindo.length?16:2}}>
        <button onClick={()=>fileRef.current && fileRef.current.click()}
          style={{display:'flex',alignItems:'flex-start',gap:11,padding:'13px 14px',background:'#fff',border:'1.5px solid '+NB.bd,borderRadius:12,textAlign:'left',transition:'border-color 0.12s, background 0.12s'}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=NB.azul; e.currentTarget.style.background='#F7FAFF';}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=NB.bd; e.currentTarget.style.background='#fff';}}>
          <span style={{width:32,height:32,borderRadius:9,background:'#EAF3FD',color:NB.azul,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><IClip s={16}/></span>
          <span>
            <div style={{fontSize:13,fontWeight:600,color:NB.txt,marginBottom:2}}>Enviar arquivo</div>
            <div style={{fontSize:11.5,color:NB.mut2,lineHeight:1.4}}>Do computador, até {fmtBytes(MAX_FILE)}</div>
          </span>
        </button>
        <input ref={fileRef} type="file" multiple onChange={pickFiles} style={{display:'none'}}/>

        <button onClick={()=>{setMode(m=>m==='link'?null:'link'); setErr('');}}
          style={{display:'flex',alignItems:'flex-start',gap:11,padding:'13px 14px',background:mode==='link'?'#F5F1FE':'#fff',border:'1.5px solid '+(mode==='link'?NB.roxo:NB.bd),borderRadius:12,textAlign:'left',transition:'border-color 0.12s, background 0.12s'}}
          onMouseEnter={e=>{ if(mode!=='link'){e.currentTarget.style.borderColor=NB.roxo; e.currentTarget.style.background='#FAF8FF';} }}
          onMouseLeave={e=>{ if(mode!=='link'){e.currentTarget.style.borderColor=NB.bd; e.currentTarget.style.background='#fff';} }}>
          <span style={{width:32,height:32,borderRadius:9,background:'#F1ECFE',color:NB.roxo,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><ILink s={16}/></span>
          <span>
            <div style={{fontSize:13,fontWeight:600,color:NB.txt,marginBottom:2}}>Colar link</div>
            <div style={{fontSize:11.5,color:NB.mut2,lineHeight:1.4}}>Canva, Drive — sem limite de tamanho</div>
          </span>
        </button>
      </div>

      {mode==='link' && (
        <div style={{background:'#F5F1FE',border:'1px solid #E4D9FC',borderLeft:'3px solid '+NB.roxo,borderRadius:11,padding:'14px 15px',marginBottom:14,display:'flex',flexDirection:'column',gap:9}}>
          <input value={ln.url} autoFocus placeholder="drive.google.com/..." onChange={e=>{setLn(v=>({...v,url:e.target.value})); setErr('');}}
            onKeyDown={e=>{ if(e.key==='Enter') saveLink(); }}
            style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
          <input value={ln.name} placeholder="Nome (opcional) — ex: Briefing no Drive" onChange={e=>setLn(v=>({...v,name:e.target.value}))}
            onKeyDown={e=>{ if(e.key==='Enter') saveLink(); }}
            style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button onClick={()=>{setMode(null);setErr('');}} style={{padding:'8px 14px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:12.5,fontWeight:500,color:NB.mut}}>Cancelar</button>
            <button onClick={saveLink} style={{padding:'8px 16px',background:NB.roxo,border:'none',borderRadius:8,fontSize:12.5,fontWeight:500,color:'#fff'}}>Salvar link</button>
          </div>
        </div>
      )}

      {subindo.map(u=>(
        <div key={u.chave} style={{marginBottom:9,background:NB.col,border:'1px solid '+NB.bd,borderRadius:10,padding:'11px 13px'}}>
          <div style={{display:'flex',justifyContent:'space-between',gap:10,marginBottom:7}}>
            <span style={{fontSize:12.5,color:NB.txt,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>Enviando {u.nome}</span>
            <span style={{fontSize:12,color:NB.azul,fontWeight:500,flexShrink:0}}>{u.pct}%</span>
          </div>
          <div style={{height:5,background:'#E3EAF5',borderRadius:3,overflow:'hidden'}}>
            <div style={{width:u.pct+'%',height:'100%',background:NB.azul,transition:'width 0.2s'}}/>
          </div>
        </div>
      ))}

      {(err || storageWarn) && (
        <div style={{marginBottom:12,padding:'10px 13px',background:'#FFF6DE',border:'1px solid #F3D98A',borderRadius:9,fontSize:12.5,color:'#8A6206',lineHeight:1.55}}>
          {err || storageWarn}
        </div>
      )}

      {list.length===0 ? (
        <p style={{fontSize:13,color:NB.mut2,lineHeight:1.6}}>
          Nenhum anexo ainda. Arquivos até {fmtBytes(MAX_FILE)} e links ficam na nuvem e o time inteiro vê. Peça grande do Canva ou Drive, use o link.
        </p>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:8}}>

/* modo 'blur' estende a própria peça desfocada no fundo — é o que o Meta faz
   ao adaptar um criativo pra outro formato. 'cor' preenche com a paleta. */
function drawVariant(img, w, h, bg, mode) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const iw = img.naturalWidth, ih = img.naturalHeight;
  ctx.imageSmoothingQuality = 'high';

  if (mode === 'cover') {
    const s = Math.max(w/iw, h/ih);
    ctx.drawImage(img, (w-iw*s)/2, (h-ih*s)/2, iw*s, ih*s);
    return cv.toDataURL('image/png');
  }

  if (mode === 'blur') {
    const sb = Math.max(w/iw, h/ih) * 1.25;
    ctx.filter = 'blur(' + Math.round(Math.max(w,h)/34) + 'px) saturate(1.1) brightness(0.9)';
    ctx.drawImage(img, (w-iw*sb)/2, (h-ih*sb)/2, iw*sb, ih*sb);
    ctx.filter = 'none';
    const sf = Math.min(w/iw, h/ih) * 0.94;
    const dw = iw*sf, dh = ih*sf;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.28)'; ctx.shadowBlur = Math.round(Math.max(w,h)/50); ctx.shadowOffsetY = 6;
    ctx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
    ctx.restore();
    return cv.toDataURL('image/png');
  }

  ctx.fillStyle = bg; ctx.fillRect(0,0,w,h);
  const s = Math.min(w/iw, h/ih) * 0.88;
  ctx.drawImage(img, (w-iw*s)/2, (h-ih*s)/2, iw*s, ih*s);
  return cv.toDataURL('image/png');
}

/* Espera a Poppins carregar antes de desenhar texto no canvas — sem isso o
   navegador às vezes cai pra uma fonte serifada padrão no primeiro uso. */
function ensurePoppins() {
  if (!(window.document && document.fonts)) return Promise.resolve();
  return Promise.all([
    document.fonts.load('800 60px Poppins'),
    document.fonts.load('600 30px Poppins'),
  ]).catch(()=>{});
}

/* Quebra de linha manual — canvas não quebra texto sozinho. */
function wrapLines(ctx, text, maxWidth) {
  const palavras = (text||'').trim().split(/\s+/).filter(Boolean);
  const linhas = []; let atual = '';
  palavras.forEach(p => {
    const teste = atual ? atual+' '+p : p;
    if (ctx.measureText(teste).width > maxWidth && atual) { linhas.push(atual); atual = p; }
    else atual = teste;
  });
  if (atual) linhas.push(atual);
  return linhas;
}

/* Desenha o símbolo do Nibo direto no canvas, com a MESMA geometria do
   NiboSymbol em SVG (três círculos + conector), pra ficar idêntico ao logo do app. */
function drawNiboMarkOnCanvas(ctx, x, y, size, color) {
  const s = size/100;
  ctx.save();
  ctx.translate(x - size/2, y - size/2);
  ctx.scale(s, s);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(50, 36.8, 8.85, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(67.65, 63.2, 8.85, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(32.35, 63.2, 8.85, 0, Math.PI*2); ctx.fill();
  ctx.fill(new Path2D('M48.978 45.591 A12 12 0 0 1 59.136 60.785 L68.672 54.409 A12 12 0 0 1 58.514 39.215 Z'));
  ctx.restore();
}

/* Capa: peça (opcional) com degradê escuro embaixo pra legibilidade, título
   grande, subtítulo, marca do Nibo no canto — igual uma thumbnail de vídeo. */
async function drawCapa(bgImg, w, h, titulo, subtitulo) {
  await ensurePoppins();
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingQuality = 'high';

  if (bgImg) {
    const s = Math.max(w/bgImg.naturalWidth, h/bgImg.naturalHeight);
    const dw = bgImg.naturalWidth*s, dh = bgImg.naturalHeight*s;
    ctx.drawImage(bgImg, (w-dw)/2, (h-dh)/2, dw, dh);
  } else {
    const grad = ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0, NB.navy1); grad.addColorStop(1, NB.roxo);
    ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
  }

  const overlay = ctx.createLinearGradient(0, h*0.42, 0, h);
  overlay.addColorStop(0, 'rgba(0,20,50,0)'); overlay.addColorStop(1, 'rgba(0,17,42,0.86)');
  ctx.fillStyle = overlay; ctx.fillRect(0, h*0.42, w, h*0.58);

  const pad = w*0.08;
  let cursorY = h - pad - (subtitulo ? h*0.05 : 0);

  if (subtitulo) {
    ctx.font = '600 '+Math.round(w*0.032)+'px Poppins, sans-serif';
    ctx.fillStyle = '#B8CCEA';
    const subLinhas = wrapLines(ctx, subtitulo, w - pad*2);
    subLinhas.slice(0,2).reverse().forEach(l => { ctx.fillText(l, pad, cursorY); cursorY -= w*0.045; });
    cursorY -= w*0.015;
  }

  ctx.font = '800 '+Math.round(w*0.068)+'px Poppins, sans-serif';
  ctx.fillStyle = '#fff';
  const linhas = wrapLines(ctx, titulo || 'Título da capa', w - pad*2).slice(0,3);
  const linhaAltura = w*0.082;
  [...linhas].reverse().forEach(l => { ctx.fillText(l, pad, cursorY); cursorY -= linhaAltura; });

  drawNiboMarkOnCanvas(ctx, pad + w*0.035, h*0.42 - h*0.055, w*0.075, '#fff');

  return cv.toDataURL('image/png');
}

/* Encerramento: card final padronizado — degradê Nibo, marca grande centralizada
   e uma frase opcional. Pensado pra ser o último frame de um vídeo simples. */
async function drawEncerramento(w, h, frase) {
  await ensurePoppins();
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx = cv.getContext('2d');

  const grad = ctx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0, '#001B45'); grad.addColorStop(0.55, NB.navy1); grad.addColorStop(1, '#0A3F94');
  ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);

  const cx = w/2, cy = h*0.44;
  drawNiboMarkOnCanvas(ctx, cx, cy, Math.min(w,h)*0.22, '#B8CCEA');

  ctx.textAlign = 'center';
  ctx.font = '800 '+Math.round(Math.min(w,h)*0.09)+'px Poppins, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('nibo', cx, cy + Math.min(w,h)*0.135);

  if (frase && frase.trim()) {
    ctx.font = '500 '+Math.round(Math.min(w,h)*0.032)+'px Poppins, sans-serif';
    ctx.fillStyle = '#B8CCEA';
    const linhas = wrapLines(ctx, frase.trim(), w*0.78);
    let ly = cy + Math.min(w,h)*0.21;
    linhas.slice(0,2).forEach(l => { ctx.fillText(l, cx, ly); ly += Math.min(w,h)*0.045; });
  }
  ctx.textAlign = 'left';

  return cv.toDataURL('image/png');
}

    if (!img) return;
    if (modo === 'formatos') {
      setOuts(FORMATS.map(f => ({ key:f.id, label:f.label, w:f.w, h:f.h, url:drawVariant(img,f.w,f.h,bg,fit) })));
    } else {
      const f = FORMATS.find(x=>x.id===fmt);
      setOuts(BGS.map(b => ({ key:b.id, label:b.label, w:f.w, h:f.h, url:drawVariant(img,f.w,f.h,b.hex,'cor') })));
    }
  };

  const gerarCapa = async () => {
    if (!capaTitulo.trim()) return setErr('Escreva o título que vai aparecer na capa.');
    setErr(''); setGerando(true);
    const f = FORMATS.find(x=>x.id===fmt);
    const url = await drawCapa(capaImg, f.w, f.h, capaTitulo.trim(), capaSub.trim());
    setOuts([{ key:'capa', label:'Capa', w:f.w, h:f.h, url }]);
    setGerando(false);
  };

  const gerarEncerramento = async () => {
    setErr(''); setGerando(true);
    const f = FORMATS.find(x=>x.id===fmt);
    const url = await drawEncerramento(f.w, f.h, fraseFinal);
    setOuts([{ key:'encerramento', label:'Encerramento', w:f.w, h:f.h, url }]);
    setGerando(false);
  };

  const baixar = o => {
    const a = document.createElement('a');
    a.href = o.url; a.download = (imgName||modo) + '-' + o.key + '.png';
    document.body.appendChild(a); a.click(); a.remove();
  };

  /* A variação vai para o Storage, como qualquer outro anexo. */
  const salvar = o => {
    const dem = designs.find(d => d.id === alvo);
    if (!dem) return setErr('Escolha em qual demanda salvar, no seletor acima.');
    const nome = (imgName||modo) + '-' + o.key + '.png';
    setErr(''); setOk('Enviando ' + o.label + '…');
    fetch(o.url).then(r => r.blob()).then(blob => {
      const file = new File([blob], nome, { type:'image/png' });
      return uploadFile(dem, file);
    }).then(meta => {
      addAttachment(dem, { ...meta, by:user.name });
      setOk('Salvo nos anexos de ' + dem.code); setTimeout(()=>setOk(''), 2500);
    }).catch(e => { setOk(''); setErr(e.message); });
  };

  const btn = on => ({display:'flex',alignItems:'center',gap:7,padding:'9px 14px',borderRadius:9,
    border:'1px solid '+(on?NB.azul:NB.bd), background:on?'#EAF3FD':'#fff',
    fontSize:13,fontWeight:500,color:on?NB.azul:NB.mut});

  const trocarModo = m => { setModo(m); setOuts([]); setErr(''); };

  return (
    <div style={{padding:'22px 30px 30px',overflowY:'auto',overflowX:'hidden',height:'100%'}}>
      <div style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:16,padding:'20px 22px',marginBottom:18,boxShadow:'0 1px 3px rgba(11,42,92,0.04)'}}>

        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:18}}>
          <button onClick={()=>trocarModo('formatos')} style={btn(modo==='formatos')}>Cortes de formato</button>
          <button onClick={()=>trocarModo('fundos')}   style={btn(modo==='fundos')}>Versões de fundo</button>
          <button onClick={()=>trocarModo('capa')}     style={btn(modo==='capa')}>Capa</button>
          <button onClick={()=>trocarModo('encerramento')} style={btn(modo==='encerramento')}>Encerramento</button>
          <button onClick={()=>trocarModo('briefing')} style={btn(modo==='briefing')}>Briefing do que testar</button>
        </div>

        {/* ---- Cortes de formato / Versões de fundo: precisam da peça ---- */}
        {modoPrecisaPeca && !img && (
          <React.Fragment>
            <div
              onClick={()=>fileRef.current && fileRef.current.click()}
              onDragOver={e=>{e.preventDefault();}}
              onDrop={e=>{e.preventDefault(); load(e.dataTransfer.files && e.dataTransfer.files[0]);}}
              style={{border:'1.5px dashed '+NB.bd,borderRadius:12,padding:'46px 20px',textAlign:'center',cursor:'pointer',background:NB.col}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=NB.azul;}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=NB.bd;}}>
              <div style={{color:NB.mut2,display:'flex',justifyContent:'center',marginBottom:12}}><IClip s={30}/></div>
              <div style={{fontSize:15,fontWeight:500,color:NB.txt,marginBottom:6}}>Suba a peça já criada</div>
              <p style={{fontSize:13,color:NB.mut,lineHeight:1.6,maxWidth:440,margin:'0 auto'}}>
                Arraste aqui ou clique. A partir dela saem os cortes de formato adaptados e as versões de fundo na paleta Nibo.
              </p>
            </div>
            <input ref={fileRef} type="file" accept="image/*" onChange={e=>{const f=e.target.files&&e.target.files[0]; e.target.value=''; load(f);}} style={{display:'none'}}/>
            {err && <p style={{fontSize:12.5,color:'#B4232A',marginTop:10}}>{err}</p>}
          </React.Fragment>
        )}

        {modoPrecisaPeca && img && (
          <React.Fragment>
            <div style={{display:'flex',alignItems:'center',gap:13,marginBottom:18,flexWrap:'wrap'}}>
              <img src={img.src} alt="" style={{width:52,height:52,borderRadius:9,objectFit:'cover',border:'1px solid '+NB.bd}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14.5,fontWeight:500,color:NB.txt,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{imgName}</div>
                <div style={{fontSize:12,color:NB.mut2}}>{img.naturalWidth} × {img.naturalHeight} px</div>
              </div>
              <button onClick={()=>{setImg(null); setOuts([]);}}
                style={{padding:'8px 14px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut,flexShrink:0}}>
                Trocar peça
              </button>
            </div>

            <div style={{background:NB.col,border:'1px solid '+NB.bd,borderRadius:11,padding:'15px 16px'}}>
              <div style={{display:'flex',gap:20,flexWrap:'wrap',alignItems:'flex-end'}}>
                {modo==='formatos' ? (
                  <React.Fragment>
                    <div>
                      <div style={{...lbl,marginBottom:7}}>Como preencher o que sobra</div>
                      <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
                        <button onClick={()=>setFit('blur')}    style={{...btn(fit==='blur'),padding:'8px 13px',fontSize:12.5}}>Estender a peça</button>
                        <button onClick={()=>setFit('cor')}     style={{...btn(fit==='cor'),padding:'8px 13px',fontSize:12.5}}>Cor sólida</button>
                        <button onClick={()=>setFit('cover')}   style={{...btn(fit==='cover'),padding:'8px 13px',fontSize:12.5}}>Cortar</button>
                      </div>
                    </div>
                    {fit==='cor' && (
                      <div>
                        <div style={{...lbl,marginBottom:7}}>Cor</div>
                        <div style={{display:'flex',gap:7}}>
                          {BGS.map(b=>(
                            <button key={b.id} onClick={()=>setBg(b.hex)} title={b.label}
                              style={{width:30,height:30,borderRadius:8,background:b.hex,border:bg===b.hex?'2.5px solid '+NB.azul:'1px solid '+NB.bd,cursor:'pointer'}}/>
                          ))}
                        </div>
                      </div>
                    )}
                  </React.Fragment>
                ) : (
                  <div>
                    <div style={{...lbl,marginBottom:7}}>Formato</div>
                    <select value={fmt} onChange={e=>setFmt(e.target.value)} style={{...inp,padding:'8px 11px',fontSize:13,width:'auto'}}>
                      {FORMATS.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}

                <button onClick={gerar}

              </div>
              {modo==='formatos' && fit==='blur' && (
                <p style={{fontSize:12,color:NB.mut2,marginTop:11,lineHeight:1.55}}>
                  A própria peça vira o fundo, ampliada e desfocada — é assim que o Meta adapta um criativo pra outro formato sem deixar tarja.
                </p>
              )}
            </div>
          </React.Fragment>
        )}

        {/* ---- Capa: fundo opcional, título obrigatório ---- */}
        {modo==='capa' && (
          <div>
            <p style={{fontSize:13,color:NB.mut,lineHeight:1.6,marginBottom:16}}>
              Gera uma capa/thumbnail pronta — com foto de fundo se você subir uma, ou no degradê do Nibo se não subir nada.
            </p>
            <div style={{display:'flex',alignItems:'center',gap:11,marginBottom:16}}>
              <button onClick={()=>capaFileRef.current && capaFileRef.current.click()}
                style={{display:'flex',alignItems:'center',gap:7,padding:'9px 14px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:12.5,fontWeight:500,color:NB.mut}}>
                <IClip s={14}/> {capaImg?'Trocar fundo':'Fundo (opcional)'}
              </button>
              <input ref={capaFileRef} type="file" accept="image/*" onChange={e=>{const f=e.target.files&&e.target.files[0]; e.target.value=''; loadCapaFundo(f);}} style={{display:'none'}}/>
              {capaImg && (
                <React.Fragment>
                  <img src={capaImg.src} alt="" style={{width:36,height:36,borderRadius:7,objectFit:'cover',border:'1px solid '+NB.bd}}/>
                  <button onClick={()=>setCapaImg(null)} style={{background:'none',border:'none',color:NB.mut2,padding:2,display:'flex'}}><IX s={14}/></button>
                </React.Fragment>
              )}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:13,marginBottom:14}}>
              <div>
                <div style={{...lbl,marginBottom:7}}>Título</div>
                <input value={capaTitulo} onChange={e=>setCapaTitulo(e.target.value)} placeholder="ex: Reforma Tributária explicada" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
              </div>
              <div>
                <div style={{...lbl,marginBottom:7}}>Subtítulo (opcional)</div>
                <input value={capaSub} onChange={e=>setCapaSub(e.target.value)} placeholder="ex: o que muda pro seu escritório" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
              </div>
            </div>
            <div style={{display:'flex',gap:16,alignItems:'flex-end',flexWrap:'wrap'}}>
              <div>
                <div style={{...lbl,marginBottom:7}}>Formato</div>
                <select value={fmt} onChange={e=>setFmt(e.target.value)} style={{...inp,padding:'8px 11px',fontSize:13,width:'auto'}}>
                  {FORMATS.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}
                </select>
              </div>
              <button onClick={gerarCapa} disabled={gerando}
                style={{padding:'10px 20px',background:gerando?'#CFD8E6':NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',cursor:gerando?'wait':'pointer'}}>
                {gerando?'Gerando…':'Gerar capa'}
              </button>
            </div>
            {err && <p style={{fontSize:12.5,color:'#B4232A',marginTop:12}}>{err}</p>}
          </div>
        )}

        {/* ---- Encerramento: card padrão da marca, nunca precisa de imagem ---- */}
        {modo==='encerramento' && (
          <div>
            <p style={{fontSize:13,color:NB.mut,lineHeight:1.6,marginBottom:16}}>
              Card final padronizado — logo do Nibo no degradê da marca. Cole como o último frame de vídeos simples, sem precisar editar do zero cada vez.
            </p>
            <div style={{marginBottom:14}}>
              <div style={{...lbl,marginBottom:7}}>Frase de encerramento (opcional)</div>
              <input value={fraseFinal} onChange={e=>setFraseFinal(e.target.value)} placeholder="ex: Siga @nibo pra mais conteúdo assim" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
            </div>
            <div style={{display:'flex',gap:16,alignItems:'flex-end',flexWrap:'wrap'}}>
              <div>
                <div style={{...lbl,marginBottom:7}}>Formato</div>
                <select value={fmt} onChange={e=>setFmt(e.target.value)} style={{...inp,padding:'8px 11px',fontSize:13,width:'auto'}}>
                  {FORMATS.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}
                </select>
              </div>
              <button onClick={gerarEncerramento} disabled={gerando}
                style={{padding:'10px 20px',background:gerando?'#CFD8E6':NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',cursor:gerando?'wait':'pointer'}}>
                {gerando?'Gerando…':'Gerar encerramento'}
              </button>
            </div>
            {err && <p style={{fontSize:12.5,color:'#B4232A',marginTop:12}}>{err}</p>}
          </div>
        )}

        {/* ---- Briefing: nunca precisou de imagem de verdade ---- */}
        {modo==='briefing' && (
          <div>
            <div style={{display:'flex',alignItems:'flex-end',gap:12,marginBottom:16,flexWrap:'wrap'}}>
              <div style={{flex:'1 1 260px'}}>
                <div style={{...lbl,marginBottom:6}}>Tema da peça</div>
                <input value={tema} onChange={e=>setTema(e.target.value)} placeholder="ex: Radar e-CAC na Reforma Tributária" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
              </div>
              <div>
                <div style={{...lbl,marginBottom:6}}>Público na peça</div>
                <select value={pub} onChange={e=>setPub(e.target.value)} style={{...inp,padding:'9px 12px',fontSize:13.5,width:'auto'}}>
                  {PUBLICOS.map(p=><option key={p}>{p}</option>)}
                </select>
              </div>
            </div>
            {Object.entries(briefing(tema||imgName, pub)).map(([sec,itens])=>(
              <div key={sec} style={{marginBottom:16}}>
                <div style={{fontSize:12.5,fontWeight:600,color:NB.txt,marginBottom:7}}>{sec}</div>
                <ul style={{margin:0,paddingLeft:18,display:'flex',flexDirection:'column',gap:5}}>
                  {itens.map((it,i)=><li key={i} style={{fontSize:13,color:'#3D4B63',lineHeight:1.6}}>{it}</li>)}
                </ul>
              </div>
            ))}
            <button onClick={()=>{
              const b = briefing(tema||imgName, pub);
              const txt = Object.entries(b).map(([s,i])=>s+'\n'+i.map(x=>'- '+x).join('\n')).join('\n\n');
              navigator.clipboard && navigator.clipboard.writeText((tema||imgName)+' — variações\n\n'+txt);
            }}
              style={{padding:'9px 16px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>
              Copiar briefing
            </button>
          </div>
        )}
      </div>

      {outs.length>0 && (
        <div style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:16,padding:'20px 22px',boxShadow:'0 1px 3px rgba(11,42,92,0.04)'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14,gap:12,flexWrap:'wrap'}}>
            <span style={{fontSize:14,fontWeight:500,color:NB.txt}}>{outs.length} variações geradas</span>
            <div style={{display:'flex',gap:9,alignItems:'center',flexWrap:'wrap'}}>
              <select value={alvo} onChange={e=>{setAlvo(e.target.value); setErr('');}} style={{...inp,padding:'8px 11px',fontSize:12.5,width:'auto'}}>
                <option value="">Salvar nos anexos de…</option>
                {designs.map(d=><option key={d.id} value={d.id}>{d.code} — {d.title.slice(0,38)}</option>)}
              </select>
              <button onClick={()=>outs.forEach((o,i)=>setTimeout(()=>baixar(o), i*250))}
                style={{display:'flex',alignItems:'center',gap:7,padding:'9px 15px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:12.5,fontWeight:500,color:NB.azul}}>
                <IDown/> Baixar todas
              </button>
            </div>
          </div>

          {err && <p style={{fontSize:12.5,color:'#B4232A',marginBottom:12}}>{err}</p>}
          {okMsg && <p style={{fontSize:12.5,color:'#0F6E56',marginBottom:12}}>{okMsg}</p>}

          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(170px,1fr))',gap:14}}>
            {outs.map(o=>(
              <div key={o.key} style={{border:'1px solid '+NB.bd,borderRadius:11,overflow:'hidden',background:'#fff'}}>
                <div style={{background:'#EEF2F8',display:'flex',alignItems:'center',justifyContent:'center',height:190,padding:10}}>
                  <img src={o.url} alt={o.label} style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain',borderRadius:5}}/>
                </div>
                <div style={{padding:'11px 12px'}}>
                  <div style={{fontSize:13,fontWeight:500,color:NB.txt}}>{o.label}</div>
                  <div style={{fontSize:11.5,color:NB.mut2,marginBottom:9}}>{o.w} × {o.h}</div>
                  <div style={{display:'flex',gap:6}}>
                    <button onClick={()=>baixar(o)} title="Baixar"
                      style={{flex:1,padding:'7px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,color:NB.mut,display:'flex',justifyContent:'center'}}><IDown/></button>
                    <button onClick={()=>salvar(o)} title="Salvar nos anexos da demanda escolhida"
                      style={{flex:1,padding:'7px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,color:NB.mut,display:'flex',justifyContent:'center'}}><IClip s={14}/></button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

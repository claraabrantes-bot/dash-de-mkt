const PRI_STL = {
  Urgente:{ bg:'#FEF3C7', txt:'#92400E', bdr:'#FCD34D' },
  Alta:   { bg:'#FEE2E2', txt:'#991B1B', bdr:'#FCA5A5' },

];

const t = (d) => new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

const INIT_SLACK = [
  { id:'s1', code:'DEM-101', area:'Social', time:'09:14', stagePath:'Solicitado → Em Redação', action:'Briefing de copy ativado — equipe Social notificada', next:'Design de Arte → @Millena Barros', type:'move' },
  { id:'s2', code:'DEM-104', area:'Social', time:'10:33', stagePath:'Design de Arte → Aprovação', action:'@Mariana Araújo notificada para revisão e aprovação', next:'Aprovado → Agendamento | Ajuste → volta para Design', type:'approval' },
  { id:'s3', code:'DEM-106', area:'RevOps', time:'11:05', stagePath:'Em Análise → Implementação', action:'Automação configurada no n8n + testes de integração ativados', next:'Validação → @Mariana Araújo', type:'move' },
];

/* =========== CONTEXT =========== */
const Ctx = createContext(null);

function Provider({ children }) {
  const cntRef = useRef(INIT_DEMANDS.length);
  const [demands, setDemands] = useState(() => {
    try { const s=localStorage.getItem('nibo_dem_v3'); return s ? JSON.parse(s) : INIT_DEMANDS; } catch { return INIT_DEMANDS; }
  });
  const [slack, setSlack] = useState(() => {
    try { const s=localStorage.getItem('nibo_slk_v3'); return s ? JSON.parse(s) : INIT_SLACK; } catch { return INIT_SLACK; }
  });
  const [user, setUser]     = useState(TEAM[1]);
  const [view, setView]     = useState('kanban');
  const [area, setArea]     = useState('Social');
  const [query, setQuery]   = useState('');
  const [modal, setModal]   = useState(null);
  const [newOpen, setNewOpen] = useState(false);

  useEffect(() => { try { localStorage.setItem('nibo_dem_v3', JSON.stringify(demands)); } catch {} }, [demands]);
  useEffect(() => { try { localStorage.setItem('nibo_slk_v3', JSON.stringify(slack)); } catch {} }, [slack]);

  const addDemand = useCallback((data) => {
    const cnt = ++cntRef.current;
    const nd = { ...data, id:'d'+Date.now(), code:'DEM-'+(108+cnt), stageId:PIPELINES[data.area][0].id, createdAt:new Date().toISOString() };
    setDemands(p => [nd,...p]);
    setSlack(p => [{ id:'s'+Date.now(), code:nd.code, area:data.area, time:t(new Date()), stagePath:'Nova demanda criada', action:'Solicitação registrada por '+data.requester, next:'Equipe de '+data.area+' notificada', type:'new' }, ...p]);
    return nd;
  }, []);

  const moveStage = useCallback((demId, newStageId) => {
    setDemands(p => p.map(d => {
      if (d.id !== demId) return d;
      const oldStage = Object.values(PIPELINES).flat().find(s=>s.id===d.stageId);
      const newStage = Object.values(PIPELINES).flat().find(s=>s.id===newStageId);
      const auto = AUTO[d.area] && AUTO[d.area][newStageId];
      if (auto) {
        setSlack(sp => [{ id:'s'+Date.now(), code:d.code, area:d.area, time:t(new Date()), stagePath:(oldStage?oldStage.name:'?')+' → '+(newStage?newStage.name:'?'), action:auto.action, next:auto.next, type:newStage&&newStage.isApproval?'approval':'move' }, ...sp]);
      }
      return {...d, stageId:newStageId};
    }));
  }, []);

  const delDemand = useCallback((id) => {
    setDemands(p=>p.filter(d=>d.id!==id));
    setModal(null);
  }, []);

  const reset = useCallback(() => { setDemands(INIT_DEMANDS); setSlack(INIT_SLACK); cntRef.current=INIT_DEMANDS.length; }, []);

  const filtered = demands.filter(d => {
    if (area !== 'Todas' && d.area !== area) return false;
    if (query.trim()) { const q=query.toLowerCase(); return d.title.toLowerCase().includes(q)||d.code.toLowerCase().includes(q); }
    return true;
  });

  const selDemand = modal ? demands.find(d=>d.id===modal)||null : null;

  return <Ctx.Provider value={{ demands, filtered, slack, user, setUser, view, setView, area, setArea, query, setQuery, selDemand, setModal, newOpen, setNewOpen, addDemand, moveStage, delDemand, reset }}>{children}</Ctx.Provider>;
}

const useApp = () => useContext(Ctx);

/* =========== UTILS =========== */
function getSla(dl) {
  if (!dl) return null;
  const diff = Math.ceil((new Date(dl)-new Date())/86400000);
  if (diff < 0) return { label:'Atrasado '+Math.abs(diff)+'d', type:'danger' };
  if (diff <= 2) return { label:'Vence em '+diff+'d', type:'warn' };
  return { label:diff+'d', type:'ok' };
}
function fmtDate(s) { if(!s) return ''; const [,m,d]=s.split('-'); return d+'/'+m; }

  const title = view==='slack' ? 'Automações Slack' : area==='Todas' ? 'Todos os Pipelines' : 'Pipeline — '+area;

    <header style={{background:'#fff',borderBottom:'1px solid #E2EBF4',padding:'11px 22px',display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
      <div style={{flex:1}}>
        <div style={{fontSize:14,fontWeight:700,color:'#002D72'}}>{title}</div>
      </div>
      {view==='kanban' && (
        <div style={{position:'relative',width:260}}>
          <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#94A3B8',pointerEvents:'none'}}><ISearch /></span>

        style={{padding:'7px 10px',background:'#F8FAFC',border:'1px solid #E2EBF4',borderRadius:8,color:'#64748B',display:'flex',alignItems:'center',lineHeight:1}}>

      </button>
      <button onClick={()=>setNewOpen(true)}
        style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',background:'#0072CE',border:'none',borderRadius:8,color:'#fff',fontSize:12,fontWeight:600}}>
        <IPlus /> Nova Demanda
      </button>

}

/* =========== CARD (SIMPLIFICADO) =========== */
function Card({ demand }) {
  const { setModal } = useApp();
  const sla = getSla(demand.deadline);
  const ps  = PRI_STL[demand.priority] || PRI_STL.Baixa;
  const ac  = AREA_CLR[demand.area] || '#0072CE';
  const slaStyle = !sla ? {} :
    sla.type==='danger' ? {color:'#991B1B',background:'#FEE2E2'} :
    sla.type==='warn'   ? {color:'#92400E',background:'#FEF3C7'} :
    {color:'#475569',background:'#F1F5F9'};

  return (
    <div onClick={()=>setModal(demand.id)}
      style={{background:'#fff',borderRadius:9,border:'1px solid #E2EBF4',borderLeft:'3px solid '+ac,padding:'10px 11px 9px',cursor:'pointer',transition:'box-shadow 0.12s, border-color 0.12s',marginBottom:8}}
      onMouseEnter={e=>{e.currentTarget.style.boxShadow='0 2px 10px rgba(0,45,114,0.1)'; e.currentTarget.style.borderColor='#93C5FD'; e.currentTarget.style.borderLeftColor=ac;}}
      onMouseLeave={e=>{e.currentTarget.style.boxShadow='none'; e.currentTarget.style.borderColor='#E2EBF4'; e.currentTarget.style.borderLeftColor=ac;}}>

      {/* Priority badge */}
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:5}}>
        <span style={{fontSize:9,fontWeight:700,padding:'2px 6px',borderRadius:4,background:ps.bg,color:ps.txt,border:'1px solid '+ps.bdr,letterSpacing:'0.05em'}}>
          {demand.priority.toUpperCase()}
        </span>
      </div>

      {/* Title */}
      <p style={{fontSize:12,fontWeight:600,color:'#002D72',lineHeight:1.45,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden',marginBottom:10}}>
        {demand.title}
      </p>

      {/* Footer */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        {sla
          ? <span style={{fontSize:10,fontWeight:600,padding:'2px 6px',borderRadius:4,...slaStyle}}>{sla.label}</span>
          : <span/>
        }
        <div style={{display:'flex'}}>
          {demand.assignees.slice(0,2).map((init,i)=>(
            <div key={i} title={init} style={{width:21,height:21,borderRadius:'50%',background:'#0072CE',color:'#fff',fontSize:8,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',border:'2px solid #fff',marginLeft:i>0?-7:0,flexShrink:0}}>
              {init}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* =========== COLUMN =========== */

        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <div style={{width:6,height:6,borderRadius:'50%',background:headerClr}}/>
          <span style={{fontSize:11,fontWeight:600,color:'#002D72'}}>{stage.name}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span style={{fontSize:9.5,background:'#E8EFF7',color:'#64748B',fontWeight:700,padding:'1px 6px',borderRadius:8}}>{cards.length}</span>

/* =========== KANBAN =========== */
function KanbanBoard() {
  const { filtered, area } = useApp();
  const areas = area==='Todas' ? Object.keys(PIPELINES) : [area];

  if (area==='Todas') {
    return (
      <div style={{padding:'18px 22px',overflowY:'auto',height:'100%'}}>
        {areas.map(a => {
          const aCards = filtered.filter(d=>d.area===a);
          const stages = PIPELINES[a];
          return (
            <div key={a} style={{marginBottom:28}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
                <div style={{width:9,height:9,borderRadius:'50%',background:AREA_CLR[a]}}/>
                <span style={{fontWeight:700,color:'#002D72',fontSize:13}}>{a}</span>
                <span style={{fontSize:11,color:'#94A3B8'}}>{aCards.length} demandas</span>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10}}>
                {stages.map(stage => {
                  const cs = aCards.filter(d=>d.stageId===stage.id);
                  return (
                    <div key={stage.id} style={{background:'#F8FAFC',borderRadius:10,border:'1px solid #E2EBF4',padding:'9px 10px'}}>
                      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:7}}>
                        <span style={{fontSize:10,fontWeight:600,color:stage.isDone?'#059669':stage.isApproval?'#D97706':'#002D72'}}>{stage.name}</span>
                        <span style={{fontSize:9,background:'#E8EFF7',color:'#64748B',fontWeight:700,padding:'1px 5px',borderRadius:8}}>{cs.length}</span>
                      </div>
                      {cs.map(c=><Card key={c.id} demand={c}/>)}
                      {cs.length===0&&<div style={{textAlign:'center',color:'#CBD5E1',fontSize:10,padding:'10px 0'}}>—</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    );
  }

  const stages = PIPELINES[area]||[];
  const areaCards = filtered.filter(d=>d.area===area);
  const aClr = AREA_CLR[area]||'#0072CE';

  return (
    <div style={{display:'flex',gap:12,padding:'18px 22px',overflowX:'auto',height:'100%',alignItems:'flex-start'}} className="nb-scrollnone">
      {stages.map(stage=>(
        <Column key={stage.id} stage={stage} cards={areaCards.filter(d=>d.stageId===stage.id)} areaColor={aClr}/>
      ))}
    </div>
  );
}

/* =========== SLACK FEED =========== */
function SlackFeed() {
  const { slack } = useApp();

  const typeMap = {
    approval:{ border:'#FCD34D', bg:'#FEFCE8', badge:'Aprovação', bdgClr:'#92400E', bdgBg:'#FEF3C7', dot:'#D97706' },
    new:     { border:'#93C5FD', bg:'#EFF6FF', badge:'Nova demanda', bdgClr:'#1E40AF', bdgBg:'#DBEAFE', dot:'#0072CE' },
    move:    { border:'#7DD3FC', bg:'#F0F9FF', badge:'Automação', bdgClr:'#0369A1', bdgBg:'#E0F2FE', dot:'#41B6E6' },
  };

  return (
    <div style={{padding:'18px 22px',overflowY:'auto',height:'100%'}}>
      {/* Header */}
      <div style={{background:'#002D72',borderRadius:12,padding:'16px 20px',marginBottom:18,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div>
          <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:5}}>
            <ISlack/>
            <span style={{color:'#fff',fontWeight:700,fontSize:14}}>#automacoes-nibo</span>
          </div>
          <p style={{color:'#B8CCEA',fontSize:11}}>Caminho das automações disparadas ao mover cards no kanban</p>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:7}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:'#22D3EE'}}/>
          <span style={{color:'#41B6E6',fontSize:11,fontWeight:600}}>Bot ativo</span>
        </div>
      </div>

      {/* Legenda */}
      <div style={{display:'flex',gap:14,marginBottom:14,flexWrap:'wrap'}}>
        {[{dot:'#41B6E6',label:'Automação de etapa'},{dot:'#D97706',label:'Enviado para aprovação'},{dot:'#0072CE',label:'Nova demanda criada'}].map(({dot,label})=>(
          <div key={label} style={{display:'flex',alignItems:'center',gap:5}}>
            <div style={{width:7,height:7,borderRadius:'50%',background:dot}}/>
            <span style={{fontSize:10,color:'#64748B'}}>{label}</span>
          </div>
        ))}
      </div>

      {/* Mensagens */}
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {slack.map(msg => {
          const ts = typeMap[msg.type] || typeMap.move;
          return (
            <div key={msg.id} style={{background:'#fff',borderRadius:10,border:'1px solid #E2EBF4',borderLeft:'4px solid '+ts.border,padding:'12px 15px'}}>
              {/* Header */}
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                  <span style={{background:'#002D72',color:'#fff',fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:4,letterSpacing:'0.05em',fontFamily:'monospace'}}>{msg.code}</span>
                  <span style={{fontSize:10,fontWeight:700,color:AREA_CLR[msg.area]||'#0072CE'}}>{msg.area}</span>
                  <span style={{background:ts.bdgBg,color:ts.bdgClr,fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:4}}>{ts.badge}</span>
                </div>
                <span style={{fontSize:10,color:'#94A3B8',flexShrink:0}}>{msg.time}</span>
              </div>

              {/* Caminho */}
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:9}}>
                <span style={{fontSize:10.5,color:'#64748B'}}>Caminho:</span>
                <span style={{fontSize:10.5,fontWeight:700,color:'#002D72'}}>{msg.stagePath}</span>
              </div>

              {/* Detalhe */}
              <div style={{background:'#F8FAFC',borderRadius:7,padding:'9px 11px'}}>
                <div style={{display:'flex',alignItems:'flex-start',gap:6,marginBottom:6}}>
                  <span style={{color:'#41B6E6',marginTop:1,flexShrink:0}}><IZap/></span>
                  <div>
                    <div style={{fontSize:9,color:'#94A3B8',fontWeight:600,letterSpacing:'0.04em',textTransform:'uppercase',marginBottom:2}}>Ação automatizada</div>
                    <span style={{fontSize:11.5,color:'#002D72',fontWeight:500}}>{msg.action}</span>
                  </div>
                </div>
                <div style={{display:'flex',alignItems:'flex-start',gap:6}}>
                  <span style={{color:'#0072CE',marginTop:1,flexShrink:0,fontSize:11}}>→</span>
                  <div>
                    <div style={{fontSize:9,color:'#94A3B8',fontWeight:600,letterSpacing:'0.04em',textTransform:'uppercase',marginBottom:2}}>Próximo passo</div>
                    <span style={{fontSize:11.5,color:'#0072CE',fontWeight:500}}>{msg.next}</span>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
        {slack.length===0 && (
          <div style={{textAlign:'center',padding:'60px 0',color:'#94A3B8',fontSize:13}}>
            Nenhuma automação disparada ainda.
            <br/><span style={{fontSize:11}}>Mova um card no kanban para ver o caminho da automação aqui.</span>
          </div>
        )}
      </div>
    </div>
  );
}

      </div>
    </div>
  );

/* =========== NEW DEMAND MODAL =========== */
function NewModal() {
  const { newOpen, setNewOpen, addDemand, user, area } = useApp();
  const initArea = area!=='Todas' ? area : 'Social';
  const [form, setForm] = useState({ title:'', area:initArea, priority:'Média', deadline:dStr(7), description:'', requester:user.name, assignee:user.initials });

  useEffect(() => {
    if (newOpen) setForm(f=>({ ...f, area:area!=='Todas'?area:'Social', requester:user.name, assignee:user.initials }));
  }, [newOpen, area, user]);

  if (!newOpen) return null;

  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const submit = () => {
    if (!form.title.trim()) return;
    addDemand({ title:form.title, area:form.area, priority:form.priority, deadline:form.deadline, description:form.description, requester:form.requester, assignees:[form.assignee] });
    setNewOpen(false);
  };

  const inp = { background:'#F8FAFC', border:'1px solid #E2EBF4', borderRadius:8, padding:'8px 11px', fontSize:12, color:'#002D72', width:'100%', outline:'none' };
  const lbl = { fontSize:9.5, fontWeight:600, color:'#94A3B8', textTransform:'uppercase', letterSpacing:'0.07em', display:'block', marginBottom:5 };

  return (
    <div onClick={()=>setNewOpen(false)}
      style={{position:'fixed',inset:0,background:'rgba(0,45,114,0.4)',zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div onClick={e=>e.stopPropagation()}
        style={{background:'#fff',borderRadius:16,width:'100%',maxWidth:460,boxShadow:'0 24px 64px rgba(0,45,114,0.3)'}}>

        <div style={{padding:'18px 22px 14px',borderBottom:'1px solid #E2EBF4',display:'flex',alignItems:'center',justifyContent:'space-between'}}>

        <div style={{padding:'18px 22px',display:'flex',flexDirection:'column',gap:13}}>

            <label style={lbl}>Título</label>
            <input value={form.title} onChange={e=>set('title',e.target.value)} placeholder="O que precisa ser feito?" style={inp}/>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:11}}>
            <div>
              <label style={lbl}>Área</label>
              <select value={form.area} onChange={e=>set('area',e.target.value)} style={inp}>
                {['Social','Design','Mídia Paga','Produto','RevOps'].map(a=><option key={a}>{a}</option>)}

              <label style={lbl}>Prioridade</label>

                {['Urgente','Alta','Média','Baixa'].map(p=><option key={p}>{p}</option>)}
              </select>
            </div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:11}}>
            <div>
              <label style={lbl}>Prazo</label>
              <input type="date" value={form.deadline} onChange={e=>set('deadline',e.target.value)} style={inp}/>
            </div>
            <div>
              <label style={lbl}>Responsável</label>
              <select value={form.assignee} onChange={e=>set('assignee',e.target.value)} style={inp}>
                {TEAM.map(m=><option key={m.id} value={m.initials}>{m.name}</option>)}

        </div>
      </div>
    </div>
  );
}

/* =========== APP =========== */
function AppContent() {
  const { view } = useApp();
  return (
    <div style={{display:'flex',height:'100vh',width:'100%',overflow:'hidden'}}>
      <Sidebar/>
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
        <TopBar/>
        <main style={{flex:1,overflow:'hidden'}}>
          {view==='kanban' && <KanbanBoard/>}
          {view==='slack'  && <SlackFeed/>}
        </main>
      </div>
      <CardModal/>
      <NewModal/>
    </div>
  );
}

function App() {
  return <Provider><AppContent/></Provider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

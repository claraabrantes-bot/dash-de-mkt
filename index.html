function CardModal() {
  const { selDemand, setModal, moveStage, moveArea, delDemand, archiveDemand, setNotifyPending, setAssignees, updateDemand, attach, comments, pipes, enviarCampanhaDeDemanda, demands } = useApp();
  const [picker, setPicker] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const [tab, setTab] = useState('anexos');
  const [areaPick, setAreaPick] = useState(false);
  const [tgtArea, setTgtArea]   = useState(null);
  const [tgtStage, setTgtStage] = useState(null);
  const [enviando, setEnviando] = useState(false);
  const [novoItem, setNovoItem] = useState({ titulo:'', responsavel:'' });
  const [addingItem, setAddingItem] = useState(false);
  const openId = selDemand ? selDemand.id : null;

  /* Reabrir outro card não pode herdar o estado do anterior */
  useEffect(() => {
    setPicker(false); setConfirmDel(false); setTab('anexos');
    setAreaPick(false); setTgtArea(null); setTgtStage(null); setEnviando(false);
  }, [openId]);

  if (!selDemand) return null;

  const nAttach   = (attach[openId] || []).length;
  const nComments = (comments[openId] || []).length;

  const d = selDemand;
  const espelhos = d.espelhoGrupoId ? demands.filter(x=>x.espelhoGrupoId===d.espelhoGrupoId && x.id!==d.id) : [];
  const stages = pipes[d.area]||[];
  const stage = stages.find(s=>s.id===d.stageId);
  const ps  = PRI_STL[d.priority]||PRI_STL.Baixa;
  const ac  = AREA_CLR[d.area]||NB.azul;
  const sla = getSla(d.deadline);
  const Icon = AREA_ICON[d.area];
  const podeEnviarCampanha = d.ehCampanha && stage && stage.isDone;

  const enviarCampanha = () => {
    setEnviando(true);
    enviarCampanhaDeDemanda(d);
    setTimeout(()=>setEnviando(false), 900);
  };

  /* Subtarefas: quem está na vez marca a sua como feita (pede aprovação);
     quem é dono da tarefa principal aprova, o que libera a próxima da fila. */
  const concluirSubtarefa = subId => {
    const novas = (d.subtarefas||[]).map(s => s.id===subId ? {...s, status:'aguardando_aprovacao'} : s);
    updateDemand(d.id, { subtarefas: novas });
  };
  const aprovarSubtarefa = subId => {
    const lista = d.subtarefas||[];
    const idx = lista.findIndex(s=>s.id===subId);
    const novas = lista.map((s,i) => {
      if (i===idx) return { ...s, status:'aprovada' };
      if (i===idx+1 && s.status==='bloqueada') return { ...s, status:'pendente' };
      return s;
    });
    updateDemand(d.id, { subtarefas: novas });
  };
  const reabrirSubtarefa = subId => {
    const novas = (d.subtarefas||[]).map(s => s.id===subId ? {...s, status:'pendente'} : s);
    updateDemand(d.id, { subtarefas: novas });
  };

  /* Checklist simples e independente — qualquer tarefa pode ter, sem
     precisar vir de um pacote pronto. Cada item tem um responsável e
     aparece pra ele em "Minhas subtarefas", em qualquer demanda. */
  const adicionarItemChecklist = () => {
    if (!novoItem.titulo.trim() || !novoItem.responsavel) return;
    const item = { id:'chk'+Date.now()+Math.random().toString(36).slice(2,6), titulo:novoItem.titulo.trim(), responsavel:novoItem.responsavel, feita:false };
    updateDemand(d.id, { checklist:[...(d.checklist||[]), item] });
    setNovoItem({ titulo:'', responsavel:'' }); setAddingItem(false);
  };
  const toggleItemChecklist = itemId => {
    const novos = (d.checklist||[]).map(it => it.id===itemId ? {...it, feita:!it.feita} : it);
    updateDemand(d.id, { checklist: novos });
  };
  const removerItemChecklist = itemId => {
    updateDemand(d.id, { checklist: (d.checklist||[]).filter(it=>it.id!==itemId) });
  };

  const toggle = init => {
    const has = d.assignees.includes(init);
    if (has && d.assignees.length === 1) return;   // nunca deixar sem ninguém
    setAssignees(d.id, has ? d.assignees.filter(i=>i!==init) : [...d.assignees, init]);
  };

  return (
    <Modal onClose={()=>setModal(null)} width={620}>
      <div style={{padding:'22px 26px 18px',borderBottom:'1px solid '+NB.bdSoft,display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:14}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:9,flexWrap:'wrap'}}>
            <span style={{background:NB.col,border:'1px solid '+NB.bd,color:NB.mut,fontSize:11,fontWeight:500,padding:'3px 8px',borderRadius:6,fontFamily:'monospace'}}>{d.code}</span>
            <span style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:13,fontWeight:500,color:ac}}><Icon s={15}/> {d.area}</span>
            <span style={{fontSize:11.5,fontWeight:500,padding:'3px 9px',borderRadius:6,background:ps.bg,color:ps.txt}}>{d.priority}</span>
          </div>
          <EditableText value={d.title} required
            onSave={v=>updateDemand(d.id,{title:v})}
            textStyle={{fontSize:19,fontWeight:600,color:NB.txt,lineHeight:1.32,letterSpacing:'-0.01em'}}/>
          {espelhos.length>0 && (
            <div style={{marginTop:9,display:'flex',alignItems:'center',gap:7,flexWrap:'wrap'}}>
              <span style={{fontSize:11.5,color:NB.mut2}}>Espelhada também em:</span>
              {espelhos.map(e=>{
                const EIcon = AREA_ICON[e.area];
                return (
                  <button key={e.id} onClick={()=>setModal(e.id)}
                    style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:11.5,fontWeight:600,color:AREA_CLR[e.area]||NB.azul,background:NB.col,border:'1px solid '+NB.bd,borderRadius:20,padding:'3px 10px'}}>
                    <EIcon s={11}/> {e.area}
                  </button>
                );
              })}
            </div>
          )}
        </div>
        <button onClick={()=>setModal(null)} style={{padding:8,background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,color:NB.mut,display:'flex',flexShrink:0}}><IX/></button>
      </div>

      <div style={{padding:'22px 26px'}}>
        {(podeEnviarCampanha || d.campanhaId) && (
          <div style={{marginBottom:20,background:d.campanhaId?'#E1F5EE':'#EAF3FD',border:'1px solid '+(d.campanhaId?'#A7E8CC':'#BBD8F5'),borderRadius:12,padding:'14px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:14,flexWrap:'wrap'}}>
            <div style={{display:'flex',alignItems:'center',gap:11,minWidth:0}}>
              <span style={{color:d.campanhaId?'#0F6E56':NB.azul,display:'flex',flexShrink:0}}>{d.campanhaId?<ICheck s={18}/>:<ITarget s={18}/>}</span>
              <div>
                <div style={{fontSize:13.5,fontWeight:600,color:NB.txt}}>
                  {d.campanhaId ? 'Já está na Central de Informações' : 'Pronta pra ir pra Central de Informações'}
                </div>
                <div style={{fontSize:12,color:NB.mut}}>
                  {d.campanhaId
                    ? 'Todo o Nibo já pode ver essa campanha, com as peças anexadas aqui.'
                    : (d.campanhaDesconto ? d.campanhaDesconto+' · ' : '')+'Jornada: '+(PERSONAS.find(p=>p.id===d.campanhaJornada)?.label||d.campanhaJornada)}
                </div>
              </div>
            </div>
            {!d.campanhaId && (
              <button onClick={enviarCampanha} disabled={enviando}
                style={{padding:'9px 16px',background:NB.azul,border:'none',borderRadius:9,fontSize:12.5,fontWeight:500,color:'#fff',flexShrink:0,opacity:enviando?0.7:1,cursor:enviando?'wait':'pointer'}}>
                {enviando?'Enviando…':'Enviar campanha para Central de Informações'}
              </button>
            )}
          </div>
        )}

        {(d.subtarefas||[]).length>0 && (
          <div style={{marginBottom:24}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
              <span style={lbl}>Subtarefas</span>
              <span style={{fontSize:11.5,color:NB.mut2}}>{d.subtarefas.filter(s=>s.status==='aprovada').length}/{d.subtarefas.length} concluídas</span>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {d.subtarefas.map((s,i)=>{
                const resp = ACTIVE_TEAM.find(m=>m.initials===s.responsavel);
                if (s.status==='aprovada') return (
                  <div key={s.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 13px',background:'#E1F5EE',border:'1px solid #A7E8CC',borderRadius:9}}>
                    <span style={{color:'#0F6E56',display:'flex',flexShrink:0}}><ICheck s={15}/></span>
                    <span style={{fontSize:13,color:'#0F6E56',textDecoration:'line-through',flex:1}}>{s.titulo}</span>
                    <span style={{fontSize:11,color:'#0F6E56',flexShrink:0}}>{resp?resp.initials:s.responsavel}</span>
                  </div>
                );
                if (s.status==='aguardando_aprovacao') return (
                  <div key={s.id} style={{padding:'10px 13px',background:'#FFF6DE',border:'1px solid #F3D98A',borderRadius:9}}>
                    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
                      <span style={{color:'#8A6206',display:'flex',flexShrink:0}}><IClock s={14}/></span>
                      <span style={{fontSize:13,color:NB.txt,flex:1}}>{s.titulo}</span>
                      <span style={{fontSize:11,color:'#8A6206',flexShrink:0}}>{resp?resp.initials:s.responsavel}</span>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:12,paddingLeft:24}}>
                      <button onClick={()=>aprovarSubtarefa(s.id)}
                        style={{padding:'5px 12px',background:'#8A6206',border:'none',borderRadius:7,fontSize:11.5,fontWeight:500,color:'#fff'}}>
                        Aprovar
                      </button>
                      <button onClick={()=>reabrirSubtarefa(s.id)} style={{fontSize:11.5,color:NB.mut2,background:'none',border:'none'}}>Desfazer</button>

                  </div>

                if (s.status==='bloqueada') return (

                    <span style={{fontSize:11,color:NB.mut2,flexShrink:0}}>{resp?resp.initials:s.responsavel}</span>
                  </div>

                /* 'pendente' — a atual, liberada */

                  <div key={s.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 13px',background:'#EAF3FD',border:'1px solid #BFDDF7',borderRadius:9}}>
                    <span style={{width:20,height:20,borderRadius:'50%',background:NB.azul,color:'#fff',fontSize:10,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{i+1}</span>
                    <span style={{fontSize:13,color:NB.txt,flex:1}}>{s.titulo}</span>
                    <span style={{fontSize:11,color:NB.azul,fontWeight:600,flexShrink:0}}>{resp?resp.initials:s.responsavel}</span>
                    <button onClick={()=>concluirSubtarefa(s.id)}
                      style={{padding:'6px 12px',background:NB.azul,border:'none',borderRadius:7,fontSize:11.5,fontWeight:500,color:'#fff',flexShrink:0}}>

                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        <div style={{marginBottom:22}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <span style={lbl}>Checklist</span>
            {(d.checklist||[]).length>0 && (
              <span style={{fontSize:11.5,color:NB.mut2}}>{d.checklist.filter(it=>it.feita).length}/{d.checklist.length} feitas</span>

          </div>
          {(d.checklist||[]).length>0 && (
            <div style={{display:'flex',flexDirection:'column',gap:7,marginBottom:10}}>
              {d.checklist.map(it=>{
                const resp = ACTIVE_TEAM.find(m=>m.initials===it.responsavel);
                return (
                  <div key={it.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',background: it.feita ? '#E1F5EE' : NB.col, border:'1px solid '+(it.feita?'#A7E8CC':NB.bd), borderRadius:9}}>
                    <button onClick={()=>toggleItemChecklist(it.id)}
                      style={{width:18,height:18,borderRadius:5,border:'1.5px solid '+(it.feita?'#0F6E56':NB.bd),background:it.feita?'#0F6E56':'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      {it.feita && <span style={{color:'#fff',display:'flex'}}><ICheck s={11}/></span>}

                    <span style={{fontSize:13,flex:1,color: it.feita?'#0F6E56':NB.txt, textDecoration: it.feita?'line-through':'none'}}>{it.titulo}</span>

                    <button onClick={()=>removerItemChecklist(it.id)} title="Remover" style={{color:NB.mut2,background:'none',border:'none',display:'flex',flexShrink:0}}><IX s={12}/></button>
                  </div>

              })}
            </div>

          {addingItem ? (

                autoFocus style={{...inp,padding:'7px 10px',fontSize:12.5,background:'#fff'}}
                onKeyDown={e=>{if(e.key==='Enter') adicionarItemChecklist();}}/>
              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                {ACTIVE_TEAM.map(m=>(
                  <button key={m.id} type="button" onClick={()=>setNovoItem(v=>({...v,responsavel:m.initials}))}
                    style={{padding:'4px 10px',borderRadius:20,border:'1px solid '+(novoItem.responsavel===m.initials?NB.azul:NB.bd),background:novoItem.responsavel===m.initials?'#EAF3FD':'#fff',fontSize:11.5,fontWeight:500,color:novoItem.responsavel===m.initials?NB.azul:NB.mut}}>
                    {m.initials}
                  </button>
                ))}
              </div>
              <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
                <button onClick={()=>{setAddingItem(false); setNovoItem({titulo:'',responsavel:''});}} style={{padding:'6px 12px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:7,fontSize:12,color:NB.mut}}>Cancelar</button>
                <button onClick={adicionarItemChecklist} disabled={!novoItem.titulo.trim()||!novoItem.responsavel}
                  style={{padding:'6px 14px',background:NB.azul,border:'none',borderRadius:7,fontSize:12,fontWeight:500,color:'#fff',opacity:(!novoItem.titulo.trim()||!novoItem.responsavel)?0.5:1}}>
                  Adicionar
                </button>
              </div>
            </div>
          ) : (
            <button onClick={()=>setAddingItem(true)}
              style={{display:'flex',alignItems:'center',gap:6,fontSize:12.5,color:NB.azul,background:'none',border:'none',fontWeight:500}}>
              <IPlus s={12}/> Adicionar subtarefa
            </button>
          )}
        </div>

        <div style={{marginBottom:22}}>
          <div style={lbl}>Descrição</div>
          <EditableText value={d.description} multiline rows={3}
            placeholder="Clique para adicionar contexto, referências ou link do briefing..."
            onSave={v=>updateDemand(d.id,{description:v})}
            textStyle={{fontSize:14.5,color:'#3D4B63',lineHeight:1.65}}/>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:13,marginBottom:22}}>
          <div style={{background:NB.col,borderRadius:11,padding:'13px 15px'}}>
            <div style={lbl}>Solicitante</div>
            <EditableText value={d.requester} required onSave={v=>updateDemand(d.id,{requester:v})}
              textStyle={{fontSize:14.5,color:NB.txt,fontWeight:500}}/>
          </div>
          <div style={{background:NB.col,borderRadius:11,padding:'13px 15px'}}>
            <div style={lbl}>Prazo</div>
            <div style={{display:'flex',alignItems:'center',gap:9,flexWrap:'wrap'}}>
              <input type="date" value={d.deadline||''}
                onChange={e=>{ if(e.target.value) updateDemand(d.id,{deadline:e.target.value}); }}
                style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,padding:'7px 10px',fontSize:13.5,color:NB.txt,outline:'none',fontWeight:500}}
                onFocus={e=>{e.target.style.borderColor=NB.azul;}} onBlur={e=>{e.target.style.borderColor=NB.bd;}}/>
              {sla && (
                <span style={{fontSize:12.5,fontWeight:500,padding:'4px 9px',borderRadius:6,
                  background: sla.type==='danger' ? '#FEECEC' : sla.type==='warn' ? '#FFF6DE' : '#EEF2F8',
                  color:      sla.type==='danger' ? '#B4232A' : sla.type==='warn' ? '#8A6206' : NB.mut}}>{sla.label}</span>
              )}
            </div>
          </div>
        </div>

        <div style={{marginBottom:24}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:7,gap:10}}>
            <span style={{...lbl, marginBottom:0}}>Responsáveis</span>
            <button onClick={()=>setPicker(p=>!p)}
              style={{display:'flex',alignItems:'center',gap:6,padding:'5px 11px',background:picker?'#EAF3FD':'#fff',border:'1px solid '+(picker?NB.azul:NB.bd),borderRadius:8,fontSize:12.5,fontWeight:500,color:picker?NB.azul:NB.mut}}>
              <IPlus s={13}/> {picker ? 'Fechar' : 'Adicionar ou trocar'}
            </button>
          </div>

          <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
            {d.assignees.map(init => (
              <AssigneeChip key={init} initials={init}
                onRemove={d.assignees.length>1 ? ()=>toggle(init) : null}/>
            ))}
          </div>

          {picker && (
            <div style={{marginTop:12,padding:'14px 15px',background:NB.col,border:'1px solid '+NB.bd,borderRadius:12}}>
              <div style={{fontSize:12,color:NB.mut,marginBottom:10}}>Clique para adicionar ou remover. Quem entrar é notificado no Slack.</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                {ACTIVE_TEAM.map(m => (
                  <AssigneePick key={m.id} member={m}
                    checked={d.assignees.includes(m.initials)}
                    onToggle={()=>toggle(m.initials)}/>
                ))}
              </div>
              {d.assignees.length===1 && (
                <p style={{fontSize:12,color:NB.mut2,marginTop:10}}>A demanda precisa de pelo menos uma pessoa responsável.</p>
              )}
            </div>
          )}
        </div>

        <div>
          <div style={lbl}>Mover para etapa</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:11}}>
            {stages.map(stage=>{
              const isCur = stage.id===d.stageId;
              const needsNotify = d.area==='Design' && stage.isDone;
              return (
                <button key={stage.id} onClick={()=>{
                  if (isCur) return;
                  if (needsNotify) setNotifyPending({ demandId:d.id, stageId:stage.id, demandTitle:d.title });
                  else moveStage(d.id, stage.id);
                }}
                  style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',borderRadius:9,fontSize:13,fontWeight:500,border:'1px solid '+(isCur?NB.azul:NB.bd),background:isCur?NB.azul:'#fff',color:isCur?'#fff':NB.mut,transition:'all 0.12s'}}
                  onMouseEnter={e=>{ if(!isCur){e.currentTarget.style.color=NB.txt; e.currentTarget.style.borderColor='#D3DCEA';} }}
                  onMouseLeave={e=>{ if(!isCur){e.currentTarget.style.color=NB.mut; e.currentTarget.style.borderColor=NB.bd;} }}>
                  {isCur && <ICheck s={13}/>}
                  {stage.name}
                </button>
              );
            })}
          </div>
          <p style={{fontSize:12.5,color:NB.mut2,lineHeight:1.55,marginBottom:14}}>Ao mover, o caminho da automação é enviado automaticamente para o Slack. Etapas de aprovação são sempre encaminhadas para @Mariana Araújo.</p>

          <div style={{marginTop:16,background:'#EAF3FD',border:'1px solid #BBD8F5',borderRadius:12,padding:'14px 16px'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
              <div style={{display:'flex',alignItems:'flex-start',gap:11,minWidth:0}}>
                <span style={{color:NB.azul,display:'flex',marginTop:1,flexShrink:0}}><IArrowR s={17}/></span>
                <div>
                  <div style={{fontSize:13.5,fontWeight:600,color:NB.txt,marginBottom:2}}>Passar para outra área</div>
                  <div style={{fontSize:12.5,color:'#3D5B85',lineHeight:1.5}}>
                    Aprovada no {d.area} e agora é de Mídia Paga ou Social? Mande a demanda para o pipeline certo.
                  </div>
                </div>
              </div>
              <button onClick={()=>{setAreaPick(v=>!v); setTgtArea(null);}}
                style={{display:'flex',alignItems:'center',gap:7,padding:'10px 16px',background:areaPick?'#fff':NB.azul,border:'1px solid '+NB.azul,borderRadius:9,fontSize:13,fontWeight:500,color:areaPick?NB.azul:'#fff',flexShrink:0,whiteSpace:'nowrap'}}>

                    const AIcon = AREA_ICON[a]; const on = tgtArea===a;
                    return (
                      <button key={a} onClick={()=>setTgtArea(on?null:a)}
                        style={{display:'flex',alignItems:'center',gap:7,padding:'8px 13px',borderRadius:9,border:'1px solid '+(on?AREA_CLR[a]:NB.bd),background:on?AREA_CLR[a]+'14':'#fff',fontSize:13,fontWeight:500,color:on?AREA_CLR[a]:NB.mut}}>

                      </button>

                {tgtArea && (
                  <React.Fragment>
                    <div style={{...lbl,marginBottom:8}}>Entra em qual etapa de {tgtArea}</div>

                      {pipes[tgtArea].map(st=>{
                        const on = tgtStage===st.id || (!tgtStage && st.id===pipes[tgtArea][0].id);
                        return (
                          <button key={st.id} onClick={()=>setTgtStage(st.id)}
                            style={{padding:'7px 12px',borderRadius:8,border:'1px solid '+(on?AREA_CLR[tgtArea]:NB.bd),background:on?AREA_CLR[tgtArea]:'#fff',fontSize:12.5,fontWeight:500,color:on?'#fff':NB.mut}}>
                            {st.name}
                          </button>
                        );
                      })}
                    </div>
                    <p style={{fontSize:12,color:NB.mut2,lineHeight:1.55,marginBottom:12}}>

                    </p>
                    <button onClick={()=>{
                      moveArea(d.id, tgtArea, tgtStage || pipes[tgtArea][0].id);
                      setAreaPick(false); setTgtArea(null); setTgtStage(null);
                    }}
                      style={{padding:'9px 18px',background:AREA_CLR[tgtArea],border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>
                      Passar para {tgtArea}
                    </button>
                  </React.Fragment>
                )}
              </div>
            )}
          </div>
        </div>

        {/* Anexos e comentários */}

            {[

              {id:'comentarios',label:'Comentários',Icon:IChatBox,n:nComments},

              const on = tab===id;

                <button key={id} onClick={()=>setTab(id)}
                  style={{display:'flex',alignItems:'center',gap:8,padding:'9px 15px',borderRadius:9,border:'1px solid '+(on?NB.azul:NB.bd),background:on?'#EAF3FD':'#fff',fontSize:13,fontWeight:500,color:on?NB.azul:NB.mut}}>
                  <Icon s={15}/> {label}
                  {n>0 && <span style={{background:on?NB.azul:'#EEF2F8',color:on?'#fff':NB.mut,fontSize:11,fontWeight:600,borderRadius:20,padding:'1px 7px'}}>{n}</span>}
                </button>

          </div>

        </div>

          <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
            <span style={{fontSize:13,color:'#B4232A',fontWeight:500}}>Excluir {d.code}? Não dá para desfazer.</span>
            <button onClick={()=>delDemand(d.id)}

              Sim, excluir
            </button>
            <button onClick={()=>setConfirmDel(false)}
              style={{padding:'8px 15px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:12.5,fontWeight:500,color:NB.mut}}>
              Cancelar
            </button>
          </div>
        ) : (
          <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
            <button onClick={()=>archiveDemand(d.id)} title="Sai do quadro mas continua guardada"

              onMouseLeave={e=>{e.currentTarget.style.color=NB.mut; e.currentTarget.style.borderColor=NB.bd;}}>

const DESIGN_NOTIFY_OPTIONS = ['RO','CA','MA'];

function NotifyModal() {
  const { notifyPending, setNotifyPending, moveStage } = useApp();
  const [picked, setPicked] = useState([]);
  useEffect(() => { if (notifyPending) setPicked([]); }, [notifyPending]);
  if (!notifyPending) return null;

  const toggle = init => setPicked(p => p.includes(init) ? p.filter(i=>i!==init) : [...p, init]);
  const allSelected = DESIGN_NOTIFY_OPTIONS.every(i=>picked.includes(i));
  const toggleAll = () => setPicked(allSelected ? [] : [...DESIGN_NOTIFY_OPTIONS]);
  const confirm = () => { moveStage(notifyPending.demandId, notifyPending.stageId, picked); setNotifyPending(null); };

  return (
    <Modal onClose={()=>setNotifyPending(null)} width={450} z={60}>
      <div style={{padding:'24px 26px 16px'}}>
        <h2 style={{fontSize:17.5,fontWeight:600,color:NB.txt,marginBottom:7}}>Notificar entrega no Slack</h2>
        <p style={{fontSize:13.5,color:NB.mut,lineHeight:1.6}}>A arte de <strong style={{color:NB.txt,fontWeight:500}}>{notifyPending.demandTitle}</strong> vai para Entregue. Quem deve receber a menção?</p>
      </div>
      <div style={{padding:'4px 26px 10px',display:'flex',flexDirection:'column',gap:8}}>
        <label style={{display:'flex',alignItems:'center',gap:11,padding:'11px 14px',borderRadius:11,background:allSelected?'#EAF3FD':'#fff',border:'1px solid '+(allSelected?NB.azul:NB.bd),cursor:'pointer'}}>
          <input type="checkbox" checked={allSelected} onChange={toggleAll} style={{width:15,height:15,accentColor:NB.azul}}/>
          <span style={{fontSize:14,fontWeight:500,color:NB.txt}}>Todos</span>
        </label>
        {DESIGN_NOTIFY_OPTIONS.map(init => (
          <NotifyOption key={init} initials={init} checked={picked.includes(init)} onToggle={()=>toggle(init)}/>
        ))}
      </div>
      <div style={{padding:'16px 26px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'flex-end',gap:10}}>
        <button onClick={()=>setNotifyPending(null)}
          style={{padding:'10px 18px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>
          Cancelar
        </button>
        <button onClick={confirm} disabled={picked.length===0}
          style={{padding:'10px 22px',background:picked.length?NB.azul:'#CFD8E6',border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',cursor:picked.length?'pointer':'not-allowed'}}>
          Mover e notificar
        </button>
      </div>
    </Modal>
  );
}

function ProfileModal() {
  const { profileOpen, setProfileOpen, user, savePhoto, removePhoto, saveProfile, photos, googlePhotos } = useApp();
  const fileRef = useRef(null);
  const [name, setName] = useState('');
  const [err, setErr]   = useState('');
  const [photoDraft, setPhotoDraft] = useState(undefined);

  const userId  = user ? user.id : null;
  const nameRef = useRef('');
  nameRef.current = user ? user.name : '';

  useEffect(() => {
    if (profileOpen && userId) { setName(nameRef.current); setPhotoDraft(undefined); setErr(''); }
  }, [profileOpen, userId]);

  if (!profileOpen || !user) return null;

  const currentPhoto = photoDraft !== undefined ? photoDraft : (photos[user.id] || googlePhotos[user.id] || user.googlePhoto || null);

  const pick = e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (!f.type.startsWith('image/')) return setErr('Escolha um arquivo de imagem.');
    if (f.size > 3 * 1024 * 1024) return setErr('Imagem muito grande. Use um arquivo de até 3 MB.');
    const rd = new FileReader();
    rd.onload = () => { setPhotoDraft(rd.result); setErr(''); };
    rd.onerror = () => setErr('Não foi possível ler a imagem.');
    rd.readAsDataURL(f);
  };

  const save = () => {
    saveProfile(user.id, { name: name.trim() || nameRef.current });
    if (photoDraft !== undefined) { photoDraft ? savePhoto(user.id, photoDraft) : removePhoto(user.id); }
    setProfileOpen(false);
  };

  return (
    <Modal onClose={()=>setProfileOpen(false)} width={470} z={70}>
      <div style={{height:92,background:'linear-gradient(120deg,'+user.color+','+NB.roxo+')'}}/>
      <div style={{padding:'0 28px 24px',marginTop:-44}}>
        <div style={{display:'flex',alignItems:'flex-end',gap:16,marginBottom:22}}>
          <div style={{position:'relative'}}>
            <Avatar member={user} src={currentPhoto} size={90} ring={false} style={{border:'4px solid #fff',boxShadow:'0 4px 14px rgba(11,42,92,0.18)'}}/>
            <button onClick={()=>fileRef.current && fileRef.current.click()} title="Trocar foto"
              style={{position:'absolute',right:-2,bottom:-2,width:32,height:32,borderRadius:'50%',background:NB.azul,border:'3px solid #fff',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <ICamera s={15}/>
            </button>
            <input ref={fileRef} type="file" accept="image/*" onChange={pick} style={{display:'none'}}/>
          </div>
          <div style={{paddingBottom:6,minWidth:0}}>
            <div style={{fontSize:11.5,color:NB.mut2,fontWeight:500,textTransform:'uppercase',letterSpacing:'0.09em'}}>{user.area}</div>
            <div style={{fontSize:13.5,color:NB.mut,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{user.email}</div>
          </div>
        </div>

        <div style={lbl}>Nome de exibição</div>
        <input value={name} onChange={e=>setName(e.target.value)} style={inp}
          onFocus={e=>{e.target.style.borderColor=NB.azul;}} onBlur={e=>{e.target.style.borderColor=NB.bd;}}/>

        <div style={{display:'flex',gap:9,marginTop:16,flexWrap:'wrap'}}>
          <button onClick={()=>fileRef.current && fileRef.current.click()}
            style={{display:'flex',alignItems:'center',gap:8,padding:'10px 15px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:10,fontSize:13,fontWeight:500,color:NB.mut}}>
            <ICamera s={15}/> {currentPhoto ? 'Trocar foto' : 'Adicionar foto'}
          </button>
          {currentPhoto && (
            <button onClick={()=>setPhotoDraft(null)}
              style={{padding:'10px 15px',background:'#fff',border:'1px solid #FBD5D5',borderRadius:10,fontSize:13,fontWeight:500,color:'#B4232A'}}>
              Remover foto
            </button>
          )}
        </div>
        {err && <p style={{fontSize:12.5,color:'#B4232A',marginTop:10}}>{err}</p>}
        <p style={{fontSize:12.5,color:NB.mut2,marginTop:12,lineHeight:1.55}}>
          {photoDraft !== undefined
            ? 'Clique em Salvar perfil para aplicar a nova foto.'
            : 'Por padrão usamos sua foto do Google. A foto que você subir fica salva neste navegador.'}
        </p>
      </div>

      <div style={{padding:'16px 28px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'flex-end',gap:10}}>
        <button onClick={()=>setProfileOpen(false)}
          style={{padding:'10px 18px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>
          Cancelar
        </button>
        <button onClick={save}
          style={{padding:'10px 22px',background:NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>
          Salvar perfil
        </button>
      </div>
    </Modal>
  );
}

/* =========== PACOTE DE TAREFAS =========== */
function PacoteModal() {
  const { pacoteOpen, setPacoteOpen, addDemand, pacotes, user } = useApp();
  const [pacoteId, setPacoteId] = useState('webinar');
  const [tema, setTema] = useState('');
  const [dataBase, setDataBase] = useState(dStr(20));
  const [err, setErr] = useState('');
  const [criando, setCriando] = useState(false);
  const [editando, setEditando] = useState(null); // null | 'novo' | id do pacote

  /* Junta o pacote embutido com os que o time já salvou — um pacote salvo
     com o mesmo id (ex: 'webinar') substitui o embutido. */
  const todos = { ...PACOTES_TAREFAS_PADRAO, ...Object.fromEntries(pacotes.map(p=>[p.id,p])) };
  const lista = Object.entries(todos);

  useEffect(() => {
    if (pacoteOpen) { setTema(''); setDataBase(dStr(20)); setErr(''); setCriando(false); setEditando(null); }
  }, [pacoteOpen]);

  useEffect(() => {
    if (!todos[pacoteId] && lista.length>0) setPacoteId(lista[0][0]);
  }, [pacotes]);

  if (!pacoteOpen) return null;
  const pacote = todos[pacoteId];

  const somarDias = (isoBase, dias) => {
    const d = new Date(isoBase+'T00:00:00');
    d.setDate(d.getDate() - dias);
    return d.toISOString().split('T')[0];
  };

  const criar = () => {
    if (!tema.trim()) return setErr('Dê um nome pra esse fluxo.');
    setCriando(true);
    const subtarefas = (pacote.subtarefas||[]).map((s,i) => ({
      id: 'sub'+i,
      titulo: resolverTitulo(s.titulo, tema.trim()),
      responsavel: s.responsavel,
      prazo: somarDias(dataBase, s.diasAntes),
      status: i===0 ? 'pendente' : 'bloqueada',
    }));
    addDemand({
      title: resolverTitulo(pacote.tituloPrincipal, tema.trim()),
      area: pacote.area, priority: pacote.priority, deadline: dataBase,
      description: (pacote.descricao||'') + (pacote.descricao ? '\n\n' : '') + 'Criada a partir do pacote "'+pacote.nome+'".',
      requester: user.name, assignees: [pacote.responsavelPrincipal],
      subtarefas,
    });
    setTimeout(() => { setCriando(false); setPacoteOpen(false); }, 700);
  };

  if (editando) {
    return <PacoteEditModal id={editando==='novo'?null:editando} pacote={editando==='novo'?null:pacote}
      onClose={()=>setEditando(null)} onSaved={novoId=>{ setEditando(null); if(novoId) setPacoteId(novoId); }}/>;
  }

  return (
    <Modal onClose={()=>setPacoteOpen(false)} width={560}>
      <div style={{padding:'24px 28px 18px',borderBottom:'1px solid '+NB.bdSoft,display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:14}}>
        <div>
          <h2 style={{fontSize:20,fontWeight:600,color:NB.txt,marginBottom:5,letterSpacing:'-0.01em'}}>Criar pacote de tarefas</h2>
          <p style={{fontSize:13.5,color:NB.mut}}>Um clique cria todas as tarefas padrão desse fluxo de uma vez.</p>
        </div>
        <button onClick={()=>setPacoteOpen(false)} style={{padding:8,background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,color:NB.mut,display:'flex',flexShrink:0}}><IX/></button>
      </div>

      <div style={{padding:'22px 28px',display:'flex',flexDirection:'column',gap:18}}>
        <div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:7}}>
            <div style={{...lbl,marginBottom:0}}>Pacote</div>
            <div style={{display:'flex',gap:12}}>
              <button onClick={()=>setEditando(pacoteId)} style={{fontSize:12,color:NB.azul,background:'none',border:'none',fontWeight:500}}>Editar este</button>
              <button onClick={()=>setEditando('novo')} style={{fontSize:12,color:NB.azul,background:'none',border:'none',fontWeight:500}}>+ Novo pacote</button>
            </div>
          </div>
          <select value={pacoteId} onChange={e=>setPacoteId(e.target.value)} style={inp}>
            {lista.map(([id,p])=><option key={id} value={id}>{p.nome}</option>)}
          </select>
          {pacote.descricao && <p style={{fontSize:12,color:NB.mut2,marginTop:6}}>{pacote.descricao}</p>}
        </div>

        <div>
          <div style={lbl}>Tema desse fluxo</div>
          <input value={tema} onChange={e=>{setTema(e.target.value); setErr('');}} placeholder="ex: Reforma Tributária na prática" style={inp}
            onFocus={e=>{e.target.style.borderColor=NB.azul;}} onBlur={e=>{e.target.style.borderColor=NB.bd;}}/>
        </div>

        <div>
          <div style={lbl}>{pacote.campoData || 'Data-base'}</div>
          <input type="date" value={dataBase} onChange={e=>setDataBase(e.target.value)} style={inp}/>
        </div>

        <div style={{background:NB.col,border:'1px solid '+NB.bd,borderRadius:11,padding:'14px 16px'}}>
          <div style={{fontSize:13,fontWeight:600,color:NB.txt,marginBottom:3}}>{resolverTitulo(pacote.tituloPrincipal, tema.trim())}</div>
          <div style={{fontSize:11.5,color:NB.mut2,marginBottom:12}}>Fica com {ACTIVE_TEAM.find(m=>m.initials===pacote.responsavelPrincipal)?.name || pacote.responsavelPrincipal} · {(pacote.subtarefas||[]).length} subtarefas no checklist</div>
          <div style={{display:'flex',flexDirection:'column',gap:7}}>
            {(pacote.subtarefas||[]).map((s,i)=>(
              <div key={i} style={{display:'flex',alignItems:'center',gap:9,fontSize:12.5,color:NB.txt}}>
                <span style={{width:18,height:18,borderRadius:'50%',background:i===0?NB.azul:'#fff',border:'1.5px solid '+(i===0?NB.azul:NB.bd),color:i===0?'#fff':NB.mut2,fontSize:10,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{i+1}</span>
                <span style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{resolverTitulo(s.titulo, tema.trim())}</span>
                <span style={{color:NB.mut2,flexShrink:0,fontSize:11}}>{s.responsavel}</span>
              </div>
            ))}
            {(pacote.subtarefas||[]).length===0 && <p style={{fontSize:12.5,color:NB.mut2}}>Esse pacote ainda não tem subtarefas — clica em "Editar este" pra adicionar.</p>}
          </div>
        </div>

        {err && <p style={{fontSize:12.5,color:'#B4232A'}}>{err}</p>}
      </div>

      <div style={{padding:'16px 28px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'flex-end',gap:10}}>
        <button onClick={()=>setPacoteOpen(false)}
          style={{padding:'11px 18px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>
          Cancelar
        </button>
        <button onClick={criar} disabled={criando || (pacote.subtarefas||[]).length===0}
          style={{padding:'11px 24px',background:(criando||(pacote.subtarefas||[]).length===0)?'#CFD8E6':NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',cursor:criando?'wait':'pointer'}}>
          {criando?'Criando…':'Criar tarefa com '+(pacote.subtarefas||[]).length+' subtarefas'}
        </button>
      </div>
    </Modal>
  );
}

function PacoteEditModal({ id, pacote, onClose, onSaved }) {
  const { salvarPacote, removePacote } = useApp();
  const editando = !!pacote;
  const [form, setForm] = useState(() => pacote ? {
    nome: pacote.nome||'', descricao: pacote.descricao||'', campoData: pacote.campoData||'Data-base',
    tituloPrincipal: pacote.tituloPrincipal||'', area: pacote.area||'Social', responsavelPrincipal: pacote.responsavelPrincipal||'',
    priority: pacote.priority||'Média',
    subtarefas: (pacote.subtarefas||[]).map(s=>({...s})),
  } : { nome:'', descricao:'', campoData:'Data-base', tituloPrincipal:'', area:'Social', responsavelPrincipal:'', priority:'Média', subtarefas:[] });
  const [err, setErr] = useState('');
  const [confirmarExcluir, setConfirmarExcluir] = useState(false);
  const set = (k,v) => { setForm(f=>({...f,[k]:v})); setErr(''); };

  const addSubtarefa = () => setForm(f=>({...f, subtarefas:[...f.subtarefas, { titulo:'', responsavel:'', diasAntes:5 }]}));
  const updateSubtarefa = (i, nova) => setForm(f=>({...f, subtarefas: f.subtarefas.map((s,ix)=>ix===i?nova:s)}));
  const removeSubtarefa = i => setForm(f=>({...f, subtarefas: f.subtarefas.filter((_,ix)=>ix!==i)}));

  const salvar = () => {
    if (!form.nome.trim()) return setErr('Dê um nome pro pacote.');
    if (!form.tituloPrincipal.trim()) return setErr('Dê um título pra tarefa principal.');
    if (!form.responsavelPrincipal) return setErr('Escolha quem fica responsável pela tarefa principal.');
    if (form.subtarefas.length===0) return setErr('Adicione pelo menos uma subtarefa.');
    if (form.subtarefas.some(s=>!s.titulo.trim())) return setErr('Toda subtarefa precisa de um título.');
    if (form.subtarefas.some(s=>!s.responsavel)) return setErr('Toda subtarefa precisa de um responsável.');
    salvarPacote(id, {
      nome: form.nome.trim(), descricao: form.descricao.trim(), campoData: form.campoData.trim()||'Data-base',
      tituloPrincipal: form.tituloPrincipal.trim(), area: form.area, responsavelPrincipal: form.responsavelPrincipal,
      priority: form.priority, subtarefas: form.subtarefas,
    });
    onSaved(id);
  };

  const excluir = () => {
    if (id) removePacote(id);
    onSaved(null);
  };

  const ehEmbutido = id && !!PACOTES_TAREFAS_PADRAO[id] && !pacote.criadoPor;

  return (
    <Modal onClose={onClose} width={620}>
      <div style={{padding:'22px 24px 16px',borderBottom:'1px solid '+NB.bdSoft}}>
        <h2 style={{fontSize:18,fontWeight:600,color:NB.txt}}>{editando?'Editar pacote':'Novo pacote'}</h2>
        {ehEmbutido && <p style={{fontSize:12,color:NB.mut,marginTop:4}}>Esse é um pacote padrão do sistema — salvar aqui cria a sua própria versão editável dele.</p>}
      </div>
      <div style={{padding:'20px 24px',display:'flex',flexDirection:'column',gap:14,maxHeight:'62vh',overflowY:'auto'}}>
        <div>
          <div style={{...lbl,marginBottom:6}}>Nome do pacote</div>
          <input value={form.nome} onChange={e=>set('nome',e.target.value)} placeholder="ex: Pacote Cadastro de Embaixador" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
        </div>
        <div>
          <div style={{...lbl,marginBottom:6}}>Descrição</div>
          <input value={form.descricao} onChange={e=>set('descricao',e.target.value)} placeholder="Uma linha explicando pra que serve" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
        </div>
        <div>

function NewModal() {

  const initArea = presetNovo ? presetNovo.area : (area!=='Todas' ? area : 'Social');
  const [form, setForm] = useState({ title:'', area:initArea, priority:'Média', deadline:dStr(7), description:'', requester:user.name, assignees:[],
    ehCampanha:false, campanhaDesconto:'', campanhaJornada:'empresa', recorrente:false, frequenciaDias:30 });
  const [areasEspelho, setAreasEspelho] = useState([]);
  const [checklist, setChecklist] = useState([]);
  const [novoItem, setNovoItem] = useState({ titulo:'', responsavel:'' });
  const [addingItem, setAddingItem] = useState(false);

  useEffect(() => {
    if (newOpen) { setForm(f=>({ ...f, title:'', area: presetNovo ? presetNovo.area : (area!=='Todas'?area:'Social'), requester:user.name, assignees:[], description:'',
      ehCampanha:false, campanhaDesconto:'', campanhaJornada:'empresa', recorrente:false, frequenciaDias:30 })); setAreasEspelho([]); setChecklist([]); setAddingItem(false); }
  }, [newOpen, area, user, presetNovo]);

  if (!newOpen) return null;

  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const toggleAssignee = init => setForm(f => ({ ...f, assignees: f.assignees.includes(init) ? f.assignees.filter(i=>i!==init) : [...f.assignees, init] }));
  const toggleEspelho = a => setAreasEspelho(v => v.includes(a) ? v.filter(x=>x!==a) : [...v, a]);

    if (!novoItem.titulo.trim() || !novoItem.responsavel) return;

  const removerItemChecklist = id => setChecklist(c => c.filter(it=>it.id!==id));

/* =========== PORTA DE ENTRADA — pública, sem login. "Gestão" pede login. ============ */
/* Lógica de login isolada, reaproveitada pelo card de Gestão. */
function useLoginGestao() {
  const { setAuthError, setPreferirCentral } = useApp();
  const [busy, setBusy] = useState(false);
  const [erro, setErro] = useState('');

  const entrar = async (destino) => {
    setPreferirCentral(destino === 'central');
    setBusy(true); setErro(''); setAuthError('');
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ hd: 'nibo.com.br', prompt: 'select_account' });
      await firebase.auth().signInWithPopup(provider);
      /* onAuthStateChanged assume a partir daqui */
    } catch (err) {
      const code = err && err.code;
      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') { /* fechou de propósito */ }
      else if (code === 'auth/unauthorized-domain') setErro('Domínio não autorizado no Firebase.');
      else if (code === 'auth/popup-blocked') setErro('O navegador bloqueou o popup. Libere pop-ups e tente de novo.');
      else setErro('Não foi possível entrar. Erro: ' + (code || 'desconhecido'));
      setBusy(false); return;
    }
    setBusy(false);
  };

  return { entrar, busy, erro };
}

function EmbaixadorLoginPage({ onVoltar }) {
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [erro, setErro] = useState('');
  const [busy, setBusy] = useState(false);

  const entrar = async e => {
    e.preventDefault();
    if (!email.trim() || !senha) return setErro('Preencha e-mail e senha.');
    setBusy(true); setErro('');
    try {
      await firebase.auth().signInWithEmailAndPassword(email.trim(), senha);
    } catch (err) {
      const code = err && err.code;
      setErro(
        code==='auth/invalid-credential' || code==='auth/wrong-password' || code==='auth/user-not-found' ? 'E-mail ou senha incorretos.'
        : code==='auth/too-many-requests' ? 'Muitas tentativas — espera um pouco e tenta de novo.'
        : code==='auth/invalid-email' ? 'E-mail inválido.'
        : 'Não foi possível entrar. Erro: '+(code||'desconhecido')
      );
      setBusy(false);
    }
  };

  return (
    <div style={{height:'100vh',width:'100%',display:'flex',alignItems:'center',justifyContent:'center',background:NB.bg,padding:24}}>
      <div style={{width:'100%',maxWidth:380}}>
        <button onClick={onVoltar} style={{display:'flex',alignItems:'center',gap:7,background:'none',border:'none',color:NB.mut,fontSize:12.5,marginBottom:22}}>
          <IArrowL s={13}/> Voltar
        </button>
        <div style={{display:'flex',alignItems:'center',gap:11,marginBottom:28}}>
          <NiboSymbol size={30} color={NB.navy1}/>
          <div style={{fontSize:15,fontWeight:700,color:NB.navy1}}>Área do Embaixador</div>
        </div>
        <form onSubmit={entrar} style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:16,padding:28}}>
          <div style={{marginBottom:16}}>
            <div style={{...lbl,marginBottom:6}}>E-mail cadastrado</div>

          </div>
          <div style={{marginBottom:20}}>
            <div style={{...lbl,marginBottom:6}}>Senha</div>
            <input type="password" value={senha} onChange={e=>{setSenha(e.target.value); setErro('');}} placeholder="••••••••" style={{...inp,padding:'10px 12px',fontSize:13.5}}/>

function EnvioFotosEmbaixador() {
  const { meusEnviosFotos, enviarFotoEmbaixador, MAX_FILE } = useApp();
  const [enviando, setEnviando] = useState(false);
  const [err, setErr] = useState('');
  const [ok, setOk] = useState(false);

  const comprimirImagem = file => new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const maxLado = 900;
      const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
      const w = Math.round(img.width * escala), h = Math.round(img.height * escala);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });

  const escolher = async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (file.size > 10*1024*1024) return setErr('A foto tem '+Math.round(file.size/1024)+'KB — tenta uma bem menor (até uns 10MB de origem).');
    setErr(''); setOk(false); setEnviando(true);
    try {
      const dataUrl = await comprimirImagem(file);
      if (dataUrl.length > MAX_FILE) throw new Error('A foto ficou grande demais mesmo depois de comprimida — tenta outra.');
      const r = await enviarFotoEmbaixador(dataUrl);
      setEnviando(false);
      if (!r.ok) setErr(r.erro); else { setOk(true); setTimeout(()=>setOk(false), 3000); }
    } catch (err) {
      setEnviando(false);
      setErr(err && err.message ? err.message : 'Não foi possível processar essa foto.');
    }
  };

  return (
    <div style={{marginTop:28}}>
      <h2 style={{fontSize:19,fontWeight:600,color:NB.txt,marginBottom:4}}>Enviar fotos suas</h2>
      <p style={{fontSize:13.5,color:NB.mut,marginBottom:16}}>Manda fotos suas pro time de Marketing usar em posts, depoimentos e materiais — não precisa ter nada a ver com o seu perfil.</p>
      <div style={{background:'#fff',border:'1px dashed '+NB.bd,borderRadius:14,padding:'20px',display:'flex',alignItems:'center',gap:16,flexWrap:'wrap',marginBottom:16}}>
        <div style={{width:44,height:44,borderRadius:12,background:'#EAF3FD',color:NB.azul,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <ICamera s={19}/>
        </div>
        <div style={{flex:1,minWidth:180}}>
          <div style={{fontSize:13.5,fontWeight:600,color:NB.txt,marginBottom:2}}>Mandar uma foto</div>
          <div style={{fontSize:12,color:NB.mut2}}>Até {Math.round(MAX_FILE/1024)}KB por foto.</div>
        </div>
        <label style={{padding:'9px 16px',background:enviando?NB.mut2:NB.azul,borderRadius:9,color:'#fff',fontSize:12.5,fontWeight:600,cursor:enviando?'default':'pointer',flexShrink:0}}>
          {enviando?'Enviando…':'Escolher foto'}
          <input type="file" accept="image/*" onChange={escolher} disabled={enviando} style={{display:'none'}}/>
        </label>
      </div>
      {err && <p style={{fontSize:12.5,color:'#B4232A',marginBottom:12}}>{err}</p>}
      {ok && <p style={{fontSize:12.5,color:'#0F6E56',marginBottom:12}}>Foto enviada! O time de Marketing vai ver por aqui.</p>}

      {meusEnviosFotos.length>0 && (
        <div>
          <div style={{fontSize:12,color:NB.mut2,marginBottom:10}}>Suas fotos enviadas ({meusEnviosFotos.length})</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(90px,1fr))',gap:10}}>
            {meusEnviosFotos.map(f=>(
              <div key={f.id} style={{aspectRatio:'1/1',borderRadius:10,overflow:'hidden',background:NB.col,border:'1px solid '+NB.bd}}>
                <img src={f.foto} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* Visualização da Gestão: qualquer pessoa do time vê o portal de qualquer
   embaixador, sem precisar da senha dele — só pra conferência. */
function BarraMetrica({ label, valor, max, cor, totalGeral }) {
  const pct = max>0 ? Math.round((valor/max)*100) : 0;
  const pctTotal = totalGeral ? Math.round((valor/totalGeral)*100) : null;
  return (
    <div style={{display:'flex',alignItems:'center',gap:12}}>
      <span style={{fontSize:12.5,color:NB.mut,width:110,flexShrink:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{label}</span>
      <div style={{flex:1,height:10,background:NB.col,borderRadius:6,overflow:'hidden'}}>
        <div style={{width:pct+'%',height:'100%',background:cor,borderRadius:6,transition:'width 0.3s'}}/>
      </div>
      <span style={{fontSize:12.5,fontWeight:600,color:NB.txt,width:pctTotal!==null?58:22,textAlign:'right',flexShrink:0}}>
        {valor}{pctTotal!==null && <span style={{color:NB.mut2,fontWeight:500}}> · {pctTotal}%</span>}
      </span>
    </div>
  );
}

function PieChart({ dados, size=150 }) {
  const total = dados.reduce((s,d)=>s+d.valor,0);
  if (total===0) return <div style={{width:size,height:size,borderRadius:'50%',background:NB.col,border:'1px solid '+NB.bd}}/>;
  let acc = 0;
  const partes = dados.map(d => {
    const inicio = acc/total*360;
    acc += d.valor;
    const fim = acc/total*360;
    return d.cor+' '+inicio.toFixed(1)+'deg '+fim.toFixed(1)+'deg';
  });
  return (
    <div style={{width:size,height:size,borderRadius:'50%',background:'conic-gradient('+partes.join(', ')+')',flexShrink:0,boxShadow:'0 0 0 1px '+NB.bd+' inset'}}/>
  );
}

function PizzaChart({ dados, tamanho=140 }) {
  // dados: [{ label, valor, cor }]
  const total = dados.reduce((s,d)=>s+d.valor,0) || 1;
  let acumulado = 0;
  const fatias = dados.map(d => {
    const inicio = (acumulado/total)*360;
    acumulado += d.valor;
    const fim = (acumulado/total)*360;
    return d.cor+' '+inicio.toFixed(2)+'deg '+fim.toFixed(2)+'deg';
  });
  const gradient = dados.every(d=>d.valor===0) ? NB.bd : 'conic-gradient(' + fatias.join(', ') + ')';
  return (
    <div style={{display:'flex',alignItems:'center',gap:22,flexWrap:'wrap'}}>
      <div style={{width:tamanho,height:tamanho,borderRadius:'50%',background:gradient,flexShrink:0,position:'relative'}}>
        <div style={{position:'absolute',inset:tamanho*0.28,borderRadius:'50%',background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column'}}>
          <span style={{fontSize:17,fontWeight:700,color:NB.txt}}>{total}</span>
          <span style={{fontSize:9.5,color:NB.mut2}}>total</span>
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:7}}>
        {dados.map(d=>(
          <div key={d.label} style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{width:9,height:9,borderRadius:3,background:d.cor,flexShrink:0}}/>
            <span style={{fontSize:12.5,color:NB.txt,minWidth:90}}>{d.label}</span>
            <span style={{fontSize:12.5,fontWeight:600,color:NB.mut}}>{d.valor} ({total?Math.round(d.valor/total*100):0}%)</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function MinhasSubtarefasView() {
  const { active, user, setModal, updateDemand } = useApp();

  const itens = [];
  active.forEach(d => {
    (d.checklist||[]).forEach(it => {
      if (it.responsavel === user.initials) itens.push({ ...it, demanda:d });
    });
  });
  const pendentes = itens.filter(it=>!it.feita).sort((a,b)=>(a.demanda.deadline||'').localeCompare(b.demanda.deadline||''));
  const feitas = itens.filter(it=>it.feita);

  const toggle = (demanda, itemId) => {
    const novos = (demanda.checklist||[]).map(it => it.id===itemId ? {...it, feita:!it.feita} : it);
    updateDemand(demanda.id, { checklist: novos });
  };

  const Linha = ({ it }) => {
    const Icon = AREA_ICON[it.demanda.area] || ILayers;
    return (
      <div style={{display:'flex',alignItems:'center',gap:12,background:'#fff',border:'1px solid '+NB.bd,borderRadius:12,padding:'13px 16px'}}>
        <button onClick={()=>toggle(it.demanda, it.id)}
          style={{width:19,height:19,borderRadius:6,border:'1.5px solid '+(it.feita?'#0F6E56':NB.bd),background:it.feita?'#0F6E56':'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          {it.feita && <span style={{color:'#fff',display:'flex'}}><ICheck s={11}/></span>}
        </button>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13.5,color:it.feita?NB.mut2:NB.txt,textDecoration:it.feita?'line-through':'none'}}>{it.titulo}</div>
          <button onClick={()=>setModal(it.demanda.id)}
            style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:11.5,color:NB.mut,background:'none',border:'none',marginTop:2}}>
            <Icon s={11}/> {it.demanda.title}
          </button>
        </div>
        <span style={{fontSize:11,color:AREA_CLR[it.demanda.area]||NB.mut2,fontWeight:600,flexShrink:0}}>{it.demanda.area}</span>
      </div>
    );
  };

  return (
    <div style={{padding:'22px 30px 30px',overflowY:'auto',height:'100%'}}>
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:20,fontWeight:600,color:NB.txt,marginBottom:4}}>Minhas subtarefas</h2>
        <p style={{fontSize:13,color:NB.mut}}>Itens de checklist que outras pessoas te atribuíram, de qualquer demanda.</p>
      </div>
      {pendentes.length===0 && feitas.length===0 ? (
        <div style={{background:'#fff',border:'1px dashed '+NB.bd,borderRadius:16,padding:'40px 24px',textAlign:'center'}}>
          <p style={{fontSize:13.5,color:NB.mut}}>Nenhuma subtarefa atribuída a você por enquanto.</p>
        </div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:9,maxWidth:640}}>
          {pendentes.map(it=><Linha key={it.demanda.id+it.id} it={it}/>)}
          {feitas.length>0 && (
            <div style={{marginTop:18}}>
              <div style={{fontSize:11.5,color:NB.mut2,marginBottom:9,textTransform:'uppercase',letterSpacing:'0.05em',fontWeight:600}}>Concluídas ({feitas.length})</div>
              <div style={{display:'flex',flexDirection:'column',gap:9}}>
                {feitas.map(it=><Linha key={it.demanda.id+it.id} it={it}/>)}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function CriarAcessoPortalModal({ embaixador, onClose }) {
  const { criarPortalEmbaixador } = useApp();
  const [portal, setPortal] = useState({ email:'', senha:'', contratoUrl:'', lpUrl:'' });
  const [materiais, setMateriais] = useState([]);
  const [novoMaterial, setNovoMaterial] = useState({ nome:'', url:'' });
  const [err, setErr] = useState('');
  const [salvando, setSalvando] = useState(false);
  const setP = (k,v) => { setPortal(x=>({...x,[k]:v})); setErr(''); };

  const adicionarMaterial = () => {
    if (!novoMaterial.nome.trim() || !novoMaterial.url.trim()) return setErr('Preencha nome e link do material.');
    let url = novoMaterial.url.trim();
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    setMateriais(m => [...m, { nome: novoMaterial.nome.trim(), url }]);
    setNovoMaterial({ nome:'', url:'' }); setErr('');
  };
  const removerMaterial = i => setMateriais(m => m.filter((_,ix)=>ix!==i));

  const salvar = async () => {
    if (!portal.email.trim()) return setErr('Preencha o e-mail de acesso.');
    if (!portal.senha || portal.senha.length<6) return setErr('A senha inicial precisa ter pelo menos 6 caracteres.');
    setSalvando(true);
    const r = await criarPortalEmbaixador({
      email: portal.email.trim(), nome: embaixador.nome, foto: embaixador.foto || '',
      contratoUrl: portal.contratoUrl.trim(), lpUrl: portal.lpUrl.trim(), materiais,
    }, portal.senha);
    setSalvando(false);
    if (!r.ok) { setErr(r.erro); return; }
    onClose();
  };

  return (
    <Modal onClose={onClose} width={460}>
      <div style={{padding:'22px 24px 16px',borderBottom:'1px solid '+NB.bdSoft}}>
        <h2 style={{fontSize:17,fontWeight:600,color:NB.txt}}>Criar acesso ao portal</h2>
        <p style={{fontSize:12.5,color:NB.mut,marginTop:4}}>Pra {embaixador.nome} — o cadastro dela já existe, isso só libera o login.</p>
      </div>
      <div style={{padding:'20px 24px',display:'flex',flexDirection:'column',gap:12,maxHeight:'56vh',overflowY:'auto'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <input type="email" value={portal.email} onChange={e=>setP('email',e.target.value)} placeholder="E-mail de acesso" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
          <input type="text" value={portal.senha} onChange={e=>setP('senha',e.target.value)} placeholder="Senha inicial (mín. 6)" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
        </div>
        <input value={portal.contratoUrl} onChange={e=>setP('contratoUrl',e.target.value)} placeholder="Link do contrato (opcional)" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
        <input value={portal.lpUrl} onChange={e=>setP('lpUrl',e.target.value)} placeholder="Link da LP personalizada (opcional)" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
        <div>
          <div style={{fontSize:11,fontWeight:600,color:NB.mut,marginBottom:7,textTransform:'uppercase',letterSpacing:'0.05em'}}>Materiais pra divulgar</div>
          {materiais.length>0 && (
            <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:9}}>
              {materiais.map((m,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:8,background:NB.col,border:'1px solid '+NB.bd,borderRadius:8,padding:'6px 10px'}}>
                  <span style={{fontSize:12.5,color:NB.txt,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.nome}</span>
                  <button type="button" onClick={()=>removerMaterial(i)} style={{fontSize:11,color:'#B4232A',background:'none',border:'none'}}>Remover</button>
                </div>
              ))}
            </div>
          )}
          <div style={{display:'flex',gap:7}}>
            <input value={novoMaterial.nome} onChange={e=>{setNovoMaterial(v=>({...v,nome:e.target.value})); setErr('');}} placeholder="Nome" style={{...inp,padding:'7px 10px',fontSize:12,flex:1}}/>
            <input value={novoMaterial.url} onChange={e=>{setNovoMaterial(v=>({...v,url:e.target.value})); setErr('');}} placeholder="Link" style={{...inp,padding:'7px 10px',fontSize:12,flex:1}}/>
            <button type="button" onClick={adicionarMaterial} style={{padding:'7px 12px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:11.5,fontWeight:500,color:NB.pink,flexShrink:0}}>+</button>
          </div>
        </div>
        {err && <p style={{fontSize:12.5,color:'#B4232A'}}>{err}</p>}
      </div>
      <div style={{padding:'16px 24px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'flex-end',gap:10}}>
        <button onClick={onClose} style={{padding:'10px 16px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>Cancelar</button>
        <button onClick={salvar} disabled={salvando} style={{padding:'10px 20px',background:NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',opacity:salvando?0.7:1}}>{salvando?'Criando…':'Criar acesso'}</button>
      </div>
    </Modal>
  );
}

function PortalEmbaixadorGestaoView() {
  const { embaixadores, portaisEmbaixador, todosEnviosFotos, removerEnvioFoto } = useApp();
  const [selId, setSelId] = useState(null);
  const [criarAcessoPara, setCriarAcessoPara] = useState(null);
  const [novoEmb, setNovoEmb] = useState(false);
  const normaliza = s => (s||'').trim().toLowerCase();
  const selecionado = portaisEmbaixador.find(p=>p.id===selId) || null;

  /* Todo embaixador cadastrado aparece aqui — com ou sem portal.
     O match é pelo nome porque embaixadores/embaixadoresPortal são
     coleções separadas, sem um id em comum entre elas. */
  const lista = embaixadores.map(e => ({
    embaixador: e,
    portal: portaisEmbaixador.find(p => normaliza(p.nome) === normaliza(e.nome)) || null,
  }));

  if (selecionado) {
    const enviosDela = todosEnviosFotos.filter(f=>f.email===selecionado.email);
    return (
      <div style={{padding:'22px 30px 30px',overflowY:'auto',height:'100%'}}>
        <button onClick={()=>setSelId(null)} style={{display:'flex',alignItems:'center',gap:7,background:'none',border:'none',color:NB.mut,fontSize:12.5,marginBottom:18}}>
          <IArrowL s={13}/> Voltar pra lista
        </button>
        <h2 style={{fontSize:20,fontWeight:600,color:NB.txt,marginBottom:4}}>{selecionado.nome}</h2>
        <p style={{fontSize:13,color:NB.mut,marginBottom:22}}>{selecionado.email} · o que essa conta vê ao entrar no portal</p>
        <div style={{maxWidth:640}}>
          <EmbaixadorPortalConteudo p={selecionado}/>

          <div style={{marginTop:28}}>
            <h3 style={{fontSize:16,fontWeight:600,color:NB.txt,marginBottom:4}}>Fotos que ela mandou ({enviosDela.length})</h3>
            <p style={{fontSize:12.5,color:NB.mut,marginBottom:14}}>Enviadas pelo Portal, pra usar em posts, depoimentos e materiais.</p>
            {enviosDela.length===0 ? (
              <div style={{background:NB.col,border:'1px dashed '+NB.bd,borderRadius:12,padding:20,textAlign:'center'}}>
                <p style={{fontSize:12.5,color:NB.mut2}}>Ainda não mandou nenhuma.</p>
              </div>
            ) : (
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(120px,1fr))',gap:12}}>
                {enviosDela.map(f=>(
                  <div key={f.id} style={{position:'relative'}}>
                    <div style={{aspectRatio:'1/1',borderRadius:12,overflow:'hidden',background:NB.col,border:'1px solid '+NB.bd}}>
                      <img src={f.foto} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                    </div>
                    <a href={f.foto} download={'foto-'+(selecionado.nome||'embaixador').replace(/\s+/g,'-')+'.png'}
                      style={{position:'absolute',top:6,right:6,width:26,height:26,borderRadius:'50%',background:'rgba(255,255,255,0.9)',display:'flex',alignItems:'center',justifyContent:'center',color:NB.navy1}}>
                      <IDown s={13}/>
                    </a>
                    <button onClick={()=>removerEnvioFoto(f.id)} title="Remover"
                      style={{position:'absolute',bottom:6,right:6,width:22,height:22,borderRadius:'50%',background:'rgba(255,255,255,0.9)',border:'none',color:'#B4232A',fontSize:13,lineHeight:1}}>×</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{padding:'22px 30px 30px',overflowY:'auto',height:'100%'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18,flexWrap:'wrap',gap:10}}>
        <span style={{fontSize:13.5,color:NB.mut}}>{embaixadores.length} embaixador(es) cadastrado(s) · {portaisEmbaixador.length} com portal ativo</span>
        <button onClick={()=>setNovoEmb(true)}
          style={{display:'flex',alignItems:'center',gap:7,padding:'9px 15px',background:NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>
          <IPlus s={13}/> Novo embaixador
        </button>
      </div>
      {lista.length===0 ? (
        <div style={{background:'#fff',border:'1px dashed '+NB.bd,borderRadius:16,padding:'40px 24px',textAlign:'center'}}>
          <p style={{fontSize:13.5,color:NB.mut}}>Nenhum embaixador cadastrado ainda.</p>
        </div>
      ) : (
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:14}}>
          {lista.map(({embaixador:e, portal:p}) => (
            <div key={e.id} style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:14,padding:'16px 18px',display:'flex',flexDirection:'column',gap:10}}>
              <button onClick={()=>p && setSelId(p.id)} disabled={!p}
                style={{textAlign:'left',background:'none',border:'none',padding:0,display:'flex',alignItems:'center',gap:12,cursor:p?'pointer':'default'}}>
                <div style={{width:38,height:38,borderRadius:'50%',overflow:'hidden',background:NB.pink,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:600,flexShrink:0}}>
                  {e.foto ? <img src={e.foto} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/> : (e.nome||'').split(/\s+/).filter(Boolean).map(s=>s[0]).slice(0,2).join('').toUpperCase()}
                </div>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:13.5,fontWeight:600,color:NB.txt,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.nome}</div>
                  <div style={{fontSize:11.5,color:NB.mut2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p ? p.email : (e.cargo || 'sem portal ainda')}</div>
                </div>
              </button>
              {p ? (
                <span style={{fontSize:11,fontWeight:600,color:'#0F6E56',background:'#E1F5EE',borderRadius:6,padding:'4px 9px',alignSelf:'flex-start'}}>Portal ativo</span>
              ) : (
                <button onClick={()=>setCriarAcessoPara(e)}
                  style={{fontSize:12,fontWeight:600,color:NB.azul,background:'#EAF3FD',border:'none',borderRadius:8,padding:'8px 12px',alignSelf:'flex-start'}}>
                  Criar acesso ao portal
                </button>
              )}
            </div>
          ))}
        </div>
      )}
      {novoEmb && <EmbaixadorModal onClose={()=>setNovoEmb(false)}/>}
      {criarAcessoPara && <CriarAcessoPortalModal embaixador={criarAcessoPara} onClose={()=>setCriarAcessoPara(null)}/>}
    </div>
  );
}

function VisitorApp() {
  const { user, isTeamMember, preferirCentral, setPreferirCentral, logout } = useApp();
  const vendoComoTime = isTeamMember && preferirCentral;

  return (
    <div style={{height:'100vh',width:'100%',overflow:'hidden'}}>
      <InfoCentralView
        onLogoClick={logout}
        topBanner={
          vendoComoTime ? (
            <div style={{background:'#EAF3FD',borderBottom:'1px solid #BFDDF7',padding:'10px 28px',fontSize:12.5,color:NB.navy1,display:'flex',alignItems:'center',justifyContent:'space-between',gap:9}}>
              <span style={{display:'flex',alignItems:'center',gap:9}}><IAlert s={14}/> Você está vendo a Central do jeito que qualquer colaborador vê.</span>
              <button onClick={()=>setPreferirCentral(false)} style={{background:'none',border:'none',color:NB.azul,fontWeight:600,fontSize:12.5}}>Ir pra Gestão</button>
            </div>
          ) : (
            <div style={{background:'#EAF3FD',borderBottom:'1px solid #BFDDF7',padding:'10px 28px',fontSize:12.5,color:NB.navy1,display:'flex',alignItems:'center',gap:9}}>
              <IAlert s={14}/> Essa conta não tem acesso à Gestão do Marketing — aqui vai o que dá pra ver.
            </div>
          )
        }
        headerRight={
          <React.Fragment>
            <a href="/solicitar.html" target="_blank" rel="noopener noreferrer"
              style={{display:'flex',alignItems:'center',gap:7,padding:'9px 16px',background:NB.navy1,borderRadius:20,color:'#fff',fontSize:12.5,fontWeight:600,textDecoration:'none'}}>
              <IPlus s={13}/> Solicitar demanda
            </a>
            <span title={user.name+' · '+user.email}><Avatar member={user} size={30} ring={false}/></span>
            <button onClick={logout} title="Sair" style={{padding:8,background:'#fff',border:'1px solid '+NB.bd,borderRadius:'50%',color:NB.mut,display:'flex'}}>
              <ILogout s={14}/>
            </button>
          </React.Fragment>
        }/>
    </div>
  );
}

function AppContent() {
  const { view, user, isTeamMember, isEmbaixador, portalCarregado, authReady, preferirCentral, setDragging, editStages, setEditStages, dbReady, dbErro, previewMember, setPreviewMember } = useApp();
  const [entrada, setEntrada] = useState('escolha'); // 'escolha' | 'embaixador'
  if (!authReady) return <Splash/>;
  if (!user) {
    if (entrada==='embaixador') return <EmbaixadorLoginPage onVoltar={()=>setEntrada('escolha')}/>;
    return <EntryChooser onEscolherEmbaixador={()=>setEntrada('embaixador')}/>;
  }
  if (!isTeamMember || preferirCentral) {
    if (!isTeamMember && !portalCarregado) return <Splash/>;
    if (isEmbaixador) return <EmbaixadorPortalView/>;
    return <VisitorApp/>;
  }
  return (
    <div style={{display:'flex',height:'100vh',width:'100%',overflow:'hidden',background:NB.bg}}
      onDragOver={e=>e.preventDefault()}
      onDrop={()=>setDragging(null)}>
      <Sidebar/>
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
        <ContentHeader/>
        {previewMember && (
          <div style={{background:'#EAF3FD',borderBottom:'1px solid #BBD8F5',padding:'9px 28px',fontSize:12.5,color:'#0B4F92',display:'flex',alignItems:'center',gap:9,flexShrink:0,flexWrap:'wrap'}}>
            <IEye s={14}/>
            <span>Visualizando como <strong style={{fontWeight:600}}>{previewMember.name}</strong> — suas ações continuam sendo registradas como {user.name}.</span>
            <button onClick={()=>setPreviewMember(null)}
              style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:6,padding:'4px 11px',background:'#fff',border:'1px solid #BBD8F5',borderRadius:7,fontSize:12,fontWeight:600,color:NB.azul,whiteSpace:'nowrap'}}>
              <IEyeOff s={12}/> Sair da pré-visualização
            </button>
          </div>
        )}
        {dbErro && (
          <div style={{background:'#FEF2F2',borderBottom:'1px solid #FECACA',padding:'11px 28px',fontSize:13,color:'#B4232A',display:'flex',alignItems:'center',gap:9,flexShrink:0}}>
            <IAlert s={15}/> {dbErro}
          </div>
        )}
        <main style={{flex:1,overflow:'hidden',minHeight:0}}>
          {!dbReady && !dbErro ? (
            <div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:13,color:NB.mut}}>
              <div style={{width:32,height:32,border:'2.5px solid '+NB.bd,borderTopColor:NB.azul,borderRadius:'50%',animation:'nb-spin 0.8s linear infinite'}}/>
              <span style={{fontSize:13.5}}>Carregando as demandas do time…</span>
            </div>
          ) : (
            <React.Fragment>
              {view==='kanban'     && <KanbanBoard/>}
              {view==='slack'      && <SlackFeed/>}
              {view==='arquivadas' && <ArchivedView/>}
              {view==='variacoes'  && <VariationsView/>}
              {view==='publicacoes'&& <PublishQueueView/>}
              {view==='gestao'     && <GestaoView/>}
              {view==='central'    && <InfoCentralView/>}
              {view==='campanhas'  && <CampanhasManagerView/>}
              {view==='portalEmbaixador' && <PortalEmbaixadorGestaoView/>}
              {view==='minhasSubtarefas' && <MinhasSubtarefasView/>}
              {view==='resumo' && <ResumoView/>}
            </React.Fragment>
          )}
        </main>
      </div>
      <CardModal/>
      <NewModal/>
      <PacoteModal/>
      <NotifyModal/>
      <ProfileModal/>
      {editStages && <StageEditorModal areaName={editStages} onClose={()=>setEditStages(null)}/>}
    </div>
  );
}

function App() { return <Provider><AppContent/></Provider>; }

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

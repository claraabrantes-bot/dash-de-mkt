const INIT_DEMANDS = [
  { id:'d1', code:'DEM-101', title:'Carousel BPO Financeiro na Prática', area:'Social', priority:'Alta', stageId:'soc-2', assignees:['CA','RO'], deadline:dStr(2), description:'Carousel para lançamento do curso BPO Financeiro com Barbara Maciel. Foco em contadores que já usam Nibo.', requester:'Clara Abrantes' },
  { id:'d2', code:'DEM-102', title:'Banner Radar e-CAC — Reforma Tributária', area:'Design', priority:'Urgente', stageId:'des-3', assignees:['MB'], deadline:dStr(0), description:'Banner destacando a funcionalidade do Radar e-CAC no contexto da Reforma Tributária (IBS/CBS).', requester:'Mariana Araújo' },
  { id:'d3', code:'DEM-103', title:'Campanha Open Finance — Meta Ads', area:'Mídia Paga', priority:'Média', stageId:'mid-2', assignees:['VI'], deadline:dStr(5), description:'Campanha de conversão no Meta Ads para o Conciliador Open Finance. Público: empresários PME.', requester:'Vivian Santos' },
  { id:'d4', code:'DEM-104', title:'Webinar Barbara Maciel — LP + e-mail sequence', area:'Social', priority:'Alta', stageId:'soc-4', assignees:['CA'], deadline:dStr(8), description:'Landing page HubSpot e sequência de 3 e-mails para webinar de 20/08 sobre onboarding de clientes.', requester:'Clara Abrantes' },
  { id:'d5', code:'DEM-105', title:'Post LinkedIn — Split Payment IBS/CBS', area:'Social', priority:'Média', stageId:'soc-1', assignees:['RO'], deadline:dStr(10), description:'Post educativo sobre split payment na Reforma Tributária para público contador.', requester:'Roberta Rocha' },
  { id:'d6', code:'DEM-106', title:'Automação intake de arte — Slack + n8n', area:'RevOps', priority:'Alta', stageId:'rev-3', assignees:['CL','JE'], deadline:dStr(3), description:'Formulário de intake de demandas de arte integrado ao Slack com triagem automática via n8n.', requester:'Clara Abrantes' },
  { id:'d7', code:'DEM-107', title:'Ebook Emissão NFS-e para contadores', area:'Design', priority:'Baixa', stageId:'des-1', assignees:['MK'], deadline:dStr(15), description:'Ebook sobre o Emissor NFS-e do Nibo — guia prático para contadores configurarem emissão.', requester:'Roberta Rocha' },
  { id:'d8', code:'DEM-108', title:'Feature Brief App Personalizado', area:'Produto', priority:'Média', stageId:'pro-2', assignees:['RO'], deadline:dStr(12), description:'Documentação de funcionalidades do App Personalizado para página de produto do site.', requester:'Roberta Rocha' },
];

const t = (d) => new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

const INIT_SLACK = [
  { id:'s1', code:'DEM-101', area:'Social', time:'09:14', stagePath:'Solicitado → Em Redação', action:'Briefing de copy ativado — equipe Social notificada', next:'Design de Arte → @Millena Barros', type:'move' },
  { id:'s2', code:'DEM-104', area:'Social', time:'10:33', stagePath:'Design de Arte → Aprovação', action:'@Mariana Araújo notificada para revisão e aprovação', next:'Aprovado → Agendamento | Ajuste → volta para Design', type:'approval' },
  { id:'s3', code:'DEM-106', area:'RevOps', time:'11:05', stagePath:'Em Análise → Implementação', action:'Automação configurada no n8n + testes de integração ativados', next:'Validação → @Mariana Araújo', type:'move' },
];

/* =========== CONTEXT =========== */
const Ctx = createContext(null);

function Provider({ children }) {
  /* ---------- dados compartilhados (Firestore) ---------- */
  const [demands, setDemands] = useState([]);
  const [pedidos, setPedidos] = useState([]);
  const [posts, setPosts] = useState([]);
  const [campanhasPublicas, setCampanhasPublicas] = useState([]);
  const [campanhasGestao, setCampanhasGestao] = useState([]);
  const [redesSociais, setRedesSociais] = useState({ instagramHandle:'', posts:[] });
  const [arquivosPublicos, setArquivosPublicos] = useState([]);
  const [arquivosGestao, setArquivosGestao] = useState([]);
  const [embaixadores, setEmbaixadores] = useState([]);
  const [pecas, setPecas] = useState([]);
  const [slack, setSlack]     = useState([]);
  const [pipes, setPipes]     = useState(DEFAULT_PIPELINES);
  const [dbReady, setDbReady] = useState(false);
  const [dbErro, setDbErro]   = useState('');
  const dbRef    = useRef(null);
  const publicDbRef = useRef(null);
  const [dbErroPublico, setDbErroPublico] = useState('');
  const pipesRef = useRef(pipes);
  pipesRef.current = pipes;

  /* ---------- dados só deste navegador ---------- */
  const [photos, setPhotos] = useState(() => {
    try { const s=localStorage.getItem('nibo_photos_v1'); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });
  const [googlePhotos, setGooglePhotos] = useState(() => {
    try { const s=localStorage.getItem('nibo_gphotos_v1'); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });
  const [profiles, setProfiles] = useState(() => {
    try { const s=localStorage.getItem('nibo_profiles_v1'); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });
  /* arquivos ficam locais: são grandes demais para um documento do Firestore */
  const [attach, setAttach] = useState(() => {
    try { const s=localStorage.getItem('nibo_attach_v1'); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });
  const [storageWarn, setStorageWarn] = useState('');
  const MAX_FILE = 700 * 1024;   /* um documento do Firestore aceita 1 MB */

  /* ---------- autenticação ---------- */
  const [fbUser, setFbUser]       = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [authError, setAuthError] = useState('');

  /* ---------- interface ---------- */
  const [view, setView]     = useState('kanban');
  const [layout, setLayout] = useState('board');
  const [area, setArea]     = useState('Todas');
  const abriuRef = useRef(false);
  const [query, setQuery]   = useState('');
  const [priFilter, setPriFilter] = useState([]);
  const [reqFilter, setReqFilter] = useState([]);
  const [modal, setModal]   = useState(null);
  const [newOpen, setNewOpen] = useState(false);
  const [notifyPending, setNotifyPending] = useState(null);
  const [profileOpen, setProfileOpen] = useState(false);
  const [editStages, setEditStages] = useState(null);
  const [dragging, setDragging] = useState(null);
  /* "Ver como" — pré-visualiza a interface de outra pessoa (ex: a aprovadora)
     sem trocar de conta. Toda ação continua sendo registrada com o usuário real. */
  const [previewMember, setPreviewMember] = useState(null);

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged(u => {
      if (!u) { setFbUser(null); setAuthReady(true); return; }
      const mail = (u.email || '').toLowerCase();
      if (!mail.endsWith(NIBO_DOMAIN)) {
        setAuthError('Acesso restrito a contas ' + NIBO_DOMAIN + '. Você entrou com ' + mail + '.');
        firebase.auth().signOut();
        return;
      }
      /* Qualquer conta do Nibo entra — quem não é do marketing só vê a
         Central de Informações (decidido lá embaixo em AppContent). */
      setAuthError('');
      const found = ACTIVE_TEAM.find(m => m.email === mail);
      if (found && u.photoURL) setGooglePhotos(p => p[found.id]===u.photoURL ? p : {...p, [found.id]:u.photoURL});
      setFbUser({ email: mail, photoURL: u.photoURL || null, displayName: u.displayName || '' });
      setAuthReady(true);
    });
    return unsub;
  }, []);

  const baseUser = fbUser ? ACTIVE_TEAM.find(m => m.email === fbUser.email) : null;
  const isTeamMember = !!baseUser;
  const user = fbUser
    ? baseUser
      ? { ...baseUser, googlePhoto: fbUser.photoURL, ...(profiles[baseUser.id] || {}) }
      : { id:'visitante', name: fbUser.displayName || fbUser.email.split('@')[0], email: fbUser.email,
          initials: (fbUser.displayName||fbUser.email).split(/\s+/).filter(Boolean).map(s=>s[0]).slice(0,2).join('').toUpperCase() || 'VI',
          color: NB.mut2, area: null, isApprover:false, canPublishCampaigns:false, isVisitor:true,
          googlePhoto: fbUser.photoURL }
    : null;

  /* Central de Informações é pública: essas duas coleções carregam sempre,
     com ou sem login — as regras do Firestore liberam leitura sem exigir conta. */
  useEffect(() => {
    let db;
    try { db = firebase.firestore(); publicDbRef.current = db; }
    catch (e) { setDbErroPublico('Não foi possível abrir o banco: ' + e.message); return; }

    const erro = e => setDbErroPublico(
      e && e.code === 'permission-denied'
        ? 'Sem permissão de leitura pública. Publique as regras do Firestore no console do Firebase.'
        : 'Falha de conexão: ' + (e && e.message ? e.message : 'desconhecida')
    );

    const uc = db.collection('campanhas').where('status','==','publicada').onSnapshot(snap => {
      setCampanhasPublicas(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    }, erro);
    const up = db.collection('pecas').onSnapshot(snap => {
      setPecas(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    }, erro);
    const ur = db.collection('redesSociais').doc('principal').onSnapshot(doc => {
      setRedesSociais(doc.exists ? doc.data() : { instagramHandle:'', posts:[] });
    }, erro);
    const ua = db.collection('arquivos').where('categoria','!=','restrito').onSnapshot(snap => {
      setArquivosPublicos(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    }, erro);
    const ue = db.collection('embaixadores').onSnapshot(snap => {
      setEmbaixadores(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    }, erro);

    return () => { uc(); up(); ul(); ur(); ua(); ue(); };
  }, []);

  /* Escutas do que é interno só depois do login — as regras exigem usuária autenticada. */
  useEffect(() => {
    if (!fbUser) { dbRef.current = null; setDbReady(false); return; }
    let db;
    try { db = firebase.firestore(); dbRef.current = db; }
    catch (e) { setDbErro('Não foi possível abrir o banco: ' + e.message); return; }

    const erro = e => setDbErro(
      e && e.code === 'permission-denied'
        ? 'Sem permissão de acesso ao banco. Publique as regras do Firestore no console do Firebase.'
        : 'Falha de conexão com o banco: ' + (e && e.message ? e.message : 'desconhecida')
    );

    const u1 = db.collection('demandas').onSnapshot(snap => {
      setDemands(snap.docs.map(d => ({ id:d.id, ...d.data() })));
      setDbReady(true); setDbErro('');
    }, erro);

    const u2 = db.collection('feed').orderBy('ts','desc').limit(150).onSnapshot(snap => {
      setSlack(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    }, erro);

    const u4 = db.collection('solicitacoes').onSnapshot(snap => {
      setPedidos(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    }, erro);

    const u5 = db.collection('posts').onSnapshot(snap => {
      setPosts(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    }, erro);

    const u3 = db.collection('config').doc('pipes').onSnapshot(doc => {
      const d = doc.exists ? doc.data() : null;
      setPipes(d && d.data ? d.data : DEFAULT_PIPELINES);
    }, erro);

    /* Versões completas (todos os status/categorias) pra quem gerencia — só existem
       logada, porque só aí a regra libera ler sem o filtro que a lista pública exige. */
    const u6 = db.collection('campanhas').onSnapshot(snap => {
      setCampanhasGestao(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    }, erro);
    const u7 = db.collection('arquivos').onSnapshot(snap => {
      setArquivosGestao(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    }, erro);

    return () => { u1(); u2(); u3(); u4(); u5(); u6(); u7(); };
  }, [fbUser]);

  /* Logada, a gestão precisa ver tudo (rascunho + publicada, restrito + não).
     Sem login, só a fatia pública, que já veio pré-filtrada do Firestore. */
  const campanhas = fbUser ? campanhasGestao : campanhasPublicas;
  const arquivos  = fbUser ? arquivosGestao  : arquivosPublicos;

  /* Ao entrar, cai direto no próprio setor. Quem aprova cai na fila de Gestão. */
  useEffect(() => {
    if (abriuRef.current || !baseUser) return;
    abriuRef.current = true;
    if (pipesRef.current[baseUser.area]) setArea(baseUser.area);
    else if (baseUser.isApprover) setView('gestao');
  }, [baseUser]);

  useEffect(() => { try { localStorage.setItem('nibo_photos_v1', JSON.stringify(photos)); } catch {} }, [photos]);
  useEffect(() => { try { localStorage.setItem('nibo_gphotos_v1', JSON.stringify(googlePhotos)); } catch {} }, [googlePhotos]);
  useEffect(() => { try { localStorage.setItem('nibo_profiles_v1', JSON.stringify(profiles)); } catch {} }, [profiles]);
  useEffect(() => {
    try { localStorage.setItem('nibo_attach_v1', JSON.stringify(attach)); setStorageWarn(''); }

  const logout = useCallback(() => {
    setProfileOpen(false); setModal(null); setNewOpen(false); setNotifyPending(null); setEditStages(null); setPreviewMember(null);
    firebase.auth().signOut();

  const mentionNames = (inits) => inits.map(i => { const m=TEAM.find(t=>t.initials===i); return '@'+(m?m.name:i); }).join(' ');

    }).catch(()=>{});

  const patch = useCallback((id, campos) => {
    const db = dbRef.current; if (!db) return Promise.resolve();
    return db.collection('demandas').doc(id).update(campos).catch(e=>setDbErro('Não foi possível salvar: '+e.message));
  }, []);

  const addDemand = useCallback((data) => {
    const db = dbRef.current; if (!db) return;
    const nums = (window.__nbDem || []).map(d => parseInt(String(d.code).replace(/\D/g,''),10)).filter(n=>!isNaN(n));
    const code = 'DEM-' + ((nums.length ? Math.max(...nums) : 100) + 1);
    const nd = { ...data, code, stageId: pipesRef.current[data.area][0].id, createdAt: new Date().toISOString(), comments: [], links: [] };
    db.collection('demandas').add(nd).then(ref => {
      const who = data.assignees && data.assignees.length ? mentionNames(data.assignees) : 'equipe de '+data.area;
      feed({ code, area:data.area }, 'Nova demanda criada',
        'Solicitação registrada por '+data.requester+' — destinada a '+who,
        'Demanda solicitada no Slack para '+who, 'new');

  const moveStage = useCallback((demId, newStageId, notifyTargets) => {
    const d = (window.__nbDem || []).find(x => x.id === demId); if (!d) return;
    const stages   = pipesRef.current[d.area] || [];
    const oldStage = stages.find(s=>s.id===d.stageId);
    const newStage = stages.find(s=>s.id===newStageId);
    let assignees = d.assignees || [];
    if (newStage && newStage.isApproval && !assignees.includes('MA')) assignees = [...assignees, 'MA'];
    patch(demId, { stageId:newStageId, assignees });

    const auto = AUTO[d.area] && AUTO[d.area][newStageId];
    let action = auto ? auto.action : '"'+d.title+'" avançou para '+(newStage?newStage.name:'nova etapa');
    const passo = auto ? auto.next
      : (newStage && newStage.isApproval) ? 'Aguardando aprovação de @Mariana Araújo'
      : (newStage && newStage.isDone)     ? 'Etapa final de '+d.area
      : 'Equipe de '+d.area+' segue com a demanda';
    if (notifyTargets && notifyTargets.length) action += ' — ' + mentionNames(notifyTargets) + ' notificados no Slack';

    const stages = pipesRef.current[newArea] || [];
    const target = stages.find(s => s.id === newStageId) || stages[0];
    if (!target) return;
    let assignees = d.assignees || [];
    if (target.isApproval && !assignees.includes('MA')) assignees = [...assignees, 'MA'];
    patch(demId, { area:newArea, stageId:target.id, assignees });
    feed({ code:d.code, area:newArea }, d.area + ' → ' + newArea,
      '"' + d.title + '" mudou de área e entrou em ' + target.name,
      'Equipe de ' + newArea + ' assume a partir daqui',
      target.isApproval ? 'approval' : 'new');
  }, [patch, feed]);

  const setAssignees = useCallback((demId, list) => {
    const d = (window.__nbDem || []).find(x => x.id === demId); if (!d) return;
    const antes = d.assignees || [];
    const added   = list.filter(i => !antes.includes(i));
    const removed = antes.filter(i => !list.includes(i));
    patch(demId, { assignees:list });
    if (added.length || removed.length) {
      const partes = [];
      if (added.length)   partes.push(mentionNames(added)+' '+(added.length>1?'entraram':'entrou')+' na demanda');
      if (removed.length) partes.push(mentionNames(removed)+' '+(removed.length>1?'saíram':'saiu'));

  const delDemand = useCallback((id) => {

  const addComment = useCallback((demand, text, by) => {

    const atuais = (demand.comments || []);

  const removeComment = useCallback((demandId, cid) => {

  /* Tudo vai para a nuvem: links no documento, arquivos no Storage. */
  const anexosDe = (d) => [ ...((d && d.anexos) || []), ...((d && d.links) || []) ];

  /* Busca o conteúdo de um anexo só quando o card é aberto. */
  const carregarAnexo = useCallback((anexoId) => {

  const addAttachment = useCallback((demand, item) => {

  /* Cada arquivo vira um documento próprio na coleção anexos, para que

  const uploadFile = useCallback((demand, file, onProgress) => {
    const db = dbRef.current;
    if (!db) return Promise.reject(new Error('Sem conexão com o banco.'));
    if (file.size > MAX_FILE) return Promise.reject(new Error(
      '"'+file.name+'" tem '+fmtBytes(file.size)+' e o limite é '+fmtBytes(MAX_FILE)+'. Suba no Drive ou Canva e anexe o link.'));
    return new Promise((resolve, reject) => {
      const rd = new FileReader();
      rd.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*70)); };
      rd.onerror = () => reject(new Error('Não consegui ler "'+file.name+'".'));
      rd.onload = () => {
        onProgress && onProgress(80);
        db.collection('anexos').add({
          demandaId: demand.id, name: file.name, size: file.size,
          mime: file.type || 'application/octet-stream', data: rd.result, at: new Date().toISOString(),
        }).then(ref => {
          onProgress && onProgress(100);
          resolve({ kind:'file', name:file.name, size:file.size, mime:file.type, anexoId: ref.id });
        }).catch(e => reject(new Error(
          e.code === 'permission-denied'
            ? 'Sem permissão para gravar anexos. Republique as regras do Firestore.'

      rd.readAsDataURL(file);

    }).then(ref => {
      db.collection('demandas').doc(demand.id).update({ campanhaId: ref.id }).catch(()=>{});

  const removeEmbaixador = useCallback((id) => {
    const db = dbRef.current; if (!db) return;

  const comments = {};
  demands.forEach(d => { comments[d.id] = d.comments || []; });

  const archived = demands.filter(d => d.archivedAt)
                          .sort((a,b) => (a.archivedAt < b.archivedAt ? 1 : -1));

  const filtered = active.filter(d => {

    if (reqFilter.length && !reqFilter.includes(d.requester)) return false;

    return true;

  window.__nbDem = demands;

  return <Ctx.Provider value={{ demands, active, archived, filtered, slack, user, isTeamMember, authReady, authError, setAuthError, dbReady, dbErro, dbErroPublico, seed, pedidos, aceitarPedido, recusarPedido, posts, addPost, updatePost, deletePost, campanhas, updateCampanha, publicarCampanha, despublicarCampanha, deleteCampanha, enviarCampanhaDeDemanda, pecas, addPeca, removePeca, redesSociais, salvarRedesSociais, arquivos, addArquivo, removeArquivo, embaixadores, addEmbaixador, removeEmbaixador, view, setView, layout, setLayout, area, setArea, query, setQuery, priFilter, setPriFilter, reqFilter, setReqFilter, selDemand, setModal, newOpen, setNewOpen, notifyPending, setNotifyPending, profileOpen, setProfileOpen, editStages, setEditStages, dragging, setDragging, previewMember, setPreviewMember, photos, googlePhotos, profiles, pipes, salvarPipes, attach, comments, storageWarn, MAX_FILE, addAttachment, uploadFile, migrarLocal, carregarAnexo, removeAttachment, addComment, removeComment, logout, savePhoto, removePhoto, saveProfile, addDemand, moveStage, moveArea, setAssignees, updateDemand, archiveDemand, restoreDemand, delDemand }}>{children}</Ctx.Provider>;

const useApp = () => useContext(Ctx);

function useMember(initials) {
  const { profiles } = useApp();
  const base = TEAM.find(m=>m.initials===initials);
  return base ? { ...base, ...(profiles[base.id]||{}) } : null;
}

/* =========== UTILS =========== */
function getSla(dl) {
  if (!dl) return null;
  const diff = Math.ceil((new Date(dl)-new Date())/86400000);
  if (diff < 0) return { label:'Atrasado '+Math.abs(diff)+'d', type:'danger' };
  if (diff <= 2) return { label:'Vence em '+diff+'d', type:'warn' };
  return { label:diff+'d', type:'ok' };
}
function fmtDate(s) { if(!s) return ''; const [,m,d]=s.split('-'); return d+'/'+m; }

/* =========== ICONS =========== */
const sw = { fill:'none', stroke:'currentColor', strokeWidth:1.8, strokeLinecap:'round', strokeLinejoin:'round' };

function getPostUrgency(iso, status) {
  if (status === 'publicado') return { label:'Publicado', type:'done' };
  if (!iso) return null;
  const diffH = (new Date(iso) - new Date()) / 3600000;
  if (diffH < 0)  return { label:'Atrasado', type:'danger' };
  if (diffH < 24) return { label:'Hoje',     type:'warn' };
  return { label:'Em '+Math.ceil(diffH/24)+'d', type:'ok' };
}

function NiboMark({ size=42, radius=12, bg=NB.azul, color='#fff' }) {
  return (
    <div style={{width:size,height:size,borderRadius:radius,background:bg,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
      <NiboSymbol size={Math.round(size*0.72)} color={color}/>

}

/* =========== AVATAR =========== */
function Avatar({ member, size=32, ring=true, style, src }) {
  const { photos, googlePhotos } = useApp();
  /* prioridade: foto enviada no perfil > foto do Google > iniciais */
  const photo = src !== undefined ? src
    : (member && (photos[member.id] || googlePhotos[member.id] || member.googlePhoto));
  const clr = (member && member.color) || NB.azul;
  const base = { width:size, height:size, borderRadius:'50%', flexShrink:0, border:'2px solid #fff', boxShadow: ring ? '0 0 0 1.5px '+clr : 'none', ...style };
  if (photo) return <img src={photo} alt={member.name} title={member.name} style={{...base, objectFit:'cover'}}/>;
  return (
    <div title={member?member.name:''} style={{...base, background:clr, color:'#fff', fontSize:Math.round(size*0.36), fontWeight:600, display:'flex', alignItems:'center', justifyContent:'center', letterSpacing:'0.02em'}}>
      {member ? member.initials : '?'}
    </div>
  );
}

function NavItem({ label, Icon, iconColor, count, active, onClick, indent }) {
  return (
    <button onClick={onClick}
      style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,
        padding: indent ? '9px 12px 9px 14px' : '10px 12px',
        borderRadius:10,border:'none',marginLeft:indent?18:0,width:indent?'calc(100% - 18px)':'100%',
        borderLeft:'3px solid '+(active?NB.azul:'transparent'),
        background:active?'#EAF3FD':'transparent',transition:'background 0.12s'}}
      onMouseEnter={e=>{ if(!active) e.currentTarget.style.background=NB.col; }}
      onMouseLeave={e=>{ if(!active) e.currentTarget.style.background='transparent'; }}>
      <span style={{display:'flex',alignItems:'center',gap:11,minWidth:0}}>
        <span style={{color:active?iconColor:iconColor,opacity:active?1:0.85,display:'flex',flexShrink:0}}><Icon s={indent?15:17}/></span>
        <span style={{color:active?NB.txt:'#3D4B63',fontSize:indent?13:13.5,fontWeight:active?600:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{label}</span>
      </span>
      {count !== undefined && (
        <span style={{color:active?NB.azul:NB.mut2,fontSize:12,fontWeight:600,flexShrink:0}}>{count}</span>
      )}
    </button>
  );
}

function CardAvatar({ initials, offset }) {
  const mb = useMember(initials);
  return <Avatar member={mb} size={28} style={{marginLeft:offset>0?-9:0,zIndex:10-offset}}/>;
}

function DemandCard({ demand }) {
  const { setModal, dragging, setDragging, attach, comments, pipes, user, previewMember, moveStage, setNotifyPending, addComment } = useApp();
  const sla = getSla(demand.deadline);
  const ps  = PRI_STL[demand.priority] || PRI_STL.Baixa;
  const isDragging = dragging && dragging.id === demand.id;
  const nA = (attach[demand.id]||[]).length;
  const nC = (comments[demand.id]||[]).length;

  const stages = pipes[demand.area] || [];
  const idx    = stages.findIndex(s => s.id === demand.stageId);
  const stage  = stages[idx];
  const prox   = stages[idx+1];
  const antes  = stages[idx-1];
  const podeDecidir = !!(stage && stage.isApproval && (previewMember ? previewMember.isApprover : user.isApprover));

  const [ajustando, setAjustando] = useState(false);
  const [motivo, setMotivo] = useState('');

  const aprovar = e => {
    e.stopPropagation();
    if (!prox) return;
    if (demand.area === 'Design' && prox.isDone) setNotifyPending({ demandId:demand.id, stageId:prox.id, demandTitle:demand.title });
    else moveStage(demand.id, prox.id);
  };
  const confirmarAjuste = e => {
    e.stopPropagation();
    if (!antes) return;
    if (motivo.trim()) addComment(demand, 'Ajuste solicitado: ' + motivo.trim(), user.initials);
    moveStage(demand.id, antes.id);
    setAjustando(false); setMotivo('');
  };

  return (
    <div
      draggable
      onDragStart={e=>{
        setDragging(demand);
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', demand.id); } catch(err) {}
      }}
      onDragEnd={()=>setDragging(null)}
      onClick={()=>setModal(demand.id)}
      style={{background:'#fff',borderRadius:11,border:'1px solid '+NB.bd,padding:'14px 15px 13px',cursor:isDragging?'grabbing':'grab',transition:'box-shadow 0.14s, border-color 0.14s, transform 0.14s, opacity 0.14s',marginBottom:10,opacity:isDragging?0.4:1}}
      onMouseEnter={e=>{ if(!dragging){ e.currentTarget.style.boxShadow='0 4px 16px rgba(11,42,92,0.09)'; e.currentTarget.style.borderColor='#CFDCF0'; e.currentTarget.style.transform='translateY(-1px)'; } }}
      onMouseLeave={e=>{e.currentTarget.style.boxShadow='none'; e.currentTarget.style.borderColor=NB.bd; e.currentTarget.style.transform='none';}}>

      <p style={{fontSize:14,fontWeight:500,color:NB.txt,lineHeight:1.45,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden',marginBottom:13}}>
        {demand.title}
      </p>

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
        <div style={{display:'flex',alignItems:'center',gap:9,minWidth:0}}>
          {sla && (sla.type==='ok'
            ? <span style={{display:'flex',alignItems:'center',gap:6,fontSize:12.5,color:NB.mut}}><ICal/> {sla.label}</span>
            : <span style={{fontSize:12,fontWeight:500,padding:'4px 9px',borderRadius:6,
                background: sla.type==='danger' ? '#FEECEC' : '#FFF6DE',
                color:      sla.type==='danger' ? '#B4232A' : '#8A6206'}}>{sla.label}</span>
          )}
          {nA>0 && <span title={nA+' anexo(s)'} style={{display:'flex',alignItems:'center',gap:3,fontSize:12,color:NB.mut2}}><IClip s={13}/>{nA}</span>}
          {nC>0 && <span title={nC+' comentário(s)'} style={{display:'flex',alignItems:'center',gap:3,fontSize:12,color:NB.mut2}}><IChatBox s={13}/>{nC}</span>}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:9,flexShrink:0}}>
          <span title={'Prioridade '+demand.priority} style={{width:7,height:7,borderRadius:2,background:ps.bdr,flexShrink:0}}/>
          <div style={{display:'flex'}}>
            {demand.assignees.slice(0,3).map((init,i)=>(
              <CardAvatar key={init+i} initials={init} offset={i}/>
            ))}
          </div>
        </div>
      </div>

      {podeDecidir && (
        ajustando ? (
          <div onClick={e=>e.stopPropagation()} style={{marginTop:12,paddingTop:12,borderTop:'1px solid '+NB.bdSoft}}>
            <textarea value={motivo} onChange={e=>setMotivo(e.target.value)} rows={2} autoFocus
              placeholder="O que precisa mudar (opcional)"
              draggable={false}
              style={{...inp,padding:'8px 10px',fontSize:12.5,resize:'vertical',marginBottom:8}}/>
            <div style={{display:'flex',gap:7}}>
              <button draggable={false} onClick={e=>{e.stopPropagation(); setAjustando(false); setMotivo('');}}
                style={{flex:1,padding:'7px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:7,fontSize:12,fontWeight:500,color:NB.mut}}>Cancelar</button>
              <button draggable={false} onClick={confirmarAjuste}
                style={{flex:1,padding:'7px',background:'#B4232A',border:'none',borderRadius:7,fontSize:12,fontWeight:500,color:'#fff'}}>Confirmar</button>
            </div>
          </div>
        ) : (
          <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid '+NB.bdSoft,display:'flex',gap:7}}>
            <button draggable={false} onClick={aprovar}
              style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:6,padding:'8px',background:'#0F6E56',border:'none',borderRadius:8,fontSize:12.5,fontWeight:500,color:'#fff'}}>
              <ICheck s={12}/> Aprovar
            </button>
            <button draggable={false} onClick={e=>{e.stopPropagation(); setAjustando(true);}}
              style={{flex:1,padding:'8px',background:'#FFF6DE',border:'none',borderRadius:8,fontSize:12.5,fontWeight:500,color:'#8A6206'}}>
              Revisar
            </button>
          </div>
        )
      )}
    </div>
  );
}

/* Etapas são editáveis por pipeline, então a cor/ícone nunca depende do
   nome — só da posição e das flags isApproval/isDone, que são estáveis. */
const STAGE_CYCLE = [
  { bg:'#EAF3FD', head:'#DCEAFB', bd:'#BFDDF7', ic:NB.azul,  Icon: IFile  },
  { bg:'#F1ECFE', head:'#E7DFFC', bd:'#DDD0FB', ic:NB.roxo,  Icon: IPen   },
  { bg:'#FFEAF6', head:'#FDDCEF', bd:'#FAC7E3', ic:NB.pink,  Icon: IBrush },
];
const STAGE_APPROVAL = { bg:'#FFF6DE', head:'#FBEFC7', bd:'#F3D98A', ic:'#8A6206', Icon: ICheck };
const STAGE_DONE     = { bg:'#ECFDF5', head:'#D8F5E6', bd:'#A7E8CC', ic:'#0F6E56', Icon: IRocket };

function stageVisuals(stages) {
  let regular = 0;
  return stages.map(st => {
    if (st.isApproval) return { st, v: STAGE_APPROVAL };
    if (st.isDone)     return { st, v: STAGE_DONE };
    const v = STAGE_CYCLE[regular % STAGE_CYCLE.length];
    regular += 1;
    return { st, v };
  });
}

function StageColumn({ stage, cards, compact, areaName, visual }) {
  const { dragging, setDragging, moveStage, moveArea, setNotifyPending } = useApp();
  const [over, setOver] = useState(false);
  const v = visual || STAGE_CYCLE[0];
  const Icon = v.Icon;

  const otherArea = !!dragging && dragging.area !== areaName;
  /* Aceita qualquer etapa do próprio pipeline, ou qualquer etapa de outro (troca de área) */
  const canDrop = !!dragging && (otherArea || dragging.stageId !== stage.id);

  const handleDrop = e => {
    e.preventDefault();
    setOver(false);
    if (!canDrop) return;
    const d = dragging;
    setDragging(null);
    if (d.area !== areaName) { moveArea(d.id, areaName, stage.id); return; }
    if (d.area === 'Design' && stage.isDone) {
      setNotifyPending({ demandId:d.id, stageId:stage.id, demandTitle:d.title });
    } else {
      moveStage(d.id, stage.id);
    }
  };

  const accent = otherArea ? (AREA_CLR[areaName] || NB.azul) : NB.azul;
  const border = over && canDrop ? '1.5px dashed '+accent
    : canDrop ? '1.5px dashed '+(otherArea ? '#C9D6EA' : NB.azulClaro)
    : '1.5px solid '+v.bd;

  return (
    <div
      onDragOver={e=>{ if(canDrop){ e.preventDefault(); e.dataTransfer.dropEffect='move'; setOver(true); } }}
      onDragLeave={()=>setOver(false)}
      onDrop={handleDrop}
      style={{background:over&&canDrop?(otherArea?accent+'12':'#E4F0FD'):v.bg,borderRadius:12,border:border,padding:compact?'0 0 10px':'0 0 12px',display:'flex',flexDirection:'column',minWidth:0,minHeight:140,transition:'background 0.12s, border-color 0.12s',overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,padding:compact?'10px 12px':'11px 14px',borderBottom:'1px solid '+v.bd,background:v.head}}>
        <div style={{display:'flex',alignItems:'center',gap:9,minWidth:0}}>
          <div style={{width:26,height:26,borderRadius:8,background:'#fff',color:v.ic,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <Icon s={13.5}/>
          </div>
          <span style={{fontSize:13.5,fontWeight:600,color:over&&canDrop?accent:NB.txt,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{stage.name}</span>
        </div>
        <span style={{fontSize:11.5,color:NB.mut,fontWeight:600,flexShrink:0,background:'#fff',border:'1px solid '+v.bd,borderRadius:20,padding:'1px 8px'}}>{cards.length}</span>
      </div>
      <div style={{flex:1,minHeight:0,padding:compact?'11px 11px 0':'12px 13px 0'}}>
        {cards.map(c=><DemandCard key={c.id} demand={c}/>)}
        {cards.length===0 && (
          <div style={{border:'1.5px dashed '+(over&&canDrop?accent:v.bd),borderRadius:10,padding:'22px 10px',textAlign:'center',color:over&&canDrop?accent:NB.mut2,fontSize:12.5,transition:'all 0.12s',display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
            {!(over&&canDrop) && <span style={{color:v.ic,opacity:0.35,display:'flex'}}><Icon s={22}/></span>}
            {over&&canDrop ? (otherArea ? 'Passar para '+areaName : 'Soltar aqui') : 'Nenhuma demanda'}
          </div>
        )}
        {cards.length>0 && over && canDrop && otherArea && (
          <div style={{border:'1.5px dashed '+accent,borderRadius:10,padding:'14px 10px',textAlign:'center',color:accent,fontSize:12.5,fontWeight:500}}>
            Passar para {areaName}
          </div>
        )}
      </div>
    </div>
  );
}

/* Quem está nesta área: o time fixo dela + quem estiver em card dessa área agora */
function AreaPeople({ areaName, cards, max=5 }) {
  const { profiles } = useApp();
  /* Só quem é do setor. Quem apenas participa de um card aparece no próprio card. */
  const inits = TEAM.filter(m => m.area === areaName).map(m => m.initials);
  if (!inits.length) return null;

  const show = inits.slice(0, max);
  const resto = inits.length - show.length;

  return (
    <div style={{display:'flex',alignItems:'center',flexShrink:0}}>
      {show.map((init,i) => {
        const base = TEAM.find(m => m.initials === init);
        const mb = base ? { ...base, ...(profiles[base.id]||{}) } : null;
        return <Avatar key={init} member={mb} size={26} ring={false}
          style={{marginLeft:i>0?-8:0, zIndex:max-i, boxShadow:'0 0 0 1.5px '+((mb&&mb.color)||NB.azul)}}/>;
      })}
      {resto>0 && (
        <div title={inits.slice(max).join(', ')}
          style={{width:26,height:26,borderRadius:'50%',marginLeft:-8,background:'#EEF2F8',border:'2px solid #fff',color:NB.mut,fontSize:10,fontWeight:600,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          +{resto}
        </div>
      )}
    </div>
  );
}

function NewPostModal({ onClose, editingPost }) {
  const { addPost, updatePost, active, user } = useApp();
  const socialDemands = active.filter(d => d.area === 'Social');
  const [form, setForm] = useState(() => editingPost ? {
    legenda: editingPost.legenda || '', canal: editingPost.canal || CHANNELS[0].id,
    data: (editingPost.scheduledAt||'').slice(0,10) || dStr(1),
    hora: (editingPost.scheduledAt||'').slice(11,16) || '09:00',
    assignees: editingPost.assignees || [user.initials],
    imageData: editingPost.imageData || null, imageLink: editingPost.imageLink || '',
    demandaId: editingPost.demandaId || '',
  } : {
    legenda: '', canal: CHANNELS[0].id, data: dStr(1), hora: '09:00',
    assignees: [user.initials], imageData: null, imageLink: '', demandaId: '',
  });
  const [linkMode, setLinkMode] = useState(!!(editingPost && editingPost.imageLink));
  const [err, setErr] = useState('');
  const fileRef = useRef(null);

  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const toggleAssignee = i => setForm(f=>({ ...f, assignees: f.assignees.includes(i) ? f.assignees.filter(x=>x!==i) : [...f.assignees,i] }));

  const pickImage = e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    if (!f.type.startsWith('image/')) return setErr('Escolha uma imagem.');
    if (f.size > 700*1024) return setErr('Imagem grande demais (limite 700 KB). Use um link do Canva ou Drive.');
    const rd = new FileReader();
    rd.onload = () => { set('imageData', rd.result); setErr(''); };
    rd.readAsDataURL(f);
  };

  const valido = form.legenda.trim().length > 0 && form.assignees.length > 0;

  const salvar = () => {
    if (!valido) return setErr('Escreva a legenda e escolha ao menos um responsável.');
    if (form.legenda.length > 2200) return setErr('A legenda passou de 2.200 caracteres, o limite do Instagram.');
    const dem = socialDemands.find(d=>d.id===form.demandaId);
    const dados = {
      legenda: form.legenda.trim(), canal: form.canal,
      scheduledAt: form.data + 'T' + form.hora,
      assignees: form.assignees,
      imageData: linkMode ? null : form.imageData,
      imageLink: linkMode ? form.imageLink.trim() : '',
      demandaId: form.demandaId || null, demandaCodigo: dem ? dem.code : null,
    };
    if (editingPost) updatePost(editingPost.id, dados);
    else addPost(dados);
    onClose();
  };

  return (
    <Modal onClose={onClose} width={560}>
      <div style={{padding:'22px 26px 18px',borderBottom:'1px solid '+NB.bdSoft,display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:14}}>
        <div>
          <h2 style={{fontSize:19,fontWeight:600,color:NB.txt,marginBottom:4}}>{editingPost?'Editar publicação':'Nova publicação'}</h2>
          <p style={{fontSize:12.5,color:NB.mut}}>Fica pronta na fila; publicar ainda é manual até a integração com o Meta.</p>
        </div>
        <button onClick={onClose} style={{padding:8,background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,color:NB.mut,display:'flex',flexShrink:0}}><IX/></button>
      </div>

      <div style={{padding:'20px 26px',display:'flex',flexDirection:'column',gap:16}}>
        <div>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:7}}>
            <span style={lbl}>Legenda</span>
            <span style={{fontSize:11.5,color:form.legenda.length>2200?'#B4232A':NB.mut2}}>{form.legenda.length}/2200</span>
          </div>
          <textarea value={form.legenda} onChange={e=>set('legenda',e.target.value)} rows={4}
            placeholder="Escreva a legenda do post..." style={{...inp,padding:'10px 13px',fontSize:13.5,resize:'vertical',lineHeight:1.6}}/>
        </div>

        <div>
          <div style={{...lbl,marginBottom:8}}>Canal</div>
          <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
            {CHANNELS.map(c=>{
              const on = form.canal===c.id; const Icon=c.Icon;
              return (
                <button key={c.id} onClick={()=>set('canal',c.id)}
                  style={{display:'flex',alignItems:'center',gap:7,padding:'8px 13px',borderRadius:9,border:'1px solid '+(on?c.color:NB.bd),background:on?c.color+'14':'#fff',fontSize:12.5,fontWeight:500,color:on?c.color:NB.mut}}>
                  <Icon s={14}/> {c.label}
                </button>
              );
            })}
          </div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:13}}>
          <div>
            <div style={{...lbl,marginBottom:7}}>Data</div>
            <input type="date" value={form.data} onChange={e=>set('data',e.target.value)} style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
          </div>
          <div>
            <div style={{...lbl,marginBottom:7}}>Hora</div>
            <input type="time" value={form.hora} onChange={e=>set('hora',e.target.value)} style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
          </div>
        </div>

        <div>
          <div style={{...lbl,marginBottom:8}}>Mídia</div>
          <div style={{display:'flex',gap:8,marginBottom:10}}>
            <button onClick={()=>setLinkMode(false)} style={{...(linkMode?{}:{}), padding:'7px 13px',borderRadius:8,border:'1px solid '+(!linkMode?NB.azul:NB.bd),background:!linkMode?'#EAF3FD':'#fff',fontSize:12.5,fontWeight:500,color:!linkMode?NB.azul:NB.mut}}>Enviar arquivo</button>
            <button onClick={()=>setLinkMode(true)} style={{padding:'7px 13px',borderRadius:8,border:'1px solid '+(linkMode?NB.azul:NB.bd),background:linkMode?'#EAF3FD':'#fff',fontSize:12.5,fontWeight:500,color:linkMode?NB.azul:NB.mut}}>Link do Canva/Drive</button>
          </div>
          {linkMode ? (
            <input value={form.imageLink} onChange={e=>set('imageLink',e.target.value)} placeholder="https://canva.com/..." style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
          ) : (
            <div style={{display:'flex',alignItems:'center',gap:11}}>
              <button onClick={()=>fileRef.current&&fileRef.current.click()}
                style={{display:'flex',alignItems:'center',gap:7,padding:'9px 14px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:12.5,fontWeight:500,color:NB.mut}}>
                <IClip s={14}/> {form.imageData?'Trocar imagem':'Escolher imagem'}
              </button>
              <input ref={fileRef} type="file" accept="image/*" onChange={pickImage} style={{display:'none'}}/>
              {form.imageData && <img src={form.imageData} alt="" style={{width:36,height:36,borderRadius:7,objectFit:'cover',border:'1px solid '+NB.bd}}/>}
            </div>
          )}
        </div>

        <div>
          <div style={{...lbl,marginBottom:8}}>Responsáveis</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {ACTIVE_TEAM.map(m=><AssigneePick key={m.id} member={m} checked={form.assignees.includes(m.initials)} onToggle={()=>toggleAssignee(m.initials)}/>)}
          </div>
        </div>

        {socialDemands.length>0 && (
          <div>
            <div style={{...lbl,marginBottom:7}}>Vincular a uma demanda do Social (opcional)</div>
            <select value={form.demandaId} onChange={e=>set('demandaId',e.target.value)} style={{...inp,padding:'9px 12px',fontSize:13.5}}>
              <option value="">Nenhuma</option>
              {socialDemands.map(d=><option key={d.id} value={d.id}>{d.code} — {d.title.slice(0,44)}</option>)}
            </select>
          </div>
        )}

        {err && <div style={{padding:'10px 13px',background:'#FEF2F2',border:'1px solid #FECACA',borderRadius:9,fontSize:12.5,color:'#B4232A'}}>{err}</div>}
      </div>

      <div style={{padding:'16px 26px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'flex-end',gap:10}}>
        <button onClick={onClose} style={{padding:'10px 18px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>Cancelar</button>
        <button onClick={salvar} disabled={!valido}
          style={{padding:'10px 22px',background:valido?NB.azul:'#CFD8E6',border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',cursor:valido?'pointer':'not-allowed'}}>
          {editingPost?'Salvar':'Adicionar à fila'}
        </button>
      </div>
    </Modal>
  );
}

        )}
        {post.demandaCodigo && <span style={{fontSize:10.5,color:NB.mut2,fontFamily:'monospace'}}>{post.demandaCodigo}</span>}

      <p onClick={onEdit} style={{fontSize:13,color:NB.txt,lineHeight:1.5,display:'-webkit-box',WebkitLineClamp:3,WebkitBoxOrient:'vertical',overflow:'hidden',marginBottom:9,cursor:'pointer'}}>
        {post.legenda}
      </p>

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:confirmDel?9:0}}>

        <span style={{fontSize:11,color:NB.mut2}}>{fmtDate(post.scheduledAt&&post.scheduledAt.slice(0,10))} · {(post.scheduledAt||'').slice(11,16)}</span>

      {confirmDel ? (
        <div style={{display:'flex',gap:7,marginTop:2}}>
          <button onClick={()=>deletePost(post.id)} style={{flex:1,padding:'7px',background:'#B4232A',border:'none',borderRadius:7,fontSize:12,fontWeight:500,color:'#fff'}}>Excluir</button>
          <button onClick={()=>setConfirmDel(false)} style={{flex:1,padding:'7px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:7,fontSize:12,fontWeight:500,color:NB.mut}}>Cancelar</button>
        </div>
      ) : (
        <div style={{display:'flex',gap:7,marginTop:11,paddingTop:11,borderTop:'1px solid '+NB.bdSoft}}>
          {post.status!=='rascunho' && (
            <button onClick={copiar} style={{flex:1,padding:'7px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:7,fontSize:12,fontWeight:500,color:NB.mut}}>Copiar legenda</button>
          )}
          {post.status!=='publicado' && (
            <button onClick={avançar}
              style={{flex:1,padding:'7px',background:post.status==='pronto'?'#0F6E56':NB.azul,border:'none',borderRadius:7,fontSize:12,fontWeight:500,color:'#fff'}}>
              {post.status==='rascunho'?'Marcar como pronto':'Marcar como publicado'}
            </button>
          )}
          {post.status==='publicado' && (
            <button onClick={()=>updatePost(post.id,{status:'rascunho'})} style={{flex:1,padding:'7px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:7,fontSize:12,fontWeight:500,color:NB.mut}}>Reabrir</button>
          )}
        </div>
      )}
    </div>
  );
}

function CampanhasBuscaTab() {
  const { campanhas, pecas } = useApp();
  const [busca, setBusca] = useState('');
  const publicadas = campanhas.filter(c=>c.status==='publicada');

  const resultados = busca.trim() ? pecas.filter(p => {
    const q = busca.toLowerCase();
    return (p.nome||'').toLowerCase().includes(q)

      || (p.tags||[]).some(t=>t.toLowerCase().includes(q));
  }) : [];

  return (
    <div>
      <div style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:16,padding:'20px 22px',marginBottom:22,boxShadow:'0 1px 3px rgba(11,42,92,0.04)'}}>

          <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',color:NB.mut2,display:'flex'}}><ISearch s={16}/></span>
          <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Busque por nome, descrição ou tag — ex: black friday, webinar, banner"
            style={{...inp,padding:'11px 14px 11px 40px',fontSize:14}}/>
        </div>
        {busca.trim() && (
          resultados.length===0 ? (
            <p style={{fontSize:13,color:NB.mut2,marginTop:14}}>Nada encontrado pra "{busca}". Tente outra palavra ou peça pro marketing cadastrar essa peça.</p>
          ) : (
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(230px,1fr))',gap:12,marginTop:16}}>
              {resultados.map(p=><PecaResultCard key={p.id} peca={p}/>)}
            </div>
          )
        )}
      </div>

      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
        <span style={{fontSize:16,fontWeight:600,color:NB.txt}}>Campanhas ativas</span>
        <span style={{fontSize:13,color:NB.mut}}>{publicadas.length===0?'nenhuma no momento':publicadas.length+(publicadas.length===1?' campanha':' campanhas')}</span>
      </div>

      {publicadas.length===0 ? (
        <div style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:14,padding:'26px 22px',fontSize:13.5,color:NB.mut,lineHeight:1.6}}>

        </div>
      ) : (
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:14}}>
          {publicadas.map(c=>(
            <CampanhaPublicCard key={c.id} camp={c} pecasDaCampanha={pecas.filter(p=>(c.pecaIds||[]).includes(p.id))}/>
          ))}
        </div>
      )}

  );
}

            {sincronizado

          </p>
        </div>
      ) : (
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:12}}>
          {posts.map((p,i)=>{
            const post = typeof p === 'string' ? { permalink:p } : p;
            return (
              <a key={post.id||i} href={post.permalink} target="_blank" rel="noopener noreferrer"
                style={{display:'block',background:NB.col,border:'1px solid '+NB.bd,borderRadius:11,overflow:'hidden',textDecoration:'none'}}>
                {post.mediaUrl && (
                  <div style={{width:'100%',aspectRatio:'1/1',background:'#E8EDF5',overflow:'hidden'}}>
                    <img src={post.mediaUrl} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>

                )}
                <div style={{padding:'10px 12px'}}>
                  {post.caption
                    ? <p style={{fontSize:12,color:NB.txt,lineHeight:1.5,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden',marginBottom:6}}>{post.caption}</p>

        <IExt s={12}/> Ver perfil no Instagram

function ArquivoModal({ onClose }) {
  const { addArquivo } = useApp();
  const [f, setF] = useState({ nome:'', descricao:'', url:'', categoria:'conteudo' });
  const [err, setErr] = useState('');
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const salvar = () => {
    if (!f.nome.trim() || !f.url.trim()) return setErr('Preencha nome e link.');
    addArquivo(f); onClose();
  };
  return (
    <Modal onClose={onClose} width={460}>
      <div style={{padding:'22px 24px 16px',borderBottom:'1px solid '+NB.bdSoft}}>
        <h2 style={{fontSize:17,fontWeight:600,color:NB.txt}}>Novo item na pasta</h2>
      </div>
      <div style={{padding:'20px 24px',display:'flex',flexDirection:'column',gap:12}}>

function ArquivosTab({ podeEditar }) {
  const { arquivos: arquivosDoBanco, addArquivo, removeArquivo } = useApp();
  const [novo, setNovo] = useState(false);
  const [corrigindo, setCorrigindo] = useState(false);

  /* Os arquivos padrão sempre aparecem, e o que for adicionado de verdade
     entra junto — nunca é tudo ou nada. Se algum dia um item real usar a
     mesma URL de um padrão, o padrão correspondente some pra não duplicar. */
  const padroesRestantes = ARQUIVOS_CORRIGIDOS
    .filter(padrao => !arquivosDoBanco.some(real => real.url === padrao.url))
    .map((item, i) => ({ ...item, id: 'padrao-'+i, ehPadrao: true }));
  const arquivos = [...arquivosDoBanco, ...padroesRestantes];

  const temLinksRuins = arquivosDoBanco.some(a => a.url === URL_PLACEHOLDER_RUIM);

  const corrigirLinks = () => {
    setCorrigindo(true);
    arquivosDoBanco.filter(a => a.url === URL_PLACEHOLDER_RUIM).forEach(a => removeArquivo(a.id));
    ARQUIVOS_CORRIGIDOS.forEach(item => addArquivo(item));
    setTimeout(()=>setCorrigindo(false), 700);
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'flex-end',gap:9,marginBottom:14,flexWrap:'wrap'}}>
        {podeEditar && temLinksRuins && (
          <button onClick={corrigirLinks} disabled={corrigindo}
            style={{display:'flex',alignItems:'center',gap:7,padding:'9px 15px',background:'#FFF6DE',border:'1px solid #F3D98A',borderRadius:9,fontSize:13,fontWeight:500,color:'#8A6206',opacity:corrigindo?0.6:1}}>
            <IRefresh s={13}/> {corrigindo?'Corrigindo…':'Corrigir links duplicados'}
          </button>
        )}
        {podeEditar && (
          <button onClick={()=>setNovo(true)}
            style={{display:'flex',alignItems:'center',gap:7,padding:'9px 15px',background:NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>
            <IPlus s={13}/> Adicionar link
          </button>
        )}
      </div>
      {Object.entries(CATEGORIAS_ARQUIVO).map(([cat,label])=>{
        const itens = arquivos.filter(a=>a.categoria===cat);
        if (itens.length===0) return null;
        const v = ARQUIVO_VISUAL[cat];
        const CatIcon = v.Icon;
        return (
          <div key={cat} style={{marginBottom:26}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:13}}>
              <div style={{width:30,height:30,borderRadius:9,background:v.bg,border:'1px solid '+v.bd,color:v.ic,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <CatIcon s={15}/>
              </div>
              <span style={{fontSize:15,fontWeight:600,color:NB.txt}}>{label}</span>
              <span style={{fontSize:12,color:NB.mut2,fontWeight:500}}>{itens.length}</span>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:12}}>
              {itens.map(a=>(
                <div key={a.id} style={{background:'#fff',border:'1px solid '+v.bd,borderTop:'3px solid '+v.ic,borderRadius:12,padding:'15px 16px',boxShadow:'0 1px 3px rgba(11,42,92,0.04)'}}>
                  <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:a.descricao?8:12}}>
                    <div style={{width:32,height:32,borderRadius:9,background:v.bg,color:v.ic,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      <CatIcon s={15}/>
                    </div>
                    <div style={{fontSize:13.5,fontWeight:600,color:NB.txt,lineHeight:1.35,paddingTop:4}}>{a.nome}</div>
                  </div>
                  {a.descricao && <p style={{fontSize:12,color:NB.mut,marginBottom:12,lineHeight:1.55}}>{a.descricao}</p>}
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
                    <a href={a.url} target="_blank" rel="noopener noreferrer"
                      style={{fontSize:12,fontWeight:600,color:v.ic,background:v.bg,border:'1px solid '+v.bd,borderRadius:8,padding:'6px 12px',textDecoration:'none',display:'flex',alignItems:'center',gap:6}}>
                      <IExt s={12}/> Abrir
                    </a>
                    {podeEditar && !a.ehPadrao && <button onClick={()=>removeArquivo(a.id)} style={{fontSize:11,color:'#B4232A',background:'none',border:'none'}}>Remover</button>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      })}
      {arquivos.length===0 && (
        <div style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:14,padding:'34px 22px',textAlign:'center',color:NB.mut,fontSize:13.5}}>
          Nenhum arquivo cadastrado ainda.
        </div>
      )}
      {novo && <ArquivoModal onClose={()=>setNovo(false)}/>}
    </div>
  );
}

/* ---------- Gerar Abordagem (IA por persona) ---------- */
function AbordagemTab() {
  const { campanhas } = useApp();
  const publicadas = campanhas.filter(c=>c.status==='publicada');
  const [campId, setCampId] = useState(null);
  const [persona, setPersona] = useState(null);
  const [copiado, setCopiado] = useState(null);
  const copiar = (t,i) => { navigator.clipboard && navigator.clipboard.writeText(t); setCopiado(i); setTimeout(()=>setCopiado(null),1800); };
  const camp = publicadas.find(c=>c.id===campId) || null;

  return (
    <div style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:16,padding:'22px 24px',boxShadow:'0 1px 3px rgba(11,42,92,0.04)'}}>
      <div style={{...lbl,marginBottom:11}}>Qual campanha você vai abordar?</div>
      {publicadas.length===0 ? (
        <div style={{background:NB.col,border:'1px dashed '+NB.bd,borderRadius:11,padding:'18px 16px',marginBottom:8}}>
          <p style={{fontSize:13,color:NB.mut,lineHeight:1.6}}>Nenhuma campanha publicada no momento. A abordagem sempre parte de uma campanha real — assim que o marketing publicar uma, ela aparece aqui pra escolher.</p>
        </div>
      ) : (
        <div style={{display:'flex',gap:9,flexWrap:'wrap',marginBottom:22}}>
          {publicadas.map(c=>{
            const on = campId===c.id;
            return (
              <button key={c.id} onClick={()=>setCampId(c.id)}
                style={{padding:'10px 16px',borderRadius:10,border:'1px solid '+(on?NB.azul:NB.bd),background:on?'#EAF3FD':'#fff',fontSize:13.5,fontWeight:500,color:on?NB.azul:NB.mut,textAlign:'left'}}>
                {c.titulo}{c.desconto && <span style={{color:NB.mut2,fontWeight:400}}> · {c.desconto}</span>}
              </button>
            );
          })}
        </div>
      )}

      {camp && (
        <React.Fragment>
          <div style={{...lbl,marginBottom:11}}>Pra quem é essa abordagem?</div>
          <div style={{display:'flex',gap:9,flexWrap:'wrap',marginBottom:22}}>
            {PERSONAS.map(p=>{
              const on = persona===p.id;
              return (
                <button key={p.id} onClick={()=>setPersona(p.id)}
                  style={{display:'flex',alignItems:'center',gap:8,padding:'10px 16px',borderRadius:10,border:'1px solid '+(on?NB.azul:NB.bd),background:on?'#EAF3FD':'#fff',fontSize:13.5,fontWeight:500,color:on?NB.azul:NB.mut}}>
                  <span>{p.emoji}</span> {p.label}
                </button>
              );
            })}
          </div>
        </React.Fragment>
      )}

      {camp && persona && (
        <div style={{display:'flex',flexDirection:'column',gap:11}}>
          {personaVariants(persona, camp).map((v,i)=>(
            <div key={i} style={{background:NB.col,border:'1px solid '+NB.bd,borderRadius:11,padding:'14px 16px'}}>
              <div style={{fontSize:10.5,fontWeight:600,color:NB.mut2,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:7}}>{v.rotulo}</div>
              <p style={{fontSize:13.5,color:NB.txt,lineHeight:1.6,marginBottom:10}}>{v.texto}</p>
              <button onClick={()=>copiar(v.texto,i)}
                style={{padding:'7px 13px',background:copiado===i?'#E1F5EE':'#fff',border:'1px solid '+(copiado===i?'#0F6E56':NB.bd),borderRadius:8,fontSize:12,fontWeight:500,color:copiado===i?'#0F6E56':NB.mut}}>
                {copiado===i?'Copiado ✓':'Copiar'}
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ApprovalCard({ demand }) {
  const { moveStage, setNotifyPending, addComment, user, previewMember, setModal, attach, comments, pipes } = useApp();
  const [nota, setNota] = useState('');
  const [ajuste, setAjuste] = useState(false);

  const stages = pipes[demand.area] || [];
  const idx    = stages.findIndex(s => s.id === demand.stageId);
  const prox   = stages[idx+1];
  const antes  = stages[idx-1];
  const sla    = getSla(demand.deadline);
  const Icon   = AREA_ICON[demand.area];
  const podeAprovar = !!(previewMember ? previewMember.isApprover : user.isApprover);
  const nA = (attach[demand.id]||[]).length;
  const nC = (comments[demand.id]||[]).length;

  const aprovar = () => {
    if (!prox) return;
    if (demand.area === 'Design' && prox.isDone) {
      setNotifyPending({ demandId:demand.id, stageId:prox.id, demandTitle:demand.title });
    } else {
      moveStage(demand.id, prox.id);
    }
  };

  const pedirAjuste = () => {
    if (!antes) return;
    if (nota.trim()) addComment(demand, 'Ajuste solicitado: ' + nota.trim(), user.initials);
    moveStage(demand.id, antes.id);
    setNota(''); setAjuste(false);
  };

  return (
    <div style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:13,padding:'16px 18px',boxShadow:'0 1px 3px rgba(11,42,92,0.04)'}}>
      <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:9,flexWrap:'wrap'}}>
        <span style={{background:NB.col,border:'1px solid '+NB.bd,color:NB.mut,fontSize:11,fontWeight:500,padding:'2px 8px',borderRadius:6,fontFamily:'monospace'}}>{demand.code}</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:12.5,fontWeight:500,color:AREA_CLR[demand.area]}}><Icon s={14}/> {demand.area}</span>
        <span style={{fontSize:12,color:NB.mut2}}>· {stages[idx] ? stages[idx].name : '—'}</span>
        {sla && sla.type!=='ok' && (
          <span style={{fontSize:11.5,fontWeight:500,padding:'3px 9px',borderRadius:6,background:sla.type==='danger'?'#FEECEC':'#FFF6DE',color:sla.type==='danger'?'#B4232A':'#8A6206'}}>{sla.label}</span>
        )}
      </div>

      <button onClick={()=>setModal(demand.id)}
        style={{background:'none',border:'none',padding:0,textAlign:'left',fontSize:15,fontWeight:500,color:NB.txt,lineHeight:1.4,marginBottom:11}}>
        {demand.title}
      </button>

      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14,flexWrap:'wrap'}}>
        <div style={{display:'flex'}}>
          {demand.assignees.slice(0,4).map((init,i)=><CardAvatar key={init+i} initials={init} offset={i}/>)}
        </div>
        <span style={{fontSize:12.5,color:NB.mut}}>Prazo {fmtDate(demand.deadline)}</span>
        {nA>0 && <span style={{display:'flex',alignItems:'center',gap:4,fontSize:12,color:NB.mut2}}><IClip s={13}/>{nA}</span>}
        {nC>0 && <span style={{display:'flex',alignItems:'center',gap:4,fontSize:12,color:NB.mut2}}><IChatBox s={13}/>{nC}</span>}
      </div>

      {!podeAprovar ? (
        <div style={{fontSize:12.5,color:NB.mut2,background:NB.col,border:'1px solid '+NB.bd,borderRadius:9,padding:'10px 13px',lineHeight:1.55}}>
          Aguardando decisão de @Mariana Araújo. Abra o card para comentar ou anexar algo que ajude na aprovação.
        </div>
      ) : ajuste ? (
        <div style={{background:NB.col,border:'1px solid '+NB.bd,borderRadius:10,padding:'13px 14px'}}>
          <div style={{...lbl,marginBottom:7}}>O que precisa mudar</div>
          <textarea value={nota} onChange={e=>setNota(e.target.value)} rows={2} autoFocus
            placeholder="Ex: trocar o CTA e deixar o público explícito na primeira linha"
            style={{...inp,padding:'9px 12px',fontSize:13.5,resize:'vertical',lineHeight:1.55}}/>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:10}}>
            <button onClick={()=>{setAjuste(false); setNota('');}}
              style={{padding:'8px 14px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:12.5,fontWeight:500,color:NB.mut}}>Cancelar</button>
            <button onClick={pedirAjuste}
              style={{padding:'8px 16px',background:'#B4232A',border:'none',borderRadius:8,fontSize:12.5,fontWeight:500,color:'#fff'}}>
              Devolver para {antes ? antes.name : 'etapa anterior'}
            </button>
          </div>
        </div>
      ) : (
        <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
          <button onClick={aprovar} disabled={!prox}
            style={{display:'flex',alignItems:'center',gap:7,padding:'10px 17px',background:prox?'#0F6E56':'#CFD8E6',border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',cursor:prox?'pointer':'not-allowed'}}>
            <ICheck s={14}/> Aprovar {prox ? '→ '+prox.name : ''}
          </button>
          <button onClick={()=>setAjuste(true)} disabled={!antes}
            style={{padding:'10px 17px',background:'#fff',border:'1px solid #FBD5D5',borderRadius:9,fontSize:13,fontWeight:500,color:'#B4232A',cursor:antes?'pointer':'not-allowed'}}>
            Pedir ajuste
          </button>
        </div>
      )}
    </div>
  );
}

/* =========== EDITOR DE ETAPAS =========== */
function StageEditorModal({ areaName, onClose }) {
  const { pipes, salvarPipes, active, moveStage } = useApp();
  const [rows, setRows] = useState(() => (pipes[areaName]||[]).map(s => ({...s})));
  const [delIdx, setDelIdx] = useState(null);
  const [err, setErr] = useState('');

  const contar = id => active.filter(d => d.area===areaName && d.stageId===id).length;

  const set = (i, patch) => setRows(r => r.map((s,k)=> k===i ? {...s, ...patch} : s));

  const mover = (i, dir) => setRows(r => {
    const j = i + dir;
    if (j < 0 || j >= r.length) return r;
    const c = [...r]; const tmp = c[i]; c[i] = c[j]; c[j] = tmp; return c;
  });

  const addStage = () => setRows(r => [...r, {
    id: areaName.slice(0,3).toLowerCase().replace(/[^a-z]/g,'') + '-' + Date.now().toString(36),
    name: 'Nova etapa',
  }]);

  const remover = i => {
    const alvo = rows[i];
    const n = contar(alvo.id);
    const destino = rows[i-1] || rows[i+1];
    if (rows.length <= 2) { setErr('Um pipeline precisa de pelo menos duas etapas.'); return; }
    if (n > 0 && destino) {
      active.filter(d => d.area===areaName && d.stageId===alvo.id)
            .forEach(d => moveStage(d.id, destino.id));
    }
    setRows(r => r.filter((_,k)=>k!==i));
    setDelIdx(null); setErr('');
  };

  const salvar = () => {
    const limpo = rows.map(s => {
      const o = { id:s.id, name:(s.name||'').trim() || 'Etapa' };
      if (s.isApproval) o.isApproval = true;
      if (s.isDone) o.isDone = true;
      return o;
    });
    if (limpo.filter(s=>s.isApproval).length > 1) { setErr('Marque só uma etapa como de aprovação.'); return; }
    salvarPipes({ ...pipes, [areaName]: limpo });
    onClose();
  };

  const restaurar = () => { setRows(DEFAULT_PIPELINES[areaName].map(s=>({...s}))); setErr(''); };
  const Icon = AREA_ICON[areaName];

  return (
    <Modal onClose={onClose} width={620} z={65}>
      <div style={{padding:'22px 26px 16px',borderBottom:'1px solid '+NB.bdSoft,display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:14}}>
        <div>
          <h2 style={{fontSize:19,fontWeight:600,color:NB.txt,marginBottom:5,display:'flex',alignItems:'center',gap:9}}>
            <span style={{color:AREA_CLR[areaName],display:'flex'}}><Icon s={18}/></span> Etapas de {areaName}
          </h2>
          <p style={{fontSize:13,color:NB.mut}}>Renomeie, reordene, adicione ou remova. Vale só para este pipeline.</p>
        </div>
        <button onClick={onClose} style={{padding:8,background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,color:NB.mut,display:'flex',flexShrink:0}}><IX/></button>
      </div>

      <div style={{padding:'18px 26px',display:'flex',flexDirection:'column',gap:9}}>
        {rows.map((st,i)=>{
          const n = contar(st.id);
          const apagando = delIdx===i;
          return (
            <div key={st.id} style={{border:'1px solid '+(apagando?'#FBD5D5':NB.bd),borderRadius:11,padding:'12px 13px',background:apagando?'#FEF7F7':'#fff'}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div style={{display:'flex',flexDirection:'column',gap:2,flexShrink:0}}>
                  <button onClick={()=>mover(i,-1)} disabled={i===0} title="Subir"
                    style={{padding:'2px 5px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:6,color:i===0?'#DDE5F0':NB.mut,cursor:i===0?'not-allowed':'pointer',lineHeight:1,fontSize:10}}>▲</button>
                  <button onClick={()=>mover(i,1)} disabled={i===rows.length-1} title="Descer"
                    style={{padding:'2px 5px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:6,color:i===rows.length-1?'#DDE5F0':NB.mut,cursor:i===rows.length-1?'not-allowed':'pointer',lineHeight:1,fontSize:10}}>▼</button>
                </div>
                <input value={st.name} onChange={e=>set(i,{name:e.target.value})}
                  style={{...inp,padding:'9px 12px',fontSize:13.5,flex:1}}
                  onFocus={e=>{e.target.style.borderColor=NB.azul;}} onBlur={e=>{e.target.style.borderColor=NB.bd;}}/>
                <span style={{fontSize:12,color:NB.mut2,whiteSpace:'nowrap',flexShrink:0}}>{n} {n===1?'card':'cards'}</span>
                <button onClick={()=>{setDelIdx(apagando?null:i); setErr('');}} title="Remover etapa"
                  style={{padding:'8px 9px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,color:apagando?'#B4232A':NB.mut,display:'flex',flexShrink:0}}>
                  <ITrash/>
                </button>
              </div>

              <div style={{display:'flex',gap:16,marginTop:10,flexWrap:'wrap',paddingLeft:34}}>
                <label style={{display:'flex',alignItems:'center',gap:7,fontSize:12.5,color:NB.mut,cursor:'pointer'}}>
                  <input type="checkbox" checked={!!st.isApproval}
                    onChange={e=>set(i,{isApproval:e.target.checked, isDone:e.target.checked?false:st.isDone})}
                    style={{width:14,height:14,accentColor:NB.azul}}/>
                  Etapa de aprovação <span style={{color:NB.mut2}}>(vai para Gestão e puxa a Mariana)</span>
                </label>
                <label style={{display:'flex',alignItems:'center',gap:7,fontSize:12.5,color:NB.mut,cursor:'pointer'}}>
                  <input type="checkbox" checked={!!st.isDone}
                    onChange={e=>set(i,{isDone:e.target.checked, isApproval:e.target.checked?false:st.isApproval})}
                    style={{width:14,height:14,accentColor:NB.azul}}/>
                  Etapa final
                </label>
              </div>

              {apagando && (
                <div style={{marginTop:11,paddingLeft:34}}>
                  <p style={{fontSize:12.5,color:'#B4232A',lineHeight:1.55,marginBottom:9}}>
                    {n>0
                      ? 'Remover "'+st.name+'"? Os '+n+' card(s) daqui vão para "'+((rows[i-1]||rows[i+1]||{}).name||'—')+'".'
                      : 'Remover "'+st.name+'"?'}
                  </p>
                  <div style={{display:'flex',gap:8}}>
                    <button onClick={()=>remover(i)}
                      style={{padding:'7px 14px',background:'#B4232A',border:'none',borderRadius:8,fontSize:12.5,fontWeight:500,color:'#fff'}}>Remover</button>
                    <button onClick={()=>setDelIdx(null)}
                      style={{padding:'7px 14px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:12.5,fontWeight:500,color:NB.mut}}>Cancelar</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}

        <button onClick={addStage}
          style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'12px',background:'#fff',border:'1.5px dashed '+NB.bd,borderRadius:11,fontSize:13,fontWeight:500,color:NB.mut}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=NB.azul; e.currentTarget.style.color=NB.azul;}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=NB.bd; e.currentTarget.style.color=NB.mut;}}>
          <IPlus s={15}/> Adicionar etapa
        </button>

        {err && (
          <div style={{padding:'10px 13px',background:'#FEF2F2',border:'1px solid #FECACA',borderRadius:9,fontSize:12.5,color:'#B4232A'}}>{err}</div>
        )}
      </div>

      <div style={{padding:'16px 26px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}}>
        <button onClick={restaurar}
          style={{padding:'10px 16px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>
          Restaurar padrão
        </button>
        <div style={{display:'flex',gap:10}}>
          <button onClick={onClose}
            style={{padding:'10px 18px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>Cancelar</button>
          <button onClick={salvar}
            style={{padding:'10px 22px',background:NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>Salvar etapas</button>
        </div>
      </div>
    </Modal>
  );
}

/* Campo que vira input ao clicar. Enter salva, Esc cancela, sair do campo salva. */
function EditableText({ value, onSave, multiline, placeholder, required, textStyle, rows }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(value || '');
  const ref = useRef(null);

  useEffect(() => { if (editing) setDraft(value || ''); }, [editing, value]);
  useEffect(() => {
    if (editing && ref.current) { ref.current.focus(); if (ref.current.select) ref.current.select(); }
  }, [editing]);

  const commit = () => {
    const v = (draft || '').trim();
    setEditing(false);
    if (required && !v) return;          // título não pode ficar vazio
    if (v !== (value || '')) onSave(v);
  };

  const keys = e => {
    if (e.key === 'Escape') { e.preventDefault(); setEditing(false); }
    if (e.key === 'Enter' && !multiline) { e.preventDefault(); commit(); }
    if (e.key === 'Enter' && multiline && (e.metaKey || e.ctrlKey)) { e.preventDefault(); commit(); }
  };

  if (editing) {
    const common = {
      ref, value:draft, onChange:e=>setDraft(e.target.value), onBlur:commit, onKeyDown:keys,
      style:{ ...inp, ...textStyle, borderColor:NB.azul, background:'#fff', width:'100%',
              resize: multiline?'vertical':undefined, lineHeight: multiline?1.65:undefined }
    };
    return multiline ? <textarea rows={rows||3} {...common}/> : <input {...common}/>;
  }

  const empty = !value;
  return (
    <div onClick={()=>setEditing(true)} title="Clique para editar"
      style={{ ...textStyle, cursor:'text', borderRadius:9, padding:'6px 9px', margin:'-6px -9px',
               color: empty ? NB.mut2 : (textStyle && textStyle.color) || NB.txt,
               fontStyle: empty ? 'italic' : 'normal', transition:'background 0.12s',
               whiteSpace: multiline ? 'pre-wrap' : undefined }}
      onMouseEnter={e=>{e.currentTarget.style.background=NB.col;}}
      onMouseLeave={e=>{e.currentTarget.style.background='transparent';}}>
      {value || placeholder}
    </div>
  );
}

const fmtBytes = b => b < 1024 ? b+' B' : b < 1048576 ? (b/1024).toFixed(0)+' KB' : (b/1048576).toFixed(1)+' MB';
const fmtWhen = iso => { const d=new Date(iso); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };

function AttachPanel({ demand }) {
  const { attach, addAttachment, uploadFile, migrarLocal, carregarAnexo, removeAttachment, user, MAX_FILE, storageWarn } = useApp();
  const nuvem  = [ ...(demand.anexos||[]), ...(demand.links||[]) ].map(a => ({ ...a, origem:'nuvem' }));
  const locais = (attach[demand.id] || []).map(a => ({ ...a, origem:'local' }));
  const list = [...nuvem, ...locais];
  const fileRef = useRef(null);
  const [mode, setMode] = useState(null);
  const [ln, setLn] = useState({ name:'', url:'' });
  const [err, setErr] = useState('');
  const [subindo, setSubindo] = useState([]);   // [{nome, pct}]
  const [conteudo, setConteudo] = useState({}); // anexoId -> dataURL, buscado sob demanda

  /* Só busca o arquivo em si quando o card está aberto, para não pesar o quadro. */
  useEffect(() => {
    let vivo = true;
    nuvem.filter(a => a.anexoId && !conteudo[a.anexoId]).forEach(a => {
      carregarAnexo(a.anexoId)
        .then(d => { if (vivo && d) setConteudo(c => ({ ...c, [a.anexoId]: d.data })); })
        .catch(()=>{});
    });
    return () => { vivo = false; };
  }, [demand.id, nuvem.length]);

  const saveLink = () => {
    let url = ln.url.trim();
    if (!url) return setErr('Cole o endereço do link.');
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    try { new URL(url); } catch { return setErr('Esse endereço não parece válido.'); }
    addAttachment(demand, { kind:'link', name: ln.name.trim() || url.replace(/^https?:\/\//,'').slice(0,50), url, by:user.name });
    setLn({name:'',url:''}); setMode(null); setErr('');
  };

  const pickFiles = e => {
    const files = Array.from(e.target.files||[]);
    e.target.value = '';
    setErr('');
    files.forEach(f => {
      const chave = f.name + Math.random();
      setSubindo(s => [...s, { chave, nome:f.name, pct:0 }]);
      uploadFile(demand, f, pct => setSubindo(s => s.map(x => x.chave===chave ? {...x, pct} : x)))
        .then(meta => {
          addAttachment(demand, { ...meta, by:user.name });
          setSubindo(s => s.filter(x => x.chave!==chave));
        })
        .catch(erro => {
          setErr(erro.message);
          setSubindo(s => s.filter(x => x.chave!==chave));
        });
    });
  };

  const enviarLocal = att => {
    const chave = att.name + Math.random();
    setSubindo(s => [...s, { chave, nome:att.name, pct:0 }]);
    migrarLocal(demand, att)
      .then(() => setSubindo(s => s.filter(x=>x.chave!==chave)))
      .catch(e => { setErr(e.message); setSubindo(s => s.filter(x=>x.chave!==chave)); });
  };

  return (
    <div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:list.length||mode||subindo.length?16:2}}>
        <button onClick={()=>fileRef.current && fileRef.current.click()}
          style={{display:'flex',alignItems:'flex-start',gap:11,padding:'13px 14px',background:'#fff',border:'1.5px solid '+NB.bd,borderRadius:12,textAlign:'left',transition:'border-color 0.12s, background 0.12s'}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=NB.azul; e.currentTarget.style.background='#F7FAFF';}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=NB.bd; e.currentTarget.style.background='#fff';}}>
          <span style={{width:32,height:32,borderRadius:9,background:'#EAF3FD',color:NB.azul,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><IClip s={16}/></span>

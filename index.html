  { id:'d3', code:'DEM-103', title:'Campanha Open Finance — Meta Ads', area:'Mídia Paga', priority:'Média', stageId:'mid-2', assignees:['VI'], deadline:dStr(5), description:'Campanha de conversão no Meta Ads para o Conciliador Open Finance. Público: empresários PME.', requester:'Vivian Santos' },

  { id:'s1', code:'DEM-101', area:'Social', time:'09:14', stagePath:'Solicitado → Em Redação', action:'Briefing de copy ativado — equipe Social notificada', next:'Design de Arte → @Millena Barros', type:'move' },
  { id:'s2', code:'DEM-104', area:'Social', time:'10:33', stagePath:'Design de Arte → Aprovação', action:'@Mariana Araújo notificada para revisão e aprovação', next:'Aprovado → Agendamento | Ajuste → volta para Design', type:'approval' },
  { id:'s3', code:'DEM-106', area:'RevOps', time:'11:05', stagePath:'Em Análise → Implementação', action:'Automação configurada no n8n + testes de integração ativados', next:'Validação → @Mariana Araújo', type:'move' },
];

/* =========== CONTEXT =========== */
const Ctx = createContext(null);

function Provider({ children }) {
  /* ---------- dados compartilhados (Firestore) ---------- */
  const [demands, setDemands] = useState([]);
  const [pedidos, setPedidos] = useState([]);
  const [posts, setPosts] = useState([]);
  const [campanhas, setCampanhas] = useState([]);
  const [redesSociais, setRedesSociais] = useState({ instagramHandle:'', posts:[] });
  const [arquivos, setArquivos] = useState([]);
  const [embaixadores, setEmbaixadores] = useState([]);
  const [pacotes, setPacotes] = useState([]);
  const [meuPortalEmbaixador, setMeuPortalEmbaixador] = useState(null);
  const [portalCarregado, setPortalCarregado] = useState(false);
  const [portaisEmbaixador, setPortaisEmbaixador] = useState([]);
  const [meusEnviosFotos, setMeusEnviosFotos] = useState([]);
  const [todosEnviosFotos, setTodosEnviosFotos] = useState([]);
  const [pecas, setPecas] = useState([]);
  const [slack, setSlack]     = useState([]);
  const [pipes, setPipes]     = useState(DEFAULT_PIPELINES);
  const [dbReady, setDbReady] = useState(false);
  const [dbErro, setDbErro]   = useState('');
  const dbRef    = useRef(null);
  const pipesRef = useRef(pipes);
  pipesRef.current = pipes;

  /* ---------- dados só deste navegador ---------- */
  const [photos, setPhotos] = useState(() => {
    try { const s=localStorage.getItem('nibo_photos_v1'); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });
  const [googlePhotos, setGooglePhotos] = useState(() => {
    try { const s=localStorage.getItem('nibo_gphotos_v1'); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });
  const [profiles, setProfiles] = useState(() => {
    try { const s=localStorage.getItem('nibo_profiles_v1'); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });
  /* arquivos ficam locais: são grandes demais para um documento do Firestore */
  const [attach, setAttach] = useState(() => {
    try { const s=localStorage.getItem('nibo_attach_v1'); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });
  const [storageWarn, setStorageWarn] = useState('');
  const MAX_FILE = 700 * 1024;   /* um documento do Firestore aceita 1 MB */

  /* ---------- autenticação ---------- */
  const [fbUser, setFbUser]       = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [authError, setAuthError] = useState('');
  const [preferirCentral, setPreferirCentral] = useState(false);

  /* ---------- interface ---------- */
  const [view, setView]     = useState('kanban');
  const [layout, setLayout] = useState('board');
  const [area, setArea]     = useState('Todas');
  const abriuRef = useRef(false);
  const [query, setQuery]   = useState('');
  const [mesFiltro, setMesFiltro] = useState('todos'); // 'todos' | 'YYYY-MM'
  const [priFilter, setPriFilter] = useState([]);
  const [reqFilter, setReqFilter] = useState([]);
  const [modal, setModal]   = useState(null);
  const [newOpen, setNewOpen] = useState(false);
  const [presetNovo, setPresetNovo] = useState(null); // { area, stageId } | null
  const [pacoteOpen, setPacoteOpen] = useState(false);
  const [notifyPending, setNotifyPending] = useState(null);
  const [profileOpen, setProfileOpen] = useState(false);
  const [editStages, setEditStages] = useState(null);
  const [dragging, setDragging] = useState(null);
  /* "Ver como" — pré-visualiza a interface de outra pessoa (ex: a aprovadora)
     sem trocar de conta. Toda ação continua sendo registrada com o usuário real. */
  const [previewMember, setPreviewMember] = useState(null);

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged(u => {
      if (!u) { setFbUser(null); setAuthReady(true); return; }
      const mail = (u.email || '').toLowerCase();
      const viaGoogle = (u.providerData||[]).some(p => p.providerId === 'google.com');
      /* A restrição de domínio só vale pra quem entra pelo Google (Gestão) —
         embaixadores entram com e-mail/senha próprio, de fora do Nibo. */
      if (viaGoogle && !mail.endsWith(NIBO_DOMAIN)) {
        setAuthError('Acesso restrito a contas ' + NIBO_DOMAIN + '. Você entrou com ' + mail + '.');
        firebase.auth().signOut();
        return;
      }
      /* Qualquer conta do Nibo entra — quem não é do marketing só vê a
         Central de Informações (decidido lá embaixo em AppContent). */
      setAuthError('');
      const found = ACTIVE_TEAM.find(m => m.email === mail);
      if (found && u.photoURL) {
        setGooglePhotos(p => p[found.id]===u.photoURL ? p : {...p, [found.id]:u.photoURL});
        try { firebase.firestore().collection('fotosTime').doc(found.id).set({ photoURL: u.photoURL }, { merge:true }).catch(()=>{}); } catch(e){}
      }
      setFbUser({ email: mail, photoURL: u.photoURL || null, displayName: u.displayName || '' });
      setAuthReady(true);
    });
    return unsub;
  }, []);

  /* Fotos do Google de todo o time, compartilhadas via Firestore — antes
     cada foto só existia no localStorage de quem tinha logado com ela. */
  useEffect(() => {
    if (!fbUser) return;
    let db;
    try { db = firebase.firestore(); } catch (e) { return; }
    const un = db.collection('fotosTime').onSnapshot(snap => {
      setGooglePhotos(prev => {
        const novo = { ...prev };
        snap.docs.forEach(d => { const v=d.data(); if (v && v.photoURL) novo[d.id] = v.photoURL; });
        return novo;
      });
    }, () => {});
    return () => un();
  }, [fbUser]);

  const baseUser = fbUser ? ACTIVE_TEAM.find(m => m.email === fbUser.email) : null;
  const isTeamMember = !!baseUser;
  const isEmbaixador = !isTeamMember && !!meuPortalEmbaixador;
  const user = fbUser
    ? baseUser
      ? { ...baseUser, googlePhoto: fbUser.photoURL, ...(profiles[baseUser.id] || {}) }
      : { id:'visitante', name: fbUser.displayName || fbUser.email.split('@')[0], email: fbUser.email,
          initials: (fbUser.displayName||fbUser.email).split(/\s+/).filter(Boolean).map(s=>s[0]).slice(0,2).join('').toUpperCase() || 'VI',
          color: NB.mut2, area: null, isApprover:false, canPublishCampaigns:false, isVisitor:true,
          googlePhoto: fbUser.photoURL }
    : null;

  /* Central de Informações agora exige login @nibo.com.br — qualquer conta
     do Nibo carrega esses dados, não só o time de marketing. Embaixadores
     (login por e-mail externo) nunca batem nesse domínio, então ficam fora. */
  useEffect(() => {
    if (!fbUser || !fbUser.email.endsWith(NIBO_DOMAIN)) {
      setCampanhas([]); setPecas([]); setRedesSociais({instagramHandle:'',posts:[]}); setArquivos([]); setEmbaixadores([]);
      return;
    }
    let db;
    try { db = firebase.firestore(); }
    catch (e) { setDbErro('Não foi possível abrir o banco: ' + e.message); return; }

    const erro = e => setDbErro(
      e && e.code === 'permission-denied'
        ? 'Sem permissão de acesso ao banco. Publique as regras do Firestore no console do Firebase.'
        : 'Falha de conexão: ' + (e && e.message ? e.message : 'desconhecida')
    );

    const uc = db.collection('campanhas').onSnapshot(snap => {
      setCampanhas(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    }, erro);
    const up = db.collection('pecas').onSnapshot(snap => {
      setPecas(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    }, erro);
    const ur = db.collection('redesSociais').doc('principal').onSnapshot(doc => {
      setRedesSociais(doc.exists ? doc.data() : { instagramHandle:'', posts:[] });
    }, erro);
    const ua = db.collection('arquivos').onSnapshot(snap => {
      setArquivos(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    }, erro);
    const ue = db.collection('embaixadores').onSnapshot(snap => {
      setEmbaixadores(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    }, erro);

    return () => { uc(); up(); ur(); ua(); ue(); };
  }, [fbUser]);

  /* Escutas do que é interno só depois do login — as regras exigem usuária autenticada. */
  useEffect(() => {
    if (!fbUser || !isTeamMember) { dbRef.current = null; setDbReady(false); return; }
    let db;
    try { db = firebase.firestore(); dbRef.current = db; }
    catch (e) { setDbErro('Não foi possível abrir o banco: ' + e.message); return; }

    const erro = e => setDbErro(
      e && e.code === 'permission-denied'
        ? 'Sem permissão de acesso ao banco. Publique as regras do Firestore no console do Firebase.'
        : 'Falha de conexão com o banco: ' + (e && e.message ? e.message : 'desconhecida')
    );

    const u1 = db.collection('demandas').onSnapshot(snap => {
      setDemands(snap.docs.map(d => ({ id:d.id, ...d.data() })));
      setDbReady(true); setDbErro('');

  /* Cada arquivo vira um documento próprio na coleção anexos, para que
     um anexo grande nunca comprometa o documento da demanda. */
  const comprimirImagem = file => new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const maxLado = 1000;
      const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
      const w = Math.round(img.width * escala), h = Math.round(img.height * escala);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => {
        if (!blob) return reject(new Error('Não consegui comprimir a imagem.'));
        resolve(new File([blob], file.name.replace(/\.\w+$/, '')+'.jpg', { type:'image/jpeg' }));
      }, 'image/jpeg', 0.82);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });

  const uploadFile = useCallback(async (demand, file, onProgress) => {
    const db = dbRef.current;
    if (!db) return Promise.reject(new Error('Sem conexão com o banco.'));
    let arquivo = file;
    if (file.size > MAX_FILE && file.type && file.type.startsWith('image/')) {
      try { arquivo = await comprimirImagem(file); }
      catch (e) { /* se não der pra comprimir, segue com o original e deixa o check abaixo barrar */ }
    }
    if (arquivo.size > MAX_FILE) return Promise.reject(new Error(
      '"'+file.name+'" tem '+fmtBytes(arquivo.size)+' e o limite é '+fmtBytes(MAX_FILE)+'. Suba no Drive ou Canva e anexe o link.'));
    return new Promise((resolve, reject) => {
      const rd = new FileReader();
      rd.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*70)); };
      rd.onerror = () => reject(new Error('Não consegui ler "'+file.name+'".'));
      rd.onload = () => {
        onProgress && onProgress(80);
        db.collection('anexos').add({
          demandaId: demand.id, name: file.name, size: arquivo.size,
          mime: arquivo.type || 'application/octet-stream', data: rd.result, at: new Date().toISOString(),
        }).then(ref => {
          onProgress && onProgress(100);
          resolve({ kind:'file', name:file.name, size:arquivo.size, mime:arquivo.type, anexoId: ref.id });
        }).catch(e => reject(new Error(
          e.code === 'permission-denied'
            ? 'Sem permissão para gravar anexos. Republique as regras do Firestore.'
            : 'Não foi possível salvar o arquivo: ' + e.message)));
      };
      rd.readAsDataURL(arquivo);
    });
  }, []);

     empurra a data do próximo ciclo — sem precisar de servidor externo,

function getSla(dl) {
  if (!dl) return null;
  const diff = Math.ceil((new Date(dl)-new Date())/86400000);
  if (diff < 0) return { label:'Atrasado '+Math.abs(diff)+'d', type:'danger' };
  if (diff <= 2) return { label:'Vence em '+diff+'d', type:'warn' };
  return { label:diff+'d', type:'ok' };
}

function getPostUrgency(iso, status) {
  if (status === 'publicado') return { label:'Publicado', type:'done' };
  if (!iso) return null;
  const diffH = (new Date(iso) - new Date()) / 3600000;
  if (diffH < 0)  return { label:'Atrasado', type:'danger' };
  if (diffH < 24) return { label:'Hoje',     type:'warn' };
  return { label:'Em '+Math.ceil(diffH/24)+'d', type:'ok' };
}

function NiboSymbol({ size=24, color='#fff' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" fill={color} aria-label="Nibo" role="img">
      <circle cx="50" cy="36.8" r="8.85"/>

}

function NiboMark({ size=42, radius=12, bg=NB.azul, color='#fff' }) {
  return (
    <div style={{width:size,height:size,borderRadius:radius,background:bg,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
      <NiboSymbol size={Math.round(size*0.72)} color={color}/>
    </div>
  );
}

/* =========== AVATAR =========== */
function Avatar({ member, size=32, ring=true, style, src }) {
  const { photos, googlePhotos } = useApp();
  /* prioridade: foto enviada no perfil > foto do Google > iniciais */
  const photo = src !== undefined ? src
    : (member && (photos[member.id] || googlePhotos[member.id] || member.googlePhoto));
  const clr = (member && member.color) || NB.azul;
  const base = { width:size, height:size, borderRadius:'50%', flexShrink:0, border:'2px solid #fff', boxShadow: ring ? '0 0 0 1.5px '+clr : 'none', ...style };
  if (photo) return <img src={photo} alt={member.name} title={member.name} style={{...base, objectFit:'cover'}}/>;
  return (
    <div title={member?member.name:''} style={{...base, background:clr, color:'#fff', fontSize:Math.round(size*0.36), fontWeight:600, display:'flex', alignItems:'center', justifyContent:'center', letterSpacing:'0.02em'}}>
      {member ? member.initials : '?'}
    </div>
  );
}

function CardAvatar({ initials, offset }) {
  const mb = useMember(initials);
  return <Avatar member={mb} size={28} style={{marginLeft:offset>0?-9:0,zIndex:10-offset}}/>;

function DemandCard({ demand, colunaOrdenada }) {
  const { setModal, dragging, setDragging, attach, comments, pipes, user, previewMember, moveStage, setNotifyPending, addComment, reordenarCards } = useApp();
  const sla = getSla(demand.deadline);
  const ps  = PRI_STL[demand.priority] || PRI_STL.Baixa;
  const isDragging = dragging && dragging.id === demand.id;
  const nA = (attach[demand.id]||[]).length;
  const nC = (comments[demand.id]||[]).length;
  const [overPos, setOverPos] = useState(null); // 'antes' | 'depois' | null

  const mesmaColuna = !!dragging && !isDragging && colunaOrdenada
    && dragging.area === demand.area && dragging.stageId === demand.stageId;

  const reordenarAqui = pos => {
    if (!mesmaColuna) return;
    const idsAtuais = colunaOrdenada.map(c=>c.id).filter(id=>id!==dragging.id);
    const idxAlvo = idsAtuais.indexOf(demand.id);
    const novosIds = [...idsAtuais];
    novosIds.splice(pos==='antes'?idxAlvo:idxAlvo+1, 0, dragging.id);
    reordenarCards(novosIds);
  };

  const stages = pipes[demand.area] || [];
  const idx    = stages.findIndex(s => s.id === demand.stageId);
  const stage  = stages[idx];
  const prox   = stages[idx+1];
  const antes  = stages[idx-1];
  const podeDecidir = !!(stage && stage.isApproval && (previewMember ? previewMember.isApprover : user.isApprover));

  const [ajustando, setAjustando] = useState(false);
  const [motivo, setMotivo] = useState('');

  const aprovar = e => {
    e.stopPropagation();
    if (!prox) return;
    if (demand.area === 'Design' && prox.isDone) setNotifyPending({ demandId:demand.id, stageId:prox.id, demandTitle:demand.title });
    else moveStage(demand.id, prox.id);
  };
  const confirmarAjuste = e => {
    e.stopPropagation();
    if (!antes) return;
    if (motivo.trim()) addComment(demand, 'Ajuste solicitado: ' + motivo.trim(), user.initials);
    moveStage(demand.id, antes.id);
    setAjustando(false); setMotivo('');
  };

  return (
    <div
      draggable
      onDragStart={e=>{
        setDragging(demand);
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', demand.id); } catch(err) {}
      }}
      onDragEnd={()=>{setDragging(null); setOverPos(null);}}
      onDragOver={e=>{
        if (!mesmaColuna) return;
        e.preventDefault();
        const r = e.currentTarget.getBoundingClientRect();
        setOverPos(e.clientY - r.top < r.height/2 ? 'antes' : 'depois');
      }}
      onDragLeave={()=>setOverPos(null)}
      onDrop={e=>{
        if (!mesmaColuna) return;
        e.preventDefault(); e.stopPropagation();
        reordenarAqui(overPos||'depois');
        setDragging(null); setOverPos(null);
      }}
      onClick={()=>setModal(demand.id)}
      style={{background:'#fff',borderRadius:11,border:'1px solid '+NB.bd,padding:'14px 15px 13px',cursor:isDragging?'grabbing':'grab',transition:'box-shadow 0.14s, border-color 0.14s, transform 0.14s, opacity 0.14s',marginBottom:10,opacity:isDragging?0.4:1,
        boxShadow: overPos==='antes' ? 'inset 0 3px 0 0 '+NB.azul : overPos==='depois' ? 'inset 0 -3px 0 0 '+NB.azul : 'none'}}
      onMouseEnter={e=>{ if(!dragging){ e.currentTarget.style.boxShadow='0 4px 16px rgba(11,42,92,0.09)'; e.currentTarget.style.borderColor='#CFDCF0'; e.currentTarget.style.transform='translateY(-1px)'; } }}
      onMouseLeave={e=>{e.currentTarget.style.boxShadow='none'; e.currentTarget.style.borderColor=NB.bd; e.currentTarget.style.transform='none';}}>

      <p style={{fontSize:14,fontWeight:500,color:NB.txt,lineHeight:1.45,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden',marginBottom:13}}>
        {demand.recorrente && <span title="Atividade recorrente" style={{color:NB.azul,display:'inline-flex',verticalAlign:'-2px',marginRight:5}}><IRefresh s={13}/></span>}
        {demand.title}
      </p>

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
        <div style={{display:'flex',alignItems:'center',gap:9,minWidth:0}}>
          {sla && (sla.type==='ok'
            ? <span style={{display:'flex',alignItems:'center',gap:6,fontSize:12.5,color:NB.mut}}><ICal/> {sla.label}</span>
            : <span style={{fontSize:12,fontWeight:500,padding:'4px 9px',borderRadius:6,
                background: sla.type==='danger' ? '#FEECEC' : '#FFF6DE',
                color:      sla.type==='danger' ? '#B4232A' : '#8A6206'}}>{sla.label}</span>
          )}
          {nA>0 && <span title={nA+' anexo(s)'} style={{display:'flex',alignItems:'center',gap:3,fontSize:12,color:NB.mut2}}><IClip s={13}/>{nA}</span>}
          {nC>0 && <span title={nC+' comentário(s)'} style={{display:'flex',alignItems:'center',gap:3,fontSize:12,color:NB.mut2}}><IChatBox s={13}/>{nC}</span>}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:9,flexShrink:0}}>
          <span title={'Prioridade '+demand.priority} style={{width:7,height:7,borderRadius:2,background:ps.bdr,flexShrink:0}}/>
          <div style={{display:'flex'}}>
            {demand.assignees.slice(0,3).map((init,i)=>(
              <CardAvatar key={init+i} initials={init} offset={i}/>
            ))}
          </div>
        </div>
      </div>

      {podeDecidir && (
        ajustando ? (
          <div onClick={e=>e.stopPropagation()} style={{marginTop:12,paddingTop:12,borderTop:'1px solid '+NB.bdSoft}}>
            <textarea value={motivo} onChange={e=>setMotivo(e.target.value)} rows={2} autoFocus
              placeholder="O que precisa mudar (opcional)"
              draggable={false}
              style={{...inp,padding:'8px 10px',fontSize:12.5,resize:'vertical',marginBottom:8}}/>
            <div style={{display:'flex',gap:7}}>
              <button draggable={false} onClick={e=>{e.stopPropagation(); setAjustando(false); setMotivo('');}}
                style={{flex:1,padding:'7px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:7,fontSize:12,fontWeight:500,color:NB.mut}}>Cancelar</button>
              <button draggable={false} onClick={confirmarAjuste}
                style={{flex:1,padding:'7px',background:'#B4232A',border:'none',borderRadius:7,fontSize:12,fontWeight:500,color:'#fff'}}>Confirmar</button>
            </div>
          </div>
        ) : (
          <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid '+NB.bdSoft,display:'flex',gap:7}}>
            <button draggable={false} onClick={aprovar}
              style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:6,padding:'8px',background:'#0F6E56',border:'none',borderRadius:8,fontSize:12.5,fontWeight:500,color:'#fff'}}>
              <ICheck s={12}/> Aprovar
            </button>
            <button draggable={false} onClick={e=>{e.stopPropagation(); setAjustando(true);}}
              style={{flex:1,padding:'8px',background:'#FFF6DE',border:'none',borderRadius:8,fontSize:12.5,fontWeight:500,color:'#8A6206'}}>
              Revisar
            </button>
          </div>
        )
      )}
    </div>
  );
}

/* =========== IDENTIDADE VISUAL DAS ETAPAS =========== */
/* Etapas são editáveis por pipeline, então a cor/ícone nunca depende do
   nome — só da posição e das flags isApproval/isDone, que são estáveis. */
const STAGE_CYCLE = [
  { bg:'#F4F9FE', head:'#EEF5FD', bd:'#D6E8FA', ic:NB.azul,  Icon: IFile  },
  { bg:'#F8F5FE', head:'#F1ECFE', bd:'#E9E0FC', ic:NB.roxo,  Icon: IPen   },
  { bg:'#FFF5FA', head:'#FEEDF6', bd:'#FCDCED', ic:NB.pink,  Icon: IBrush },
];
const STAGE_APPROVAL = { bg:'#FFFBEF', head:'#FDF6DC', bd:'#F7E5AC', ic:'#8A6206', Icon: ICheck };
const STAGE_DONE     = { bg:'#F5FEFA', head:'#E9FAF0', bd:'#C3EFDC', ic:'#0F6E56', Icon: IRocket };

function stageVisuals(stages) {
  let regular = 0;
  return stages.map(st => {
    if (st.isApproval) return { st, v: STAGE_APPROVAL };
    if (st.isDone)     return { st, v: STAGE_DONE };
    const v = STAGE_CYCLE[regular % STAGE_CYCLE.length];
    regular += 1;
    return { st, v };
  });
}

function StageColumn({ stage, cards, compact, areaName, visual }) {
  const { dragging, setDragging, moveStage, moveArea, setNotifyPending, setArea, setNewOpen, setPresetNovo, reordenarCards } = useApp();
  const [over, setOver] = useState(false);
  const v = visual || STAGE_CYCLE[0];
  const Icon = v.Icon;
  const cardsOrdenados = [...cards].sort((a,b) => {
    if (a.ordem!=null && b.ordem!=null) return a.ordem-b.ordem;
    if (a.ordem!=null) return -1;
    if (b.ordem!=null) return 1;
    return (a.createdAt||'').localeCompare(b.createdAt||'');
  });

  const otherArea = !!dragging && dragging.area !== areaName;
  /* Aceita qualquer etapa do próprio pipeline, ou qualquer etapa de outro (troca de área) */
  const canDrop = !!dragging && (otherArea || dragging.stageId !== stage.id);

  const handleDrop = e => {
    e.preventDefault();
    setOver(false);
    if (!canDrop) return;
    const d = dragging;
    setDragging(null);
    if (d.area !== areaName) { moveArea(d.id, areaName, stage.id); return; }
    if (d.area === 'Design' && stage.isDone) {
      setNotifyPending({ demandId:d.id, stageId:stage.id, demandTitle:d.title });
    } else {
      moveStage(d.id, stage.id);
    }
  };

  const accent = otherArea ? (AREA_CLR[areaName] || NB.azul) : NB.azul;
  const border = over && canDrop ? '1.5px dashed '+accent
    : canDrop ? '1.5px dashed '+(otherArea ? '#C9D6EA' : NB.azulClaro)
    : '1.5px solid '+v.bd;

  return (
    <div
      onDragOver={e=>{ if(canDrop){ e.preventDefault(); e.dataTransfer.dropEffect='move'; setOver(true); } }}
      onDragLeave={()=>setOver(false)}
      onDrop={handleDrop}

        {cards.length===0 && (
          <div style={{border:'1.5px dashed '+(over&&canDrop?accent:v.bd),borderRadius:10,padding:'22px 10px',textAlign:'center',color:over&&canDrop?accent:NB.mut2,fontSize:12.5,transition:'all 0.12s',display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
            {!(over&&canDrop) && <span style={{color:v.ic,opacity:0.35,display:'flex'}}><Icon s={22}/></span>}

              <button onClick={()=>{ setArea(areaName); setPresetNovo({area:areaName, stageId:stage.id}); setNewOpen(true); }}
                title={'Adicionar demanda direto em '+stage.name}
                style={{display:'flex',alignItems:'center',gap:5,marginTop:2,padding:'5px 11px',background:'#fff',border:'1px solid '+v.bd,borderRadius:20,fontSize:11.5,fontWeight:600,color:v.ic}}>

}

/* Quem está nesta área: o time fixo dela + quem estiver em card dessa área agora */
function AreaPeople({ areaName, cards, max=5 }) {
  const { profiles } = useApp();
  /* Só quem é do setor. Quem apenas participa de um card aparece no próprio card. */
  const inits = TEAM.filter(m => m.area === areaName || (m.areasExtra||[]).includes(areaName)).map(m => m.initials);
  if (!inits.length) return null;

  const show = inits.slice(0, max);
  const resto = inits.length - show.length;

  return (
    <div style={{display:'flex',alignItems:'center',flexShrink:0}}>
      {show.map((init,i) => {
        const base = TEAM.find(m => m.initials === init);
        const mb = base ? { ...base, ...(profiles[base.id]||{}) } : null;
        return <Avatar key={init} member={mb} size={26} ring={false}
          style={{marginLeft:i>0?-8:0, zIndex:max-i, boxShadow:'0 0 0 1.5px '+((mb&&mb.color)||NB.azul)}}/>;
      })}
      {resto>0 && (
        <div title={inits.slice(max).join(', ')}
          style={{width:26,height:26,borderRadius:'50%',marginLeft:-8,background:'#EEF2F8',border:'2px solid #fff',color:NB.mut,fontSize:10,fontWeight:600,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          +{resto}
        </div>
      )}
    </div>
  );
}

function NewPostModal({ onClose, editingPost }) {
  const { addPost, updatePost, active, user } = useApp();
  const socialDemands = active.filter(d => d.area === 'Social');
  const [form, setForm] = useState(() => editingPost ? {
    legenda: editingPost.legenda || '', canal: editingPost.canal || CHANNELS[0].id,
    data: (editingPost.scheduledAt||'').slice(0,10) || dStr(1),
    hora: (editingPost.scheduledAt||'').slice(11,16) || '09:00',
    assignees: editingPost.assignees || [user.initials],
    imageData: editingPost.imageData || null, imageLink: editingPost.imageLink || '',
    demandaId: editingPost.demandaId || '',
  } : {
    legenda: '', canal: CHANNELS[0].id, data: dStr(1), hora: '09:00',
    assignees: [user.initials], imageData: null, imageLink: '', demandaId: '',
  });
  const [linkMode, setLinkMode] = useState(!!(editingPost && editingPost.imageLink));
  const [err, setErr] = useState('');
  const fileRef = useRef(null);

  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const toggleAssignee = i => setForm(f=>({ ...f, assignees: f.assignees.includes(i) ? f.assignees.filter(x=>x!==i) : [...f.assignees,i] }));

  const pickImage = e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    if (!f.type.startsWith('image/')) return setErr('Escolha uma imagem.');
    if (f.size > 700*1024) return setErr('Imagem grande demais (limite 700 KB). Use um link do Canva ou Drive.');
    const rd = new FileReader();
    rd.onload = () => { set('imageData', rd.result); setErr(''); };
    rd.readAsDataURL(f);
  };

  const valido = form.legenda.trim().length > 0 && form.assignees.length > 0;

  const salvar = () => {
    if (!valido) return setErr('Escreva a legenda e escolha ao menos um responsável.');
    if (form.legenda.length > 2200) return setErr('A legenda passou de 2.200 caracteres, o limite do Instagram.');
    const dem = socialDemands.find(d=>d.id===form.demandaId);
    const dados = {
      legenda: form.legenda.trim(), canal: form.canal,
      scheduledAt: form.data + 'T' + form.hora,
      assignees: form.assignees,
      imageData: linkMode ? null : form.imageData,
      imageLink: linkMode ? form.imageLink.trim() : '',
      demandaId: form.demandaId || null, demandaCodigo: dem ? dem.code : null,
    };
    if (editingPost) updatePost(editingPost.id, dados);
    else addPost(dados);
    onClose();
  };

  return (
    <Modal onClose={onClose} width={560}>
      <div style={{padding:'22px 26px 18px',borderBottom:'1px solid '+NB.bdSoft,display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:14}}>
        <div>
          <h2 style={{fontSize:19,fontWeight:600,color:NB.txt,marginBottom:4}}>{editingPost?'Editar publicação':'Nova publicação'}</h2>
          <p style={{fontSize:12.5,color:NB.mut}}>Fica pronta na fila; publicar ainda é manual até a integração com o Meta.</p>
        </div>
        <button onClick={onClose} style={{padding:8,background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,color:NB.mut,display:'flex',flexShrink:0}}><IX/></button>
      </div>

      <div style={{padding:'20px 26px',display:'flex',flexDirection:'column',gap:16}}>
        <div>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:7}}>
            <span style={lbl}>Legenda</span>
            <span style={{fontSize:11.5,color:form.legenda.length>2200?'#B4232A':NB.mut2}}>{form.legenda.length}/2200</span>
          </div>
          <textarea value={form.legenda} onChange={e=>set('legenda',e.target.value)} rows={4}
            placeholder="Escreva a legenda do post..." style={{...inp,padding:'10px 13px',fontSize:13.5,resize:'vertical',lineHeight:1.6}}/>
        </div>

        <div>
          <div style={{...lbl,marginBottom:8}}>Canal</div>
          <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
            {CHANNELS.map(c=>{
              const on = form.canal===c.id; const Icon=c.Icon;
              return (
                <button key={c.id} onClick={()=>set('canal',c.id)}
                  style={{display:'flex',alignItems:'center',gap:7,padding:'8px 13px',borderRadius:9,border:'1px solid '+(on?c.color:NB.bd),background:on?c.color+'14':'#fff',fontSize:12.5,fontWeight:500,color:on?c.color:NB.mut}}>
                  <Icon s={14}/> {c.label}
                </button>
              );
            })}
          </div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:13}}>
          <div>
            <div style={{...lbl,marginBottom:7}}>Data</div>
            <input type="date" value={form.data} onChange={e=>set('data',e.target.value)} style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
          </div>
          <div>
            <div style={{...lbl,marginBottom:7}}>Hora</div>
            <input type="time" value={form.hora} onChange={e=>set('hora',e.target.value)} style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
          </div>
        </div>

        <div>
          <div style={{...lbl,marginBottom:8}}>Mídia</div>
          <div style={{display:'flex',gap:8,marginBottom:10}}>
            <button onClick={()=>setLinkMode(false)} style={{...(linkMode?{}:{}), padding:'7px 13px',borderRadius:8,border:'1px solid '+(!linkMode?NB.azul:NB.bd),background:!linkMode?'#EAF3FD':'#fff',fontSize:12.5,fontWeight:500,color:!linkMode?NB.azul:NB.mut}}>Enviar arquivo</button>
            <button onClick={()=>setLinkMode(true)} style={{padding:'7px 13px',borderRadius:8,border:'1px solid '+(linkMode?NB.azul:NB.bd),background:linkMode?'#EAF3FD':'#fff',fontSize:12.5,fontWeight:500,color:linkMode?NB.azul:NB.mut}}>Link do Canva/Drive</button>
          </div>
          {linkMode ? (
            <input value={form.imageLink} onChange={e=>set('imageLink',e.target.value)} placeholder="https://canva.com/..." style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
          ) : (
            <div style={{display:'flex',alignItems:'center',gap:11}}>
              <button onClick={()=>fileRef.current&&fileRef.current.click()}
                style={{display:'flex',alignItems:'center',gap:7,padding:'9px 14px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:12.5,fontWeight:500,color:NB.mut}}>
                <IClip s={14}/> {form.imageData?'Trocar imagem':'Escolher imagem'}
              </button>
              <input ref={fileRef} type="file" accept="image/*" onChange={pickImage} style={{display:'none'}}/>
              {form.imageData && <img src={form.imageData} alt="" style={{width:36,height:36,borderRadius:7,objectFit:'cover',border:'1px solid '+NB.bd}}/>}
            </div>
          )}
        </div>

        <div>
          <div style={{...lbl,marginBottom:8}}>Responsáveis</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {ACTIVE_TEAM.map(m=><AssigneePick key={m.id} member={m} checked={form.assignees.includes(m.initials)} onToggle={()=>toggleAssignee(m.initials)}/>)}
          </div>
        </div>

        {socialDemands.length>0 && (
          <div>
            <div style={{...lbl,marginBottom:7}}>Vincular a uma demanda do Social (opcional)</div>
            <select value={form.demandaId} onChange={e=>set('demandaId',e.target.value)} style={{...inp,padding:'9px 12px',fontSize:13.5}}>
              <option value="">Nenhuma</option>
              {socialDemands.map(d=><option key={d.id} value={d.id}>{d.code} — {d.title.slice(0,44)}</option>)}
            </select>
          </div>
        )}

        {err && <div style={{padding:'10px 13px',background:'#FEF2F2',border:'1px solid #FECACA',borderRadius:9,fontSize:12.5,color:'#B4232A'}}>{err}</div>}
      </div>

      <div style={{padding:'16px 26px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'flex-end',gap:10}}>
        <button onClick={onClose} style={{padding:'10px 18px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>Cancelar</button>
        <button onClick={salvar} disabled={!valido}
          style={{padding:'10px 22px',background:valido?NB.azul:'#CFD8E6',border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',cursor:valido?'pointer':'not-allowed'}}>
          {editingPost?'Salvar':'Adicionar à fila'}
        </button>
      </div>
    </Modal>
  );
}

const CAPA_GRADIENTES = [
  ['#002D72','#0072CE'], ['#6431E2','#41B6E6'], ['#FF40B3','#6431E2'], ['#0072CE','#41B6E6'], ['#002D72','#6431E2'],
];

function tempoRelativo(iso) {
  if (!iso) return '';
  const dias = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (dias<=0) return 'hoje';
  if (dias===1) return 'há 1 dia';
  if (dias<7) return 'há '+dias+' dias';
  const semanas = Math.floor(dias/7);
  if (semanas===1) return 'há 1 semana';
  if (semanas<5) return 'há '+semanas+' semanas';
  const meses = Math.floor(dias/30);
  return meses<=1 ? 'há 1 mês' : 'há '+meses+' meses';
}

function SolicitarPecaInline() {
  const { user } = useApp();
  const [f, setF] = useState({ titulo:'', setor:'', tipo:'', descricao:'', prazo:'', referencia:'' });
  const [err, setErr] = useState('');
  const [enviando, setEnviando] = useState(false);
  const [enviado, setEnviado] = useState(false);
  const set = (k,v) => { setF(x=>({...x,[k]:v})); setErr(''); };

  const enviar = async () => {
    if (!f.titulo.trim()) return setErr('Conta o que você precisa.');
    if (!f.setor.trim()) return setErr('Preenche o seu setor.');
    if (!f.descricao.trim()) return setErr('Descreve o contexto e o objetivo — isso ajuda bastante o time a entender rápido.');
    setEnviando(true);
    try {
      const db = firebase.firestore();
      await db.collection('solicitacoes').add({
        titulo: f.titulo.trim(), setor: f.setor.trim(), tipo: f.tipo.trim(),
        descricao: f.descricao.trim(), prazo: f.prazo || '', referencia: f.referencia.trim(),
        solicitante: user.name, email: user.email, status: 'novo', criadoEm: new Date().toISOString(),
      });
      setEnviado(true);
      setF({ titulo:'', setor:'', tipo:'', descricao:'', prazo:'', referencia:'' });
      setTimeout(()=>setEnviado(false), 4000);
    } catch (e) {
      setErr(e && e.message ? 'Não foi possível enviar: '+e.message : 'Não foi possível enviar.');
    } finally {
      setEnviando(false);
    }
  };

  return (
    <div style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:16,padding:22,display:'flex',flexDirection:'column',gap:14,boxShadow:'0 6px 20px rgba(11,42,92,0.06)'}}>
      <div>
        <div style={{fontSize:11,fontWeight:600,color:NB.mut,marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>O que você precisa</div>
        <input value={f.titulo} onChange={e=>set('titulo',e.target.value)} placeholder="Ex: banner para a campanha de vagas"
          style={{width:'100%',background:NB.col,border:'1.5px solid '+NB.bd,borderRadius:9,padding:'9px 12px',fontSize:12.5,color:NB.txt,outline:'none',boxSizing:'border-box'}}/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div>
          <div style={{fontSize:11,fontWeight:600,color:NB.mut,marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>Seu setor</div>
          <input value={f.setor} onChange={e=>set('setor',e.target.value)} placeholder="Ex: Vendas, Suporte..."
            style={{width:'100%',background:NB.col,border:'1.5px solid '+NB.bd,borderRadius:9,padding:'9px 12px',fontSize:12.5,color:NB.txt,outline:'none',boxSizing:'border-box'}}/>
        </div>
        <div>
          <div style={{fontSize:11,fontWeight:600,color:NB.mut,marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>Tipo de material</div>
          <input value={f.tipo} onChange={e=>set('tipo',e.target.value)} placeholder="Ex: Post, banner, vídeo..."
            style={{width:'100%',background:NB.col,border:'1.5px solid '+NB.bd,borderRadius:9,padding:'9px 12px',fontSize:12.5,color:NB.txt,outline:'none',boxSizing:'border-box'}}/>
        </div>
      </div>
      <div>
        <div style={{fontSize:11,fontWeight:600,color:NB.mut,marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>Contexto e objetivo</div>
        <textarea value={f.descricao} onChange={e=>set('descricao',e.target.value)} rows={2} placeholder="Para que serve, onde vai ser usado..."
          style={{width:'100%',background:NB.col,border:'1.5px solid '+NB.bd,borderRadius:9,padding:'9px 12px',fontSize:12.5,color:NB.txt,outline:'none',boxSizing:'border-box',resize:'vertical',fontFamily:'inherit'}}/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div>
          <div style={{fontSize:11,fontWeight:600,color:NB.mut,marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>Precisa para quando</div>
          <input type="date" value={f.prazo} onChange={e=>set('prazo',e.target.value)}
            style={{width:'100%',background:NB.col,border:'1.5px solid '+NB.bd,borderRadius:9,padding:'9px 12px',fontSize:12.5,color:NB.txt,outline:'none',boxSizing:'border-box'}}/>
        </div>
        <div>
          <div style={{fontSize:11,fontWeight:600,color:NB.mut,marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>Link de referência</div>
          <input value={f.referencia} onChange={e=>set('referencia',e.target.value)} placeholder="Drive, Figma..."
            style={{width:'100%',background:NB.col,border:'1.5px solid '+NB.bd,borderRadius:9,padding:'9px 12px',fontSize:12.5,color:NB.txt,outline:'none',boxSizing:'border-box'}}/>
        </div>
      </div>
      {err && <p style={{fontSize:12.5,color:'#B4232A',margin:0}}>{err}</p>}
      {enviado && <p style={{fontSize:12.5,color:'#0F6E56',margin:0}}>Pedido enviado! O time de Marketing já recebeu.</p>}
      <button onClick={enviar} disabled={enviando}
        style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,background:NB.navy1,color:'#fff',padding:'12px 22px',border:'none',borderRadius:10,fontWeight:600,fontSize:13.5,opacity:enviando?0.7:1,cursor:enviando?'wait':'pointer'}}>
        {enviando ? 'Enviando…' : 'Solicitar demanda ao marketing'} {!enviando && <IArrowR s={13}/>}
      </button>
    </div>
  );
}

function ArquivosTab({ podeEditar }) {
  const { arquivos: arquivosTodos, isTeamMember, addArquivo, removeArquivo } = useApp();
  const [novo, setNovo] = useState(false);
  const [corrigindo, setCorrigindo] = useState(false);

  /* A regra do Firestore libera tudo pra quem está logada — quem não é do
     time de marketing não deve ver a categoria "Apenas time de Marketing". */
  const arquivosDoBanco = isTeamMember ? arquivosTodos : arquivosTodos.filter(a => a.categoria !== 'restrito');

  /* Os arquivos padrão sempre aparecem, e o que for adicionado de verdade
     entra junto — nunca é tudo ou nada. Se algum dia um item real usar a
     mesma URL de um padrão, o padrão correspondente some pra não duplicar. */
  const padroesRestantes = ARQUIVOS_CORRIGIDOS
    .filter(padrao => !arquivosDoBanco.some(real => real.url === padrao.url))
    .map((item, i) => ({ ...item, id: 'padrao-'+i, ehPadrao: true }));
  const arquivos = [...arquivosDoBanco, ...padroesRestantes];

  const temLinksRuins = arquivosDoBanco.some(a => a.url === URL_PLACEHOLDER_RUIM);

  const corrigirLinks = () => {
    setCorrigindo(true);
    arquivosDoBanco.filter(a => a.url === URL_PLACEHOLDER_RUIM).forEach(a => removeArquivo(a.id));
    ARQUIVOS_CORRIGIDOS.forEach(item => addArquivo(item));
    setTimeout(()=>setCorrigindo(false), 700);
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'flex-end',gap:9,marginBottom:14,flexWrap:'wrap'}}>
        {podeEditar && temLinksRuins && (
          <button onClick={corrigirLinks} disabled={corrigindo}
            style={{display:'flex',alignItems:'center',gap:7,padding:'9px 15px',background:'#FFF6DE',border:'1px solid #F3D98A',borderRadius:9,fontSize:13,fontWeight:500,color:'#8A6206',opacity:corrigindo?0.6:1}}>
            <IRefresh s={13}/> {corrigindo?'Corrigindo…':'Corrigir links duplicados'}
          </button>
        )}
        {podeEditar && (
          <button onClick={()=>setNovo(true)}
            style={{display:'flex',alignItems:'center',gap:7,padding:'9px 15px',background:NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>
            <IPlus s={13}/> Adicionar link
          </button>
        )}
      </div>
      {Object.entries(CATEGORIAS_ARQUIVO).map(([cat,label])=>{
        const itens = arquivos.filter(a=>a.categoria===cat);
        if (itens.length===0) return null;
        const v = ARQUIVO_VISUAL[cat];
        const CatIcon = v.Icon;
        return (
          <div key={cat} style={{marginBottom:36}}>
            <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',marginBottom:24}}>
              <h2 style={{fontSize:22,fontWeight:600,color:NB.txt}}>{label}</h2>
              <span style={{fontSize:12,color:NB.mut2,fontWeight:500}}>{itens.length} {itens.length===1?'arquivo':'arquivos'}</span>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:20}}>
              {itens.map(a=>(
                <div key={a.id} style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:16,padding:22,display:'flex',gap:16,alignItems:'flex-start',transition:'border-color 0.15s ease'}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor=NB.azul} onMouseLeave={e=>e.currentTarget.style.borderColor=NB.bd}>
                  <div style={{width:44,height:44,borderRadius:12,background:NB.navy1,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <CatIcon s={18}/>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <h4 style={{fontSize:15,fontWeight:600,color:NB.txt,marginBottom:5,lineHeight:1.3}}>{a.nome}</h4>
                    <span style={{fontSize:12,color:NB.mut2}}>{a.descricao || 'Link externo'}</span>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:10}}>
                      <a href={a.url} target="_blank" rel="noopener noreferrer"
                        style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:12.5,fontWeight:600,color:NB.azul,textDecoration:'none'}}>
                        Baixar arquivo <IDown s={11}/>
                      </a>
                      {podeEditar && !a.ehPadrao && <button onClick={()=>removeArquivo(a.id)} style={{fontSize:11,color:'#B4232A',background:'none',border:'none'}}>Remover</button>}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      })}
      {arquivos.length===0 && (
        <div style={{background:'#fff',border:'1px dashed '+NB.bd,borderRadius:16,padding:'48px 24px',textAlign:'center'}}>
          <div style={{width:52,height:52,borderRadius:14,background:NB.col,color:NB.mut2,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}}>
            <IFile s={23}/>
          </div>
          <p style={{fontSize:14,fontWeight:600,color:NB.txt,marginBottom:6}}>Nenhum arquivo cadastrado ainda</p>
        </div>
      )}
      {novo && <ArquivoModal onClose={()=>setNovo(false)}/>}
    </div>
  );
}

/* ---------- Embaixadores ---------- */
function EmbaixadorModal({ onClose }) {
  const { addEmbaixador, criarPortalEmbaixador, MAX_FILE } = useApp();
  const [f, setF] = useState({ nome:'', cargo:'', empresa:'', instagram:'', descricao:'', foto:'', especialidades:[] });
  const [novaEspecialidade, setNovaEspecialidade] = useState('');
  const [comPortal, setComPortal] = useState(false);
  const [portal, setPortal] = useState({ email:'', senha:'', contratoUrl:'', lpUrl:'' });
  const [materiais, setMateriais] = useState([]);
  const [novoMaterial, setNovoMaterial] = useState({ nome:'', url:'' });
  const [guias, setGuias] = useState([]);
  const [novoGuia, setNovoGuia] = useState({ nome:'', url:'', descricao:'' });
  const [err, setErr] = useState('');
  const [salvando, setSalvando] = useState(false);
  const [removendoFundo, setRemovendoFundo] = useState(false);
  const set=(k,v)=>{setF(x=>({...x,[k]:v})); setErr('');};
  const setP=(k,v)=>{setPortal(x=>({...x,[k]:v})); setErr('');};
  const adicionarGuia = () => {
    if (!novoGuia.nome.trim() || !novoGuia.url.trim()) return setErr('Preencha nome e link do guia.');
    let url = novoGuia.url.trim();
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    setGuias(g => [...g, { nome: novoGuia.nome.trim(), url, descricao: novoGuia.descricao.trim() }]);
    setNovoGuia({ nome:'', url:'', descricao:'' }); setErr('');
  };
  const removerGuia = i => setGuias(g => g.filter((_,ix)=>ix!==i));

  const escolherFoto = async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 8*1024*1024) return setErr('A foto tem '+Math.round(file.size/1024)+'KB — tenta uma bem menor (até uns 8MB de origem).');
    setErr(''); setRemovendoFundo(true);

    /* Junta o recorte (com ou sem fundo removido) num fundo azul claro e
       exporta como JPEG redimensionado — bem mais leve que um PNG
       transparente, que é o que fazia quase toda foto real ser recusada. */
    const achatarEmJpeg = blob => new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const maxLado = 640;
        const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
        const w = Math.round(img.width * escala), h = Math.round(img.height * escala);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#EAF3FD';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(blob);
    });
    const verificarTamanho = dataUrl => {
      if (dataUrl.length > MAX_FILE) throw new Error('A foto ficou com '+Math.round(dataUrl.length/1024)+'KB depois de processada — o limite é '+Math.round(MAX_FILE/1024)+'KB. Tenta uma foto de origem menor ou mais simples.');
      return dataUrl;
    };
    try {
      const { default: removerFundo } = await import('https://esm.sh/@imgly/background-removal@1.5.7');
      const blobSemFundo = await removerFundo(file);
      const dataUrl = verificarTamanho(await achatarEmJpeg(blobSemFundo));
      setF(x=>({...x, foto: dataUrl}));
    } catch (err) {
      try {
        const dataUrl = verificarTamanho(await achatarEmJpeg(file));
        setF(x=>({...x, foto: dataUrl}));
        setErr('Não deu pra remover o fundo automaticamente ('+(err&&err.message?err.message:'erro desconhecido')+') — a foto foi salva do jeito que veio.');
      } catch (err2) {
        setErr(err2 && err2.message ? err2.message : 'Não foi possível processar essa foto.');
      }
    } finally {
      setRemovendoFundo(false);
    }
  };
  const adicionarEspecialidade = () => {
    const v = novaEspecialidade.trim();
    if (!v) return;
    setF(x=>({...x, especialidades:[...(x.especialidades||[]), v]}));
    setNovaEspecialidade('');
  };
  const removerEspecialidade = i => setF(x=>({...x, especialidades:x.especialidades.filter((_,ix)=>ix!==i)}));

  const adicionarMaterial = () => {
    if (!novoMaterial.nome.trim() || !novoMaterial.url.trim()) return setErr('Preencha nome e link do material.');
    let url = novoMaterial.url.trim();
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    setMateriais(m => [...m, { nome: novoMaterial.nome.trim(), url }]);
    setNovoMaterial({ nome:'', url:'' }); setErr('');
  };
  const removerMaterial = i => setMateriais(m => m.filter((_,ix)=>ix!==i));

  const salvar = async () => {
    if (!f.nome.trim()) return setErr('Preencha o nome.');
    if (comPortal) {
      if (!portal.email.trim()) return setErr('Preencha o e-mail de acesso do embaixador.');
      if (!portal.senha || portal.senha.length<6) return setErr('A senha inicial precisa ter pelo menos 6 caracteres.');
    }
    setSalvando(true);
    const rEmb = await addEmbaixador(f);
    if (!rEmb.ok) { setErr('Não foi possível salvar: '+rEmb.erro); setSalvando(false); return; }
    if (comPortal) {
      const r = await criarPortalEmbaixador({
        email: portal.email.trim(), nome: f.nome.trim(), foto: f.foto,
        contratoUrl: portal.contratoUrl.trim(), lpUrl: portal.lpUrl.trim(), materiais,
      }, portal.senha);
      if (!r.ok) { setErr(r.erro); setSalvando(false); return; }
    }
    setSalvando(false);
    onClose();
  };

  return (
    <Modal onClose={onClose} width={480}>
      <div style={{padding:'22px 24px 16px',borderBottom:'1px solid '+NB.bdSoft}}>
        <h2 style={{fontSize:17,fontWeight:600,color:NB.txt}}>Novo embaixador</h2>
      </div>
      <div style={{padding:'20px 24px',display:'flex',flexDirection:'column',gap:12,maxHeight:'62vh',overflowY:'auto'}}>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <div style={{width:56,height:56,borderRadius:14,overflow:'hidden',background:'#EAF3FD',border:'1px solid '+NB.bd,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,position:'relative'}}>
            {removendoFundo ? (
              <div style={{width:16,height:16,border:'2px solid '+NB.bd,borderTopColor:NB.azul,borderRadius:'50%',animation:'nb-spin 0.8s linear infinite'}}/>
            ) : f.foto ? (
              <img src={f.foto} alt="" style={{width:'100%',height:'100%',objectFit:'contain'}}/>
            ) : <IStamp s={20} color={NB.mut2}/>}
          </div>
          <div>
            <label style={{fontSize:12.5,fontWeight:600,color:removendoFundo?NB.mut2:NB.azul,cursor:removendoFundo?'default':'pointer',padding:'8px 14px',border:'1px solid '+NB.bd,borderRadius:9,display:'inline-block'}}>
              {removendoFundo ? 'Removendo fundo…' : (f.foto?'Trocar foto':'Adicionar foto')}
              <input type="file" accept="image/*" onChange={escolherFoto} disabled={removendoFundo} style={{display:'none'}}/>
            </label>
            <p style={{fontSize:11,color:NB.mut2,marginTop:5}}>O fundo é removido automaticamente.</p>
          </div>
        </div>
        <input value={f.nome} onChange={e=>set('nome',e.target.value)} placeholder="Nome" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <input value={f.cargo} onChange={e=>set('cargo',e.target.value)} placeholder="Cargo (ex: Mentora e CEO)" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
          <input value={f.empresa} onChange={e=>set('empresa',e.target.value)} placeholder="Empresa (opcional)" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
        </div>
        <input value={f.instagram} onChange={e=>set('instagram',e.target.value)} placeholder="@instagram ou link" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
        <textarea value={f.descricao} onChange={e=>set('descricao',e.target.value)} rows={2} placeholder="Como ele colabora com o Nibo" style={{...inp,padding:'9px 12px',fontSize:13.5,resize:'vertical'}}/>

        <div>
          <div style={{fontSize:11,fontWeight:600,color:NB.mut,marginBottom:7,textTransform:'uppercase',letterSpacing:'0.05em'}}>Especialidades e áreas de conhecimento</div>
          {(f.especialidades||[]).length>0 && (
            <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:8}}>
              {f.especialidades.map((t,i)=>(
                <span key={i} style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:NB.azul,background:'#EAF3FD',borderRadius:20,padding:'4px 10px'}}>
                  {t} <button type="button" onClick={()=>removerEspecialidade(i)} style={{background:'none',border:'none',color:NB.azul,fontWeight:700,lineHeight:1}}>×</button>
                </span>
              ))}
            </div>
          )}
          <div style={{display:'flex',gap:7}}>
            <input value={novaEspecialidade} onChange={e=>setNovaEspecialidade(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault(); adicionarEspecialidade();}}}
              placeholder="Ex: Gestão financeira" style={{...inp,padding:'8px 11px',fontSize:12.5,flex:1}}/>
            <button type="button" onClick={adicionarEspecialidade} style={{padding:'8px 14px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:12,fontWeight:600,color:NB.azul}}>+</button>
          </div>
        </div>

        <div style={{background:comPortal?'#FFF0F8':NB.col,border:'1px solid '+(comPortal?'#FBC5E3':NB.bd),borderRadius:11,padding:'13px 15px'}}>
          <label style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}}>
            <input type="checkbox" checked={comPortal} onChange={e=>{setComPortal(e.target.checked); setErr('');}} style={{width:16,height:16,accentColor:NB.pink}}/>
            <span style={{fontSize:13.5,fontWeight:500,color:NB.txt}}>Criar acesso ao Portal do Embaixador</span>
          </label>
          {comPortal && (
            <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:13}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                <input type="email" value={portal.email} onChange={e=>setP('email',e.target.value)} placeholder="E-mail de acesso" style={{...inp,padding:'8px 11px',fontSize:12.5,background:'#fff'}}/>
                <input type="text" value={portal.senha} onChange={e=>setP('senha',e.target.value)} placeholder="Senha inicial (mín. 6 caracteres)" style={{...inp,padding:'8px 11px',fontSize:12.5,background:'#fff'}}/>
              </div>
              <input value={portal.contratoUrl} onChange={e=>setP('contratoUrl',e.target.value)} placeholder="Link do contrato (opcional por agora)" style={{...inp,padding:'8px 11px',fontSize:12.5,background:'#fff'}}/>
              <input value={portal.lpUrl} onChange={e=>setP('lpUrl',e.target.value)} placeholder="Link da LP personalizada (opcional por agora)" style={{...inp,padding:'8px 11px',fontSize:12.5,background:'#fff'}}/>

              <div>
                <div style={{fontSize:11,fontWeight:600,color:NB.mut,marginBottom:7,textTransform:'uppercase',letterSpacing:'0.05em'}}>Materiais pra divulgar</div>
                {materiais.length>0 && (
                  <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:9}}>
                    {materiais.map((m,i)=>(
                      <div key={i} style={{display:'flex',alignItems:'center',gap:8,background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,padding:'6px 10px'}}>
                        <span style={{fontSize:12.5,color:NB.txt,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.nome}</span>
                        <button type="button" onClick={()=>removerMaterial(i)} style={{fontSize:11,color:'#B4232A',background:'none',border:'none'}}>Remover</button>
                      </div>
                    ))}
                  </div>
                )}
                <div style={{display:'flex',gap:7}}>
                  <input value={novoMaterial.nome} onChange={e=>{setNovoMaterial(v=>({...v,nome:e.target.value})); setErr('');}} placeholder="Nome" style={{...inp,padding:'7px 10px',fontSize:12,flex:1,background:'#fff'}}/>
                  <input value={novoMaterial.url} onChange={e=>{setNovoMaterial(v=>({...v,url:e.target.value})); setErr('');}} placeholder="Link" style={{...inp,padding:'7px 10px',fontSize:12,flex:1,background:'#fff'}}/>
                  <button type="button" onClick={adicionarMaterial} style={{padding:'7px 12px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:11.5,fontWeight:500,color:NB.pink,flexShrink:0}}>+</button>
                </div>
              </div>

              <div>
                <div style={{fontSize:11,fontWeight:600,color:NB.mut,marginBottom:7,textTransform:'uppercase',letterSpacing:'0.05em'}}>Guias e materiais de apoio</div>
                <p style={{fontSize:11,color:NB.mut2,marginBottom:8}}>O primeiro da lista aparece em destaque pra ela.</p>
                {guias.length>0 && (
                  <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:9}}>
                    {guias.map((g,i)=>(
                      <div key={i} style={{display:'flex',alignItems:'center',gap:8,background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,padding:'6px 10px'}}>
                        {i===0 && <span style={{fontSize:10,fontWeight:700,color:NB.pink}}>DESTAQUE</span>}
                        <span style={{fontSize:12.5,color:NB.txt,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{g.nome}</span>
                        <button type="button" onClick={()=>removerGuia(i)} style={{fontSize:11,color:'#B4232A',background:'none',border:'none'}}>Remover</button>
                      </div>
                    ))}
                  </div>
                )}
                <div style={{display:'flex',flexDirection:'column',gap:7}}>
                  <div style={{display:'flex',gap:7}}>
                    <input value={novoGuia.nome} onChange={e=>{setNovoGuia(v=>({...v,nome:e.target.value})); setErr('');}} placeholder="Nome" style={{...inp,padding:'7px 10px',fontSize:12,flex:1,background:'#fff'}}/>
                    <input value={novoGuia.url} onChange={e=>{setNovoGuia(v=>({...v,url:e.target.value})); setErr('');}} placeholder="Link" style={{...inp,padding:'7px 10px',fontSize:12,flex:1,background:'#fff'}}/>
                  </div>
                  <div style={{display:'flex',gap:7}}>
                    <input value={novoGuia.descricao} onChange={e=>{setNovoGuia(v=>({...v,descricao:e.target.value})); setErr('');}} placeholder="Descrição (opcional, só o destaque usa)" style={{...inp,padding:'7px 10px',fontSize:12,flex:1,background:'#fff'}}/>
                    <button type="button" onClick={adicionarGuia} style={{padding:'7px 12px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:11.5,fontWeight:500,color:NB.pink,flexShrink:0}}>+</button>
                  </div>
                </div>
              </div>
              <p style={{fontSize:11.5,color:NB.mut2,lineHeight:1.5,margin:0}}>Exige que o login por e-mail/senha esteja habilitado no Firebase (Authentication → Sign-in method).</p>
            </div>
          )}
        </div>

        {err && <p style={{fontSize:12.5,color:'#B4232A'}}>{err}</p>}
      </div>
      <div style={{padding:'16px 24px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'flex-end',gap:10}}>
        <button onClick={onClose} style={{padding:'10px 16px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>Cancelar</button>
        <button onClick={salvar} disabled={salvando}
          style={{padding:'10px 20px',background:NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',opacity:salvando?0.7:1}}>
          {salvando?'Salvando…':'Salvar'}
        </button>
      </div>
    </Modal>
  );
}

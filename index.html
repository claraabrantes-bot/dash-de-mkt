const Ctx = createContext(null);

function Provider({ children }) {
  const cntRef = useRef(INIT_DEMANDS.length);
  const [demands, setDemands] = useState(() => {
    try { const s=localStorage.getItem('nibo_dem_v3'); return s ? JSON.parse(s) : INIT_DEMANDS; } catch { return INIT_DEMANDS; }
  });
  const [slack, setSlack] = useState(() => {
    try { const s=localStorage.getItem('nibo_slk_v3'); return s ? JSON.parse(s) : INIT_SLACK; } catch { return INIT_SLACK; }
  });
  const [photos, setPhotos] = useState(() => {
    try { const s=localStorage.getItem('nibo_photos_v1'); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });
  const [profiles, setProfiles] = useState(() => {
    try { const s=localStorage.getItem('nibo_profiles_v1'); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });

  /* --- Autenticação Google via Firebase --- */
  const [fbUser, setFbUser]       = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [authError, setAuthError] = useState('');

  const [view, setView]     = useState('kanban');
  const [area, setArea]     = useState('Social');
  const [query, setQuery]   = useState('');
  const [modal, setModal]   = useState(null);
  const [newOpen, setNewOpen] = useState(false);
  const [notifyPending, setNotifyPending] = useState(null);
  const [profileOpen, setProfileOpen] = useState(false);

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged(u => {
      if (!u) { setFbUser(null); setAuthReady(true); return; }
      const mail = (u.email || '').toLowerCase();
      if (!mail.endsWith(NIBO_DOMAIN)) {
        setAuthError('Acesso restrito a contas ' + NIBO_DOMAIN + '. Você entrou com ' + mail + '.');
        firebase.auth().signOut();
        return;
      }
      const found = ACTIVE_TEAM.find(m => m.email === mail);
      if (!found) {
        setAuthError('A conta ' + mail + ' não está na lista da equipe de Marketing. Peça para adicionarem seu e-mail.');
        firebase.auth().signOut();
        return;
      }
      setAuthError('');
      setFbUser({ email: mail, photoURL: u.photoURL || null, displayName: u.displayName || '' });
      setAuthReady(true);
    });
    return unsub;
  }, []);

  const baseUser = fbUser ? ACTIVE_TEAM.find(m => m.email === fbUser.email) : null;
  const user = baseUser
    ? { ...baseUser, googlePhoto: fbUser.photoURL, ...(profiles[baseUser.id] || {}) }
    : null;

  useEffect(() => { try { localStorage.setItem('nibo_dem_v3', JSON.stringify(demands)); } catch {} }, [demands]);
  useEffect(() => { try { localStorage.setItem('nibo_slk_v3', JSON.stringify(slack)); } catch {} }, [slack]);
  useEffect(() => { try { localStorage.setItem('nibo_photos_v1', JSON.stringify(photos)); } catch {} }, [photos]);
  useEffect(() => { try { localStorage.setItem('nibo_profiles_v1', JSON.stringify(profiles)); } catch {} }, [profiles]);

  const logout = useCallback(() => {
    setProfileOpen(false); setModal(null); setNewOpen(false); setNotifyPending(null);
    firebase.auth().signOut();
  }, []);

  const savePhoto   = useCallback((id, dataUrl) => setPhotos(p=>({...p,[id]:dataUrl})), []);
  const removePhoto = useCallback(id => setPhotos(p => { const n={...p}; delete n[id]; return n; }), []);
  const saveProfile = useCallback((id, patch) => setProfiles(p=>({...p,[id]:{...(p[id]||{}),...patch}})), []);

  const mentionNames = (inits) => inits.map(i => { const m=TEAM.find(t=>t.initials===i); return '@'+(m?m.name:i); }).join(' ');

  const addDemand = useCallback((data) => {
    const cnt = ++cntRef.current;
    const nd = { ...data, id:'d'+Date.now(), code:'DEM-'+(108+cnt), stageId:PIPELINES[data.area][0].id, createdAt:new Date().toISOString() };
    setDemands(p => [nd,...p]);
    const who = data.assignees && data.assignees.length ? mentionNames(data.assignees) : 'equipe de '+data.area;
    setSlack(p => [{ id:'s'+Date.now(), code:nd.code, area:data.area, time:t(new Date()), stagePath:'Nova demanda criada', action:'Solicitação registrada por '+data.requester+' — destinada a '+who, next:'Demanda solicitada no Slack para '+who, type:'new' }, ...p]);
    return nd;
  }, []);

  const moveStage = useCallback((demId, newStageId, notifyTargets) => {
    setDemands(p => p.map(d => {
      if (d.id !== demId) return d;
      const oldStage = Object.values(PIPELINES).flat().find(s=>s.id===d.stageId);
      const newStage = Object.values(PIPELINES).flat().find(s=>s.id===newStageId);
      let assignees = d.assignees;
      if (newStage && newStage.isApproval && !assignees.includes('MA')) {
        assignees = [...assignees, 'MA'];
      }
      const auto = AUTO[d.area] && AUTO[d.area][newStageId];
      if (auto) {
        let action = auto.action;
        if (notifyTargets && notifyTargets.length) {
          action = action + ' — ' + mentionNames(notifyTargets) + ' notificados no Slack';
        }
        setSlack(sp => [{ id:'s'+Date.now(), code:d.code, area:d.area, time:t(new Date()), stagePath:(oldStage?oldStage.name:'?')+' → '+(newStage?newStage.name:'?'), action, next:auto.next, type:newStage&&newStage.isApproval?'approval':'move' }, ...sp]);
      }
      return {...d, stageId:newStageId, assignees};
    }));
  }, []);

  const delDemand = useCallback((id) => {
    setDemands(p=>p.filter(d=>d.id!==id));
    setModal(null);
  }, []);

  const reset = useCallback(() => { setDemands(INIT_DEMANDS); setSlack(INIT_SLACK); cntRef.current=INIT_DEMANDS.length; }, []);

  const filtered = demands.filter(d => {
    if (area !== 'Todas' && d.area !== area) return false;
    if (query.trim()) { const q=query.toLowerCase(); return d.title.toLowerCase().includes(q)||d.code.toLowerCase().includes(q); }
    return true;
  });

  const selDemand = modal ? demands.find(d=>d.id===modal)||null : null;

  return <Ctx.Provider value={{ demands, filtered, slack, user, authReady, authError, setAuthError, view, setView, area, setArea, query, setQuery, selDemand, setModal, newOpen, setNewOpen, notifyPending, setNotifyPending, profileOpen, setProfileOpen, photos, profiles, logout, savePhoto, removePhoto, saveProfile, addDemand, moveStage, delDemand, reset }}>{children}</Ctx.Provider>;
}

const useApp = () => useContext(Ctx);

/* Nome/foto podem ter sido editados no perfil — resolve o membro já com essas mudanças */
function useMember(initials) {
  const { profiles } = useApp();
  const base = TEAM.find(m=>m.initials===initials);
  return base ? { ...base, ...(profiles[base.id]||{}) } : null;
}

/* =========== UTILS =========== */
function getSla(dl) {
  if (!dl) return null;
  const diff = Math.ceil((new Date(dl)-new Date())/86400000);
  if (diff < 0) return { label:'Atrasado '+Math.abs(diff)+'d', type:'danger' };
  if (diff <= 2) return { label:'Vence em '+diff+'d', type:'warn' };
  return { label:diff+'d', type:'ok' };
}
function fmtDate(s) { if(!s) return ''; const [,m,d]=s.split('-'); return d+'/'+m; }

/* Foto do perfil quando existe, foto do Google depois, iniciais como último recurso */
function Avatar({ member, size=32, ring=true, style, src }) {
  const { photos } = useApp();
  /* src !== undefined vence o que está salvo — usado pelo preview do perfil */
  const photo = src !== undefined ? src : (member && (photos[member.id] || member.googlePhoto));
  const clr = (member && member.color) || NB.azul;
  const base = { width:size, height:size, borderRadius:'50%', flexShrink:0, border:'2px solid #fff', boxShadow: ring ? '0 0 0 2px '+clr : 'none', ...style };
  if (photo) return <img src={photo} alt={member.name} title={member.name} style={{...base, objectFit:'cover'}}/>;
  return (
    <div title={member?member.name:''} style={{...base, background:clr, color:'#fff', fontSize:Math.round(size*0.38), fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center'}}>
      {member ? member.initials : '?'}
    </div>
  );
}

/* =========== LOGIN =========== */
function LoginScreen() {
  const { photos, authError, setAuthError } = useApp();
  const [busy, setBusy]   = useState(false);
  const [local, setLocal] = useState('');

  const signIn = async () => {
    setBusy(true); setLocal(''); setAuthError('');
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ hd: 'nibo.com.br', prompt: 'select_account' });
      await firebase.auth().signInWithPopup(provider);
      /* Quem assume daqui é o onAuthStateChanged no Provider */
    } catch (err) {
      const code = err && err.code;
      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
        /* fechou o popup de propósito — sem erro na tela */
      } else if (code === 'auth/unauthorized-domain') {
        setLocal('Este endereço não está autorizado no Firebase. Adicione o domínio em Authentication → Settings → Authorized domains.');
      } else if (code === 'auth/popup-blocked') {
        setLocal('Seu navegador bloqueou a janela do Google. Libere pop-ups para este site e tente de novo.');
      } else if (code === 'auth/operation-not-allowed') {
        setLocal('O login com Google está desligado no Firebase. Ative em Authentication → Sign-in method → Google.');
      } else {
        setLocal('Não foi possível entrar. Erro: ' + (code || 'desconhecido'));
      }
      setBusy(false);
    }
  };

  const msg = local || authError;

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24,
      background:'radial-gradient(1200px 600px at 15% -10%, '+NB.roxo+'26, transparent 60%), radial-gradient(900px 500px at 100% 100%, '+NB.pink+'1F, transparent 55%), linear-gradient(160deg,#001B45,'+NB.petroleo+' 55%,#003E93)'}}>
      <div style={{width:'100%',maxWidth:1000,display:'grid',gridTemplateColumns:'1.05fr 1fr',background:'#fff',borderRadius:24,overflow:'hidden',boxShadow:'0 30px 80px rgba(0,20,60,0.45)'}}>

        {/* Lado marca */}

          <div style={{position:'absolute',width:320,height:320,borderRadius:'50%',background:NB.pink,opacity:0.16,right:-120,top:-90}}/>
          <div style={{position:'absolute',width:220,height:220,borderRadius:'50%',background:NB.azulClaro,opacity:0.18,left:-80,bottom:-70}}/>
          <div style={{position:'relative'}}>
            <div style={{display:'flex',alignItems:'center',gap:13,marginBottom:40}}>
              <div style={{width:46,height:46,background:'#fff',borderRadius:13,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,color:NB.petroleo,fontSize:22}}>N</div>
              <div>
                <div style={{fontWeight:700,fontSize:18,lineHeight:1.15}}>Demandas</div>
                <div style={{fontSize:13,color:NB.gelo}}>Nibo Marketing Ops</div>
              </div>
            </div>
            <h1 style={{fontSize:34,lineHeight:1.2,fontWeight:700,marginBottom:16}}>
              Toda demanda de marketing<br/>em um só lugar.
            </h1>
            <p style={{fontSize:15,color:NB.gelo,lineHeight:1.65,maxWidth:380}}>
              Solicite, acompanhe e aprove demandas de Social, Design, Mídia Paga, Produto e RevOps — com as automações caindo direto no Slack.
            </p>
            <div style={{display:'flex',gap:9,marginTop:38,flexWrap:'wrap'}}>
              {ACTIVE_TEAM.slice(0,6).map(m=>(
                <div key={m.id} style={{width:38,height:38,borderRadius:'50%',overflow:'hidden',border:'2px solid rgba(255,255,255,0.5)',flexShrink:0}}>
                  {photos[m.id]
                    ? <img src={photos[m.id]} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                    : <div style={{width:'100%',height:'100%',background:m.color,color:'#fff',fontSize:13,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center'}}>{m.initials}</div>}
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Lado login */}
        <div style={{padding:'52px 46px',display:'flex',flexDirection:'column',justifyContent:'center'}}>
          <h2 style={{fontSize:24,fontWeight:700,color:NB.petroleo,marginBottom:8}}>Entrar</h2>

/* =========== PERFIL =========== */
function ProfileModal() {
  const { profileOpen, setProfileOpen, user, savePhoto, removePhoto, saveProfile, photos } = useApp();
  const fileRef = useRef(null);
  const [name, setName]   = useState('');
  const [err, setErr]     = useState('');
  /* undefined = foto inalterada | string = foto nova | null = remover ao salvar */
  const [photoDraft, setPhotoDraft] = useState(undefined);

  const userId   = user ? user.id : null;
  const nameRef  = useRef('');
  nameRef.current = user ? user.name : '';

  useEffect(() => {
    if (profileOpen && userId) { setName(nameRef.current); setPhotoDraft(undefined); setErr(''); }
  }, [profileOpen, userId]);

  if (!profileOpen || !user) return null;

  const currentPhoto = photoDraft !== undefined ? photoDraft : (photos[user.id] || user.googlePhoto || null);

  const pick = e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (!f.type.startsWith('image/')) return setErr('Escolha um arquivo de imagem.');
    if (f.size > 3 * 1024 * 1024) return setErr('Imagem muito grande. Use um arquivo de até 3 MB.');
    const rd = new FileReader();
    rd.onload = () => { setPhotoDraft(rd.result); setErr(''); };
    rd.onerror = () => setErr('Não foi possível ler a imagem.');
    rd.readAsDataURL(f);
  };

  const save = () => {
    saveProfile(user.id, { name: name.trim() || nameRef.current });
    if (photoDraft !== undefined) {
      photoDraft ? savePhoto(user.id, photoDraft) : removePhoto(user.id);
    }
    setProfileOpen(false);
  };

  return (
    <div onClick={()=>setProfileOpen(false)}
      style={{position:'fixed',inset:0,background:'rgba(0,45,114,0.45)',zIndex:70,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div onClick={e=>e.stopPropagation()}
        style={{background:'#fff',borderRadius:20,width:'100%',maxWidth:460,boxShadow:'0 24px 64px rgba(0,45,114,0.32)',overflow:'hidden'}}>

        <div style={{height:96,background:'linear-gradient(120deg,'+user.color+','+NB.roxo+')'}}/>
        <div style={{padding:'0 28px 24px',marginTop:-46}}>
          <div style={{display:'flex',alignItems:'flex-end',gap:16,marginBottom:22}}>
            <div style={{position:'relative'}}>
              <Avatar member={user} src={currentPhoto} size={92} ring={false} style={{border:'4px solid #fff',boxShadow:'0 4px 14px rgba(0,45,114,0.2)'}}/>
              <button onClick={()=>fileRef.current && fileRef.current.click()} title="Trocar foto"
                style={{position:'absolute',right:-2,bottom:-2,width:32,height:32,borderRadius:'50%',background:NB.azul,border:'3px solid #fff',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <ICamera/>
              </button>
              <input ref={fileRef} type="file" accept="image/*" onChange={pick} style={{display:'none'}}/>
            </div>
            <div style={{paddingBottom:6,minWidth:0}}>
              <div style={{fontSize:12,color:'#94A3B8',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.07em'}}>{user.area}</div>
              <div style={{fontSize:13.5,color:'#64748B',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{user.email}</div>
            </div>
          </div>

          <label style={{fontSize:11.5,fontWeight:600,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'0.07em',display:'block',marginBottom:6}}>Nome de exibição</label>
          <input value={name} onChange={e=>setName(e.target.value)}
            style={{width:'100%',background:'#F6F7FA',border:'1px solid #E2E8F0',borderRadius:10,padding:'11px 14px',fontSize:15,color:NB.petroleo,outline:'none'}}/>

          <div style={{display:'flex',gap:9,marginTop:16,flexWrap:'wrap'}}>
            <button onClick={()=>fileRef.current && fileRef.current.click()}
              style={{display:'flex',alignItems:'center',gap:8,padding:'9px 15px',background:'#F6F7FA',border:'1px solid #E2E8F0',borderRadius:10,fontSize:13.5,fontWeight:600,color:'#475569'}}>
              <ICamera/> {currentPhoto ? 'Trocar foto' : 'Adicionar foto'}
            </button>
            {currentPhoto && (
              <button onClick={()=>setPhotoDraft(null)}
                style={{padding:'9px 15px',background:'#FEF2F2',border:'1px solid #FECACA',borderRadius:10,fontSize:13.5,fontWeight:600,color:'#991B1B'}}>
                Remover foto
              </button>
            )}
          </div>
          {err && <p style={{fontSize:12.5,color:'#DC2626',marginTop:10}}>{err}</p>}
          <p style={{fontSize:12,color:'#94A3B8',marginTop:12,lineHeight:1.5}}>
            {photoDraft !== undefined
              ? 'Clique em Salvar perfil para aplicar a nova foto.'
              : 'Por padrão usamos sua foto do Google. A foto que você subir fica salva neste navegador.'}
          </p>
        </div>

        <div style={{padding:'16px 28px',borderTop:'1px solid #E2E8F0',display:'flex',justifyContent:'flex-end',gap:10}}>
          <button onClick={()=>setProfileOpen(false)}
            style={{padding:'10px 18px',background:'#F6F7FA',border:'1px solid #E2E8F0',borderRadius:10,fontSize:13.5,fontWeight:600,color:'#64748B'}}>
            Cancelar
          </button>
          <button onClick={save}
            style={{padding:'10px 22px',background:NB.azul,border:'none',borderRadius:10,fontSize:13.5,fontWeight:700,color:'#fff'}}>
            Salvar perfil
          </button>
        </div>
      </div>
    </div>
  );
}

function TopBar() {
  const { query, setQuery, area, view, reset } = useApp();
  const title = view==='slack' ? 'Automações Slack' : area==='Todas' ? 'Todos os Pipelines' : 'Pipeline — '+area;
  return (
    <header style={{background:'#fff',borderBottom:'1px solid #E2E8F0',padding:'16px 28px',display:'flex',alignItems:'center',gap:16,flexShrink:0}}>
      <div style={{flex:1}}>
        <div style={{fontSize:18,fontWeight:700,color:'#002D72'}}>{title}</div>
      </div>
      {view==='kanban' && (
        <div style={{position:'relative',width:320}}>
          <span style={{position:'absolute',left:13,top:'50%',transform:'translateY(-50%)',color:'#94A3B8',pointerEvents:'none'}}><ISearch /></span>
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Buscar demanda..."
            style={{width:'100%',background:'#F6F7FA',border:'1px solid #E2E8F0',borderRadius:9,padding:'10px 14px 10px 38px',fontSize:14,color:'#002D72',outline:'none'}}/>
        </div>
      )}
      <button onClick={reset} title="Restaurar dados"
        style={{padding:'10px 13px',background:'#F6F7FA',border:'1px solid #E2E8F0',borderRadius:9,color:'#64748B',display:'flex',alignItems:'center',lineHeight:1}}>
        <IReset />
      </button>
    </header>
  );
}

/* =========== CARD =========== */
function CardAvatar({ initials, offset }) {
  const mb = useMember(initials);
  return <Avatar member={mb} size={30} style={{marginLeft:offset>0?-10:0,zIndex:offset,boxShadow:'0 0 0 1.5px '+((mb&&mb.color)||NB.azul)+', 0 2px 4px rgba(0,0,0,0.15)'}}/>;
}

function Card({ demand }) {
  const { setModal } = useApp();
  const sla = getSla(demand.deadline);
  const ps  = PRI_STL[demand.priority] || PRI_STL.Baixa;
  const ac  = AREA_CLR[demand.area] || '#0072CE';
  const slaStyle = !sla ? {} :
    sla.type==='danger' ? {color:'#991B1B',background:'#FEE2E2'} :
    sla.type==='warn'   ? {color:'#92400E',background:'#FEF3C7'} :
    {color:'#475569',background:'#F1F5F9'};

  return (
    <div onClick={()=>setModal(demand.id)}
      style={{background:'#fff',borderRadius:11,border:'1px solid #E2E8F0',borderLeft:'4px solid '+ac,padding:'14px 15px 12px',cursor:'pointer',transition:'box-shadow 0.12s, border-color 0.12s',marginBottom:11}}
      onMouseEnter={e=>{e.currentTarget.style.boxShadow='0 2px 10px rgba(0,45,114,0.1)'; e.currentTarget.style.borderColor='#93C5FD'; e.currentTarget.style.borderLeftColor=ac;}}
      onMouseLeave={e=>{e.currentTarget.style.boxShadow='none'; e.currentTarget.style.borderColor='#E2E8F0'; e.currentTarget.style.borderLeftColor=ac;}}>

      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:7}}>
        <span style={{fontSize:11,fontWeight:700,padding:'3px 8px',borderRadius:5,background:ps.bg,color:ps.txt,border:'1px solid '+ps.bdr,letterSpacing:'0.05em'}}>
          {demand.priority.toUpperCase()}
        </span>
      </div>

      <p style={{fontSize:15,fontWeight:600,color:'#002D72',lineHeight:1.45,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden',marginBottom:13}}>
        {demand.title}
      </p>

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        {sla
          ? <span style={{fontSize:12.5,fontWeight:600,padding:'3px 8px',borderRadius:5,...slaStyle}}>{sla.label}</span>
          : <span/>
        }
        <div style={{display:'flex'}}>
          {demand.assignees.slice(0,3).map((init,i)=>(
            <CardAvatar key={init+i} initials={init} offset={i}/>
          ))}
        </div>
      </div>
    </div>
  );
}

/* =========== COLUMN =========== */
function Column({ stage, cards, areaColor }) {
  const { setNewOpen } = useApp();
  const headerClr = stage.isDone ? '#059669' : stage.isApproval ? '#D97706' : areaColor;
  return (
    <div style={{minWidth:268,maxWidth:290,flex:'0 0 268px',background:'#F6F7FA',borderRadius:14,border:'1px solid #E2E8F0',borderTop:'3px solid '+headerClr,padding:14,display:'flex',flexDirection:'column'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:13,paddingBottom:12,borderBottom:'1px solid #E2E8F0'}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:14,fontWeight:700,color:headerClr}}>{stage.name}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:12,background:'#EEF1F6',color:'#64748B',fontWeight:700,padding:'2px 8px',borderRadius:9}}>{cards.length}</span>
          <button onClick={()=>setNewOpen(true)} style={{background:'none',border:'none',color:'#B8CCEA',padding:2,display:'flex',alignItems:'center',lineHeight:1}}>
            <IPlus/>
          </button>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',maxHeight:'calc(100vh - 230px)'}} className="nb-scrollnone">
        {cards.map(c=><Card key={c.id} demand={c}/>)}
        {cards.length===0 && (
          <div style={{border:'1.5px dashed #E2E8F0',borderRadius:9,padding:'26px 12px',textAlign:'center',color:'#CBD5E1',fontSize:13.5}}>
            Vazio
          </div>
        )}
      </div>
    </div>
  );
}

/* =========== KANBAN =========== */
function KanbanBoard() {
  const { filtered, area } = useApp();
  const areas = area==='Todas' ? Object.keys(PIPELINES) : [area];

  if (area==='Todas') {
    return (
      <div style={{padding:'22px 26px',overflowY:'auto',height:'100%'}}>
        {areas.map(a => {
          const aCards = filtered.filter(d=>d.area===a);
          const stages = PIPELINES[a];
          return (
            <div key={a} style={{marginBottom:34}}>
              <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:13,borderLeft:'4px solid '+AREA_CLR[a],paddingLeft:10}}>
                <span style={{fontWeight:700,color:AREA_CLR[a],fontSize:16}}>{a}</span>
                <span style={{fontSize:13,color:'#94A3B8'}}>{aCards.length} demandas</span>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:13}}>
                {stages.map(stage => {
                  const cs = aCards.filter(d=>d.stageId===stage.id);
                  const stClr = stage.isDone?'#059669':stage.isApproval?'#D97706':AREA_CLR[a];
                  return (
                    <div key={stage.id} style={{background:'#F6F7FA',borderRadius:12,border:'1px solid #E2E8F0',borderTop:'3px solid '+stClr,padding:'12px 13px'}}>
                      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:9}}>
                        <span style={{fontSize:13,fontWeight:700,color:stClr}}>{stage.name}</span>
                        <span style={{fontSize:11.5,background:'#EEF1F6',color:'#64748B',fontWeight:700,padding:'2px 7px',borderRadius:9}}>{cs.length}</span>
                      </div>
                      {cs.map(c=><Card key={c.id} demand={c}/>)}
                      {cs.length===0&&<div style={{textAlign:'center',color:'#CBD5E1',fontSize:13,padding:'13px 0'}}>—</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    );
  }

  const stages = PIPELINES[area]||[];
  const areaCards = filtered.filter(d=>d.area===area);
  const aClr = AREA_CLR[area]||'#0072CE';

  return (
    <div style={{display:'flex',gap:16,padding:'22px 26px',overflowX:'auto',height:'100%',alignItems:'flex-start'}} className="nb-scrollnone">
      {stages.map(stage=>(
        <Column key={stage.id} stage={stage} cards={areaCards.filter(d=>d.stageId===stage.id)} areaColor={aClr}/>
      ))}
    </div>
  );
}

/* =========== SLACK FEED =========== */
function SlackFeed() {
  const { slack } = useApp();

  const typeMap = {
    approval:{ border:'#FCD34D', bg:'#FEFCE8', badge:'Aprovação', bdgClr:'#92400E', bdgBg:'#FEF3C7', dot:'#D97706' },
    new:     { border:'#93C5FD', bg:'#EFF6FF', badge:'Nova demanda', bdgClr:'#1E40AF', bdgBg:'#DBEAFE', dot:'#0072CE' },
    move:    { border:'#7DD3FC', bg:'#F0F9FF', badge:'Automação', bdgClr:'#0369A1', bdgBg:'#E0F2FE', dot:'#41B6E6' },
  };

  return (
    <div style={{padding:'22px 26px',overflowY:'auto',height:'100%'}}>
      <div style={{background:'#002D72',borderRadius:14,padding:'20px 24px',marginBottom:22,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div>
          <div style={{display:'flex',alignItems:'center',gap:11,marginBottom:6}}>
            <ISlack/>
            <span style={{color:'#fff',fontWeight:700,fontSize:17}}>#automacoes-nibo</span>
          </div>
          <p style={{color:'#B8CCEA',fontSize:13}}>Caminho das automações disparadas ao mover cards no kanban</p>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:9}}>
          <div style={{width:10,height:10,borderRadius:'50%',background:'#22D3EE'}}/>
          <span style={{color:'#41B6E6',fontSize:13,fontWeight:600}}>Bot ativo</span>
        </div>
      </div>

      <div style={{display:'flex',gap:18,marginBottom:18,flexWrap:'wrap'}}>
        {[{dot:'#41B6E6',label:'Automação de etapa'},{dot:'#D97706',label:'Enviado para aprovação'},{dot:'#0072CE',label:'Nova demanda criada'}].map(({dot,label})=>(
          <div key={label} style={{display:'flex',alignItems:'center',gap:7}}>
            <div style={{width:9,height:9,borderRadius:'50%',background:dot}}/>
            <span style={{fontSize:12.5,color:'#64748B'}}>{label}</span>
          </div>
        ))}
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:13}}>
        {slack.map(msg => {
          const ts = typeMap[msg.type] || typeMap.move;
          return (
            <div key={msg.id} style={{background:'#fff',borderRadius:12,border:'1px solid #E2E8F0',borderLeft:'5px solid '+ts.border,padding:'15px 18px'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                  <span style={{background:'#002D72',color:'#fff',fontSize:11,fontWeight:700,padding:'3px 9px',borderRadius:5,letterSpacing:'0.05em',fontFamily:'monospace'}}>{msg.code}</span>
                  <span style={{fontSize:12.5,fontWeight:700,color:AREA_CLR[msg.area]||'#0072CE'}}>{msg.area}</span>
                  <span style={{background:ts.bdgBg,color:ts.bdgClr,fontSize:11,fontWeight:700,padding:'3px 9px',borderRadius:5}}>{ts.badge}</span>
                </div>
                <span style={{fontSize:12.5,color:'#94A3B8',flexShrink:0}}>{msg.time}</span>
              </div>

              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                <span style={{fontSize:13,color:'#64748B'}}>Caminho:</span>
                <span style={{fontSize:13,fontWeight:700,color:'#002D72'}}>{msg.stagePath}</span>
              </div>

              <div style={{background:'#F6F7FA',borderRadius:9,padding:'12px 14px'}}>
                <div style={{display:'flex',alignItems:'flex-start',gap:8,marginBottom:8}}>
                  <span style={{color:'#41B6E6',marginTop:1,flexShrink:0}}><IZap/></span>
                  <div>
                    <div style={{fontSize:11,color:'#94A3B8',fontWeight:600,letterSpacing:'0.04em',textTransform:'uppercase',marginBottom:3}}>Ação automatizada</div>
                    <span style={{fontSize:14,color:'#002D72',fontWeight:500}}>{msg.action}</span>
                  </div>
                </div>
                <div style={{display:'flex',alignItems:'flex-start',gap:8}}>
                  <span style={{color:'#0072CE',marginTop:1,flexShrink:0,fontSize:13.5}}>→</span>
                  <div>
                    <div style={{fontSize:11,color:'#94A3B8',fontWeight:600,letterSpacing:'0.04em',textTransform:'uppercase',marginBottom:3}}>Próximo passo</div>
                    <span style={{fontSize:14,color:'#0072CE',fontWeight:500}}>{msg.next}</span>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
        {slack.length===0 && (
          <div style={{textAlign:'center',padding:'70px 0',color:'#94A3B8',fontSize:16}}>
            Nenhuma automação disparada ainda.
            <br/><span style={{fontSize:13}}>Mova um card no kanban para ver o caminho da automação aqui.</span>
          </div>
        )}
      </div>
    </div>
  );
}

      <span style={{fontSize:14,color:NB.petroleo,fontWeight:600}}>{mb?mb.name:initials}</span>

}

  const d   = selDemand;
  const stages = PIPELINES[d.area]||[];
  const ps  = PRI_STL[d.priority]||PRI_STL.Baixa;
  const ac  = AREA_CLR[d.area]||'#0072CE';
  const sla = getSla(d.deadline);

  return (
    <div onClick={()=>setModal(null)}
      style={{position:'fixed',inset:0,background:'rgba(0,45,114,0.4)',zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div onClick={e=>e.stopPropagation()}
        style={{background:'#fff',borderRadius:18,width:'100%',maxWidth:600,maxHeight:'88vh',overflowY:'auto',boxShadow:'0 24px 64px rgba(0,45,114,0.3)'}}>

        <div style={{padding:'22px 26px 18px',borderBottom:'1px solid #E2E8F0',display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
          <div style={{flex:1}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8,flexWrap:'wrap'}}>
              <span style={{fontSize:12.5,fontWeight:700,color:'#94A3B8',fontFamily:'monospace'}}>{d.code}</span>

              <span style={{fontSize:11,fontWeight:700,padding:'3px 9px',borderRadius:5,background:ps.bg,color:ps.txt,border:'1px solid '+ps.bdr}}>{d.priority.toUpperCase()}</span>

            <h2 style={{fontSize:19,fontWeight:700,color:'#002D72',lineHeight:1.3}}>{d.title}</h2>
          </div>
          <button onClick={()=>setModal(null)} style={{padding:8,background:'#F6F7FA',border:'1px solid #E2E8F0',borderRadius:9,color:'#64748B',display:'flex',marginLeft:14,flexShrink:0}}><IX/></button>
        </div>

        <div style={{padding:'22px 26px'}}>
          {d.description && (
            <div style={{marginBottom:22}}>
              <div style={{fontSize:11,fontWeight:600,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:7}}>Descrição</div>
              <p style={{fontSize:15,color:'#334155',lineHeight:1.6}}>{d.description}</p>
            </div>
          )}

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:13,marginBottom:22}}>
            <div style={{background:'#F6F7FA',borderRadius:9,padding:'12px 15px'}}>
              <div style={{fontSize:11,fontWeight:600,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:4}}>Solicitante</div>
              <div style={{fontSize:15,color:'#002D72',fontWeight:600}}>{d.requester}</div>
            </div>
            <div style={{background:'#F6F7FA',borderRadius:9,padding:'12px 15px'}}>
              <div style={{fontSize:11,fontWeight:600,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:4}}>Prazo</div>
              <div style={{fontSize:15,color:sla&&sla.type==='danger'?'#991B1B':'#002D72',fontWeight:600}}>
                {fmtDate(d.deadline)}{sla?' ('+sla.label+')':''}
              </div>
            </div>
          </div>

          <div style={{marginBottom:24}}>
            <div style={{fontSize:11,fontWeight:600,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:9}}>Responsáveis</div>
            <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
              {d.assignees.map(init => <AssigneeChip key={init} initials={init}/>)}
            </div>
          </div>

          <div>
            <div style={{fontSize:11,fontWeight:600,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:9}}>Mover para etapa</div>
            <div style={{display:'flex',gap:9,flexWrap:'wrap',marginBottom:10}}>
              {stages.map(stage=>{
                const isCur = stage.id===d.stageId;
                const needsNotify = d.area==='Design' && stage.isDone;
                return (
                  <button key={stage.id} onClick={()=>{
                    if (isCur) return;
                    if (needsNotify) setNotifyPending({ demandId:d.id, stageId:stage.id, demandTitle:d.title });
                    else moveStage(d.id, stage.id);
                  }}
                    style={{display:'flex',alignItems:'center',gap:7,padding:'7px 14px',borderRadius:7,fontSize:13.5,fontWeight:600,border:isCur?'1.5px solid '+ac:'1px solid #E2E8F0',background:isCur?ac:'#F6F7FA',color:isCur?'#fff':'#64748B',transition:'all 0.12s'}}>

          <button onClick={()=>delDemand(d.id)}
            style={{padding:'9px 16px',background:'#FEF2F2',border:'1px solid #FECACA',borderRadius:9,fontSize:13.5,fontWeight:600,color:'#991B1B'}}>
            Excluir

          <button onClick={()=>setModal(null)}
            style={{padding:'9px 22px',background:'#0072CE',border:'none',borderRadius:9,fontSize:13.5,fontWeight:600,color:'#fff'}}>
            Fechar
          </button>
        </div>
      </div>
    </div>
  );
}

/* =========== NOTIFICAR ENTREGA (DESIGN) =========== */
const DESIGN_NOTIFY_OPTIONS = ['RO','CA','MA'];

function NotifyOption({ initials, checked, onToggle }) {
  const mb = useMember(initials);
  return (
    <label style={{display:'flex',alignItems:'center',gap:11,padding:'10px 13px',borderRadius:10,background:checked?NB.azul+'12':'#F6F7FA',border:'1px solid '+(checked?NB.azul+'66':'#E2E8F0'),cursor:'pointer'}}>
      <input type="checkbox" checked={checked} onChange={onToggle} style={{width:16,height:16,accentColor:NB.azul}}/>
      <Avatar member={mb} size={28}/>
      <span style={{fontSize:14,color:NB.petroleo,fontWeight:600}}>{mb?mb.name:initials}</span>
    </label>
  );
}

function NotifyModal() {
  const { notifyPending, setNotifyPending, moveStage } = useApp();
  const [picked, setPicked] = useState([]);

  useEffect(() => { if (notifyPending) setPicked([]); }, [notifyPending]);

  if (!notifyPending) return null;

  const toggle = init => setPicked(p => p.includes(init) ? p.filter(i=>i!==init) : [...p, init]);
  const allSelected = DESIGN_NOTIFY_OPTIONS.every(i=>picked.includes(i));
  const toggleAll = () => setPicked(allSelected ? [] : [...DESIGN_NOTIFY_OPTIONS]);

  const confirm = () => {
    moveStage(notifyPending.demandId, notifyPending.stageId, picked);
    setNotifyPending(null);
  };

  return (
    <div onClick={()=>setNotifyPending(null)}
      style={{position:'fixed',inset:0,background:'rgba(0,45,114,0.4)',zIndex:60,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div onClick={e=>e.stopPropagation()}
        style={{background:'#fff',borderRadius:18,width:'100%',maxWidth:440,boxShadow:'0 24px 64px rgba(0,45,114,0.3)'}}>
        <div style={{padding:'22px 26px 14px'}}>
          <h2 style={{fontSize:17,fontWeight:700,color:'#002D72',marginBottom:6}}>Notificar entrega no Slack</h2>
          <p style={{fontSize:13.5,color:'#64748B',lineHeight:1.5}}>Arte de <strong>{notifyPending.demandTitle}</strong> foi aprovada e vai para Entregue. Quem deve receber a menção?</p>
        </div>
        <div style={{padding:'6px 26px 8px',display:'flex',flexDirection:'column',gap:8}}>
          <label style={{display:'flex',alignItems:'center',gap:11,padding:'10px 13px',borderRadius:10,background:allSelected?NB.azul+'12':'#F6F7FA',border:'1px solid '+(allSelected?NB.azul+'66':'#E2E8F0'),cursor:'pointer'}}>
            <input type="checkbox" checked={allSelected} onChange={toggleAll} style={{width:16,height:16,accentColor:NB.azul}}/>
            <span style={{fontSize:14,fontWeight:700,color:NB.petroleo}}>Todos</span>
          </label>
          {DESIGN_NOTIFY_OPTIONS.map(init => (
            <NotifyOption key={init} initials={init} checked={picked.includes(init)} onToggle={()=>toggle(init)}/>
          ))}
        </div>
        <div style={{padding:'16px 26px',borderTop:'1px solid #E2E8F0',display:'flex',justifyContent:'flex-end',gap:10}}>
          <button onClick={()=>setNotifyPending(null)}
            style={{padding:'10px 18px',background:'#F6F7FA',border:'1px solid #E2E8F0',borderRadius:9,fontSize:13.5,fontWeight:600,color:'#64748B'}}>
            Cancelar
          </button>
          <button onClick={confirm} disabled={picked.length===0}
            style={{padding:'10px 22px',background:picked.length?'#0072CE':'#CBD5E1',border:'none',borderRadius:9,fontSize:13.5,fontWeight:700,color:'#fff',cursor:picked.length?'pointer':'not-allowed'}}>
            Mover e notificar
          </button>
        </div>
      </div>
    </div>
  );
}

/* =========== NEW DEMAND MODAL =========== */
function AssigneePick({ member, checked, onToggle }) {
  const m = useMember(member.initials) || member;
  return (
    <button type="button" onClick={onToggle}
      style={{display:'flex',alignItems:'center',gap:9,padding:'6px 14px 6px 6px',borderRadius:22,border:'1.5px solid '+(checked?m.color:'#E2E8F0'),background:checked?m.color+'14':'#F6F7FA'}}>
      <Avatar member={m} size={26} ring={false}/>
      <span style={{fontSize:13.5,fontWeight:600,color:checked?NB.petroleo:'#64748B'}}>{m.name}</span>
    </button>
  );
}

function NewModal() {
  const { newOpen, setNewOpen, addDemand, user, area } = useApp();
  const initArea = area!=='Todas' ? area : 'Social';
  const [form, setForm] = useState({ title:'', area:initArea, priority:'Média', deadline:dStr(7), description:'', requester:user.name, assignees:[user.initials] });

  useEffect(() => {
    if (newOpen) setForm(f=>({ ...f, area:area!=='Todas'?area:'Social', requester:user.name, assignees:[user.initials] }));
  }, [newOpen, area, user]);

  if (!newOpen) return null;

  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const toggleAssignee = init => setForm(f => ({ ...f, assignees: f.assignees.includes(init) ? f.assignees.filter(i=>i!==init) : [...f.assignees, init] }));

  const submit = () => {
    if (!form.title.trim() || form.assignees.length===0) return;
    addDemand({ title:form.title, area:form.area, priority:form.priority, deadline:form.deadline, description:form.description, requester:form.requester, assignees:form.assignees });
    setNewOpen(false);
  };

  const inp = { background:'#F6F7FA', border:'1px solid #E2E8F0', borderRadius:9, padding:'10px 14px', fontSize:14.5, color:'#002D72', width:'100%', outline:'none' };
  const lbl = { fontSize:11.5, fontWeight:600, color:'#94A3B8', textTransform:'uppercase', letterSpacing:'0.07em', display:'block', marginBottom:6 };

  return (
    <div onClick={()=>setNewOpen(false)}
      style={{position:'fixed',inset:0,background:'rgba(0,45,114,0.4)',zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div onClick={e=>e.stopPropagation()}
        style={{background:'#fff',borderRadius:18,width:'100%',maxWidth:560,maxHeight:'88vh',overflowY:'auto',boxShadow:'0 24px 64px rgba(0,45,114,0.3)'}}>

        <div style={{padding:'22px 26px 18px',borderBottom:'1px solid #E2E8F0',display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
          <div>
            <h2 style={{fontSize:19,fontWeight:700,color:'#002D72',marginBottom:4}}>Solicitar Nova Demanda</h2>
            <p style={{fontSize:12.5,color:'#94A3B8'}}>A demanda será solicitada no Slack para quem você escolher abaixo.</p>
          </div>
          <button onClick={()=>setNewOpen(false)} style={{padding:8,background:'#F6F7FA',border:'1px solid #E2E8F0',borderRadius:9,color:'#64748B',display:'flex',marginLeft:14,flexShrink:0}}><IX/></button>
        </div>

        <div style={{padding:'22px 26px',display:'flex',flexDirection:'column',gap:16}}>
          <div>
            <label style={lbl}>Título</label>
            <input value={form.title} onChange={e=>set('title',e.target.value)} placeholder="O que precisa ser feito?" style={inp}/>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
            <div>
              <label style={lbl}>Área</label>
              <select value={form.area} onChange={e=>set('area',e.target.value)} style={inp}>
                {['Social','Design','Mídia Paga','Produto','RevOps'].map(a=><option key={a}>{a}</option>)}
              </select>
            </div>
            <div>
              <label style={lbl}>Prioridade</label>
              <select value={form.priority} onChange={e=>set('priority',e.target.value)} style={inp}>
                {['Urgente','Alta','Média','Baixa'].map(p=><option key={p}>{p}</option>)}
              </select>
            </div>
          </div>
          <div>
            <label style={lbl}>Prazo</label>
            <input type="date" value={form.deadline} onChange={e=>set('deadline',e.target.value)} style={inp}/>
          </div>
          <div>
            <label style={lbl}>Para quem vai a demanda</label>
            <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
              {ACTIVE_TEAM.map(m => (
                <AssigneePick key={m.id} member={m} checked={form.assignees.includes(m.initials)} onToggle={()=>toggleAssignee(m.initials)}/>
              ))}
            </div>
            {form.assignees.length===0 && <p style={{fontSize:11.5,color:'#DC2626',marginTop:6}}>Selecione ao menos uma pessoa.</p>}
          </div>
          <div>
            <label style={lbl}>Contexto (opcional)</label>
            <textarea value={form.description} onChange={e=>set('description',e.target.value)} rows={3}
              placeholder="Referências, objetivo, link de briefing..." style={{...inp,resize:'vertical'}}/>
          </div>
        </div>

        <div style={{padding:'16px 26px',borderTop:'1px solid #E2E8F0',display:'flex',justifyContent:'flex-end',gap:10}}>
          <button onClick={()=>setNewOpen(false)}
            style={{padding:'10px 18px',background:'#F6F7FA',border:'1px solid #E2E8F0',borderRadius:9,fontSize:13.5,fontWeight:600,color:'#64748B'}}>
            Cancelar
          </button>
          <button onClick={submit} disabled={!form.title.trim()||form.assignees.length===0}
            style={{padding:'10px 24px',background:(form.title.trim()&&form.assignees.length)?'#0072CE':'#CBD5E1',border:'none',borderRadius:9,fontSize:13.5,fontWeight:700,color:'#fff',cursor:(form.title.trim()&&form.assignees.length)?'pointer':'not-allowed'}}>
            Solicitar no Slack
          </button>
        </div>
      </div>
    </div>
  );
}

/* =========== APP =========== */
function AppContent() {
  const { view, user, authReady } = useApp();
  if (!authReady) return <Splash/>;
  if (!user)      return <LoginScreen/>;
  return (
    <div style={{display:'flex',height:'100vh',width:'100%',overflow:'hidden'}}>
      <Sidebar/>
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
        <TopBar/>
        <main style={{flex:1,overflow:'hidden'}}>
          {view==='kanban' && <KanbanBoard/>}
          {view==='slack'  && <SlackFeed/>}
        </main>
      </div>
      <CardModal/>
      <NewModal/>
      <NotifyModal/>
      <ProfileModal/>
    </div>
  );
}

function App() {
  return <Provider><AppContent/></Provider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

/* modo 'blur' estende a própria peça desfocada no fundo — é o que o Meta faz
   ao adaptar um criativo pra outro formato. 'cor' preenche com a paleta. */
function drawVariant(img, w, h, bg, mode) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const iw = img.naturalWidth, ih = img.naturalHeight;
  ctx.imageSmoothingQuality = 'high';

  if (mode === 'cover') {
    const s = Math.max(w/iw, h/ih);
    ctx.drawImage(img, (w-iw*s)/2, (h-ih*s)/2, iw*s, ih*s);
    return cv.toDataURL('image/png');
  }

  if (mode === 'blur') {
    const sb = Math.max(w/iw, h/ih) * 1.25;
    ctx.filter = 'blur(' + Math.round(Math.max(w,h)/34) + 'px) saturate(1.1) brightness(0.9)';
    ctx.drawImage(img, (w-iw*sb)/2, (h-ih*sb)/2, iw*sb, ih*sb);
    ctx.filter = 'none';
    const sf = Math.min(w/iw, h/ih) * 0.94;
    const dw = iw*sf, dh = ih*sf;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.28)'; ctx.shadowBlur = Math.round(Math.max(w,h)/50); ctx.shadowOffsetY = 6;
    ctx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
    ctx.restore();
    return cv.toDataURL('image/png');
  }

  ctx.fillStyle = bg; ctx.fillRect(0,0,w,h);
  const s = Math.min(w/iw, h/ih) * 0.88;
  ctx.drawImage(img, (w-iw*s)/2, (h-ih*s)/2, iw*s, ih*s);
  return cv.toDataURL('image/png');
}

/* Espera a Poppins carregar antes de desenhar texto no canvas — sem isso o
   navegador às vezes cai pra uma fonte serifada padrão no primeiro uso. */
function ensurePoppins() {
  if (!(window.document && document.fonts)) return Promise.resolve();
  return Promise.all([
    document.fonts.load('800 60px Poppins'),
    document.fonts.load('600 30px Poppins'),
  ]).catch(()=>{});
}

/* Quebra de linha manual — canvas não quebra texto sozinho. */
function wrapLines(ctx, text, maxWidth) {
  const palavras = (text||'').trim().split(/\s+/).filter(Boolean);
  const linhas = []; let atual = '';
  palavras.forEach(p => {
    const teste = atual ? atual+' '+p : p;
    if (ctx.measureText(teste).width > maxWidth && atual) { linhas.push(atual); atual = p; }
    else atual = teste;
  });
  if (atual) linhas.push(atual);
  return linhas;
}

/* Desenha o símbolo do Nibo direto no canvas, com a MESMA geometria do
   NiboSymbol em SVG (três círculos + conector), pra ficar idêntico ao logo do app. */
function drawNiboMarkOnCanvas(ctx, x, y, size, color) {
  const s = size/100;
  ctx.save();
  ctx.translate(x - size/2, y - size/2);
  ctx.scale(s, s);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(50, 36.8, 8.85, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(67.65, 63.2, 8.85, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(32.35, 63.2, 8.85, 0, Math.PI*2); ctx.fill();
  ctx.fill(new Path2D('M48.978 45.591 A12 12 0 0 1 59.136 60.785 L68.672 54.409 A12 12 0 0 1 58.514 39.215 Z'));
  ctx.restore();
}

/* Capa: peça (opcional) com degradê escuro embaixo pra legibilidade, título
   grande, subtítulo, marca do Nibo no canto — igual uma thumbnail de vídeo. */
async function drawCapa(bgImg, w, h, titulo, subtitulo) {
  await ensurePoppins();
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingQuality = 'high';

  if (bgImg) {
    const s = Math.max(w/bgImg.naturalWidth, h/bgImg.naturalHeight);
    const dw = bgImg.naturalWidth*s, dh = bgImg.naturalHeight*s;
    ctx.drawImage(bgImg, (w-dw)/2, (h-dh)/2, dw, dh);
  } else {
    const grad = ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0, NB.navy1); grad.addColorStop(1, NB.roxo);
    ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
  }

  const overlay = ctx.createLinearGradient(0, h*0.42, 0, h);
  overlay.addColorStop(0, 'rgba(0,20,50,0)'); overlay.addColorStop(1, 'rgba(0,17,42,0.86)');
  ctx.fillStyle = overlay; ctx.fillRect(0, h*0.42, w, h*0.58);

  const pad = w*0.08;
  let cursorY = h - pad - (subtitulo ? h*0.05 : 0);

  if (subtitulo) {
    ctx.font = '600 '+Math.round(w*0.032)+'px Poppins, sans-serif';
    ctx.fillStyle = '#B8CCEA';
    const subLinhas = wrapLines(ctx, subtitulo, w - pad*2);
    subLinhas.slice(0,2).reverse().forEach(l => { ctx.fillText(l, pad, cursorY); cursorY -= w*0.045; });
    cursorY -= w*0.015;
  }

  ctx.font = '800 '+Math.round(w*0.068)+'px Poppins, sans-serif';
  ctx.fillStyle = '#fff';
  const linhas = wrapLines(ctx, titulo || 'Título da capa', w - pad*2).slice(0,3);
  const linhaAltura = w*0.082;
  [...linhas].reverse().forEach(l => { ctx.fillText(l, pad, cursorY); cursorY -= linhaAltura; });

  drawNiboMarkOnCanvas(ctx, pad + w*0.035, h*0.42 - h*0.055, w*0.075, '#fff');

  return cv.toDataURL('image/png');
}

/* Encerramento: card final padronizado — degradê Nibo, marca grande centralizada
   e uma frase opcional. Pensado pra ser o último frame de um vídeo simples. */
async function drawEncerramento(w, h, frase) {
  await ensurePoppins();
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx = cv.getContext('2d');

  const grad = ctx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0, '#001B45'); grad.addColorStop(0.55, NB.navy1); grad.addColorStop(1, '#0A3F94');
  ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);

  const cx = w/2, cy = h*0.44;
  drawNiboMarkOnCanvas(ctx, cx, cy, Math.min(w,h)*0.22, '#B8CCEA');

  ctx.textAlign = 'center';
  ctx.font = '800 '+Math.round(Math.min(w,h)*0.09)+'px Poppins, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('nibo', cx, cy + Math.min(w,h)*0.135);

  if (frase && frase.trim()) {
    ctx.font = '500 '+Math.round(Math.min(w,h)*0.032)+'px Poppins, sans-serif';
    ctx.fillStyle = '#B8CCEA';
    const linhas = wrapLines(ctx, frase.trim(), w*0.78);
    let ly = cy + Math.min(w,h)*0.21;
    linhas.slice(0,2).forEach(l => { ctx.fillText(l, cx, ly); ly += Math.min(w,h)*0.045; });
  }
  ctx.textAlign = 'left';

  return cv.toDataURL('image/png');
}

      'Logo legível no menor formato (Stories)',
    ],
  };
}

function VariationsView() {
  const { active, addAttachment, uploadFile, user, MAX_FILE } = useApp();
  const [img, setImg]     = useState(null);
  const [imgName, setName]= useState('');
  const [modo, setModo]   = useState('formatos');
  const [fit, setFit]     = useState('blur');
  const [bg, setBg]       = useState('#002D72');
  const [fmt, setFmt]     = useState('9x16');
  const [outs, setOuts]   = useState([]);
  const [pub, setPub]     = useState(PUBLICOS[0]);
  const [tema, setTema]   = useState('');
  const [alvo, setAlvo]   = useState('');
  const [err, setErr]     = useState('');
  const [okMsg, setOk]    = useState('');
  const [gerando, setGerando] = useState(false);
  const fileRef = useRef(null);

  /* Capa: fundo é opcional — se não subir nada, usa o degradê Nibo. */
  const [capaImg, setCapaImg]   = useState(null);
  const [capaTitulo, setCapaTitulo] = useState('');
  const [capaSub, setCapaSub]       = useState('');
  const capaFileRef = useRef(null);

  /* Encerramento: nunca precisa de imagem — é sempre o card padrão da marca. */
  const [fraseFinal, setFraseFinal] = useState('');

  const designs = active.filter(d => d.area === 'Design');
  const modoPrecisaPeca = modo === 'formatos' || modo === 'fundos';

  const load = f => {
    if (!f) return;
    if (!f.type.startsWith('image/')) return setErr('Envie uma imagem (PNG ou JPG).');
    const rd = new FileReader();
    rd.onload = () => {
      const im = new Image();
      im.onload = () => { setImg(im); setName(f.name.replace(/\.[^.]+$/,'')); setTema(t=>t||f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ')); setErr(''); setOuts([]); };
      im.onerror = () => setErr('Não consegui abrir essa imagem.');
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  };

  const loadCapaFundo = f => {
    if (!f) return;
    if (!f.type.startsWith('image/')) return setErr('Envie uma imagem (PNG ou JPG).');
    const rd = new FileReader();
    rd.onload = () => {
      const im = new Image();
      im.onload = () => { setCapaImg(im); setErr(''); };
      im.onerror = () => setErr('Não consegui abrir essa imagem.');
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  };

  const gerar = () => {
    if (!img) return;
    if (modo === 'formatos') {
      setOuts(FORMATS.map(f => ({ key:f.id, label:f.label, w:f.w, h:f.h, url:drawVariant(img,f.w,f.h,bg,fit) })));
    } else {
      const f = FORMATS.find(x=>x.id===fmt);
      setOuts(BGS.map(b => ({ key:b.id, label:b.label, w:f.w, h:f.h, url:drawVariant(img,f.w,f.h,b.hex,'cor') })));
    }
  };

  const gerarCapa = async () => {
    if (!capaTitulo.trim()) return setErr('Escreva o título que vai aparecer na capa.');
    setErr(''); setGerando(true);
    const f = FORMATS.find(x=>x.id===fmt);
    const url = await drawCapa(capaImg, f.w, f.h, capaTitulo.trim(), capaSub.trim());
    setOuts([{ key:'capa', label:'Capa', w:f.w, h:f.h, url }]);
    setGerando(false);
  };

  const gerarEncerramento = async () => {
    setErr(''); setGerando(true);
    const f = FORMATS.find(x=>x.id===fmt);
    const url = await drawEncerramento(f.w, f.h, fraseFinal);
    setOuts([{ key:'encerramento', label:'Encerramento', w:f.w, h:f.h, url }]);
    setGerando(false);
  };

  const baixar = o => {
    const a = document.createElement('a');
    a.href = o.url; a.download = (imgName||modo) + '-' + o.key + '.png';
    document.body.appendChild(a); a.click(); a.remove();
  };

  /* A variação vai para o Storage, como qualquer outro anexo. */
  const salvar = o => {
    const dem = designs.find(d => d.id === alvo);
    if (!dem) return setErr('Escolha em qual demanda salvar, no seletor acima.');
    const nome = (imgName||modo) + '-' + o.key + '.png';
    setErr(''); setOk('Enviando ' + o.label + '…');
    fetch(o.url).then(r => r.blob()).then(blob => {
      const file = new File([blob], nome, { type:'image/png' });
      return uploadFile(dem, file);
    }).then(meta => {
      addAttachment(dem, { ...meta, by:user.name });
      setOk('Salvo nos anexos de ' + dem.code); setTimeout(()=>setOk(''), 2500);
    }).catch(e => { setOk(''); setErr(e.message); });
  };

  const btn = on => ({display:'flex',alignItems:'center',gap:7,padding:'9px 14px',borderRadius:9,
    border:'1px solid '+(on?NB.azul:NB.bd), background:on?'#EAF3FD':'#fff',
    fontSize:13,fontWeight:500,color:on?NB.azul:NB.mut});

  const trocarModo = m => { setModo(m); setOuts([]); setErr(''); };

  return (
    <div style={{padding:'22px 30px 30px',overflowY:'auto',overflowX:'hidden',height:'100%'}}>
      <div style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:16,padding:'20px 22px',marginBottom:18,boxShadow:'0 1px 3px rgba(11,42,92,0.04)'}}>

        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:18}}>
          <button onClick={()=>trocarModo('formatos')} style={btn(modo==='formatos')}>Cortes de formato</button>
          <button onClick={()=>trocarModo('fundos')}   style={btn(modo==='fundos')}>Versões de fundo</button>
          <button onClick={()=>trocarModo('capa')}     style={btn(modo==='capa')}>Capa</button>
          <button onClick={()=>trocarModo('encerramento')} style={btn(modo==='encerramento')}>Encerramento</button>
          <button onClick={()=>trocarModo('briefing')} style={btn(modo==='briefing')}>Briefing do que testar</button>
        </div>

        {/* ---- Cortes de formato / Versões de fundo: precisam da peça ---- */}
        {modoPrecisaPeca && !img && (
          <React.Fragment>
            <div
              onClick={()=>fileRef.current && fileRef.current.click()}
              onDragOver={e=>{e.preventDefault();}}
              onDrop={e=>{e.preventDefault(); load(e.dataTransfer.files && e.dataTransfer.files[0]);}}
              style={{border:'1.5px dashed '+NB.bd,borderRadius:12,padding:'46px 20px',textAlign:'center',cursor:'pointer',background:NB.col}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=NB.azul;}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=NB.bd;}}>
              <div style={{color:NB.mut2,display:'flex',justifyContent:'center',marginBottom:12}}><IClip s={30}/></div>
              <div style={{fontSize:15,fontWeight:500,color:NB.txt,marginBottom:6}}>Suba a peça já criada</div>
              <p style={{fontSize:13,color:NB.mut,lineHeight:1.6,maxWidth:440,margin:'0 auto'}}>
                Arraste aqui ou clique. A partir dela saem os cortes de formato adaptados e as versões de fundo na paleta Nibo.
              </p>
            </div>
            <input ref={fileRef} type="file" accept="image/*" onChange={e=>{const f=e.target.files&&e.target.files[0]; e.target.value=''; load(f);}} style={{display:'none'}}/>
            {err && <p style={{fontSize:12.5,color:'#B4232A',marginTop:10}}>{err}</p>}
          </React.Fragment>
        )}

        {modoPrecisaPeca && img && (
          <React.Fragment>
            <div style={{display:'flex',alignItems:'center',gap:13,marginBottom:18,flexWrap:'wrap'}}>
              <img src={img.src} alt="" style={{width:52,height:52,borderRadius:9,objectFit:'cover',border:'1px solid '+NB.bd}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14.5,fontWeight:500,color:NB.txt,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{imgName}</div>
                <div style={{fontSize:12,color:NB.mut2}}>{img.naturalWidth} × {img.naturalHeight} px</div>
              </div>
              <button onClick={()=>{setImg(null); setOuts([]);}}
                style={{padding:'8px 14px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut,flexShrink:0}}>
                Trocar peça
              </button>
            </div>

            <div style={{background:NB.col,border:'1px solid '+NB.bd,borderRadius:11,padding:'15px 16px'}}>
              <div style={{display:'flex',gap:20,flexWrap:'wrap',alignItems:'flex-end'}}>
                {modo==='formatos' ? (
                  <React.Fragment>
                    <div>
                      <div style={{...lbl,marginBottom:7}}>Como preencher o que sobra</div>
                      <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
                        <button onClick={()=>setFit('blur')}    style={{...btn(fit==='blur'),padding:'8px 13px',fontSize:12.5}}>Estender a peça</button>
                        <button onClick={()=>setFit('cor')}     style={{...btn(fit==='cor'),padding:'8px 13px',fontSize:12.5}}>Cor sólida</button>
                        <button onClick={()=>setFit('cover')}   style={{...btn(fit==='cover'),padding:'8px 13px',fontSize:12.5}}>Cortar</button>
                      </div>
                    </div>
                    {fit==='cor' && (
                      <div>
                        <div style={{...lbl,marginBottom:7}}>Cor</div>
                        <div style={{display:'flex',gap:7}}>
                          {BGS.map(b=>(
                            <button key={b.id} onClick={()=>setBg(b.hex)} title={b.label}
                              style={{width:30,height:30,borderRadius:8,background:b.hex,border:bg===b.hex?'2.5px solid '+NB.azul:'1px solid '+NB.bd,cursor:'pointer'}}/>
                          ))}
                        </div>
                      </div>
                    )}
                  </React.Fragment>
                ) : (
                  <div>
                    <div style={{...lbl,marginBottom:7}}>Formato</div>
                    <select value={fmt} onChange={e=>setFmt(e.target.value)} style={{...inp,padding:'8px 11px',fontSize:13,width:'auto'}}>
                      {FORMATS.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}
                    </select>
                  </div>
                )}
                <button onClick={gerar}
                  style={{padding:'10px 20px',background:NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>
                  Gerar variações
                </button>
              </div>
              {modo==='formatos' && fit==='blur' && (
                <p style={{fontSize:12,color:NB.mut2,marginTop:11,lineHeight:1.55}}>
                  A própria peça vira o fundo, ampliada e desfocada — é assim que o Meta adapta um criativo pra outro formato sem deixar tarja.
                </p>
              )}
            </div>
          </React.Fragment>
        )}

        {/* ---- Capa: fundo opcional, título obrigatório ---- */}
        {modo==='capa' && (
          <div>
            <p style={{fontSize:13,color:NB.mut,lineHeight:1.6,marginBottom:16}}>
              Gera uma capa/thumbnail pronta — com foto de fundo se você subir uma, ou no degradê do Nibo se não subir nada.
            </p>
            <div style={{display:'flex',alignItems:'center',gap:11,marginBottom:16}}>
              <button onClick={()=>capaFileRef.current && capaFileRef.current.click()}
                style={{display:'flex',alignItems:'center',gap:7,padding:'9px 14px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:12.5,fontWeight:500,color:NB.mut}}>
                <IClip s={14}/> {capaImg?'Trocar fundo':'Fundo (opcional)'}
              </button>
              <input ref={capaFileRef} type="file" accept="image/*" onChange={e=>{const f=e.target.files&&e.target.files[0]; e.target.value=''; loadCapaFundo(f);}} style={{display:'none'}}/>
              {capaImg && (
                <React.Fragment>
                  <img src={capaImg.src} alt="" style={{width:36,height:36,borderRadius:7,objectFit:'cover',border:'1px solid '+NB.bd}}/>
                  <button onClick={()=>setCapaImg(null)} style={{background:'none',border:'none',color:NB.mut2,padding:2,display:'flex'}}><IX s={14}/></button>
                </React.Fragment>
              )}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:13,marginBottom:14}}>
              <div>
                <div style={{...lbl,marginBottom:7}}>Título</div>
                <input value={capaTitulo} onChange={e=>setCapaTitulo(e.target.value)} placeholder="ex: Reforma Tributária explicada" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
              </div>
              <div>
                <div style={{...lbl,marginBottom:7}}>Subtítulo (opcional)</div>
                <input value={capaSub} onChange={e=>setCapaSub(e.target.value)} placeholder="ex: o que muda pro seu escritório" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
              </div>
            </div>
            <div style={{display:'flex',gap:16,alignItems:'flex-end',flexWrap:'wrap'}}>
              <div>
                <div style={{...lbl,marginBottom:7}}>Formato</div>
                <select value={fmt} onChange={e=>setFmt(e.target.value)} style={{...inp,padding:'8px 11px',fontSize:13,width:'auto'}}>
                  {FORMATS.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}
                </select>
              </div>
              <button onClick={gerarCapa} disabled={gerando}
                style={{padding:'10px 20px',background:gerando?'#CFD8E6':NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',cursor:gerando?'wait':'pointer'}}>
                {gerando?'Gerando…':'Gerar capa'}
              </button>
            </div>
            {err && <p style={{fontSize:12.5,color:'#B4232A',marginTop:12}}>{err}</p>}
          </div>
        )}

        {/* ---- Encerramento: card padrão da marca, nunca precisa de imagem ---- */}
        {modo==='encerramento' && (
          <div>
            <p style={{fontSize:13,color:NB.mut,lineHeight:1.6,marginBottom:16}}>
              Card final padronizado — logo do Nibo no degradê da marca. Cole como o último frame de vídeos simples, sem precisar editar do zero cada vez.
            </p>
            <div style={{marginBottom:14}}>
              <div style={{...lbl,marginBottom:7}}>Frase de encerramento (opcional)</div>
              <input value={fraseFinal} onChange={e=>setFraseFinal(e.target.value)} placeholder="ex: Siga @nibo pra mais conteúdo assim" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
            </div>
            <div style={{display:'flex',gap:16,alignItems:'flex-end',flexWrap:'wrap'}}>
              <div>
                <div style={{...lbl,marginBottom:7}}>Formato</div>
                <select value={fmt} onChange={e=>setFmt(e.target.value)} style={{...inp,padding:'8px 11px',fontSize:13,width:'auto'}}>
                  {FORMATS.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}
                </select>
              </div>
              <button onClick={gerarEncerramento} disabled={gerando}
                style={{padding:'10px 20px',background:gerando?'#CFD8E6':NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',cursor:gerando?'wait':'pointer'}}>
                {gerando?'Gerando…':'Gerar encerramento'}
              </button>
            </div>
            {err && <p style={{fontSize:12.5,color:'#B4232A',marginTop:12}}>{err}</p>}
          </div>
        )}

        {/* ---- Briefing: nunca precisou de imagem de verdade ---- */}
        {modo==='briefing' && (
          <div>
            <div style={{display:'flex',alignItems:'flex-end',gap:12,marginBottom:16,flexWrap:'wrap'}}>
              <div style={{flex:'1 1 260px'}}>
                <div style={{...lbl,marginBottom:6}}>Tema da peça</div>
                <input value={tema} onChange={e=>setTema(e.target.value)} placeholder="ex: Radar e-CAC na Reforma Tributária" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
              </div>
              <div>
                <div style={{...lbl,marginBottom:6}}>Público na peça</div>
                <select value={pub} onChange={e=>setPub(e.target.value)} style={{...inp,padding:'9px 12px',fontSize:13.5,width:'auto'}}>
                  {PUBLICOS.map(p=><option key={p}>{p}</option>)}
                </select>
              </div>
            </div>
            {Object.entries(briefing(tema||imgName, pub)).map(([sec,itens])=>(
              <div key={sec} style={{marginBottom:16}}>
                <div style={{fontSize:12.5,fontWeight:600,color:NB.txt,marginBottom:7}}>{sec}</div>
                <ul style={{margin:0,paddingLeft:18,display:'flex',flexDirection:'column',gap:5}}>
                  {itens.map((it,i)=><li key={i} style={{fontSize:13,color:'#3D4B63',lineHeight:1.6}}>{it}</li>)}
                </ul>
              </div>
            ))}
            <button onClick={()=>{
              const b = briefing(tema||imgName, pub);
              const txt = Object.entries(b).map(([s,i])=>s+'\n'+i.map(x=>'- '+x).join('\n')).join('\n\n');
              navigator.clipboard && navigator.clipboard.writeText((tema||imgName)+' — variações\n\n'+txt);
            }}
              style={{padding:'9px 16px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>
              Copiar briefing
            </button>
          </div>
        )}
      </div>

      {outs.length>0 && (
        <div style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:16,padding:'20px 22px',boxShadow:'0 1px 3px rgba(11,42,92,0.04)'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14,gap:12,flexWrap:'wrap'}}>
            <span style={{fontSize:14,fontWeight:500,color:NB.txt}}>{outs.length} variações geradas</span>
            <div style={{display:'flex',gap:9,alignItems:'center',flexWrap:'wrap'}}>
              <select value={alvo} onChange={e=>{setAlvo(e.target.value); setErr('');}} style={{...inp,padding:'8px 11px',fontSize:12.5,width:'auto'}}>
                <option value="">Salvar nos anexos de…</option>
                {designs.map(d=><option key={d.id} value={d.id}>{d.code} — {d.title.slice(0,38)}</option>)}
              </select>
              <button onClick={()=>outs.forEach((o,i)=>setTimeout(()=>baixar(o), i*250))}
                style={{display:'flex',alignItems:'center',gap:7,padding:'9px 15px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:12.5,fontWeight:500,color:NB.azul}}>
                <IDown/> Baixar todas
              </button>
            </div>
          </div>

          {err && <p style={{fontSize:12.5,color:'#B4232A',marginBottom:12}}>{err}</p>}
          {okMsg && <p style={{fontSize:12.5,color:'#0F6E56',marginBottom:12}}>{okMsg}</p>}

          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(170px,1fr))',gap:14}}>
            {outs.map(o=>(
              <div key={o.key} style={{border:'1px solid '+NB.bd,borderRadius:11,overflow:'hidden',background:'#fff'}}>
                <div style={{background:'#EEF2F8',display:'flex',alignItems:'center',justifyContent:'center',height:190,padding:10}}>
                  <img src={o.url} alt={o.label} style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain',borderRadius:5}}/>
                </div>
                <div style={{padding:'11px 12px'}}>
                  <div style={{fontSize:13,fontWeight:500,color:NB.txt}}>{o.label}</div>
                  <div style={{fontSize:11.5,color:NB.mut2,marginBottom:9}}>{o.w} × {o.h}</div>
                  <div style={{display:'flex',gap:6}}>
                    <button onClick={()=>baixar(o)} title="Baixar"
                      style={{flex:1,padding:'7px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,color:NB.mut,display:'flex',justifyContent:'center'}}><IDown/></button>
                    <button onClick={()=>salvar(o)} title="Salvar nos anexos da demanda escolhida"
                      style={{flex:1,padding:'7px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,color:NB.mut,display:'flex',justifyContent:'center'}}><IClip s={14}/></button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function CardModal() {
  const { selDemand, setModal, moveStage, moveArea, delDemand, archiveDemand, setNotifyPending, setAssignees, updateDemand, attach, comments, pipes, enviarCampanhaDeDemanda } = useApp();
  const [picker, setPicker] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const [tab, setTab] = useState('anexos');
  const [areaPick, setAreaPick] = useState(false);
  const [tgtArea, setTgtArea]   = useState(null);
  const [tgtStage, setTgtStage] = useState(null);
  const [enviando, setEnviando] = useState(false);
  const openId = selDemand ? selDemand.id : null;

  /* Reabrir outro card não pode herdar o estado do anterior */
  useEffect(() => {
    setPicker(false); setConfirmDel(false); setTab('anexos');
    setAreaPick(false); setTgtArea(null); setTgtStage(null); setEnviando(false);
  }, [openId]);

  if (!selDemand) return null;

  const nAttach   = (attach[openId] || []).length;
  const nComments = (comments[openId] || []).length;

  const d = selDemand;
  const stages = pipes[d.area]||[];
  const stage = stages.find(s=>s.id===d.stageId);
  const ps  = PRI_STL[d.priority]||PRI_STL.Baixa;
  const ac  = AREA_CLR[d.area]||NB.azul;
  const sla = getSla(d.deadline);
  const Icon = AREA_ICON[d.area];
  const podeEnviarCampanha = d.ehCampanha && stage && stage.isDone;

  const enviarCampanha = () => {
    setEnviando(true);
    enviarCampanhaDeDemanda(d);
    setTimeout(()=>setEnviando(false), 900);
  };

  const toggle = init => {
    const has = d.assignees.includes(init);
    if (has && d.assignees.length === 1) return;   // nunca deixar sem ninguém
    setAssignees(d.id, has ? d.assignees.filter(i=>i!==init) : [...d.assignees, init]);
  };

  return (
    <Modal onClose={()=>setModal(null)} width={620}>
      <div style={{padding:'22px 26px 18px',borderBottom:'1px solid '+NB.bdSoft,display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:14}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:9,flexWrap:'wrap'}}>
            <span style={{background:NB.col,border:'1px solid '+NB.bd,color:NB.mut,fontSize:11,fontWeight:500,padding:'3px 8px',borderRadius:6,fontFamily:'monospace'}}>{d.code}</span>
            <span style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:13,fontWeight:500,color:ac}}><Icon s={15}/> {d.area}</span>
            <span style={{fontSize:11.5,fontWeight:500,padding:'3px 9px',borderRadius:6,background:ps.bg,color:ps.txt}}>{d.priority}</span>
          </div>
          <EditableText value={d.title} required
            onSave={v=>updateDemand(d.id,{title:v})}
            textStyle={{fontSize:19,fontWeight:600,color:NB.txt,lineHeight:1.32,letterSpacing:'-0.01em'}}/>
        </div>
        <button onClick={()=>setModal(null)} style={{padding:8,background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,color:NB.mut,display:'flex',flexShrink:0}}><IX/></button>
      </div>

      <div style={{padding:'22px 26px'}}>
        {(podeEnviarCampanha || d.campanhaId) && (
          <div style={{marginBottom:20,background:d.campanhaId?'#E1F5EE':'#EAF3FD',border:'1px solid '+(d.campanhaId?'#A7E8CC':'#BBD8F5'),borderRadius:12,padding:'14px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:14,flexWrap:'wrap'}}>
            <div style={{display:'flex',alignItems:'center',gap:11,minWidth:0}}>
              <span style={{color:d.campanhaId?'#0F6E56':NB.azul,display:'flex',flexShrink:0}}>{d.campanhaId?<ICheck s={18}/>:<ITarget s={18}/>}</span>
              <div>
                <div style={{fontSize:13.5,fontWeight:600,color:NB.txt}}>
                  {d.campanhaId ? 'Já está na Central de Informações' : 'Pronta pra ir pra Central de Informações'}
                </div>
                <div style={{fontSize:12,color:NB.mut}}>
                  {d.campanhaId
                    ? 'Todo o Nibo já pode ver essa campanha, com as peças anexadas aqui.'
                    : (d.campanhaDesconto ? d.campanhaDesconto+' · ' : '')+'Jornada: '+(PERSONAS.find(p=>p.id===d.campanhaJornada)?.label||d.campanhaJornada)}
                </div>
              </div>
            </div>
            {!d.campanhaId && (
              <button onClick={enviarCampanha} disabled={enviando}
                style={{padding:'9px 16px',background:NB.azul,border:'none',borderRadius:9,fontSize:12.5,fontWeight:500,color:'#fff',flexShrink:0,opacity:enviando?0.7:1,cursor:enviando?'wait':'pointer'}}>
                {enviando?'Enviando…':'Enviar campanha para Central de Informações'}
              </button>
            )}
          </div>
        )}
        <div style={{marginBottom:22}}>
          <div style={lbl}>Descrição</div>
          <EditableText value={d.description} multiline rows={3}
            placeholder="Clique para adicionar contexto, referências ou link do briefing..."
            onSave={v=>updateDemand(d.id,{description:v})}
            textStyle={{fontSize:14.5,color:'#3D4B63',lineHeight:1.65}}/>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:13,marginBottom:22}}>
          <div style={{background:NB.col,borderRadius:11,padding:'13px 15px'}}>
            <div style={lbl}>Solicitante</div>
            <div style={{fontSize:14.5,color:NB.txt,fontWeight:500}}>{d.requester}</div>
          </div>
          <div style={{background:NB.col,borderRadius:11,padding:'13px 15px'}}>
            <div style={lbl}>Prazo</div>
            <div style={{display:'flex',alignItems:'center',gap:9,flexWrap:'wrap'}}>
              <input type="date" value={d.deadline||''}
                onChange={e=>{ if(e.target.value) updateDemand(d.id,{deadline:e.target.value}); }}
                style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,padding:'7px 10px',fontSize:13.5,color:NB.txt,outline:'none',fontWeight:500}}
                onFocus={e=>{e.target.style.borderColor=NB.azul;}} onBlur={e=>{e.target.style.borderColor=NB.bd;}}/>
              {sla && (
                <span style={{fontSize:12.5,fontWeight:500,padding:'4px 9px',borderRadius:6,
                  background: sla.type==='danger' ? '#FEECEC' : sla.type==='warn' ? '#FFF6DE' : '#EEF2F8',
                  color:      sla.type==='danger' ? '#B4232A' : sla.type==='warn' ? '#8A6206' : NB.mut}}>{sla.label}</span>
              )}
            </div>
          </div>
        </div>

        <div style={{marginBottom:24}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:7,gap:10}}>
            <span style={{...lbl, marginBottom:0}}>Responsáveis</span>
            <button onClick={()=>setPicker(p=>!p)}
              style={{display:'flex',alignItems:'center',gap:6,padding:'5px 11px',background:picker?'#EAF3FD':'#fff',border:'1px solid '+(picker?NB.azul:NB.bd),borderRadius:8,fontSize:12.5,fontWeight:500,color:picker?NB.azul:NB.mut}}>
              <IPlus s={13}/> {picker ? 'Fechar' : 'Adicionar ou trocar'}
            </button>
          </div>

          <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
            {d.assignees.map(init => (
              <AssigneeChip key={init} initials={init}
                onRemove={d.assignees.length>1 ? ()=>toggle(init) : null}/>
            ))}
          </div>

          {picker && (
            <div style={{marginTop:12,padding:'14px 15px',background:NB.col,border:'1px solid '+NB.bd,borderRadius:12}}>
              <div style={{fontSize:12,color:NB.mut,marginBottom:10}}>Clique para adicionar ou remover. Quem entrar é notificado no Slack.</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                {ACTIVE_TEAM.map(m => (
                  <AssigneePick key={m.id} member={m}
                    checked={d.assignees.includes(m.initials)}
                    onToggle={()=>toggle(m.initials)}/>
                ))}
              </div>
              {d.assignees.length===1 && (
                <p style={{fontSize:12,color:NB.mut2,marginTop:10}}>A demanda precisa de pelo menos uma pessoa responsável.</p>
              )}
            </div>
          )}
        </div>

        <div>
          <div style={lbl}>Mover para etapa</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:11}}>
            {stages.map(stage=>{
              const isCur = stage.id===d.stageId;
              const needsNotify = d.area==='Design' && stage.isDone;
              return (
                <button key={stage.id} onClick={()=>{
                  if (isCur) return;
                  if (needsNotify) setNotifyPending({ demandId:d.id, stageId:stage.id, demandTitle:d.title });
                  else moveStage(d.id, stage.id);
                }}
                  style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',borderRadius:9,fontSize:13,fontWeight:500,border:'1px solid '+(isCur?ac:NB.bd),background:isCur?ac:'#fff',color:isCur?'#fff':NB.mut,transition:'all 0.12s'}}
                  onMouseEnter={e=>{ if(!isCur){e.currentTarget.style.color=NB.txt; e.currentTarget.style.borderColor='#D3DCEA';} }}
                  onMouseLeave={e=>{ if(!isCur){e.currentTarget.style.color=NB.mut; e.currentTarget.style.borderColor=NB.bd;} }}>
                  {isCur && <ICheck s={13}/>}
                  {stage.name}
                </button>
              );
            })}
          </div>
          <p style={{fontSize:12.5,color:NB.mut2,lineHeight:1.55,marginBottom:14}}>Ao mover, o caminho da automação é enviado automaticamente para o Slack. Etapas de aprovação são sempre encaminhadas para @Mariana Araújo.</p>

          <div style={{marginTop:16,background:'#EAF3FD',border:'1px solid #BBD8F5',borderRadius:12,padding:'14px 16px'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
              <div style={{display:'flex',alignItems:'flex-start',gap:11,minWidth:0}}>
                <span style={{color:NB.azul,display:'flex',marginTop:1,flexShrink:0}}><IArrowR s={17}/></span>
                <div>
                  <div style={{fontSize:13.5,fontWeight:600,color:NB.txt,marginBottom:2}}>Passar para outra área</div>
                  <div style={{fontSize:12.5,color:'#3D5B85',lineHeight:1.5}}>
                    Aprovada no {d.area} e agora é de Mídia Paga ou Social? Mande a demanda para o pipeline certo.
                  </div>
                </div>
              </div>
              <button onClick={()=>{setAreaPick(v=>!v); setTgtArea(null);}}
                style={{display:'flex',alignItems:'center',gap:7,padding:'10px 16px',background:areaPick?'#fff':NB.azul,border:'1px solid '+NB.azul,borderRadius:9,fontSize:13,fontWeight:500,color:areaPick?NB.azul:'#fff',flexShrink:0,whiteSpace:'nowrap'}}>
                {areaPick ? 'Cancelar' : 'Escolher área'}
              </button>
            </div>

            {areaPick && (
              <div style={{marginTop:14,background:'#fff',border:'1px solid #BBD8F5',borderRadius:11,padding:'14px 15px'}}>
                <div style={{...lbl,marginBottom:8}}>Para qual área</div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:tgtArea?14:0}}>
                  {Object.keys(pipes).filter(a=>a!==d.area).map(a=>{
                    const AIcon = AREA_ICON[a]; const on = tgtArea===a;
                    return (
                      <button key={a} onClick={()=>setTgtArea(on?null:a)}
                        style={{display:'flex',alignItems:'center',gap:7,padding:'8px 13px',borderRadius:9,border:'1px solid '+(on?AREA_CLR[a]:NB.bd),background:on?AREA_CLR[a]+'14':'#fff',fontSize:13,fontWeight:500,color:on?AREA_CLR[a]:NB.mut}}>
                        <AIcon s={15}/> {a}
                      </button>
                    );
                  })}
                </div>

                {tgtArea && (
                  <React.Fragment>
                    <div style={{...lbl,marginBottom:8}}>Entra em qual etapa de {tgtArea}</div>
                    <div style={{display:'flex',gap:7,flexWrap:'wrap',marginBottom:14}}>
                      {pipes[tgtArea].map(st=>{
                        const on = tgtStage===st.id || (!tgtStage && st.id===pipes[tgtArea][0].id);
                        return (
                          <button key={st.id} onClick={()=>setTgtStage(st.id)}
                            style={{padding:'7px 12px',borderRadius:8,border:'1px solid '+(on?AREA_CLR[tgtArea]:NB.bd),background:on?AREA_CLR[tgtArea]:'#fff',fontSize:12.5,fontWeight:500,color:on?'#fff':NB.mut}}>
                            {st.name}
                          </button>
                        );
                      })}
                    </div>
                    <p style={{fontSize:12,color:NB.mut2,lineHeight:1.55,marginBottom:12}}>
                      Os responsáveis atuais continuam no card. Ajuste na seção Responsáveis se quem toca a demanda mudou.
                    </p>
                    <button onClick={()=>{
                      moveArea(d.id, tgtArea, tgtStage || pipes[tgtArea][0].id);
                      setAreaPick(false); setTgtArea(null); setTgtStage(null);
                    }}
                      style={{padding:'9px 18px',background:AREA_CLR[tgtArea],border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>
                      Passar para {tgtArea}
                    </button>
                  </React.Fragment>
                )}
              </div>
            )}
          </div>
        </div>

        {/* Anexos e comentários */}
        <div style={{marginTop:26,borderTop:'1px solid '+NB.bdSoft,paddingTop:18}}>
          <div style={{display:'flex',gap:6,marginBottom:18,flexWrap:'wrap'}}>
            {[
              {id:'anexos',label:'Anexos',Icon:IClip,n:nAttach},
              {id:'comentarios',label:'Comentários',Icon:IChatBox,n:nComments},
            ].map(({id,label,Icon,n})=>{
              const on = tab===id;
              return (
                <button key={id} onClick={()=>setTab(id)}
                  style={{display:'flex',alignItems:'center',gap:8,padding:'9px 15px',borderRadius:9,border:'1px solid '+(on?NB.azul:NB.bd),background:on?'#EAF3FD':'#fff',fontSize:13,fontWeight:500,color:on?NB.azul:NB.mut}}>
                  <Icon s={15}/> {label}
                  {n>0 && <span style={{background:on?NB.azul:'#EEF2F8',color:on?'#fff':NB.mut,fontSize:11,fontWeight:600,borderRadius:20,padding:'1px 7px'}}>{n}</span>}
                </button>
              );
            })}
          </div>
          {tab==='anexos' ? <AttachPanel demand={d}/> : <CommentPanel demand={d}/>}
        </div>
      </div>

      <div style={{padding:'16px 26px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}}>
        {confirmDel ? (
          <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
            <span style={{fontSize:13,color:'#B4232A',fontWeight:500}}>Excluir {d.code}? Não dá para desfazer.</span>
            <button onClick={()=>delDemand(d.id)}
              style={{padding:'8px 15px',background:'#B4232A',border:'none',borderRadius:8,fontSize:12.5,fontWeight:500,color:'#fff'}}>
              Sim, excluir
            </button>
            <button onClick={()=>setConfirmDel(false)}
              style={{padding:'8px 15px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:12.5,fontWeight:500,color:NB.mut}}>
              Cancelar
            </button>
          </div>
        ) : (
          <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
            <button onClick={()=>archiveDemand(d.id)} title="Sai do quadro mas continua guardada"
              style={{display:'flex',alignItems:'center',gap:7,padding:'10px 16px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}
              onMouseEnter={e=>{e.currentTarget.style.color=NB.txt; e.currentTarget.style.borderColor='#D3DCEA';}}
              onMouseLeave={e=>{e.currentTarget.style.color=NB.mut; e.currentTarget.style.borderColor=NB.bd;}}>
              <IArchive s={15}/> Arquivar
            </button>
            <button onClick={()=>setConfirmDel(true)}
              style={{padding:'10px 16px',background:'#fff',border:'1px solid #FBD5D5',borderRadius:9,fontSize:13,fontWeight:500,color:'#B4232A'}}>
              Excluir
            </button>
          </div>
        )}
        <button onClick={()=>setModal(null)}
          style={{padding:'10px 22px',background:NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>
          Fechar
        </button>
      </div>
    </Modal>
  );
}

/* =========== NOTIFICAR ENTREGA (DESIGN) =========== */
const DESIGN_NOTIFY_OPTIONS = ['RO','CA','MA'];

function NotifyOption({ initials, checked, onToggle }) {
  const mb = useMember(initials);
  return (
    <label style={{display:'flex',alignItems:'center',gap:11,padding:'11px 14px',borderRadius:11,background:checked?'#EAF3FD':'#fff',border:'1px solid '+(checked?NB.azul:NB.bd),cursor:'pointer',transition:'all 0.12s'}}>
      <input type="checkbox" checked={checked} onChange={onToggle} style={{width:15,height:15,accentColor:NB.azul}}/>
      <Avatar member={mb} size={28} ring={false} style={{boxShadow:'0 0 0 1.5px '+((mb&&mb.color)||NB.azul)}}/>
      <span style={{fontSize:14,color:NB.txt,fontWeight:500}}>{mb?mb.name:initials}</span>
    </label>
  );
}

function NotifyModal() {
  const { notifyPending, setNotifyPending, moveStage } = useApp();
  const [picked, setPicked] = useState([]);
  useEffect(() => { if (notifyPending) setPicked([]); }, [notifyPending]);
  if (!notifyPending) return null;

  const toggle = init => setPicked(p => p.includes(init) ? p.filter(i=>i!==init) : [...p, init]);
  const allSelected = DESIGN_NOTIFY_OPTIONS.every(i=>picked.includes(i));
  const toggleAll = () => setPicked(allSelected ? [] : [...DESIGN_NOTIFY_OPTIONS]);
  const confirm = () => { moveStage(notifyPending.demandId, notifyPending.stageId, picked); setNotifyPending(null); };

  return (
    <Modal onClose={()=>setNotifyPending(null)} width={450} z={60}>
      <div style={{padding:'24px 26px 16px'}}>
        <h2 style={{fontSize:17.5,fontWeight:600,color:NB.txt,marginBottom:7}}>Notificar entrega no Slack</h2>
        <p style={{fontSize:13.5,color:NB.mut,lineHeight:1.6}}>A arte de <strong style={{color:NB.txt,fontWeight:500}}>{notifyPending.demandTitle}</strong> vai para Entregue. Quem deve receber a menção?</p>
      </div>
      <div style={{padding:'4px 26px 10px',display:'flex',flexDirection:'column',gap:8}}>
        <label style={{display:'flex',alignItems:'center',gap:11,padding:'11px 14px',borderRadius:11,background:allSelected?'#EAF3FD':'#fff',border:'1px solid '+(allSelected?NB.azul:NB.bd),cursor:'pointer'}}>
          <input type="checkbox" checked={allSelected} onChange={toggleAll} style={{width:15,height:15,accentColor:NB.azul}}/>
          <span style={{fontSize:14,fontWeight:500,color:NB.txt}}>Todos</span>
        </label>
        {DESIGN_NOTIFY_OPTIONS.map(init => (
          <NotifyOption key={init} initials={init} checked={picked.includes(init)} onToggle={()=>toggle(init)}/>
        ))}
      </div>
      <div style={{padding:'16px 26px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'flex-end',gap:10}}>
        <button onClick={()=>setNotifyPending(null)}
          style={{padding:'10px 18px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>
          Cancelar
        </button>
        <button onClick={confirm} disabled={picked.length===0}
          style={{padding:'10px 22px',background:picked.length?NB.azul:'#CFD8E6',border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',cursor:picked.length?'pointer':'not-allowed'}}>
          Mover e notificar
        </button>
      </div>
    </Modal>
  );
}

/* =========== PERFIL =========== */
function ProfileModal() {
  const { profileOpen, setProfileOpen, user, savePhoto, removePhoto, saveProfile, photos, googlePhotos } = useApp();
  const fileRef = useRef(null);
  const [name, setName] = useState('');
  const [err, setErr]   = useState('');
  const [photoDraft, setPhotoDraft] = useState(undefined);

  const userId  = user ? user.id : null;
  const nameRef = useRef('');
  nameRef.current = user ? user.name : '';

  useEffect(() => {
    if (profileOpen && userId) { setName(nameRef.current); setPhotoDraft(undefined); setErr(''); }
  }, [profileOpen, userId]);

  if (!profileOpen || !user) return null;

  const currentPhoto = photoDraft !== undefined ? photoDraft : (photos[user.id] || googlePhotos[user.id] || user.googlePhoto || null);

  const pick = e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (!f.type.startsWith('image/')) return setErr('Escolha um arquivo de imagem.');
    if (f.size > 3 * 1024 * 1024) return setErr('Imagem muito grande. Use um arquivo de até 3 MB.');
    const rd = new FileReader();
    rd.onload = () => { setPhotoDraft(rd.result); setErr(''); };
    rd.onerror = () => setErr('Não foi possível ler a imagem.');
    rd.readAsDataURL(f);
  };

  const save = () => {
    saveProfile(user.id, { name: name.trim() || nameRef.current });
    if (photoDraft !== undefined) { photoDraft ? savePhoto(user.id, photoDraft) : removePhoto(user.id); }
    setProfileOpen(false);
  };

  return (
    <Modal onClose={()=>setProfileOpen(false)} width={470} z={70}>
      <div style={{height:92,background:'linear-gradient(120deg,'+user.color+','+NB.roxo+')'}}/>
      <div style={{padding:'0 28px 24px',marginTop:-44}}>
        <div style={{display:'flex',alignItems:'flex-end',gap:16,marginBottom:22}}>
          <div style={{position:'relative'}}>
            <Avatar member={user} src={currentPhoto} size={90} ring={false} style={{border:'4px solid #fff',boxShadow:'0 4px 14px rgba(11,42,92,0.18)'}}/>
            <button onClick={()=>fileRef.current && fileRef.current.click()} title="Trocar foto"
              style={{position:'absolute',right:-2,bottom:-2,width:32,height:32,borderRadius:'50%',background:NB.azul,border:'3px solid #fff',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <ICamera s={15}/>
            </button>
            <input ref={fileRef} type="file" accept="image/*" onChange={pick} style={{display:'none'}}/>
          </div>
          <div style={{paddingBottom:6,minWidth:0}}>
            <div style={{fontSize:11.5,color:NB.mut2,fontWeight:500,textTransform:'uppercase',letterSpacing:'0.09em'}}>{user.area}</div>
            <div style={{fontSize:13.5,color:NB.mut,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{user.email}</div>
          </div>
        </div>

        <div style={lbl}>Nome de exibição</div>
        <input value={name} onChange={e=>setName(e.target.value)} style={inp}
          onFocus={e=>{e.target.style.borderColor=NB.azul;}} onBlur={e=>{e.target.style.borderColor=NB.bd;}}/>

        <div style={{display:'flex',gap:9,marginTop:16,flexWrap:'wrap'}}>
          <button onClick={()=>fileRef.current && fileRef.current.click()}
            style={{display:'flex',alignItems:'center',gap:8,padding:'10px 15px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:10,fontSize:13,fontWeight:500,color:NB.mut}}>
            <ICamera s={15}/> {currentPhoto ? 'Trocar foto' : 'Adicionar foto'}
          </button>
          {currentPhoto && (
            <button onClick={()=>setPhotoDraft(null)}
              style={{padding:'10px 15px',background:'#fff',border:'1px solid #FBD5D5',borderRadius:10,fontSize:13,fontWeight:500,color:'#B4232A'}}>
              Remover foto
            </button>
          )}
        </div>
        {err && <p style={{fontSize:12.5,color:'#B4232A',marginTop:10}}>{err}</p>}
        <p style={{fontSize:12.5,color:NB.mut2,marginTop:12,lineHeight:1.55}}>
          {photoDraft !== undefined
            ? 'Clique em Salvar perfil para aplicar a nova foto.'
            : 'Por padrão usamos sua foto do Google. A foto que você subir fica salva neste navegador.'}
        </p>
      </div>

function NewModal() {
  const { newOpen, setNewOpen, addDemand, user, area, pipes } = useApp();
  const initArea = area!=='Todas' ? area : 'Social';
  const [form, setForm] = useState({ title:'', area:initArea, priority:'Média', deadline:dStr(7), description:'', requester:user.name, assignees:[],
    ehCampanha:false, campanhaDesconto:'', campanhaJornada:'empresa' });

  useEffect(() => {
    if (newOpen) setForm(f=>({ ...f, title:'', area:area!=='Todas'?area:'Social', requester:user.name, assignees:[], description:'',
      ehCampanha:false, campanhaDesconto:'', campanhaJornada:'empresa' }));
  }, [newOpen, area, user]);

  if (!newOpen) return null;

  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const toggleAssignee = init => setForm(f => ({ ...f, assignees: f.assignees.includes(init) ? f.assignees.filter(i=>i!==init) : [...f.assignees, init] }));
  const valid = form.title.trim() && form.assignees.length>0;

  const submit = () => {
    if (!valid) return;
    addDemand({ title:form.title, area:form.area, priority:form.priority, deadline:form.deadline, description:form.description, requester:form.requester, assignees:form.assignees,
      ehCampanha:form.ehCampanha, campanhaDesconto:form.ehCampanha?form.campanhaDesconto:'', campanhaJornada:form.ehCampanha?form.campanhaJornada:'' });
    setNewOpen(false);
  };

  return (
    <Modal onClose={()=>setNewOpen(false)} width={580}>
      <div style={{padding:'24px 28px 18px',borderBottom:'1px solid '+NB.bdSoft,display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:14}}>
        <div>
          <h2 style={{fontSize:20,fontWeight:600,color:NB.txt,marginBottom:5,letterSpacing:'-0.01em'}}>Nova demanda</h2>
          <p style={{fontSize:13.5,color:NB.mut}}>A demanda será solicitada no Slack para quem você escolher.</p>
        </div>
        <button onClick={()=>setNewOpen(false)} style={{padding:8,background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,color:NB.mut,display:'flex',flexShrink:0}}><IX/></button>
      </div>

      <div style={{padding:'22px 28px',display:'flex',flexDirection:'column',gap:18}}>
        <div>
          <div style={lbl}>Título</div>
          <input value={form.title} onChange={e=>set('title',e.target.value)} placeholder="O que precisa ser feito?" style={inp}
            onFocus={e=>{e.target.style.borderColor=NB.azul;}} onBlur={e=>{e.target.style.borderColor=NB.bd;}}/>
        </div>

        <div>
          <div style={lbl}>Solicitado por</div>
          <select value={form.requester} onChange={e=>set('requester',e.target.value)} style={inp}>
            {ACTIVE_TEAM.map(m=><option key={m.id} value={m.name}>{m.name}</option>)}
          </select>
        </div>

        <div>
          <div style={lbl}>Para quem vai a demanda</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {ACTIVE_TEAM.map(m => (
              <AssigneePick key={m.id} member={m} checked={form.assignees.includes(m.initials)} onToggle={()=>toggleAssignee(m.initials)}/>
            ))}
          </div>
          {form.assignees.length===0 && <p style={{fontSize:12.5,color:NB.mut2,marginTop:8}}>Escolha ao menos uma pessoa para receber a demanda.</p>}
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:13}}>
          <div>
            <div style={lbl}>Área</div>
            <select value={form.area} onChange={e=>set('area',e.target.value)} style={inp}>
              {Object.keys(pipes).map(a=><option key={a}>{a}</option>)}
            </select>
          </div>
          <div>
            <div style={lbl}>Prioridade</div>
            <select value={form.priority} onChange={e=>set('priority',e.target.value)} style={inp}>
              {PRIORITIES.map(p=><option key={p}>{p}</option>)}

          </div>
          <div>
            <div style={lbl}>Prazo</div>
            <input type="date" value={form.deadline} onChange={e=>set('deadline',e.target.value)} style={inp}/>
          </div>
        </div>

        <div style={{background:form.ehCampanha?'#EAF3FD':NB.col,border:'1px solid '+(form.ehCampanha?NB.azul:NB.bd),borderRadius:11,padding:'14px 15px'}}>
          <label style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}}>
            <input type="checkbox" checked={form.ehCampanha} onChange={e=>set('ehCampanha',e.target.checked)} style={{width:16,height:16,accentColor:NB.azul}}/>
            <span style={{fontSize:13.5,fontWeight:500,color:NB.txt}}>Essa demanda é uma campanha</span>
          </label>
          {form.ehCampanha && (
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginTop:13}}>
              <div>
                <div style={lbl}>Desconto</div>
                <input value={form.campanhaDesconto} onChange={e=>set('campanhaDesconto',e.target.value)} placeholder="ex: 20% OFF" style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
              </div>
              <div>
                <div style={lbl}>Jornada</div>
                <select value={form.campanhaJornada} onChange={e=>set('campanhaJornada',e.target.value)} style={{...inp,padding:'9px 12px',fontSize:13.5}}>
                  {PERSONAS.map(p=><option key={p.id} value={p.id}>{p.emoji} {p.label}</option>)}
                </select>
              </div>
              <p style={{gridColumn:'1 / -1',fontSize:12,color:NB.mut,lineHeight:1.55,margin:0}}>
                Quando essa demanda chegar em "Publicado", vai aparecer um botão pra enviar ela pra Central de Informações, junto com as peças anexadas.
              </p>
            </div>

        </div>

        <div>
          <div style={lbl}>Contexto (opcional)</div>
          <textarea value={form.description} onChange={e=>set('description',e.target.value)} rows={3}
            placeholder="Referências, objetivo, link de briefing..." style={{...inp,resize:'vertical',lineHeight:1.6}}
            onFocus={e=>{e.target.style.borderColor=NB.azul;}} onBlur={e=>{e.target.style.borderColor=NB.bd;}}/>
        </div>
      </div>

      <div style={{padding:'16px 28px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'flex-end',gap:10}}>
        <button onClick={()=>setNewOpen(false)}
          style={{padding:'11px 18px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>
          Cancelar
        </button>
        <button onClick={submit} disabled={!valid}
          style={{padding:'11px 24px',background:valid?NB.azul:'#CFD8E6',border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',cursor:valid?'pointer':'not-allowed'}}>
          Solicitar no Slack
        </button>
      </div>
    </Modal>
  );
}

/* =========== PORTA DE ENTRADA — pública, sem login. "Gestão" pede login. ============ */
/* Lógica de login isolada, reaproveitada pelo card de Gestão. */
function useLoginGestao() {
  const { setAuthError } = useApp();
  const [busy, setBusy] = useState(false);
  const [erro, setErro] = useState('');

  const entrar = async () => {
    setBusy(true); setErro(''); setAuthError('');
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ hd: 'nibo.com.br', prompt: 'select_account' });
      await firebase.auth().signInWithPopup(provider);
      /* onAuthStateChanged assume a partir daqui */
    } catch (err) {
      const code = err && err.code;
      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') { /* fechou de propósito */ }
      else if (code === 'auth/unauthorized-domain') setErro('Domínio não autorizado no Firebase.');
      else if (code === 'auth/popup-blocked') setErro('O navegador bloqueou o popup. Libere pop-ups e tente de novo.');
      else setErro('Não foi possível entrar. Erro: ' + (code || 'desconhecido'));
      setBusy(false); return;
    }
    setBusy(false);
  };

  return { entrar, busy, erro };
}

<script type="text/babel">
const { useState, createContext, useContext, useEffect, useRef, useCallback } = React;

/* =========== DADOS =========== */
const NIBO_DOMAIN = '@nibo.com.br';

/* Plataforma de planejamento social — embutida na seção Social.
   Trocar de endereço é mudar só esta linha. */
const SOCIAL_APP_URL = 'https://claraabrantes-bot.github.io/planejamento-social-nibo/planejamento-social-media.html';

const TEAM = [
  { id: 'u1', name: 'Mariana Araújo',    initials: 'MA', area: 'Gestão',     isApprover: true,  email: 'mariana.araujo'+NIBO_DOMAIN,    color: '#0072CE' },
  { id: 'u2', name: 'Clara Abrantes',    initials: 'CA', area: 'Social',     isApprover: false, email: 'clara.abrantes'+NIBO_DOMAIN,    color: '#6431E2' },
  { id: 'u3', name: 'Millena Barros',    initials: 'MB', area: 'Design',     isApprover: false, email: 'millena.barros'+NIBO_DOMAIN,    color: '#0EA5E9' },
  { id: 'u4', name: 'Roberta Rocha',     initials: 'RO', area: 'Social',     isApprover: false, email: 'roberta.rocha'+NIBO_DOMAIN,     color: '#D97706' },
  { id: 'u5', name: 'Mikaella Nicomedes',initials: 'MK', area: 'Design',     isApprover: false, email: 'mikaella.nicomedes'+NIBO_DOMAIN,color: '#059669' },
  { id: 'u6', name: 'Vivian Santos',     initials: 'VI', area: 'Mídia Paga', isApprover: false, email: 'vivian.santos'+NIBO_DOMAIN,     color: '#FF40B3' },
  { id: 'u7', name: 'Jéssica Gonçalves', initials: 'JE', area: 'RevOps',     isApprover: false, email: 'jessica.goncalves'+NIBO_DOMAIN, color: '#475569' },
  { id: 'u8', name: 'Bianca Lisboa',     initials: 'BL', area: 'RevOps',     isApprover: false, email: 'bianca.lisboa'+NIBO_DOMAIN,     color: '#B91C1C' },
  { id: 'u9', name: 'Cláudio',           initials: 'CL', area: 'RevOps',     isApprover: false, email: null,                            color: '#94A3B8' },
];

const ACTIVE_TEAM = TEAM.filter(m => m.email);

const PIPELINES = {
  Social:      [{ id:'soc-1', name:'Solicitado' },{ id:'soc-2', name:'Em Redação' },{ id:'soc-3', name:'Design de Arte', isDesign:true },{ id:'soc-4', name:'Aprovação', isApproval:true },{ id:'soc-5', name:'Publicado', isDone:true }],
  Design:      [{ id:'des-1', name:'Solicitado' },{ id:'des-2', name:'Briefing' },{ id:'des-3', name:'Em Criação' },{ id:'des-4', name:'Aprovação', isApproval:true },{ id:'des-5', name:'Entregue', isDone:true }],
  'Mídia Paga':[{ id:'mid-1', name:'Solicitado' },{ id:'mid-2', name:'Configuração' },{ id:'mid-3', name:'Em Veiculação' },{ id:'mid-4', name:'Aprovação', isApproval:true },{ id:'mid-5', name:'Encerrado', isDone:true }],
  Produto:     [{ id:'pro-1', name:'Solicitado' },{ id:'pro-2', name:'Em Análise' },{ id:'pro-3', name:'Desenvolvimento' },{ id:'pro-4', name:'Homologação', isApproval:true },{ id:'pro-5', name:'Entregue', isDone:true }],
  RevOps:      [{ id:'rev-1', name:'Solicitado' },{ id:'rev-2', name:'Em Análise' },{ id:'rev-3', name:'Implementação' },{ id:'rev-4', name:'Validação', isApproval:true },{ id:'rev-5', name:'Produção', isDone:true }],
};

const AUTO = {
  Social: {
    'soc-2':{ action:'Briefing de copy ativado — equipe Social notificada', next:'Design de Arte → @Millena Barros' },
    'soc-3':{ action:'Ticket de arte criado para @Millena Barros', next:'Aprovação → @Mariana Araújo' },
    'soc-4':{ action:'@Mariana Araújo notificada para revisão e aprovação', next:'Aprovado → Agendamento | Ajuste → volta para Design' },
    'soc-5':{ action:'Post publicado + relatório de performance iniciado automaticamente', next:'Monitorar métricas por 7 dias' },
  },
  Design: {
    'des-2':{ action:'Briefing registrado e equipe de Design notificada', next:'Em Criação → @Millena Barros ou @Mikaella' },
    'des-3':{ action:'Arquivo iniciado no Canva — checklist de criação ativado', next:'Aprovação → @Mariana Araújo' },
    'des-4':{ action:'Arte enviada para aprovação de @Mariana Araújo', next:'Aprovado → Entregue | Ajuste → volta para Em Criação' },
    'des-5':{ action:'Arte entregue e arquivada no Drive do Nibo', next:'Encerrado' },
  },
  'Mídia Paga': {
    'mid-2':{ action:'Setup de campanha iniciado no Meta Ads Manager', next:'Em Veiculação → aguardar aprovação Meta' },
    'mid-3':{ action:'Campanha ativa — monitoramento automático ligado via Metabase', next:'Revisão de performance → @Vivian' },
    'mid-4':{ action:'Relatório de performance gerado + aprovação de @Mariana Araújo', next:'Aprovado → Encerrado | Ajuste → otimização de criativos' },
    'mid-5':{ action:'Campanha encerrada + relatório final arquivado no Drive', next:'Encerrado' },
  },
  Produto: {
    'pro-2':{ action:'Análise de viabilidade iniciada com squad de Produto', next:'Desenvolvimento → @Roberta' },
    'pro-3':{ action:'Card criado automaticamente no Azure DevOps', next:'Homologação → squad + @Mariana Araújo' },
    'pro-4':{ action:'Ambiente de homologação configurado + roteiro de testes ativado', next:'Aprovado → Deploy | Ajuste → volta para Dev' },
    'pro-5':{ action:'Feature em produção + comunicado automático enviado ao time no Slack', next:'Encerrado' },
  },
  RevOps: {
    'rev-2':{ action:'Análise de processo iniciada — @Jéssica notificada', next:'Implementação → @Cláudio' },
    'rev-3':{ action:'Automação configurada no n8n + testes de integração ativados', next:'Validação → @Mariana Araújo' },
    'rev-4':{ action:'Relatório técnico gerado + aprovação de go-live solicitada', next:'Aprovado → Produção | Ajuste → revisão técnica' },
    'rev-5':{ action:'Automação em produção + documentação publicada no Notion', next:'Monitorar por 30 dias' },
  },
};

/* Paleta Nibo */
const NB = {
  petroleo:'#002D72', azul:'#0072CE', azulClaro:'#41B6E6',
  roxo:'#6431E2', pink:'#FF40B3', amarelo:'#FFE800', gelo:'#B8CCEA',
  /* neutros da interface */
  bg:'#F4F7FC', card:'#FFFFFF', col:'#FAFBFD',
  bd:'#E8EDF5', bdSoft:'#EFF3F9', txt:'#0B2A5C', mut:'#7B879B', mut2:'#A9B4C6',
  navy1:'#0B2A5C', navy2:'#071E45',
};

const AREA_CLR = { Social:NB.azul, Design:NB.roxo, 'Mídia Paga':NB.pink, Produto:NB.azulClaro, RevOps:NB.petroleo };

const PRI_STL = {
  Urgente:{ bg:'#FFF3C4', txt:'#7A5C00', bdr:NB.amarelo },
  Alta:   { bg:'#FFE4F4', txt:'#A1006A', bdr:'#FF9BD8' },
  Média:  { bg:'#EDE7FE', txt:'#4A1FB8', bdr:'#C0A8FF' },
  Baixa:  { bg:'#F1F5F9', txt:'#64748B', bdr:'#CBD5E1' },
};
const PRIORITIES = ['Urgente','Alta','Média','Baixa'];

const tod = new Date();
const dStr = (n) => { const d=new Date(tod); d.setDate(d.getDate()+n); return d.toISOString().split('T')[0]; };

const INIT_DEMANDS = [
  { id:'d1', code:'DEM-101', title:'Carousel BPO Financeiro na Prática', area:'Social', priority:'Alta', stageId:'soc-2', assignees:['CA','RO'], deadline:dStr(2), description:'Carousel para lançamento do curso BPO Financeiro com Barbara Maciel. Foco em contadores que já usam Nibo.', requester:'Clara Abrantes' },
  { id:'d2', code:'DEM-102', title:'Banner Radar e-CAC — Reforma Tributária', area:'Design', priority:'Urgente', stageId:'des-3', assignees:['MB'], deadline:dStr(0), description:'Banner destacando a funcionalidade do Radar e-CAC no contexto da Reforma Tributária (IBS/CBS).', requester:'Mariana Araújo' },
  { id:'d3', code:'DEM-103', title:'Campanha Open Finance — Meta Ads', area:'Mídia Paga', priority:'Média', stageId:'mid-2', assignees:['VI'], deadline:dStr(5), description:'Campanha de conversão no Meta Ads para o Conciliador Open Finance. Público: empresários PME.', requester:'Vivian' },
  { id:'d4', code:'DEM-104', title:'Webinar Barbara Maciel — LP + e-mail sequence', area:'Social', priority:'Alta', stageId:'soc-4', assignees:['CA'], deadline:dStr(8), description:'Landing page HubSpot e sequência de 3 e-mails para webinar de 20/08 sobre onboarding de clientes.', requester:'Clara Abrantes' },
  { id:'d5', code:'DEM-105', title:'Post LinkedIn — Split Payment IBS/CBS', area:'Social', priority:'Média', stageId:'soc-1', assignees:['RO'], deadline:dStr(10), description:'Post educativo sobre split payment na Reforma Tributária para público contador.', requester:'Roberta' },
  { id:'d6', code:'DEM-106', title:'Automação intake de arte — Slack + n8n', area:'RevOps', priority:'Alta', stageId:'rev-3', assignees:['CL','JE'], deadline:dStr(3), description:'Formulário de intake de demandas de arte integrado ao Slack com triagem automática via n8n.', requester:'Clara Abrantes' },
  { id:'d7', code:'DEM-107', title:'Ebook Emissão NFS-e para contadores', area:'Design', priority:'Baixa', stageId:'des-1', assignees:['MK'], deadline:dStr(15), description:'Ebook sobre o Emissor NFS-e do Nibo — guia prático para contadores configurarem emissão.', requester:'Roberta' },
  { id:'d8', code:'DEM-108', title:'Feature Brief App Personalizado', area:'Produto', priority:'Média', stageId:'pro-2', assignees:['RO'], deadline:dStr(12), description:'Documentação de funcionalidades do App Personalizado para página de produto do site.', requester:'Roberta' },
];

const t = (d) => new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

const INIT_SLACK = [
  { id:'s1', code:'DEM-101', area:'Social', time:'09:14', stagePath:'Solicitado → Em Redação', action:'Briefing de copy ativado — equipe Social notificada', next:'Design de Arte → @Millena Barros', type:'move' },
  { id:'s2', code:'DEM-104', area:'Social', time:'10:33', stagePath:'Design de Arte → Aprovação', action:'@Mariana Araújo notificada para revisão e aprovação', next:'Aprovado → Agendamento | Ajuste → volta para Design', type:'approval' },
  { id:'s3', code:'DEM-106', area:'RevOps', time:'11:05', stagePath:'Em Análise → Implementação', action:'Automação configurada no n8n + testes de integração ativados', next:'Validação → @Mariana Araújo', type:'move' },
];

/* =========== CONTEXT =========== */
const Ctx = createContext(null);

function Provider({ children }) {
  const cntRef = useRef(INIT_DEMANDS.length);
  const [demands, setDemands] = useState(() => {
    try { const s=localStorage.getItem('nibo_dem_v3'); return s ? JSON.parse(s) : INIT_DEMANDS; } catch { return INIT_DEMANDS; }
  });
  const [slack, setSlack] = useState(() => {
    try { const s=localStorage.getItem('nibo_slk_v3'); return s ? JSON.parse(s) : INIT_SLACK; } catch { return INIT_SLACK; }
  });
  const [photos, setPhotos] = useState(() => {
    try { const s=localStorage.getItem('nibo_photos_v1'); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });
  const [googlePhotos, setGooglePhotos] = useState(() => {
    try { const s=localStorage.getItem('nibo_gphotos_v1'); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });
  /* Anexos e comentários moram em chaves próprias: se a cota estourar,
     o salvamento das demandas continua funcionando. */
  const [attach, setAttach] = useState(() => {
    try { const s=localStorage.getItem('nibo_attach_v1'); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });
  const [comments, setComments] = useState(() => {
    try { const s=localStorage.getItem('nibo_comments_v1'); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });
  const [storageWarn, setStorageWarn] = useState('');

  const [profiles, setProfiles] = useState(() => {
    try { const s=localStorage.getItem('nibo_profiles_v1'); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });

  const [fbUser, setFbUser]       = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [authError, setAuthError] = useState('');

  const [view, setView]     = useState('kanban');
  const [layout, setLayout] = useState('board');
  const [area, setArea]     = useState('Todas');
  const [query, setQuery]   = useState('');
  const [priFilter, setPriFilter] = useState([]);
  const [modal, setModal]   = useState(null);
  const [newOpen, setNewOpen] = useState(false);
  const [notifyPending, setNotifyPending] = useState(null);
  const [profileOpen, setProfileOpen] = useState(false);
  const [dragging, setDragging] = useState(null);

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged(u => {
      if (!u) { setFbUser(null); setAuthReady(true); return; }
      const mail = (u.email || '').toLowerCase();
      if (!mail.endsWith(NIBO_DOMAIN)) {
        setAuthError('Acesso restrito a contas ' + NIBO_DOMAIN + '. Você entrou com ' + mail + '.');
        firebase.auth().signOut();
        return;
      }
      const found = ACTIVE_TEAM.find(m => m.email === mail);
      if (!found) {
        setAuthError('A conta ' + mail + ' não está na lista da equipe de Marketing. Peça para adicionarem seu e-mail.');
        firebase.auth().signOut();
        return;
      }
      setAuthError('');
      if (u.photoURL) setGooglePhotos(p => p[found.id]===u.photoURL ? p : {...p, [found.id]:u.photoURL});
      setFbUser({ email: mail, photoURL: u.photoURL || null, displayName: u.displayName || '' });
      setAuthReady(true);
    });
    return unsub;
  }, []);

  const baseUser = fbUser ? ACTIVE_TEAM.find(m => m.email === fbUser.email) : null;
  const user = baseUser
    ? { ...baseUser, googlePhoto: fbUser.photoURL, ...(profiles[baseUser.id] || {}) }
    : null;

  useEffect(() => { try { localStorage.setItem('nibo_dem_v3', JSON.stringify(demands)); } catch {} }, [demands]);
  useEffect(() => { try { localStorage.setItem('nibo_slk_v3', JSON.stringify(slack)); } catch {} }, [slack]);
  useEffect(() => { try { localStorage.setItem('nibo_photos_v1', JSON.stringify(photos)); } catch {} }, [photos]);
  useEffect(() => {
    try { localStorage.setItem('nibo_attach_v1', JSON.stringify(attach)); setStorageWarn(''); }
    catch { setStorageWarn('O armazenamento do navegador encheu. Remova anexos antigos ou use links em vez de arquivos.'); }
  }, [attach]);
  useEffect(() => { try { localStorage.setItem('nibo_comments_v1', JSON.stringify(comments)); } catch {} }, [comments]);
  useEffect(() => { try { localStorage.setItem('nibo_gphotos_v1', JSON.stringify(googlePhotos)); } catch {} }, [googlePhotos]);
  useEffect(() => { try { localStorage.setItem('nibo_profiles_v1', JSON.stringify(profiles)); } catch {} }, [profiles]);

  const logout = useCallback(() => {
    setProfileOpen(false); setModal(null); setNewOpen(false); setNotifyPending(null);
    firebase.auth().signOut();
  }, []);

  const savePhoto   = useCallback((id, dataUrl) => setPhotos(p=>({...p,[id]:dataUrl})), []);
  const removePhoto = useCallback(id => setPhotos(p => { const n={...p}; delete n[id]; return n; }), []);
  const saveProfile = useCallback((id, patch) => setProfiles(p=>({...p,[id]:{...(p[id]||{}),...patch}})), []);

  const mentionNames = (inits) => inits.map(i => { const m=TEAM.find(t=>t.initials===i); return '@'+(m?m.name:i); }).join(' ');

  const addDemand = useCallback((data) => {
    const cnt = ++cntRef.current;
    const nd = { ...data, id:'d'+Date.now(), code:'DEM-'+(108+cnt), stageId:PIPELINES[data.area][0].id, createdAt:new Date().toISOString() };
    setDemands(p => [nd,...p]);
    const who = data.assignees && data.assignees.length ? mentionNames(data.assignees) : 'equipe de '+data.area;
    setSlack(p => [{ id:'s'+Date.now(), code:nd.code, area:data.area, time:t(new Date()), stagePath:'Nova demanda criada', action:'Solicitação registrada por '+data.requester+' — destinada a '+who, next:'Demanda solicitada no Slack para '+who, type:'new' }, ...p]);
    return nd;
  }, []);

  const moveStage = useCallback((demId, newStageId, notifyTargets) => {
    setDemands(p => p.map(d => {
      if (d.id !== demId) return d;
      const oldStage = Object.values(PIPELINES).flat().find(s=>s.id===d.stageId);
      const newStage = Object.values(PIPELINES).flat().find(s=>s.id===newStageId);
      let assignees = d.assignees;
      if (newStage && newStage.isApproval && !assignees.includes('MA')) {
        assignees = [...assignees, 'MA'];
      }
      const auto = AUTO[d.area] && AUTO[d.area][newStageId];
      if (auto) {
        let action = auto.action;
        if (notifyTargets && notifyTargets.length) {
          action = action + ' — ' + mentionNames(notifyTargets) + ' notificados no Slack';
        }
        setSlack(sp => [{ id:'s'+Date.now(), code:d.code, area:d.area, time:t(new Date()), stagePath:(oldStage?oldStage.name:'?')+' → '+(newStage?newStage.name:'?'), action, next:auto.next, type:newStage&&newStage.isApproval?'approval':'move' }, ...sp]);
      }
      return {...d, stageId:newStageId, assignees};
    }));
  }, []);

  const MAX_FILE = 700 * 1024;

  const feed = (d, stagePath, action, next, type) => setSlack(sp => [{
    id:'s'+Date.now()+Math.random().toString(36).slice(2,6), code:d.code, area:d.area,
    time:t(new Date()), stagePath, action, next, type }, ...sp]);

  const addAttachment = useCallback((demand, item) => {
    const rec = { ...item, id:'at'+Date.now()+Math.random().toString(36).slice(2,6), at:new Date().toISOString() };
    setAttach(p => ({ ...p, [demand.id]: [ ...(p[demand.id]||[]), rec ] }));
    feed(demand, 'Anexo adicionado',
      (rec.kind==='link' ? 'Link' : 'Arquivo') + ' "' + rec.name + '" anexado por ' + rec.by,
      'Disponível no card ' + demand.code, 'move');
  }, []);

  const removeAttachment = useCallback((demandId, attId) => {
    setAttach(p => ({ ...p, [demandId]: (p[demandId]||[]).filter(a=>a.id!==attId) }));
  }, []);

  const addComment = useCallback((demand, text, by) => {
    const rec = { id:'c'+Date.now(), text, by, at:new Date().toISOString() };
    setComments(p => ({ ...p, [demand.id]: [ ...(p[demand.id]||[]), rec ] }));
    const who = demand.assignees.map(i=>{ const m=TEAM.find(x=>x.initials===i); return '@'+(m?m.name:i); }).join(' ');
    feed(demand, 'Novo comentário',
      (TEAM.find(m=>m.initials===by)||{name:by}).name + ' comentou: "' + (text.length>90?text.slice(0,90)+'…':text) + '"',
      who + ' notificados no Slack', 'new');
  }, []);

  const removeComment = useCallback((demandId, cid) => {
    setComments(p => ({ ...p, [demandId]: (p[demandId]||[]).filter(c=>c.id!==cid) }));
  }, []);

  const moveArea = useCallback((demId, newArea, newStageId) => {
    setDemands(p => p.map(d => {
      if (d.id !== demId || d.area === newArea) return d;
      const stages = PIPELINES[newArea] || [];
      const target = stages.find(s => s.id === newStageId) || stages[0];
      if (!target) return d;
      let assignees = d.assignees;
      if (target.isApproval && !assignees.includes('MA')) assignees = [...assignees, 'MA'];
      setSlack(sp => [{ id:'s'+Date.now(), code:d.code, area:newArea, time:t(new Date()),
        stagePath: d.area + ' → ' + newArea,
        action: '"' + d.title + '" mudou de área e entrou em ' + target.name,
        next: 'Equipe de ' + newArea + ' assume a partir daqui',
        type: target.isApproval ? 'approval' : 'new' }, ...sp]);
      return { ...d, area:newArea, stageId:target.id, assignees };
    }));
  }, []);

  const setAssignees = useCallback((demId, list) => {
    setDemands(p => p.map(d => {
      if (d.id !== demId) return d;
      const added   = list.filter(i => !d.assignees.includes(i));
      const removed = d.assignees.filter(i => !list.includes(i));
      if (added.length || removed.length) {
        const parts = [];
        if (added.length)   parts.push(mentionNames(added)+' '+(added.length>1?'entraram':'entrou')+' na demanda');
        if (removed.length) parts.push(mentionNames(removed)+' '+(removed.length>1?'saíram':'saiu'));
        setSlack(sp => [{ id:'s'+Date.now(), code:d.code, area:d.area, time:t(new Date()),
          stagePath:'Responsáveis atualizados', action:parts.join(' · '),
          next: added.length ? mentionNames(added)+' notificados no Slack' : 'Equipe atualizada',
          type:'new' }, ...sp]);
      }
      return {...d, assignees:list};
    }));
  }, []);

  const updateDemand = useCallback((id, patch) => {
    setDemands(p => p.map(d => {
      if (d.id !== id) return d;
      /* Mudança de prazo mexe no planejamento do time — vale registro */
      if (patch.deadline && patch.deadline !== d.deadline) {
        setSlack(sp => [{ id:'s'+Date.now(), code:d.code, area:d.area, time:t(new Date()),
          stagePath:'Prazo alterado',
          action:'Prazo de "'+d.title+'" mudou de '+fmtDate(d.deadline)+' para '+fmtDate(patch.deadline),
          next:'Responsáveis notificados no Slack', type:'approval' }, ...sp]);
      }
      return { ...d, ...patch };
    }));
  }, []);

  const archiveDemand = useCallback((id) => {
    setDemands(p => p.map(d => {
      if (d.id !== id || d.archivedAt) return d;
      setSlack(sp => [{ id:'s'+Date.now(), code:d.code, area:d.area, time:t(new Date()),
        stagePath:'Demanda arquivada', action:'"'+d.title+'" saiu do quadro e foi para Arquivadas',
        next:'Pode ser restaurada a qualquer momento', type:'move' }, ...sp]);
      return { ...d, archivedAt:new Date().toISOString() };
    }));
    setModal(null);
  }, []);

  const restoreDemand = useCallback((id) => {
    setDemands(p => p.map(d => {
      if (d.id !== id || !d.archivedAt) return d;
      setSlack(sp => [{ id:'s'+Date.now(), code:d.code, area:d.area, time:t(new Date()),
        stagePath:'Demanda restaurada', action:'"'+d.title+'" voltou para o quadro',
        next:'Disponível novamente em '+d.area, type:'new' }, ...sp]);
      const { archivedAt, ...rest } = d;
      return rest;
    }));
  }, []);

  const delDemand = useCallback((id) => {
    setDemands(p=>p.filter(d=>d.id!==id));
    setModal(null);
  }, []);

  const reset = useCallback(() => { setDemands(INIT_DEMANDS); setSlack(INIT_SLACK); cntRef.current=INIT_DEMANDS.length; }, []);

  const active   = demands.filter(d => !d.archivedAt);
  const archived = demands.filter(d => d.archivedAt)
                          .sort((a,b) => (a.archivedAt < b.archivedAt ? 1 : -1));

  const filtered = active.filter(d => {
    if (area !== 'Todas' && d.area !== area) return false;
    if (priFilter.length && !priFilter.includes(d.priority)) return false;
    if (query.trim()) { const q=query.toLowerCase(); return d.title.toLowerCase().includes(q)||d.code.toLowerCase().includes(q); }
    return true;
  });

  const selDemand = modal ? demands.find(d=>d.id===modal)||null : null;

  return <Ctx.Provider value={{ demands, active, archived, filtered, slack, user, authReady, authError, setAuthError, view, setView, layout, setLayout, area, setArea, query, setQuery, priFilter, setPriFilter, selDemand, setModal, newOpen, setNewOpen, notifyPending, setNotifyPending, profileOpen, setProfileOpen, dragging, setDragging, photos, googlePhotos, profiles, attach, comments, storageWarn, MAX_FILE, addAttachment, removeAttachment, addComment, removeComment, logout, savePhoto, removePhoto, saveProfile, addDemand, moveStage, moveArea, setAssignees, updateDemand, archiveDemand, restoreDemand, delDemand, reset }}>{children}</Ctx.Provider>;
}

function getSla(dl) {
  if (!dl) return null;
  const diff = Math.ceil((new Date(dl)-new Date())/86400000);
  if (diff < 0) return { label:'Atrasado '+Math.abs(diff)+'d', type:'danger' };
  if (diff <= 2) return { label:'Vence em '+diff+'d', type:'warn' };
  return { label:diff+'d', type:'ok' };
}
function fmtDate(s) { if(!s) return ''; const [,m,d]=s.split('-'); return d+'/'+m; }

/* =========== AVATAR =========== */
function Avatar({ member, size=32, ring=true, style, src }) {
  const { photos, googlePhotos } = useApp();
  /* prioridade: foto enviada no perfil > foto do Google > iniciais */
  const photo = src !== undefined ? src
    : (member && (photos[member.id] || googlePhotos[member.id] || member.googlePhoto));
  const clr = (member && member.color) || NB.azul;
  const base = { width:size, height:size, borderRadius:'50%', flexShrink:0, border:'2px solid #fff', boxShadow: ring ? '0 0 0 1.5px '+clr : 'none', ...style };
  if (photo) return <img src={photo} alt={member.name} title={member.name} style={{...base, objectFit:'cover'}}/>;
  return (
    <div title={member?member.name:''} style={{...base, background:clr, color:'#fff', fontSize:Math.round(size*0.36), fontWeight:600, display:'flex', alignItems:'center', justifyContent:'center', letterSpacing:'0.02em'}}>
      {member ? member.initials : '?'}
    </div>
  );
}

/* =========== STAGE COLUMN =========== */
function StageColumn({ stage, cards, compact, areaName }) {
  const { dragging, setDragging, moveStage, moveArea, setNotifyPending } = useApp();
  const [over, setOver] = useState(false);

  const otherArea = !!dragging && dragging.area !== areaName;
  /* Aceita qualquer etapa do próprio pipeline, ou qualquer etapa de outro (troca de área) */
  const canDrop = !!dragging && (otherArea || dragging.stageId !== stage.id);

  const handleDrop = e => {
    e.preventDefault();
    setOver(false);
    if (!canDrop) return;
    const d = dragging;
    setDragging(null);
    if (d.area !== areaName) { moveArea(d.id, areaName, stage.id); return; }
    if (d.area === 'Design' && stage.isDone) {
      setNotifyPending({ demandId:d.id, stageId:stage.id, demandTitle:d.title });
    } else {
      moveStage(d.id, stage.id);
    }
  };

  const accent = otherArea ? (AREA_CLR[areaName] || NB.azul) : NB.azul;
  const border = over && canDrop ? '1.5px dashed '+accent
    : canDrop ? '1.5px dashed '+(otherArea ? '#C9D6EA' : NB.azulClaro)
    : '1.5px solid #D3E0F2';

  return (
    <div
      onDragOver={e=>{ if(canDrop){ e.preventDefault(); e.dataTransfer.dropEffect='move'; setOver(true); } }}
      onDragLeave={()=>setOver(false)}
      onDrop={handleDrop}
      style={{background:over&&canDrop?(otherArea?accent+'12':'#E4F0FD'):'#F2F6FC',borderRadius:12,border:border,padding:compact?'0 0 10px':'0 0 12px',display:'flex',flexDirection:'column',minWidth:0,minHeight:140,transition:'background 0.12s, border-color 0.12s',overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,padding:compact?'11px 12px':'12px 14px',borderBottom:'1px solid #DFE8F5',background:'#EAF1FA'}}>
        <span style={{fontSize:13.5,fontWeight:600,color:over&&canDrop?accent:NB.txt,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{stage.name}</span>
        <span style={{fontSize:11.5,color:NB.mut,fontWeight:600,flexShrink:0,background:'#fff',border:'1px solid #DFE8F5',borderRadius:20,padding:'1px 8px'}}>{cards.length}</span>
      </div>
      <div style={{flex:1,minHeight:0,padding:compact?'11px 11px 0':'12px 13px 0'}}>
        {cards.map(c=><DemandCard key={c.id} demand={c}/>)}
        {cards.length===0 && (
          <div style={{border:'1.5px dashed '+(over&&canDrop?accent:'#D3E0F2'),borderRadius:10,padding:'26px 10px',textAlign:'center',color:over&&canDrop?accent:NB.mut2,fontSize:12.5,transition:'all 0.12s'}}>
            {over&&canDrop ? (otherArea ? 'Passar para '+areaName : 'Soltar aqui') : 'Nenhuma demanda'}
          </div>
        )}
        {cards.length>0 && over && canDrop && otherArea && (
          <div style={{border:'1.5px dashed '+accent,borderRadius:10,padding:'14px 10px',textAlign:'center',color:accent,fontSize:12.5,fontWeight:500}}>
            Passar para {areaName}
          </div>
        )}
      </div>
    </div>
  );
}

/* Campo que vira input ao clicar. Enter salva, Esc cancela, sair do campo salva. */
function EditableText({ value, onSave, multiline, placeholder, required, textStyle, rows }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(value || '');
  const ref = useRef(null);

  useEffect(() => { if (editing) setDraft(value || ''); }, [editing, value]);
  useEffect(() => {
    if (editing && ref.current) { ref.current.focus(); if (ref.current.select) ref.current.select(); }
  }, [editing]);

  const commit = () => {
    const v = (draft || '').trim();
    setEditing(false);
    if (required && !v) return;          // título não pode ficar vazio
    if (v !== (value || '')) onSave(v);
  };

  const keys = e => {
    if (e.key === 'Escape') { e.preventDefault(); setEditing(false); }
    if (e.key === 'Enter' && !multiline) { e.preventDefault(); commit(); }
    if (e.key === 'Enter' && multiline && (e.metaKey || e.ctrlKey)) { e.preventDefault(); commit(); }
  };

  if (editing) {
    const common = {
      ref, value:draft, onChange:e=>setDraft(e.target.value), onBlur:commit, onKeyDown:keys,
      style:{ ...inp, ...textStyle, borderColor:NB.azul, background:'#fff', width:'100%',
              resize: multiline?'vertical':undefined, lineHeight: multiline?1.65:undefined }
    };
    return multiline ? <textarea rows={rows||3} {...common}/> : <input {...common}/>;
  }

  const empty = !value;
  return (
    <div onClick={()=>setEditing(true)} title="Clique para editar"
      style={{ ...textStyle, cursor:'text', borderRadius:9, padding:'6px 9px', margin:'-6px -9px',
               color: empty ? NB.mut2 : (textStyle && textStyle.color) || NB.txt,
               fontStyle: empty ? 'italic' : 'normal', transition:'background 0.12s',
               whiteSpace: multiline ? 'pre-wrap' : undefined }}
      onMouseEnter={e=>{e.currentTarget.style.background=NB.col;}}
      onMouseLeave={e=>{e.currentTarget.style.background='transparent';}}>
      {value || placeholder}
    </div>
  );
}

/* =========== ANEXOS =========== */
const fmtBytes = b => b < 1024 ? b+' B' : b < 1048576 ? (b/1024).toFixed(0)+' KB' : (b/1048576).toFixed(1)+' MB';
const fmtWhen = iso => { const d=new Date(iso); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };

function AttachPanel({ demand }) {
  const { attach, addAttachment, removeAttachment, user, MAX_FILE, storageWarn } = useApp();
  const list = attach[demand.id] || [];
  const fileRef = useRef(null);
  const [mode, setMode] = useState(null);          // null | 'link'
  const [ln, setLn] = useState({ name:'', url:'' });
  const [err, setErr] = useState('');

  const saveLink = () => {
    let url = ln.url.trim();
    if (!url) return setErr('Cole o endereço do link.');
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    try { new URL(url); } catch { return setErr('Esse endereço não parece válido.'); }
    addAttachment(demand, { kind:'link', name: ln.name.trim() || url.replace(/^https?:\/\//,'').slice(0,50), url, by:user.name });
    setLn({name:'',url:''}); setMode(null); setErr('');
  };

  const pickFiles = e => {
    const files = Array.from(e.target.files||[]);
    e.target.value = '';
    setErr('');
    files.forEach(f => {
      if (f.size > MAX_FILE) {
        setErr('"'+f.name+'" tem '+fmtBytes(f.size)+'. O limite é '+fmtBytes(MAX_FILE)+' — para arquivos maiores, use um link do Drive ou Canva.');
        return;
      }
      const rd = new FileReader();
      rd.onload = () => addAttachment(demand, { kind:'file', name:f.name, size:f.size, mime:f.type, data:rd.result, by:user.name });
      rd.onerror = () => setErr('Não foi possível ler "'+f.name+'".');
      rd.readAsDataURL(f);
    });
  };

  return (
    <div>
      <div style={{display:'flex',gap:9,marginBottom:list.length||mode?14:0,flexWrap:'wrap'}}>
        <button onClick={()=>fileRef.current && fileRef.current.click()}

          <IClip s={15}/> Anexar arquivo
        </button>
        <input ref={fileRef} type="file" multiple onChange={pickFiles} style={{display:'none'}}/>
        <button onClick={()=>{setMode(m=>m==='link'?null:'link'); setErr('');}}
          style={{display:'flex',alignItems:'center',gap:7,padding:'9px 14px',background:mode==='link'?'#EAF3FD':'#fff',border:'1px solid '+(mode==='link'?NB.azul:NB.bd),borderRadius:9,fontSize:13,fontWeight:500,color:mode==='link'?NB.azul:NB.mut}}>
          <ILink/> Adicionar link
        </button>
      </div>

      {mode==='link' && (
        <div style={{background:NB.col,border:'1px solid '+NB.bd,borderRadius:11,padding:'14px 15px',marginBottom:14,display:'flex',flexDirection:'column',gap:9}}>
          <input value={ln.url} autoFocus placeholder="drive.google.com/..." onChange={e=>{setLn(v=>({...v,url:e.target.value})); setErr('');}}
            onKeyDown={e=>{ if(e.key==='Enter') saveLink(); }}
            style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
          <input value={ln.name} placeholder="Nome (opcional) — ex: Briefing no Drive" onChange={e=>setLn(v=>({...v,name:e.target.value}))}
            onKeyDown={e=>{ if(e.key==='Enter') saveLink(); }}
            style={{...inp,padding:'9px 12px',fontSize:13.5}}/>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button onClick={()=>{setMode(null);setErr('');}} style={{padding:'8px 14px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:12.5,fontWeight:500,color:NB.mut}}>Cancelar</button>

      {(err || storageWarn) && (

          {err || storageWarn}
        </div>

      {list.length===0 ? (
        <p style={{fontSize:13,color:NB.mut2,lineHeight:1.6}}>
          Nenhum anexo ainda. Arquivos até {fmtBytes(MAX_FILE)} ficam salvos aqui; para peças grandes do Canva ou Drive, prefira o link.
        </p>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {list.map(a=>{
            const img = a.kind==='file' && a.mime && a.mime.startsWith('image/');
            return (

                  : <div style={{width:38,height:38,borderRadius:8,background:a.kind==='link'?'#EAF3FD':NB.col,color:a.kind==='link'?NB.azul:NB.mut,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      {a.kind==='link' ? <ILink s={17}/> : <IFile s={17}/>}
                    </div>}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13.5,fontWeight:500,color:NB.txt,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{a.name}</div>
                  <div style={{fontSize:11.5,color:NB.mut2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                    {a.kind==='file' ? fmtBytes(a.size)+' · ' : ''}{a.by} · {fmtWhen(a.at)}
                  </div>
                </div>
                <div style={{display:'flex',gap:5,flexShrink:0}}>
                  {a.kind==='link'
                    ? <a href={a.url} target="_blank" rel="noopener noreferrer" title="Abrir link"
                        style={{padding:'7px 9px',border:'1px solid '+NB.bd,borderRadius:8,color:NB.mut,display:'flex',textDecoration:'none'}}><IExt/></a>
                    : <a href={a.data} download={a.name} title="Baixar"
                        style={{padding:'7px 9px',border:'1px solid '+NB.bd,borderRadius:8,color:NB.mut,display:'flex',textDecoration:'none'}}><IDown/></a>}
                  <button onClick={()=>removeAttachment(demand.id,a.id)} title="Remover"
                    style={{padding:'7px 9px',border:'1px solid '+NB.bd,borderRadius:8,color:NB.mut,background:'#fff',display:'flex'}}
                    onMouseEnter={e=>{e.currentTarget.style.color='#B4232A'; e.currentTarget.style.borderColor='#FBD5D5';}}

                    <ITrash/>
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

              <div key={c.id} style={{display:'flex',gap:11}}>

                        style={{background:'none',border:'none',padding:2,color:NB.mut2,display:'flex',marginLeft:'auto'}}

const FORMATS = [
  { id:'1x1',  label:'Feed 1:1',      w:1080, h:1080 },
  { id:'4x5',  label:'Feed 4:5',      w:1080, h:1350 },
  { id:'9x16', label:'Stories 9:16',  w:1080, h:1920 },
  { id:'16x9', label:'Display 16:9',  w:1200, h:628  },
];
const BGS = [
  { id:'navy',   label:'Navy',   hex:'#002D72' },
  { id:'azul',   label:'Azul',   hex:'#0072CE' },
  { id:'sky',    label:'Sky',    hex:'#41B6E6' },
  { id:'gelo',   label:'Gelo',   hex:'#B8CCEA' },
  { id:'branco', label:'Branco', hex:'#FFFFFF' },
];
const PUBLICOS = ['Contador','Escritório Contábil','Empresa','BPO Financeiro'];

function drawVariant(img, w, h, bg, mode) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = bg; ctx.fillRect(0,0,w,h);
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const scale = mode==='cover' ? Math.max(w/iw, h/ih) : Math.min(w/iw, h/ih) * 0.88;
  const dw = iw*scale, dh = ih*scale;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
  return cv.toDataURL('image/png');
}

function briefing(demand, publico) {
  const tema = demand.title.replace(/^(Banner|Post|Carousel|Ebook|Campanha)\s*/i,'').trim();
  return {
    'Ângulos de headline (3 versões pra testar)': [
      'Problema urgente — abrir pela dor: o que trava o dia do '+publico+' hoje em '+tema,
      'Consequência — o custo de não resolver, em número ou tempo perdido',
      'Virada — o Nibo entrando como saída natural, sem soar catálogo',
    ],
    'Variações de CTA': [
      'Direto: "Testar agora"',
      'Baixa fricção: "Ver como funciona"',
      'Prova: "Ver o Nibo na prática"',
    ],
    'Direções visuais pro fundo': [
      'Navy sólido com o elemento principal em Sky — máximo contraste no feed',
      'Gelo com tipografia navy — leitura mais leve, bom pra texto longo',
      'Azul com respiro maior nas laterais — destaca o produto isolado',
    ],
    'Checklist antes de subir': [
      'O público ("'+publico+'") aparece escrito no criativo, não só na segmentação',
      'Linhas curtas de impacto não terminam com ponto',
      'Nada sugere substituir equipe',
      'Sem amarelo, rosa ou roxo em contexto de plataforma',
      'Logo legível no menor formato (Stories)',
    ],
  };
}

function VariationsPanel({ demand }) {
  const { addAttachment, user, MAX_FILE } = useApp();
  const [img, setImg]       = useState(null);
  const [imgName, setImgName] = useState('');
  const [modo, setModo]     = useState(null);        // formatos | fundos | briefing
  const [fit, setFit]       = useState('contain');
  const [bg, setBg]         = useState('#002D72');
  const [fmt, setFmt]       = useState('1x1');
  const [outs, setOuts]     = useState([]);
  const [pub, setPub]       = useState(PUBLICOS[0]);
  const [err, setErr]       = useState('');
  const fileRef = useRef(null);

  const pick = e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = ''; setErr(''); setOuts([]);
    if (!f) return;
    if (!f.type.startsWith('image/')) return setErr('Envie uma imagem (PNG ou JPG).');
    const rd = new FileReader();
    rd.onload = () => {
      const im = new Image();
      im.onload = () => { setImg(im); setImgName(f.name.replace(/\.[^.]+$/,'')); };
      im.onerror = () => setErr('Não consegui abrir essa imagem.');
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  };

  const gerarFormatos = () => {
    setOuts(FORMATS.map(f => ({
      key: f.id, label: f.label, w: f.w, h: f.h,
      url: drawVariant(img, f.w, f.h, bg, fit),
    })));
  };

  const gerarFundos = () => {
    const f = FORMATS.find(x=>x.id===fmt);
    setOuts(BGS.map(b => ({
      key: b.id, label: b.label, w: f.w, h: f.h,
      url: drawVariant(img, f.w, f.h, b.hex, fit),
    })));
  };

  const baixar = o => {
    const a = document.createElement('a');
    a.href = o.url; a.download = demand.code+'-'+imgName+'-'+o.key+'.png';
    document.body.appendChild(a); a.click(); a.remove();
  };

  const salvarNoCard = o => {
    const bytes = Math.round(o.url.length * 0.75);
    if (bytes > MAX_FILE) return setErr('Essa variação tem '+fmtBytes(bytes)+' e passa do limite de anexo. Use o botão de baixar.');
    addAttachment(demand, { kind:'file', name:demand.code+'-'+o.key+'.png', size:bytes, mime:'image/png', data:o.url, by:user.name });
    setErr('');
  };

  const btn = (on) => ({display:'flex',alignItems:'center',gap:7,padding:'9px 14px',borderRadius:9,
    border:'1px solid '+(on?NB.azul:NB.bd), background:on?'#EAF3FD':'#fff',
    fontSize:13,fontWeight:500,color:on?NB.azul:NB.mut});

  if (!img) {
    return (
      <div>
        <div onClick={()=>fileRef.current && fileRef.current.click()}
          style={{border:'1.5px dashed '+NB.bd,borderRadius:12,padding:'34px 20px',textAlign:'center',cursor:'pointer',background:NB.col}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=NB.azul;}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=NB.bd;}}>
          <div style={{color:NB.mut2,display:'flex',justifyContent:'center',marginBottom:10}}><IClip s={26}/></div>
          <div style={{fontSize:14,fontWeight:500,color:NB.txt,marginBottom:5}}>Suba a peça já criada</div>
          <p style={{fontSize:12.5,color:NB.mut,lineHeight:1.6,maxWidth:400,margin:'0 auto'}}>
            A partir dela eu gero cortes de formato, versões de fundo na paleta Nibo e um briefing do que vale testar.
          </p>
        </div>
        <input ref={fileRef} type="file" accept="image/*" onChange={pick} style={{display:'none'}}/>
        {err && <p style={{fontSize:12.5,color:'#B4232A',marginTop:10}}>{err}</p>}
        <p style={{fontSize:12,color:NB.mut2,marginTop:12,lineHeight:1.6}}>
          Não gero arte nova nem troco fundo com IA — o que sai aqui é a sua peça reenquadrada e um roteiro do que variar no Canva.
        </p>
      </div>
    );
  }

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,padding:'10px 12px',background:NB.col,border:'1px solid '+NB.bd,borderRadius:10}}>
        <img src={img.src} alt="" style={{width:44,height:44,borderRadius:8,objectFit:'cover',border:'1px solid '+NB.bd}}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13.5,fontWeight:500,color:NB.txt,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{imgName}</div>
          <div style={{fontSize:11.5,color:NB.mut2}}>{img.naturalWidth} × {img.naturalHeight} px</div>
        </div>
        <button onClick={()=>{setImg(null); setOuts([]); setModo(null);}}
          style={{padding:'7px 12px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:12.5,fontWeight:500,color:NB.mut,flexShrink:0}}>
          Trocar
        </button>
      </div>

      <div style={{fontSize:12.5,color:NB.mut,marginBottom:9}}>O que você precisa agora?</div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
        <button onClick={()=>{setModo('formatos');setOuts([]);}} style={btn(modo==='formatos')}>Cortes de formato</button>
        <button onClick={()=>{setModo('fundos');setOuts([]);}}   style={btn(modo==='fundos')}>Versões de fundo</button>
        <button onClick={()=>{setModo('briefing');setOuts([]);}} style={btn(modo==='briefing')}>Briefing do que testar</button>
      </div>

      {(modo==='formatos' || modo==='fundos') && (
        <div style={{background:NB.col,border:'1px solid '+NB.bd,borderRadius:11,padding:'14px 15px',marginBottom:16}}>
          <div style={{display:'flex',gap:18,flexWrap:'wrap',alignItems:'flex-end'}}>
            <div>
              <div style={{...lbl,marginBottom:6}}>Enquadramento</div>
              <div style={{display:'flex',gap:7}}>
                <button onClick={()=>setFit('contain')} style={{...btn(fit==='contain'),padding:'7px 12px',fontSize:12.5}}>Mostrar tudo</button>
                <button onClick={()=>setFit('cover')}   style={{...btn(fit==='cover'),padding:'7px 12px',fontSize:12.5}}>Preencher</button>
              </div>
            </div>
            {modo==='formatos' ? (
              <div>
                <div style={{...lbl,marginBottom:6}}>Cor de fundo</div>
                <div style={{display:'flex',gap:7}}>
                  {BGS.map(b=>(
                    <button key={b.id} onClick={()=>setBg(b.hex)} title={b.label}
                      style={{width:30,height:30,borderRadius:8,background:b.hex,border:bg===b.hex?'2.5px solid '+NB.azul:'1px solid '+NB.bd,cursor:'pointer'}}/>
                  ))}
                </div>
              </div>
            ) : (
              <div>
                <div style={{...lbl,marginBottom:6}}>Formato</div>
                <select value={fmt} onChange={e=>setFmt(e.target.value)} style={{...inp,padding:'8px 11px',fontSize:13,width:'auto'}}>
                  {FORMATS.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}
                </select>
              </div>
            )}
            <button onClick={modo==='formatos'?gerarFormatos:gerarFundos}
              style={{padding:'9px 18px',background:NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>
              Gerar
            </button>
          </div>
        </div>
      )}

      {modo==='briefing' && (
        <div>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,flexWrap:'wrap'}}>
            <span style={{fontSize:12.5,color:NB.mut}}>Público que vai aparecer escrito na peça:</span>
            <select value={pub} onChange={e=>setPub(e.target.value)} style={{...inp,padding:'7px 11px',fontSize:13,width:'auto'}}>
              {PUBLICOS.map(p=><option key={p}>{p}</option>)}
            </select>
          </div>
          {Object.entries(briefing(demand, pub)).map(([sec,itens])=>(
            <div key={sec} style={{marginBottom:16}}>
              <div style={{fontSize:12.5,fontWeight:600,color:NB.txt,marginBottom:7}}>{sec}</div>
              <ul style={{margin:0,paddingLeft:18,display:'flex',flexDirection:'column',gap:5}}>
                {itens.map((it,i)=><li key={i} style={{fontSize:13,color:'#3D4B63',lineHeight:1.6}}>{it}</li>)}
              </ul>
            </div>
          ))}
          <button onClick={()=>{
            const b = briefing(demand,pub);
            const txt = Object.entries(b).map(([s,i])=>s+'\n'+i.map(x=>'- '+x).join('\n')).join('\n\n');
            navigator.clipboard && navigator.clipboard.writeText(demand.code+' — variações\n\n'+txt);
          }}
            style={{padding:'9px 16px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>
            Copiar briefing
          </button>
        </div>
      )}

      {err && <p style={{fontSize:12.5,color:'#B4232A',marginBottom:12}}>{err}</p>}

      {outs.length>0 && (
        <div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:11,gap:10,flexWrap:'wrap'}}>
            <span style={{fontSize:12.5,color:NB.mut}}>{outs.length} variações geradas</span>
            <button onClick={()=>outs.forEach((o,i)=>setTimeout(()=>baixar(o), i*250))}
              style={{display:'flex',alignItems:'center',gap:7,padding:'8px 14px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:12.5,fontWeight:500,color:NB.azul}}>
              <IDown/> Baixar todas
            </button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(120px,1fr))',gap:11}}>
            {outs.map(o=>(
              <div key={o.key} style={{border:'1px solid '+NB.bd,borderRadius:10,overflow:'hidden',background:'#fff'}}>
                <div style={{background:'#EEF2F8',display:'flex',alignItems:'center',justifyContent:'center',height:112,padding:8}}>
                  <img src={o.url} alt={o.label} style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain',borderRadius:4}}/>
                </div>
                <div style={{padding:'9px 10px'}}>
                  <div style={{fontSize:12.5,fontWeight:500,color:NB.txt}}>{o.label}</div>
                  <div style={{fontSize:11,color:NB.mut2,marginBottom:7}}>{o.w} × {o.h}</div>
                  <div style={{display:'flex',gap:5}}>
                    <button onClick={()=>baixar(o)} title="Baixar"
                      style={{flex:1,padding:'6px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:7,color:NB.mut,display:'flex',justifyContent:'center'}}><IDown/></button>
                    <button onClick={()=>salvarNoCard(o)} title="Salvar nos anexos do card"
                      style={{flex:1,padding:'6px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:7,color:NB.mut,display:'flex',justifyContent:'center'}}><IClip s={13}/></button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

  );
}

const lbl = { fontSize:11, fontWeight:500, color:NB.mut2, textTransform:'uppercase', letterSpacing:'0.09em', display:'block', marginBottom:7 };
const inp = { background:'#fff', border:'1px solid '+NB.bd, borderRadius:10, padding:'11px 14px', fontSize:14, color:NB.txt, width:'100%', outline:'none' };

/* =========== CARD MODAL =========== */
function AssigneeChip({ initials, onRemove }) {
  const mb = useMember(initials);
  const mc = (mb && mb.color) || NB.azul;
  return (
    <div style={{display:'flex',alignItems:'center',gap:9,background:NB.col,border:'1px solid '+NB.bd,borderRadius:20,padding:onRemove?'4px 5px 4px 4px':'4px 13px 4px 4px'}}>
      <Avatar member={mb} size={28} ring={false} style={{boxShadow:'0 0 0 1.5px '+mc}}/>
      <span style={{fontSize:13.5,color:NB.txt,fontWeight:500}}>{mb?mb.name:initials}</span>
      {onRemove && (
        <button onClick={onRemove} title={'Remover '+(mb?mb.name:initials)}
          style={{width:22,height:22,borderRadius:'50%',border:'none',background:'transparent',color:NB.mut2,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,padding:0}}
          onMouseEnter={e=>{e.currentTarget.style.background='#FEECEC'; e.currentTarget.style.color='#B4232A';}}
          onMouseLeave={e=>{e.currentTarget.style.background='transparent'; e.currentTarget.style.color=NB.mut2;}}>
          <IX s={13}/>
        </button>
      )}
    </div>
  );
}

function CardModal() {
  const { selDemand, setModal, moveStage, moveArea, delDemand, archiveDemand, setNotifyPending, setAssignees, updateDemand, attach, comments } = useApp();
  const [picker, setPicker] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const [tab, setTab] = useState('anexos');
  const [areaPick, setAreaPick] = useState(false);
  const [tgtArea, setTgtArea]   = useState(null);
  const [tgtStage, setTgtStage] = useState(null);
  const openId = selDemand ? selDemand.id : null;

  /* Reabrir outro card não pode herdar o estado do anterior */
  useEffect(() => {
    setPicker(false); setConfirmDel(false); setTab('anexos');
    setAreaPick(false); setTgtArea(null); setTgtStage(null);
  }, [openId]);

  if (!selDemand) return null;

  const nAttach   = (attach[openId] || []).length;
  const nComments = (comments[openId] || []).length;

  const d = selDemand;
  const stages = PIPELINES[d.area]||[];
  const ps  = PRI_STL[d.priority]||PRI_STL.Baixa;
  const ac  = AREA_CLR[d.area]||NB.azul;
  const sla = getSla(d.deadline);
  const Icon = AREA_ICON[d.area];

  const toggle = init => {
    const has = d.assignees.includes(init);
    if (has && d.assignees.length === 1) return;   // nunca deixar sem ninguém
    setAssignees(d.id, has ? d.assignees.filter(i=>i!==init) : [...d.assignees, init]);
  };

  return (
    <Modal onClose={()=>setModal(null)} width={620}>
      <div style={{padding:'22px 26px 18px',borderBottom:'1px solid '+NB.bdSoft,display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:14}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:9,flexWrap:'wrap'}}>
            <span style={{background:NB.col,border:'1px solid '+NB.bd,color:NB.mut,fontSize:11,fontWeight:500,padding:'3px 8px',borderRadius:6,fontFamily:'monospace'}}>{d.code}</span>
            <span style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:13,fontWeight:500,color:ac}}><Icon s={15}/> {d.area}</span>
            <span style={{fontSize:11.5,fontWeight:500,padding:'3px 9px',borderRadius:6,background:ps.bg,color:ps.txt}}>{d.priority}</span>
          </div>
          <EditableText value={d.title} required
            onSave={v=>updateDemand(d.id,{title:v})}
            textStyle={{fontSize:19,fontWeight:600,color:NB.txt,lineHeight:1.32,letterSpacing:'-0.01em'}}/>
        </div>
        <button onClick={()=>setModal(null)} style={{padding:8,background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,color:NB.mut,display:'flex',flexShrink:0}}><IX/></button>
      </div>

      <div style={{padding:'22px 26px'}}>
        <div style={{marginBottom:22}}>
          <div style={lbl}>Descrição</div>
          <EditableText value={d.description} multiline rows={3}
            placeholder="Clique para adicionar contexto, referências ou link do briefing..."
            onSave={v=>updateDemand(d.id,{description:v})}
            textStyle={{fontSize:14.5,color:'#3D4B63',lineHeight:1.65}}/>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:13,marginBottom:22}}>
          <div style={{background:NB.col,borderRadius:11,padding:'13px 15px'}}>
            <div style={lbl}>Solicitante</div>
            <div style={{fontSize:14.5,color:NB.txt,fontWeight:500}}>{d.requester}</div>
          </div>
          <div style={{background:NB.col,borderRadius:11,padding:'13px 15px'}}>
            <div style={lbl}>Prazo</div>
            <div style={{display:'flex',alignItems:'center',gap:9,flexWrap:'wrap'}}>
              <input type="date" value={d.deadline||''}
                onChange={e=>{ if(e.target.value) updateDemand(d.id,{deadline:e.target.value}); }}
                style={{background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,padding:'7px 10px',fontSize:13.5,color:NB.txt,outline:'none',fontWeight:500}}
                onFocus={e=>{e.target.style.borderColor=NB.azul;}} onBlur={e=>{e.target.style.borderColor=NB.bd;}}/>
              {sla && (
                <span style={{fontSize:12.5,fontWeight:500,padding:'4px 9px',borderRadius:6,
                  background: sla.type==='danger' ? '#FEECEC' : sla.type==='warn' ? '#FFF6DE' : '#EEF2F8',
                  color:      sla.type==='danger' ? '#B4232A' : sla.type==='warn' ? '#8A6206' : NB.mut}}>{sla.label}</span>
              )}
            </div>
          </div>
        </div>

        <div style={{marginBottom:24}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:7,gap:10}}>
            <span style={{...lbl, marginBottom:0}}>Responsáveis</span>
            <button onClick={()=>setPicker(p=>!p)}
              style={{display:'flex',alignItems:'center',gap:6,padding:'5px 11px',background:picker?'#EAF3FD':'#fff',border:'1px solid '+(picker?NB.azul:NB.bd),borderRadius:8,fontSize:12.5,fontWeight:500,color:picker?NB.azul:NB.mut}}>
              <IPlus s={13}/> {picker ? 'Fechar' : 'Adicionar ou trocar'}
            </button>
          </div>

          <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
            {d.assignees.map(init => (
              <AssigneeChip key={init} initials={init}
                onRemove={d.assignees.length>1 ? ()=>toggle(init) : null}/>
            ))}
          </div>

          {picker && (
            <div style={{marginTop:12,padding:'14px 15px',background:NB.col,border:'1px solid '+NB.bd,borderRadius:12}}>
              <div style={{fontSize:12,color:NB.mut,marginBottom:10}}>Clique para adicionar ou remover. Quem entrar é notificado no Slack.</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                {ACTIVE_TEAM.map(m => (
                  <AssigneePick key={m.id} member={m}
                    checked={d.assignees.includes(m.initials)}
                    onToggle={()=>toggle(m.initials)}/>
                ))}
              </div>
              {d.assignees.length===1 && (
                <p style={{fontSize:12,color:NB.mut2,marginTop:10}}>A demanda precisa de pelo menos uma pessoa responsável.</p>
              )}
            </div>
          )}
        </div>

        <div>
          <div style={lbl}>Mover para etapa</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:11}}>
            {stages.map(stage=>{
              const isCur = stage.id===d.stageId;
              const needsNotify = d.area==='Design' && stage.isDone;
              return (
                <button key={stage.id} onClick={()=>{
                  if (isCur) return;
                  if (needsNotify) setNotifyPending({ demandId:d.id, stageId:stage.id, demandTitle:d.title });
                  else moveStage(d.id, stage.id);
                }}
                  style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',borderRadius:9,fontSize:13,fontWeight:500,border:'1px solid '+(isCur?ac:NB.bd),background:isCur?ac:'#fff',color:isCur?'#fff':NB.mut,transition:'all 0.12s'}}
                  onMouseEnter={e=>{ if(!isCur){e.currentTarget.style.color=NB.txt; e.currentTarget.style.borderColor='#D3DCEA';} }}
                  onMouseLeave={e=>{ if(!isCur){e.currentTarget.style.color=NB.mut; e.currentTarget.style.borderColor=NB.bd;} }}>
                  {isCur && <ICheck s={13}/>}
                  {stage.name}
                </button>
              );
            })}
          </div>
          <p style={{fontSize:12.5,color:NB.mut2,lineHeight:1.55,marginBottom:14}}>Ao mover, o caminho da automação é enviado automaticamente para o Slack. Etapas de aprovação são sempre encaminhadas para @Mariana Araújo.</p>

          <div style={{borderTop:'1px dashed '+NB.bd,paddingTop:14}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap'}}>
              <span style={{fontSize:12.5,color:NB.mut}}>Essa demanda agora é de outra área?</span>
              <button onClick={()=>{setAreaPick(v=>!v); setTgtArea(null);}}
                style={{display:'flex',alignItems:'center',gap:7,padding:'7px 13px',background:areaPick?'#EAF3FD':'#fff',border:'1px solid '+(areaPick?NB.azul:NB.bd),borderRadius:9,fontSize:12.5,fontWeight:500,color:areaPick?NB.azul:NB.mut}}>
                <IArrowR s={13}/> {areaPick ? 'Cancelar' : 'Passar para outra área'}
              </button>
            </div>

            {areaPick && (
              <div style={{marginTop:12,background:NB.col,border:'1px solid '+NB.bd,borderRadius:11,padding:'14px 15px'}}>
                <div style={{...lbl,marginBottom:8}}>Para qual área</div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:tgtArea?14:0}}>
                  {Object.keys(PIPELINES).filter(a=>a!==d.area).map(a=>{
                    const AIcon = AREA_ICON[a]; const on = tgtArea===a;
                    return (
                      <button key={a} onClick={()=>setTgtArea(on?null:a)}
                        style={{display:'flex',alignItems:'center',gap:7,padding:'8px 13px',borderRadius:9,border:'1px solid '+(on?AREA_CLR[a]:NB.bd),background:on?AREA_CLR[a]+'14':'#fff',fontSize:13,fontWeight:500,color:on?AREA_CLR[a]:NB.mut}}>
                        <AIcon s={15}/> {a}
                      </button>
                    );
                  })}
                </div>

                {tgtArea && (
                  <React.Fragment>
                    <div style={{...lbl,marginBottom:8}}>Entra em qual etapa de {tgtArea}</div>
                    <div style={{display:'flex',gap:7,flexWrap:'wrap',marginBottom:14}}>
                      {PIPELINES[tgtArea].map(st=>{
                        const on = tgtStage===st.id || (!tgtStage && st.id===PIPELINES[tgtArea][0].id);
                        return (
                          <button key={st.id} onClick={()=>setTgtStage(st.id)}
                            style={{padding:'7px 12px',borderRadius:8,border:'1px solid '+(on?AREA_CLR[tgtArea]:NB.bd),background:on?AREA_CLR[tgtArea]:'#fff',fontSize:12.5,fontWeight:500,color:on?'#fff':NB.mut}}>
                            {st.name}
                          </button>
                        );
                      })}
                    </div>
                    <p style={{fontSize:12,color:NB.mut2,lineHeight:1.55,marginBottom:12}}>
                      Os responsáveis atuais continuam no card. Ajuste na seção Responsáveis se quem toca a demanda mudou.
                    </p>
                    <button onClick={()=>{
                      moveArea(d.id, tgtArea, tgtStage || PIPELINES[tgtArea][0].id);
                      setAreaPick(false); setTgtArea(null); setTgtStage(null);
                    }}
                      style={{padding:'9px 18px',background:AREA_CLR[tgtArea],border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>
                      Passar para {tgtArea}
                    </button>
                  </React.Fragment>
                )}
              </div>
            )}
          </div>
        </div>

        {/* Anexos e comentários */}
        <div style={{marginTop:26,borderTop:'1px solid '+NB.bdSoft,paddingTop:18}}>
          <div style={{display:'flex',gap:6,marginBottom:18,flexWrap:'wrap'}}>
            {[
              {id:'anexos',label:'Anexos',Icon:IClip,n:nAttach},
              {id:'comentarios',label:'Comentários',Icon:IChatBox,n:nComments},
              ...(d.area==='Design' ? [{id:'variacoes',label:'Variações',Icon:IBrush,n:0}] : []),
            ].map(({id,label,Icon,n})=>{
              const on = tab===id;
              return (
                <button key={id} onClick={()=>setTab(id)}
                  style={{display:'flex',alignItems:'center',gap:8,padding:'9px 15px',borderRadius:9,border:'1px solid '+(on?NB.azul:NB.bd),background:on?'#EAF3FD':'#fff',fontSize:13,fontWeight:500,color:on?NB.azul:NB.mut}}>
                  <Icon s={15}/> {label}
                  {n>0 && <span style={{background:on?NB.azul:'#EEF2F8',color:on?'#fff':NB.mut,fontSize:11,fontWeight:600,borderRadius:20,padding:'1px 7px'}}>{n}</span>}
                </button>
              );
            })}
          </div>
          {tab==='anexos' ? <AttachPanel demand={d}/>
            : tab==='variacoes' ? <VariationsPanel demand={d}/>
            : <CommentPanel demand={d}/>}
        </div>
      </div>

      <div style={{padding:'16px 26px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}}>
        {confirmDel ? (
          <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
            <span style={{fontSize:13,color:'#B4232A',fontWeight:500}}>Excluir {d.code}? Não dá para desfazer.</span>
            <button onClick={()=>delDemand(d.id)}
              style={{padding:'8px 15px',background:'#B4232A',border:'none',borderRadius:8,fontSize:12.5,fontWeight:500,color:'#fff'}}>
              Sim, excluir
            </button>
            <button onClick={()=>setConfirmDel(false)}
              style={{padding:'8px 15px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:8,fontSize:12.5,fontWeight:500,color:NB.mut}}>
              Cancelar
            </button>
          </div>
        ) : (
          <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
            <button onClick={()=>archiveDemand(d.id)} title="Sai do quadro mas continua guardada"
              style={{display:'flex',alignItems:'center',gap:7,padding:'10px 16px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}
              onMouseEnter={e=>{e.currentTarget.style.color=NB.txt; e.currentTarget.style.borderColor='#D3DCEA';}}
              onMouseLeave={e=>{e.currentTarget.style.color=NB.mut; e.currentTarget.style.borderColor=NB.bd;}}>
              <IArchive s={15}/> Arquivar
            </button>
            <button onClick={()=>setConfirmDel(true)}
              style={{padding:'10px 16px',background:'#fff',border:'1px solid #FBD5D5',borderRadius:9,fontSize:13,fontWeight:500,color:'#B4232A'}}>
              Excluir
            </button>
          </div>
        )}
        <button onClick={()=>setModal(null)}
          style={{padding:'10px 22px',background:NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>
          Fechar
        </button>
      </div>
    </Modal>
  );
}

/* =========== NOTIFICAR ENTREGA (DESIGN) =========== */
const DESIGN_NOTIFY_OPTIONS = ['RO','CA','MA'];

function NotifyOption({ initials, checked, onToggle }) {
  const mb = useMember(initials);
  return (
    <label style={{display:'flex',alignItems:'center',gap:11,padding:'11px 14px',borderRadius:11,background:checked?'#EAF3FD':'#fff',border:'1px solid '+(checked?NB.azul:NB.bd),cursor:'pointer',transition:'all 0.12s'}}>
      <input type="checkbox" checked={checked} onChange={onToggle} style={{width:15,height:15,accentColor:NB.azul}}/>
      <Avatar member={mb} size={28} ring={false} style={{boxShadow:'0 0 0 1.5px '+((mb&&mb.color)||NB.azul)}}/>
      <span style={{fontSize:14,color:NB.txt,fontWeight:500}}>{mb?mb.name:initials}</span>
    </label>
  );
}

function NotifyModal() {
  const { notifyPending, setNotifyPending, moveStage } = useApp();
  const [picked, setPicked] = useState([]);
  useEffect(() => { if (notifyPending) setPicked([]); }, [notifyPending]);
  if (!notifyPending) return null;

  const toggle = init => setPicked(p => p.includes(init) ? p.filter(i=>i!==init) : [...p, init]);
  const allSelected = DESIGN_NOTIFY_OPTIONS.every(i=>picked.includes(i));
  const toggleAll = () => setPicked(allSelected ? [] : [...DESIGN_NOTIFY_OPTIONS]);
  const confirm = () => { moveStage(notifyPending.demandId, notifyPending.stageId, picked); setNotifyPending(null); };

  return (
    <Modal onClose={()=>setNotifyPending(null)} width={450} z={60}>
      <div style={{padding:'24px 26px 16px'}}>
        <h2 style={{fontSize:17.5,fontWeight:600,color:NB.txt,marginBottom:7}}>Notificar entrega no Slack</h2>
        <p style={{fontSize:13.5,color:NB.mut,lineHeight:1.6}}>A arte de <strong style={{color:NB.txt,fontWeight:500}}>{notifyPending.demandTitle}</strong> vai para Entregue. Quem deve receber a menção?</p>
      </div>
      <div style={{padding:'4px 26px 10px',display:'flex',flexDirection:'column',gap:8}}>
        <label style={{display:'flex',alignItems:'center',gap:11,padding:'11px 14px',borderRadius:11,background:allSelected?'#EAF3FD':'#fff',border:'1px solid '+(allSelected?NB.azul:NB.bd),cursor:'pointer'}}>
          <input type="checkbox" checked={allSelected} onChange={toggleAll} style={{width:15,height:15,accentColor:NB.azul}}/>
          <span style={{fontSize:14,fontWeight:500,color:NB.txt}}>Todos</span>
        </label>
        {DESIGN_NOTIFY_OPTIONS.map(init => (
          <NotifyOption key={init} initials={init} checked={picked.includes(init)} onToggle={()=>toggle(init)}/>
        ))}
      </div>
      <div style={{padding:'16px 26px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'flex-end',gap:10}}>
        <button onClick={()=>setNotifyPending(null)}
          style={{padding:'10px 18px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>
          Cancelar
        </button>
        <button onClick={confirm} disabled={picked.length===0}
          style={{padding:'10px 22px',background:picked.length?NB.azul:'#CFD8E6',border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',cursor:picked.length?'pointer':'not-allowed'}}>
          Mover e notificar
        </button>
      </div>
    </Modal>
  );
}

/* =========== PERFIL =========== */
function ProfileModal() {
  const { profileOpen, setProfileOpen, user, savePhoto, removePhoto, saveProfile, photos, googlePhotos } = useApp();
  const fileRef = useRef(null);
  const [name, setName] = useState('');
  const [err, setErr]   = useState('');
  const [photoDraft, setPhotoDraft] = useState(undefined);

  const userId  = user ? user.id : null;
  const nameRef = useRef('');
  nameRef.current = user ? user.name : '';

  useEffect(() => {
    if (profileOpen && userId) { setName(nameRef.current); setPhotoDraft(undefined); setErr(''); }
  }, [profileOpen, userId]);

  if (!profileOpen || !user) return null;

  const currentPhoto = photoDraft !== undefined ? photoDraft : (photos[user.id] || googlePhotos[user.id] || user.googlePhoto || null);

  const pick = e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (!f.type.startsWith('image/')) return setErr('Escolha um arquivo de imagem.');
    if (f.size > 3 * 1024 * 1024) return setErr('Imagem muito grande. Use um arquivo de até 3 MB.');
    const rd = new FileReader();
    rd.onload = () => { setPhotoDraft(rd.result); setErr(''); };
    rd.onerror = () => setErr('Não foi possível ler a imagem.');
    rd.readAsDataURL(f);
  };

  const save = () => {
    saveProfile(user.id, { name: name.trim() || nameRef.current });
    if (photoDraft !== undefined) { photoDraft ? savePhoto(user.id, photoDraft) : removePhoto(user.id); }
    setProfileOpen(false);
  };

  return (
    <Modal onClose={()=>setProfileOpen(false)} width={470} z={70}>
      <div style={{height:92,background:'linear-gradient(120deg,'+user.color+','+NB.roxo+')'}}/>
      <div style={{padding:'0 28px 24px',marginTop:-44}}>
        <div style={{display:'flex',alignItems:'flex-end',gap:16,marginBottom:22}}>
          <div style={{position:'relative'}}>
            <Avatar member={user} src={currentPhoto} size={90} ring={false} style={{border:'4px solid #fff',boxShadow:'0 4px 14px rgba(11,42,92,0.18)'}}/>
            <button onClick={()=>fileRef.current && fileRef.current.click()} title="Trocar foto"
              style={{position:'absolute',right:-2,bottom:-2,width:32,height:32,borderRadius:'50%',background:NB.azul,border:'3px solid #fff',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <ICamera s={15}/>
            </button>
            <input ref={fileRef} type="file" accept="image/*" onChange={pick} style={{display:'none'}}/>
          </div>
          <div style={{paddingBottom:6,minWidth:0}}>
            <div style={{fontSize:11.5,color:NB.mut2,fontWeight:500,textTransform:'uppercase',letterSpacing:'0.09em'}}>{user.area}</div>
            <div style={{fontSize:13.5,color:NB.mut,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{user.email}</div>
          </div>
        </div>

        <div style={lbl}>Nome de exibição</div>
        <input value={name} onChange={e=>setName(e.target.value)} style={inp}
          onFocus={e=>{e.target.style.borderColor=NB.azul;}} onBlur={e=>{e.target.style.borderColor=NB.bd;}}/>

        <div style={{display:'flex',gap:9,marginTop:16,flexWrap:'wrap'}}>
          <button onClick={()=>fileRef.current && fileRef.current.click()}
            style={{display:'flex',alignItems:'center',gap:8,padding:'10px 15px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:10,fontSize:13,fontWeight:500,color:NB.mut}}>
            <ICamera s={15}/> {currentPhoto ? 'Trocar foto' : 'Adicionar foto'}
          </button>
          {currentPhoto && (
            <button onClick={()=>setPhotoDraft(null)}
              style={{padding:'10px 15px',background:'#fff',border:'1px solid #FBD5D5',borderRadius:10,fontSize:13,fontWeight:500,color:'#B4232A'}}>
              Remover foto
            </button>
          )}
        </div>
        {err && <p style={{fontSize:12.5,color:'#B4232A',marginTop:10}}>{err}</p>}
        <p style={{fontSize:12.5,color:NB.mut2,marginTop:12,lineHeight:1.55}}>
          {photoDraft !== undefined
            ? 'Clique em Salvar perfil para aplicar a nova foto.'
            : 'Por padrão usamos sua foto do Google. A foto que você subir fica salva neste navegador.'}
        </p>
      </div>

      <div style={{padding:'16px 28px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'flex-end',gap:10}}>
        <button onClick={()=>setProfileOpen(false)}
          style={{padding:'10px 18px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>
          Cancelar
        </button>
        <button onClick={save}
          style={{padding:'10px 22px',background:NB.azul,border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff'}}>
          Salvar perfil
        </button>
      </div>
    </Modal>
  );
}

/* =========== NOVA DEMANDA =========== */
function AssigneePick({ member, checked, onToggle }) {
  const m = useMember(member.initials) || member;
  return (
    <button type="button" onClick={onToggle}
      style={{display:'flex',alignItems:'center',gap:9,padding:'5px 14px 5px 5px',borderRadius:22,border:'1px solid '+(checked?NB.azul:NB.bd),background:checked?'#EAF3FD':'#fff',transition:'all 0.12s'}}>
      <Avatar member={m} size={26} ring={false} style={{boxShadow:'0 0 0 1.5px '+m.color}}/>
      <span style={{fontSize:13,fontWeight:500,color:checked?NB.azul:NB.mut}}>{m.name}</span>
    </button>
  );
}

function NewModal() {
  const { newOpen, setNewOpen, addDemand, user, area } = useApp();
  const initArea = area!=='Todas' ? area : 'Social';
  const [form, setForm] = useState({ title:'', area:initArea, priority:'Média', deadline:dStr(7), description:'', requester:user.name, assignees:[] });

  useEffect(() => {
    if (newOpen) setForm(f=>({ ...f, title:'', area:area!=='Todas'?area:'Social', requester:user.name, assignees:[], description:'' }));
  }, [newOpen, area, user]);

  if (!newOpen) return null;

  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const toggleAssignee = init => setForm(f => ({ ...f, assignees: f.assignees.includes(init) ? f.assignees.filter(i=>i!==init) : [...f.assignees, init] }));
  const valid = form.title.trim() && form.assignees.length>0;

  const submit = () => {
    if (!valid) return;
    addDemand({ title:form.title, area:form.area, priority:form.priority, deadline:form.deadline, description:form.description, requester:form.requester, assignees:form.assignees });
    setNewOpen(false);
  };

  return (
    <Modal onClose={()=>setNewOpen(false)} width={580}>
      <div style={{padding:'24px 28px 18px',borderBottom:'1px solid '+NB.bdSoft,display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:14}}>
        <div>
          <h2 style={{fontSize:20,fontWeight:600,color:NB.txt,marginBottom:5,letterSpacing:'-0.01em'}}>Nova demanda</h2>
          <p style={{fontSize:13.5,color:NB.mut}}>A demanda será solicitada no Slack para quem você escolher.</p>
        </div>
        <button onClick={()=>setNewOpen(false)} style={{padding:8,background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,color:NB.mut,display:'flex',flexShrink:0}}><IX/></button>
      </div>

      <div style={{padding:'22px 28px',display:'flex',flexDirection:'column',gap:18}}>
        <div>
          <div style={lbl}>Título</div>
          <input value={form.title} onChange={e=>set('title',e.target.value)} placeholder="O que precisa ser feito?" style={inp}
            onFocus={e=>{e.target.style.borderColor=NB.azul;}} onBlur={e=>{e.target.style.borderColor=NB.bd;}}/>
        </div>

        <div>
          <div style={lbl}>Para quem vai a demanda</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {ACTIVE_TEAM.map(m => (
              <AssigneePick key={m.id} member={m} checked={form.assignees.includes(m.initials)} onToggle={()=>toggleAssignee(m.initials)}/>
            ))}
          </div>
          {form.assignees.length===0 && <p style={{fontSize:12.5,color:NB.mut2,marginTop:8}}>Escolha ao menos uma pessoa para receber a demanda.</p>}
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:13}}>
          <div>
            <div style={lbl}>Área</div>
            <select value={form.area} onChange={e=>set('area',e.target.value)} style={inp}>
              {Object.keys(PIPELINES).map(a=><option key={a}>{a}</option>)}
            </select>
          </div>
          <div>
            <div style={lbl}>Prioridade</div>
            <select value={form.priority} onChange={e=>set('priority',e.target.value)} style={inp}>
              {PRIORITIES.map(p=><option key={p}>{p}</option>)}
            </select>
          </div>
          <div>
            <div style={lbl}>Prazo</div>
            <input type="date" value={form.deadline} onChange={e=>set('deadline',e.target.value)} style={inp}/>
          </div>
        </div>

        <div>
          <div style={lbl}>Contexto (opcional)</div>
          <textarea value={form.description} onChange={e=>set('description',e.target.value)} rows={3}
            placeholder="Referências, objetivo, link de briefing..." style={{...inp,resize:'vertical',lineHeight:1.6}}
            onFocus={e=>{e.target.style.borderColor=NB.azul;}} onBlur={e=>{e.target.style.borderColor=NB.bd;}}/>
        </div>
      </div>

      <div style={{padding:'16px 28px',borderTop:'1px solid '+NB.bdSoft,display:'flex',justifyContent:'flex-end',gap:10}}>
        <button onClick={()=>setNewOpen(false)}
          style={{padding:'11px 18px',background:'#fff',border:'1px solid '+NB.bd,borderRadius:9,fontSize:13,fontWeight:500,color:NB.mut}}>
          Cancelar
        </button>
        <button onClick={submit} disabled={!valid}
          style={{padding:'11px 24px',background:valid?NB.azul:'#CFD8E6',border:'none',borderRadius:9,fontSize:13,fontWeight:500,color:'#fff',cursor:valid?'pointer':'not-allowed'}}>
          Solicitar no Slack
        </button>
      </div>
    </Modal>
  );
}

/* =========== APP =========== */
function AppContent() {
  const { view, user, authReady, setDragging } = useApp();
  if (!authReady) return <Splash/>;
  if (!user)      return <LoginScreen/>;
  return (
    <div style={{display:'flex',height:'100vh',width:'100%',overflow:'hidden',background:NB.bg}}
      onDragOver={e=>e.preventDefault()}
      onDrop={()=>setDragging(null)}>
      <Sidebar/>
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
        <TopBar/>
        <main style={{flex:1,overflow:'hidden'}}>
          {view==='kanban'     && <KanbanBoard/>}
          {view==='slack'      && <SlackFeed/>}
          {view==='arquivadas' && <ArchivedView/>}
          {view==='social'     && <SocialPlannerView/>}
        </main>
      </div>
      <CardModal/>
      <NewModal/>
      <NotifyModal/>
      <ProfileModal/>
    </div>
  );
}

function App() { return <Provider><AppContent/></Provider>; }

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
